# CI for Nexus.
#
# The last job is the one that matters most, and it is the reason this file
# exists. Four defects blocked Phase 1 exit criterion 1 (F63-F66), every one was
# found by running an example BY HAND, and nothing in the repo would have caught
# any of them. Unit tests could not: they construct ResourceVectors directly, so
# they cannot see that no agent could advertise GPU memory. Spec validation could
# not: it proved the examples were ACCEPTED, which is a much weaker claim than
# runnable -- at the time, no example in the repo could reach SUCCEEDED at all.
#
# Only running the thing finds those. So CI runs it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the old run: these jobs bring up a full stack, and
# queueing them behind superseded work wastes minutes for no signal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  # Fast feedback. Deliberately first and deliberately cheap: a build error or a
  # failing unit test should not wait on a compose stack to come up.
  build:
    name: build, vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # No -tags: the integration and chaos suites are tagged out on purpose, so
      # this stays a pure unit run that needs no services.
      - run: go test -race ./...

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-dev-password
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        # -d nexus matters: pg_isready with no database succeeds while the
        # initdb bootstrap database is still being replaced, so dependents can
        # start against a database that is about to be dropped.
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Migrations are applied by a job, never by a service at startup
      # (ADR-0011 rule 4). This is that job.
      - name: Apply migrations
        run: make migrate-up
        env:
          DATABASE_URL: postgres://nexus:nexus-dev-password@localhost:5432/nexus?sslmode=disable
      # ONE variable. Every Postgres integration test reads its database from
      # NEXUS_TEST_DATABASE_URL and nothing else (internal/testdb): there is no
      # compiled-in fallback DSN any more, because a fallback silently pointed
      # the suite at whatever Postgres was listening on a developer's machine.
      #
      # A skip is indistinguishable from a pass in `go test` output (F85), so
      # the suite runs ONCE, verbosely, and the job fails if any test skipped
      # for want of a database -- in any package, not just internal/store.
      # testdb.SkipMarker is the exact text such a skip prints. Tests that skip
      # for a different reason -- no NATS broker (run by the nats-integration
      # job below), no Kubernetes cluster, no Mailpit -- print a different
      # message and are not caught here.
      #
      # -p 1: the packages share one database, and some assertions (timer
      # claims, reservation sums) are only meaningful without another package
      # writing the same tables at the same moment.
      - name: Run integration suite
        run: |
          set -euo pipefail
          status=0
          go test -tags integration -count=1 -p 1 -v ./... > integration.log 2>&1 || status=$?
          grep -E '^(--- FAIL|FAIL|ok|panic)' integration.log || true
          if grep -q "skipping integration test: no test database" integration.log; then
            echo "integration tests SKIPPED -- NEXUS_TEST_DATABASE_URL unset or unreachable; treating as failure (F85)" >&2
            grep "skipping integration test: no test database" integration.log >&2
            exit 1
          fi
          if [ "$status" != 0 ]; then
            tail -300 integration.log >&2
          fi
          exit "$status"
        env:
          NEXUS_TEST_DATABASE_URL: postgres://nexus:nexus-dev-password@localhost:5432/nexus?sslmode=disable

  # The outbox relay and dispatch hints against a REAL NATS JetStream server and a
  # REAL Postgres, each in a throwaway container the script starts itself. It
  # stops and restarts the broker (the outage test), which is why it is its own
  # job rather than a service container shared with the suite above. The script
  # fails if any TestNATS* test skipped (F85).
  nats-integration:
    name: nats integration tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run NATS/outbox integration suite
        run: tests/nats/run-integration.sh

  ui:
    name: ui tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui

  # The job this file was written for.
  #
  # It brings up the real compose stack and runs every committed example to
  # SUCCEEDED, then kills a worker mid-task and races three scheduler replicas.
  # Together those are Phase 1 exit criteria 1, 2 and 3.
  e2e:
    name: examples and chaos suite
    runs-on: ubuntu-latest
    needs: build
    # Generous: this builds every service image before it can run anything.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Bring up the stack
        run: make up

      - name: Seed an API key
        id: seed
        run: |
          set -euo pipefail
          KEY="nxs_admin_$(openssl rand -hex 32)"
          HASH=$(printf '%s' "$KEY" | shasum -a 256 | cut -d' ' -f1)
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U nexus -d nexus -v ON_ERROR_STOP=1 -q -c \
            "INSERT INTO api_keys (namespace, name, key_hash, role)
             VALUES ('default','ci-admin','$HASH','admin')
             ON CONFLICT (key_hash) DO NOTHING"
          # Masked so a re-run of the log cannot leak it, even though it is
          # scoped to a throwaway stack.
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Wait for the fleet to register
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            n=$(docker compose -f deploy/docker-compose.yml exec -T postgres \
                  psql -U nexus -d nexus -tAc \
                  "SELECT count(*) FROM workers WHERE state='ACTIVE'" | tr -d ' \r')
            [ "${n:-0}" -ge 3 ] && { echo "$n workers registered"; exit 0; }
            sleep 5
          done
          echo "workers never registered; the examples cannot run" >&2
          docker compose -f deploy/docker-compose.yml logs --tail=50 agent-cpu >&2
          exit 1

      # Criterion 1, plus criteria 2 and 3, in one suite.
      - name: Run examples and chaos suite
        run: make chaos
        env:
          NEXUS_ENDPOINT: http://localhost:8090
          NEXUS_API_KEY: ${{ steps.seed.outputs.key }}

      # Logs are worth far more than the exit code when this fails: the whole
      # point of the suite is that the interesting evidence lives in the
      # services, not in the test output.
      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200

      - name: Tear down
        if: always()
        run: make down
