# CI for Nexus.
#
# One job matters most (`examples`), and it is the reason this file exists.
# Four defects blocked Phase 1 exit criterion 1 (F63-F66), every one was
# found by running an example BY HAND, and nothing in the repo would have caught
# any of them. Unit tests could not: they construct ResourceVectors directly, so
# they cannot see that no agent could advertise GPU memory. Spec validation could
# not: it proved the examples were ACCEPTED, which is a much weaker claim than
# runnable -- at the time, no example in the repo could reach SUCCEEDED at all.
#
# Only running the thing finds those. So CI runs it.
#
# Branch protection requires ONE check: `quality gate`. It needs every job
# below and fails unless each one passed, or was skipped for a reason it can
# name (a documentation-only change; a job that belongs to another event).
# Requiring the jobs one by one does not work: a skipped job reports success,
# and a skipped matrix job reports under a name the rule never matches, so the
# rule waits forever.
#
# A push to main, or a vX.Y.Z tag, that passes the gate then publishes every
# image to GHCR, digest-pinned, and the Helm chart to
# oci://ghcr.io/<owner>/charts, through .github/workflows/release.yml
# (`publish`). Pull requests build the same images and package the chart
# without pushing anything (`images`).
name: ci

on:
  push:
    branches: [main]
    # A release: the whole suite on the tagged commit, then `publish`.
    tags: ["v*"]
  pull_request:

# A new push to a pull request supersedes its old run: these jobs bring up a
# full stack, and queueing them behind superseded work wastes minutes for no
# signal. A run on main or a tag is never cancelled part-way, because it ends
# by publishing images and a publish cut off half-way leaves `main` naming a
# mix of commits. A newer run waits instead (and a waiting one is superseded
# by the next).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository, so the token cannot either. A job that
# genuinely needs more asks for it by name (`publish`, for the registry).
permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  # Node 24 (Active LTS, supported to 2028-04-30; Node 20 went EOL 2026-04-30).
  # The exact patch, so CI and the console image (deploy/Dockerfile.ui,
  # node:24.21.0-alpine) run the same Node and npm, and a lockfile that resolves
  # here resolves in the image. Move them together: this file, the Dockerfile
  # and docs/OPERATIONS.md section 22.3 (tests/repo fails when they disagree).
  NODE_VERSION: "24.21.0"
  # A floor, not a target, for the unit suite's statement coverage (go tool
  # cover -func over every package, generated code included). It measured
  # 46.1% when CI started enforcing it; a drop of two points is a regression
  # worth failing on. Raise it as coverage rises; never lower it to pass.
  GO_COVERAGE_FLOOR: "44"
  # Locally, every stack and test script uses the host's PostgreSQL and never
  # starts a Postgres container (tests/lib/hostpg.sh). A runner has no host
  # server, so the compose stacks here opt in to their bundled postgres
  # container, and the scripts that create throwaway databases get a service
  # container as their "host" server (NEXUS_TEST_PG_SERVER, per job).
  NEXUS_BUNDLED_POSTGRES: "1"
  E2E_BUNDLED_POSTGRES: "1"

jobs:
  # What kind of change this is. One that touches only documentation
  # (docs/**, or a *.md file anywhere outside sdk/) does not need images built
  # and three stacks brought up. Not a workflow-level `paths-ignore`: a
  # workflow that does not run leaves its required check pending forever, and
  # the doc jobs must run on exactly those changes. So every run starts, the
  # expensive jobs skip themselves, and the gate knows which skips are
  # legitimate.
  #
  # `build` runs on documentation changes anyway: Go tests read Markdown
  # (CONTRACT.md, golden import reports, the nexusctl init templates). sdk/
  # counts as code because pip reads sdk/python/README.md as the package's
  # description.
  #
  # Fails OPEN: what it cannot classify (a tag, a new branch, a base that no
  # longer exists) counts as code, so the whole suite runs.
  changes:
    name: classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Documentation only, or code?
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull request is checked out as its merge commit, whose first
          # parent is the base it would merge into.
          case "$EVENT/$GITHUB_REF" in
            pull_request/*) base=HEAD^1 ;;
            push/refs/heads/*) base=$BEFORE ;;
            *) base= ;;
          esac
          code=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # --no-renames: a file moved out of a code directory into docs/
            # must count as the deletion it also is.
            changed=$(git diff --name-only --no-renames "$base" HEAD)
            if [ -n "$changed" ]; then
              code=false
              while IFS= read -r path; do
                case "$path" in
                  sdk/*) code=true ;;
                  docs/*|*.md) ;;
                  *) code=true ;;
                esac
              done <<<"$changed"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then
            echo "Code change: every job runs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Documentation-only change: build, docs and lint jobs run; the rest skip." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Fast feedback. Deliberately first and deliberately cheap: a build error or a
  # failing unit test should not wait on a compose stack to come up.
  #
  # Then the repository's own hygiene: every source file carries its SPDX
  # header, go.mod and go.sum are tidy, and the build and tests leave the tree
  # exactly as committed -- a test that rewrites a golden file, or a generated
  # file that no longer matches what produces it, fails here. Reports are
  # written to $RUNNER_TEMP, outside the tree, so that check never sees them.
  build:
    name: build, vet and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # verify checks the module cache against go.sum: it is what turns a
      # tampered module (or a poisoned cache) into a failure rather than a
      # silent build.
      - name: Download and verify modules
        run: |
          set -euo pipefail
          go mod download
          go mod verify
      # Every first-party source file carries an SPDX identifier. Generated
      # code under gen/ is exempt; the target knows that.
      - name: SPDX headers (make license-check)
        run: make license-check
      # go.mod and go.sum are generated files too.
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      # No -tags: the integration and chaos suites are tagged out on purpose, so
      # this stays a pure unit run that needs no services. gotestsum runs
      # `go test -json` and writes the JUnit report and the raw events; the log
      # stays one line per package, plus the output of anything that failed.
      - name: Unit tests (go test -race, with coverage)
        id: test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-reports"
          go run gotest.tools/gotestsum@v1.13.0 \
            --format pkgname-and-test-fails --hide-summary=skipped \
            --junitfile "$RUNNER_TEMP/go-reports/go-junit.xml" \
            --jsonfile "$RUNNER_TEMP/go-reports/go-test.json" \
            -- -race -covermode=atomic -coverprofile="$RUNNER_TEMP/go-reports/go-coverage.out" ./...
      # Whether or not a test failed: the summary is how a failure is read.
      # Cobertura is the coverage format every coverage service takes.
      - name: Test and coverage reports
        if: always() && steps.test.outcome != 'skipped'
        run: |
          set -euo pipefail
          r=$RUNNER_TEMP/go-reports
          python3 deploy/scripts/junit-summary.py --title "Go unit tests (-race)" --require "$r/go-junit.xml" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$r/go-coverage.out" ]; then
            go run github.com/boumenot/gocover-cobertura@v1.5.0 < "$r/go-coverage.out" > "$r/go-coverage.xml"
          fi
      - name: Coverage floor
        run: |
          set -euo pipefail
          total=$(go tool cover -func="$RUNNER_TEMP/go-reports/go-coverage.out" | awk '$1 == "total:" { sub("%", "", $NF); print $NF }')
          echo "Unit-test statement coverage: **$total%** (floor $GO_COVERAGE_FLOOR%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v f="$GO_COVERAGE_FLOOR" 'BEGIN { exit !(t + 0 < f + 0) }'; then
            echo "::error::unit-test statement coverage $total% is below the floor of $GO_COVERAGE_FLOOR%"
            exit 1
          fi
          echo "statement coverage $total% (floor $GO_COVERAGE_FLOOR%)"
      # Catches a hand-edited generated file that a test regenerates, a golden
      # file a test rewrites, or anything else the build and tests write into
      # the tree. Untracked files count too: `git diff` alone misses them.
      - name: The tree is exactly as committed
        run: |
          set -euo pipefail
          git diff --exit-code
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            echo "::error::the build or the tests left files in the tree"
            echo "$dirty"
            exit 1
          fi
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-report
          path: ${{ runner.temp }}/go-reports/
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-dev-password
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        # -d nexus matters: pg_isready with no database succeeds while the
        # initdb bootstrap database is still being replaced, so dependents can
        # start against a database that is about to be dropped.
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The S3 half of the integration suite (result store, durable logs, log
      # GC) needs a real S3 store. Not a `services:` entry: the image needs a
      # `server /data` argv, which service containers cannot pass. Same pinned
      # digest as deploy/docker-compose.yml (F111).
      # Provenance before use: the pinned digest must carry a GitHub build
      # attestation from pgsty/silo's release workflow (F111).
      - name: Verify the S3 image's build provenance
        run: make verify-s3-image
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Start a throwaway S3 store (Silo)
        run: |
          set -euo pipefail
          docker run -d --name nexus-ci-s3 -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=nexus-ci -e MINIO_ROOT_PASSWORD=nexus-ci-password \
            "$(make -s print-s3-image)" server /data
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs nexus-ci-s3 >&2
          exit 1
      # Migrations are applied by a job, never by a service at startup
      # (ADR-0011 rule 4). This is that job.
      - name: Apply migrations
        run: make migrate-up
        env:
          DATABASE_URL: postgres://nexus:nexus-dev-password@localhost:5432/nexus?sslmode=disable
      # ONE variable. Every Postgres integration test reads its database from
      # NEXUS_TEST_DATABASE_URL and nothing else (internal/testdb): there is no
      # compiled-in fallback DSN any more, because a fallback silently pointed
      # the suite at whatever Postgres was listening on a developer's machine.
      #
      # A skip is indistinguishable from a pass in `go test` output (F85), so
      # the suite runs ONCE, verbosely, and the job fails if any test skipped
      # for want of a database -- in any package, not just internal/store.
      # testdb.SkipMarker is the exact text such a skip prints, and
      # tests3.SkipMarker the object-store equivalent (NEXUS_TEST_S3_*). Tests
      # that skip for a different reason -- no NATS broker (run by the
      # nats-integration job below), no Kubernetes cluster, no Mailpit -- print
      # a different message and are not caught here.
      #
      # -p 1: the packages share one database, and some assertions (timer
      # claims, reservation sums) are only meaningful without another package
      # writing the same tables at the same moment.
      - name: Run integration suite
        run: |
          set -euo pipefail
          status=0
          go test -tags integration -count=1 -p 1 -v ./... > integration.log 2>&1 || status=$?
          grep -E '^(--- FAIL|FAIL|ok|panic)' integration.log || true
          if grep -q "skipping integration test: no test database" integration.log; then
            echo "integration tests SKIPPED -- NEXUS_TEST_DATABASE_URL unset or unreachable; treating as failure (F85)" >&2
            grep "skipping integration test: no test database" integration.log >&2
            exit 1
          fi
          if grep -q "skipping integration test: no test S3 store" integration.log; then
            echo "integration tests SKIPPED -- NEXUS_TEST_S3_* unset or unreachable; treating as failure (F85)" >&2
            grep "skipping integration test: no test S3 store" integration.log >&2
            exit 1
          fi
          if [ "$status" != 0 ]; then
            tail -300 integration.log >&2
          fi
          exit "$status"
        env:
          NEXUS_TEST_DATABASE_URL: postgres://nexus:nexus-dev-password@localhost:5432/nexus?sslmode=disable
          NEXUS_TEST_S3_ENDPOINT: 127.0.0.1:9000
          NEXUS_TEST_S3_ACCESS_KEY_ID: nexus-ci
          NEXUS_TEST_S3_SECRET_ACCESS_KEY: nexus-ci-password
      # The whole verbose log: the step prints only its tail on failure.
      - name: Upload the integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: integration.log
          if-no-files-found: ignore
          retention-days: 14

  # The outbox relay and dispatch hints against a REAL NATS JetStream server
  # (throwaway brokers the script starts: it stops and restarts one for the
  # outage test, which is why it is its own job) and a REAL Postgres: a
  # throwaway database the script creates on the job's server and drops. The
  # script fails if any TestNATS* test skipped (F85).
  nats-integration:
    name: nats integration tests
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-dev-password
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NEXUS_TEST_PG_SERVER: postgres://nexus:nexus-dev-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run NATS/outbox integration suite
        run: tests/nats/run-integration.sh

  # Every "OPERATIONS §N" cited from code, charts, migrations, ADRs and
  # findings must name a section that exists: merges renumber sections.
  doc-refs:
    name: OPERATIONS cross-references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make check-doc-refs

  # The documentation site: strict MkDocs build from the hash-locked toolchain,
  # the CLI reference from a nexusctl built here, the API reference from
  # api/openapi.yaml, then a link and anchor check over the built HTML.
  docs:
    name: docs site (strict build + link check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - run: make docs DOCS_PYTHON=python
      - name: Upload the built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site/site
          retention-days: 7

  # The wire contract. buf lint (rules and the project's documented exceptions
  # in proto/buf.yaml), then buf breaking against the previous main: the main
  # tip on a PR, main~1 on a push to main (proto/check.sh). A rolling upgrade
  # runs old agents against new services, so a renumbered field or a changed
  # type must not merge. buf is pinned and checksum-verified; the history is
  # needed to extract the previous tree, hence fetch-depth: 0.
  proto:
    name: proto lint and breaking-change check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .tools
          key: pinned-tools-${{ runner.os }}-${{ hashFiles('deploy/scripts/pinned-tool.sh') }}
      - name: buf lint
        run: make proto-lint
      - name: buf breaking against the previous main
        run: make proto-breaking
        env:
          # A release tag can name a commit behind the main tip. Compare it
          # with its own parent, as the push of that commit to main did, not
          # with main changes it does not contain (empty: proto/check.sh's
          # default).
          BUF_AGAINST: ${{ startsWith(github.ref, 'refs/tags/') && 'HEAD~1' || '' }}

  # This file and any other workflow, with the pinned actionlint image (it
  # bundles shellcheck for the run: scripts). A duplicated job id, for one,
  # silently drops the first job: YAML keeps the last key.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make actionlint

  # The Helm chart, with the helm and kubeconform pinned and checksum-verified
  # in deploy/scripts/pinned-tool.sh (not the runner image's helm): lint and
  # render every ci/ values file, schema-check the output against the
  # Kubernetes and CRD schemas pinned in deploy/helm/schemas.lock, and prove
  # every bad value is refused (docs/OPERATIONS.md §20.10). Then prove every
  # Nexus image the chart renders takes its digest from image.digests -- the
  # key a release sets from its digest map. The release workflow
  # (release.yml, `digests`) re-runs the same check against the real map, as
  # KGF Cloud's release pipeline does before `helm upgrade` (F112).
  helm:
    name: helm validate and image-digest check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    env:
      KUBECONFORM_SCHEMA_CACHE: ${{ github.workspace }}/.cache/kubeconform-schemas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Both caches are content-verified on use (tool stamps, schema hashes),
      # so a poisoned cache fails the job rather than passing it.
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            .cache/kubeconform-schemas
          key: helm-validate-${{ runner.os }}-${{ hashFiles('deploy/scripts/pinned-tool.sh', 'deploy/helm/schemas.lock') }}
      - name: Install pinned helm and kubeconform (sha256-verified)
        run: |
          set -euo pipefail
          dirname "$(deploy/scripts/pinned-tool.sh helm)" >> "$GITHUB_PATH"
          deploy/scripts/pinned-tool.sh kubeconform
      - name: deploy/helm/validate.sh
        run: make helm-validate
      - name: Every rendered Nexus image resolves to its digest
        run: |
          python3 deploy/scripts/helm-image-digests.py self-test \
            --chart deploy/helm/kgf-nexus \
            --set existingSecret=ci --set image.tag=ci --set nats.auth.mode=none \
            --set clusterController.enabled=true --set clusterController.clusterName=ci
      # The cluster controller also ships as a kustomize base (the chart path
      # is optional); the release retargets that base's placeholder image to
      # the built digest. Prove the overlay does that in both modes.
      - name: cluster-controller overlay takes the release digest
        run: |
          set -euo pipefail
          d=sha256:$(printf '%064d' 1)
          for mode in base apply; do
            NAMESPACE=ci AGENT_IMAGE="ci.example/nexus/agent@$d" \
              deploy/scripts/cluster-controller-overlay.sh "$mode" "ci.example/nexus/cluster-controller@$d" >/dev/null
          done
  # The AKS install tooling: deploy/scripts/aks-preflight.sh against a stub
  # kubectl (`make preflight-test`; no cluster), and shellcheck over it and
  # deploy/helm/validate.sh (`make shellcheck`) with the shellcheck bundled in
  # the pinned actionlint image -- ACTIONLINT_IMAGE in the Makefile, the one
  # pin `make actionlint` uses too.
  install-scripts:
    name: AKS preflight (tests, shellcheck)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: aks-preflight tests (stub kubectl and az)
        run: make preflight-test
      - name: shellcheck
        run: make shellcheck

  # Terraform for the dev environment and the AKS/EKS/GKE platforms, OFFLINE:
  # init -backend=false, validate, and `terraform test` plans with mocked
  # providers. No state, no cloud credentials, nothing is applied. Then the
  # linters (tflint, checkov, trivy) in pinned containers.
  terraform:
    name: terraform validate and lint (offline)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          # Same pin as deploy/terraform/validate.sh.
          terraform_version: "1.14.3"
          terraform_wrapper: false
      - uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('deploy/terraform/**/.terraform.lock.hcl', 'deploy/terraform/**/versions.tf') }}
      - name: make tf-validate
        run: make tf-validate
      - name: make tf-lint
        run: make tf-lint
        env:
          # Read-only token: lifts GitHub's anonymous rate limit for tflint's
          # plugin downloads. Grants nothing beyond `permissions` above.
          GITHUB_TOKEN: ${{ github.token }}

  # The operator console: typecheck, component tests and the production build.
  ui:
    name: ui typecheck, tests and build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # ci, not install: exactly the lockfile, and a failure when package.json
      # and the lockfile disagree.
      - run: npm ci --no-audit --no-fund
      # Its own step even though `build` runs `tsc -b` too: a type error should
      # be reported as a type error, not as a failed build.
      - run: npm run typecheck
      - id: test
        run: npm run test:ci -- --outputFile.junit=reports/ui-junit.xml
      - name: Test report summary
        if: always() && steps.test.outcome != 'skipped'
        run: python3 ../deploy/scripts/junit-summary.py --title "Console component tests (vitest)" --require reports/ui-junit.xml >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: ui/reports/
          if-no-files-found: warn
          retention-days: 14

  # The operator console in a real browser against a real stack: the
  # fan-out/fan-in journey (catalog, submit, live run, attempts, logs, log
  # download, per-node retry, final state, execution timeline). `make e2e`
  # builds an ISOLATED compose project on its own ports, seeds fresh keys,
  # runs Playwright and tears the stack down. Traces, screenshots and videos of
  # any failure, the HTML report and every service's logs are uploaded.
  #
  # The S3 store is the digest-pinned Silo image of deploy/docker-compose.yml
  # (F111). E2E_MINIO_IMAGE is an optional override: set the repository
  # variable to another MinIO-compatible image that contains `mc`
  # (deploy/e2e/docker-compose.minio-local.yml); empty means the pinned image.
  # Job id browser-e2e, not e2e: the examples-and-chaos job below is also
  # "e2e", and a duplicate key makes the whole workflow file invalid YAML for
  # GitHub (the later key would otherwise silently replace this job).
  browser-e2e:
    name: browser e2e (playwright)
    runs-on: ubuntu-latest
    needs: [changes, build, ui]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    env:
      E2E_PROJECT: nexus-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_MINIO_IMAGE: ${{ vars.E2E_MINIO_IMAGE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      # The browser matching the pinned @playwright/test, with its OS packages.
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Run the e2e suite on an isolated stack
        run: make e2e E2E_PROJECT="$E2E_PROJECT" E2E_MINIO_IMAGE="$E2E_MINIO_IMAGE"
      # Not --require: `make e2e` can fail before Playwright writes anything
      # (the stack did not come up), and its own output says so.
      - name: Test report summary
        if: always()
        run: python3 deploy/scripts/junit-summary.py --title "Browser e2e (Playwright)" ui/e2e/test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report, traces and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            ui/e2e/playwright-report/
            ui/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The Python SDK suite on every Python the package claims to support
  # (pyproject: requires-python >=3.11, classifiers 3.11-3.13). Needs no
  # services: the client tests talk to an in-process HTTP server on 127.0.0.1.
  sdk:
    name: python sdk tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    strategy:
      # One failing interpreter should not hide whether the others pass.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      # The same target a developer runs, so CI cannot drift from `make test`.
      # It builds its own venv, installs the [dev] extra and enforces the
      # coverage floor in pyproject.toml.
      - name: Run the SDK suite (make sdk-test)
        id: test
        run: make sdk-test SDK_PYTHON=python SDK_REPORT_DIR=reports/sdk
      # --require: a suite that ran and wrote no JUnit report proved nothing.
      - name: Test and coverage summary
        if: always() && steps.test.outcome != 'skipped'
        run: |
          set -euo pipefail
          python3 deploy/scripts/junit-summary.py --title "Python SDK (Python ${{ matrix.python-version }})" \
            --require reports/sdk/sdk-junit.xml >> "$GITHUB_STEP_SUMMARY"
          if [ -f .venv-sdk/.coverage ]; then
            cd sdk/python
            COVERAGE_FILE=../../.venv-sdk/.coverage ../../.venv-sdk/bin/python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-test-report-py${{ matrix.python-version }}
          path: reports/sdk/
          if-no-files-found: warn
          retention-days: 14

  # The job this file was written for.
  #
  # It brings up the real compose stack and runs every committed example to
  # SUCCEEDED, then kills a worker mid-task and races three scheduler replicas.
  # Together those are Phase 1 exit criteria 1, 2 and 3.
  #
  # Its id was `e2e`, the same as the browser job above; YAML keeps the last
  # duplicate key, so one of the two never ran. actionlint (workflow-lint)
  # now refuses a duplicate.
  examples:
    name: examples and chaos suite
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    # Generous: this builds every service image before it can run anything,
    # and the example sweep gives each example its own budget
    # (tests/chaos/config.go).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # deploy/docker-compose.yml requires NEXUS_WORKER_API_KEY, so the keys
      # exist before the stack does. Masked, and exported to every later step
      # (including the `docker compose` calls, which parse the file too).
      - name: Generate this run's API keys
        run: |
          set -euo pipefail
          WKEY=$(make -s worker-key)
          AKEY="nxs_admin_$(openssl rand -hex 32)"
          echo "::add-mask::$WKEY"
          echo "::add-mask::$AKEY"
          {
            echo "NEXUS_WORKER_API_KEY=$WKEY"
            echo "NEXUS_DEV_API_KEY=$AKEY"
            echo "NEXUS_API_KEY=$AKEY"
          } >> "$GITHUB_ENV"

      - name: Bring up the stack
        run: make up

      # The default tenant, then both key hashes: the same target a developer
      # runs (it falls back to the stack's own psql when the runner has none).
      - name: Install the keys (make seed)
        run: make seed

      - name: Wait for the fleet to register
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            n=$(docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bundled-postgres.yml exec -T postgres \
                  psql -U nexus -d nexus -tAc \
                  "SELECT count(*) FROM workers WHERE state='ACTIVE'" | tr -d ' \r')
            [ "${n:-0}" -ge 3 ] && { echo "$n workers registered"; exit 0; }
            sleep 5
          done
          echo "workers never registered; the examples cannot run" >&2
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bundled-postgres.yml logs --tail=50 agent-cpu >&2
          exit 1

      # Criterion 1, plus criteria 2 and 3, in one suite.
      - name: Run examples and chaos suite
        run: make chaos
        env:
          NEXUS_ENDPOINT: http://localhost:8090
          # The suite runs compose itself (exec postgres, restart an agent):
          # the same files `make up` used.
          NEXUS_COMPOSE_FILE: deploy/docker-compose.yml,deploy/docker-compose.bundled-postgres.yml

      # Logs are worth far more than the exit code when this fails: the whole
      # point of the suite is that the interesting evidence lives in the
      # services, not in the test output.
      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bundled-postgres.yml logs --tail=200

      - name: Tear down
        if: always()
        run: make down

  # Mixed-version skew (ADR-0011 rule 5, docs/COMPATIBILITY.md §7): the PREVIOUS
  # release's database integration suite, run against a database upgraded to
  # THIS tree's migrations. Previous = newest vX.Y.Z tag; without one, the main
  # tip on a PR, or main~1 on a push to main. It needs history for that, hence
  # fetch-depth: 0. The script creates and drops its two databases on the
  # job's server.
  compat:
    name: previous-release skew smoke
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-dev-password
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NEXUS_TEST_PG_SERVER: postgres://nexus:nexus-dev-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run the previous release's suite against this schema
        run: make compat-smoke
        env:
          NEXUS_COMPAT_LOG: ${{ runner.temp }}/compat.jsonl
      - name: Upload the go test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-go-test-log
          path: ${{ runner.temp }}/compat.jsonl
          if-no-files-found: ignore
          retention-days: 14

  # Every image builds (one job per image, linux/amd64 and linux/arm64), and
  # nothing is pushed: release.yml with push: false. After `build`, so a
  # compile error is reported once, as a compile error, and not again by
  # eleven image builds. Pull requests only; on main and tags `publish` builds
  # them for real, after the whole gate.
  images:
    name: images
    needs: [changes, build]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml
    with:
      push: false

  # The one check branch protection requires (see the top of this file). It
  # fails on a failed or cancelled job, and on a skipped one unless the skip is
  # legitimate: a documentation-only change (changes.code false), or `images`
  # outside a pull request. Every job above must be listed in `needs` AND in
  # one of the lists below; the step refuses a job it cannot classify, so a
  # new job cannot silently fall outside the gate.
  gate:
    name: quality gate
    if: always()
    needs:
      - changes
      - build
      - integration
      - nats-integration
      - doc-refs
      - docs
      - proto
      - workflow-lint
      - helm
      - install-scripts
      - terraform
      - ui
      - browser-e2e
      - sdk
      - examples
      - compat
      - images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Run on every change, documentation included.
          always="changes build doc-refs docs workflow-lint"
          # Skip themselves on a documentation-only change.
          code_jobs="integration nats-integration proto helm install-scripts terraform ui browser-e2e sdk examples compat"
          # Pull requests only.
          pr_jobs="images"

          code=$(jq -r '.changes.outputs.code // "true"' <<<"$NEEDS")
          required="$always"
          if [ "$code" = true ]; then required="$required $code_jobs"; fi
          if [ "$code" = true ] && [ "$EVENT" = pull_request ]; then required="$required $pr_jobs"; fi

          failed=0
          {
            echo "### Quality gate"
            echo
            if [ "$code" = true ]; then echo "Code change ($EVENT)."; else echo "Documentation-only change ($EVENT)."; fi
            echo
            echo "| job | result | |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            case " $always $code_jobs $pr_jobs " in
              *" $job "*) ;;
              *) echo "::error::job '$job' is in needs but in none of the gate's lists; classify it"; failed=1 ;;
            esac
            case " $required " in *" $job "*) want=required ;; *) want=optional ;; esac
            if [ "$result" = success ] || { [ "$result" = skipped ] && [ "$want" = optional ]; }; then
              mark="✅"
            else
              mark="❌"
              echo "::error::$job: $result ($want)"
              failed=1
            fi
            echo "| $job | $result | $mark |" >> "$GITHUB_STEP_SUMMARY"
          done
          for job in $required; do
            jq -e --arg j "$job" 'has($j)' <<<"$NEEDS" >/dev/null \
              || { echo "::error::required job '$job' is not in the gate's needs"; failed=1; }
          done
          if [ "$failed" = 0 ]; then
            echo "quality gate: passed"
            if [ "$EVENT" = push ] && [ "$code" = true ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              echo "Passed on a push: \`publish\` releases every image to GHCR, digest-pinned, and the Helm chart." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$failed"

  # A push to main or a vX.Y.Z tag that passed the WHOLE gate, on this commit,
  # in this run: every image built for both platforms, pushed to GHCR,
  # attested, and collected into one validated digest map, then the Helm
  # chart packaged, pushed to oci://ghcr.io/<owner>/charts and attested
  # (release.yml, push: true). The only job that can write to the registry, and the only one
  # that asks for the permissions to: packages to push, id-token and
  # attestations to sign and store the provenance. Never on a pull request,
  # and never in a fork (which would publish to the fork owner's GHCR).
  #
  # !cancelled() and an explicit result check, not the default success(): a
  # job skipped further up the chain (`images` on a push) would otherwise skip
  # this one even though the gate passed.
  publish:
    name: publish
    needs: [changes, gate]
    if: >-
      !cancelled()
      && needs.gate.result == 'success'
      && needs.changes.outputs.code == 'true'
      && github.event_name == 'push'
      && !github.event.repository.fork
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      push: true
