  /v1/namespaces/{ns}/notification-deliveries/{id}/redrive:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/deliveryId'
    post:
      tags: [Notifications]
      operationId: redriveNotificationDelivery
      summary: Re-send a dead-lettered delivery
      description: |
        Queues a NEW delivery with the same payload and the same
        receiver-facing `dedup_key` (so a receiver that did get the original
