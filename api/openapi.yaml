  # ── backfills ────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/schedules/{name}/backfills:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/scheduleName'
    post:
      tags: [Backfills]
      operationId: startBackfill
      summary: Start a backfill of a schedule over an interval
      description: |
        Creates one run per logical tick of the schedule in `[from, to]`, at most
        `max_active` at a time and at most `max_runs` in total (0 = the
        workflow-manager's default).
      x-nexus-action: write
      x-nexus-permissions: [backfills.create, runs.create]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartBackfillRequest'}
            example: {from: '2026-09-01T00:00:00Z', to: '2026-09-08T00:00:00Z', max_active: 2, max_runs: 10}
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backfill'}
              example:
                id: 8a7b6c5d-4e3f-4a1b-9c0d-e1f2a3b4c5d6
                schedule_id: 3e4f5a6b-7c8d-4e9f-a0b1-c2d3e4f5a6b7
                schedule_name: nightly-hello
                namespace: default
                from: '2026-09-01T00:00:00Z'
                to: '2026-09-08T00:00:00Z'
                cursor_at: '2026-09-01T01:00:00Z'
                max_active: 2
                max_runs: 10
                runs_created: 0
                state: RUNNING
                detail: null
                created_at: '2026-09-24T09:25:00Z'
                updated_at: '2026-09-24T09:25:00Z'
                ended_at: null
                created_by: ops@example.com
        '400':
          description: '`unreadable_body`, `malformed_json`, `invalid_from`, `invalid_to` or `invalid_schedule`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ScheduleNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/SchedulesUnavailable'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    get:
      tags: [Backfills]
      operationId: listBackfills
      summary: List a schedule's backfills
      x-nexus-action: read
      x-nexus-permissions: [backfills.view]
      parameters:
        - $ref: '#/components/parameters/limit50'
      responses:
        '200':
          description: The backfills.
          content:
            application/json:
              schema:
                type: object
                required: [backfills]
                properties:
                  backfills:
                    type: array
                    items: {$ref: '#/components/schemas/Backfill'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ScheduleNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/backfills/{id}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/backfillId'
    get:
      tags: [Backfills]
      operationId: getBackfill
      summary: Get a backfill
      x-nexus-action: read
      x-nexus-permissions: [backfills.view]
      responses:
        '200':
          description: The backfill, with `schedule_name` when resolvable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backfill'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BackfillNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/backfills/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/backfillId'
    post:
      tags: [Backfills]
      operationId: pauseBackfill
      summary: Pause a backfill (the cursor is kept)
      description: |
        Only a RUNNING backfill can be paused. The transition is a compare-and-set on the stored state, so
        concurrent actions serialize and the loser gets 409 with the state the
        winner left. An unknown or malformed id is 404 `backfill_not_found`.
      x-nexus-action: write
      x-nexus-permissions: [backfills.update]
      responses:
        '200': {$ref: '#/components/responses/BackfillAction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BackfillNotFound'}
        '409': {$ref: '#/components/responses/BackfillStateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/SchedulesUnavailable'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/backfills/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/backfillId'
    post:
      tags: [Backfills]
      operationId: resumeBackfill
      summary: Resume a paused backfill
      description: |
        Only a PAUSED backfill can be resumed. The transition is a compare-and-set on the stored state, so
        concurrent actions serialize and the loser gets 409 with the state the
        winner left. An unknown or malformed id is 404 `backfill_not_found`.
      x-nexus-action: write
      x-nexus-permissions: [backfills.update]
      responses:
        '200': {$ref: '#/components/responses/BackfillAction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BackfillNotFound'}
        '409': {$ref: '#/components/responses/BackfillStateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/SchedulesUnavailable'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/backfills/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/backfillId'
    post:
      tags: [Backfills]
      operationId: cancelBackfill
      summary: Cancel a backfill (runs already created keep running)
      description: |
        Only a RUNNING or PAUSED backfill can be cancelled; CANCELLED is final. The transition is a compare-and-set on the stored state, so
        concurrent actions serialize and the loser gets 409 with the state the
        winner left. An unknown or malformed id is 404 `backfill_not_found`.
      x-nexus-action: write
      x-nexus-permissions: [backfills.update]
      responses:
        '200': {$ref: '#/components/responses/BackfillAction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BackfillNotFound'}
        '409': {$ref: '#/components/responses/BackfillStateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/SchedulesUnavailable'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── workers and capacity ─────────────────────────────────────────────────
  /v1/namespaces/{ns}/workers:
