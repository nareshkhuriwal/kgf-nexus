                    items: {$ref: '#/components/schemas/Worker'}
              example:
                workers:
                  - id: 2c9d8e7f-6a5b-4c3d-9e2f-1a0b9c8d7e6f
                    hostname: worker-7f9c-0
                    queues: [default, gpu]
                    executors: [subprocess, docker]
                    state: ACTIVE
                    labels: {zone: eu-west-1a}
                    capacity: {cpu_millis: 8000, memory_bytes: 34359738368, gpu_count: 1}
                    committed: {cpu_millis: 500, memory_bytes: 536870912}
                    agent_version: 1.14.2
                    registered_at: '2026-09-24T06:00:00Z'
                    last_heartbeat_at: '2026-09-24T09:14:55Z'
                    active_attempts: 1
