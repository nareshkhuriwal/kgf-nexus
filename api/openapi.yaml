      tags: [Workers]
      operationId: getWorker
      summary: Get a worker with its running and recent attempts
      x-nexus-action: read
      x-nexus-permissions: [workers.view]
      parameters:
        - name: recent_limit
          in: query
          description: How many terminal attempts to include; the store clamps large values.
          schema: {type: integer, minimum: 0, default: 25}
      responses:
        '200':
          description: The worker.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkerDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/workers/{id}/drain:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/workerId'
    post:
      tags: [Workers]
      operationId: drainWorker
      summary: Drain a worker
      description: |
        202 because the drain is RECORDED, not yet performed: the DRAIN directive
        rides the worker's next heartbeat response.
      x-nexus-action: admin_write
      x-nexus-permissions: [workers.drain]
      responses:
        '202':
          description: Drain recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrainAccepted'}
              example:
                worker_id: 2c9d8e7f-6a5b-4c3d-9e2f-1a0b9c8d7e6f
                state: DRAINING
                detail: the DRAIN directive will be delivered on the worker's next heartbeat response
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/workers/{id}/quarantine:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/workerId'
    post:
      tags: [Workers]
      operationId: quarantineWorker
      summary: Quarantine an ACTIVE worker
      x-nexus-action: admin_write
      x-nexus-permissions: [workers.quarantine]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuarantineRequest'}
            example: {reason: 'disk errors on /var/lib/nexus (INC-4412)', duration_ms: 3600000}
      responses:
        '200':
          description: Quarantined.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuarantineResult'}
        '400':
          description: '`invalid_json`, `invalid_reason` or `invalid_duration`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`not_active`: only an ACTIVE worker can be quarantined.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/workers/{id}/release:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/workerId'
    post:
      tags: [Workers]
      operationId: releaseWorker
      summary: Release a QUARANTINED worker
      x-nexus-action: admin_write
      x-nexus-permissions: [workers.quarantine]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReleaseRequest'}
      responses:
        '200':
          description: Released.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseResult'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`not_quarantined`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
