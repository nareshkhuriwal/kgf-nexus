#
# The OpenAPI 3.1 description of the KGF Nexus public REST API (architecture §8.2).
#
# This file is the contract, and it is TESTED against the code rather than
# trusted: services/api-gateway/rest/openapi_test.go fails when a registered
# route is missing here, when this file lists a route the gateway does not
# serve, when a method or a path parameter name differs, when an operation's
# x-nexus-permissions / x-nexus-action / security disagree with the route guard,
# and when any example fails its own schema. The gateway embeds this exact file
# (package github.com/khuriwalgroup/kgf-nexus/api) and serves it byte-for-byte at
# GET /v1/openapi.yaml.
openapi: 3.1.0
info:
  title: KGF Nexus REST API
  version: v1
  summary: Public REST/JSON API of the KGF Nexus workflow orchestrator.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The REST surface humans, `nexusctl`, the SDK and the console use. Worker
    traffic is NOT here: agents speak gRPC on a separate listener (§3.2).

    ## Authentication

    Every operation requires a bearer credential unless its `security` is empty.
    Three credential kinds are accepted in `Authorization: Bearer <credential>`
    (a bare credential without the `Bearer ` prefix is accepted too). The gateway
    dispatches on the credential's prefix:

    * `nxsess_...` - a console **session** from `POST /v1/auth/login`.
    * `nxtok_...` - a **scoped token** from `POST /v1/namespaces/{ns}/tokens`.
    * anything else - a namespace **API key** (for example `nxs_...` from `make seed`).

    A scoped token may belong to a **service account** and may carry an explicit
    permission ceiling; its effective permissions are then the account's (or
    its creator's) current grants intersected with that ceiling.

    **KGF Cloud context (ADR-0024).** With `NEXUS_AUTH_MODE` `kgf` or `both`,
    a request may instead carry a signed KGF context in `X-KGF-Context`
    (scheme `kgfContext`): the KGF organization, subscription and resource
    group map to one namespace, and the KGF role to Nexus permissions. Such a
    request must not ALSO carry `Authorization` (400 `ambiguous_credentials`);
    a context without a subscription and resource group is refused (403
    `kgf_scope_required`), as is a KGF service acting for itself that is not
    allowed to (403 `kgf_service_not_allowed`). In `kgf` mode Nexus sessions and
    the password, registration and email routes are not served. In
    `standalone` mode a request carrying `X-KGF-Context` is refused (400
    `kgf_context_not_accepted`) unless the gateway is configured to verify
    contexts for audit ATTRIBUTION only, in which case the bearer credential
    alone authorizes. These errors can come from every authenticated
    operation and are not repeated on each.

    **Correlation.** A request may send `X-Request-ID` (1-64 of `A-Z a-z 0-9 . _ : -`);
    it is recorded as the `request_id` of every audit row the request writes.
    A request authenticated by a KGF context uses the context's request id
    instead and gets it back in the `X-Request-ID` response header.

    Every credential is bound to ONE namespace; a `{ns}` path segment naming any
    other namespace answers 403. Authorization is two-layered: the coarse action
    of the route (`x-nexus-action`: `read`, `write` or `admin_write`) against the
    credential's role and scopes, then every fine-grained RBAC permission listed
    in `x-nexus-permissions` (all of them are required). Routes whose
    `x-nexus-permissions` is empty need only a valid credential; some of those
    additionally require a platform-operator session, which the operation says.

    ## Errors

    Every error body is the envelope `{"error": "<machine code>", "message":
    "<sentence for a human>"}` (schema `Error`). Some errors add fields - the
    spec validator's `problems`, a quota's `dimension`/`used`/`limit` - and name
    a more specific schema. Clients should branch on `error`, never on
    `message`. Authentication failures are one opaque 401 by design, and a
    failing authentication BACKEND is 503, never 401.

    ## Rate limiting

    When enabled, 429 responses carry `Retry-After` and `RateLimit-Limit`,
    `RateLimit-Remaining`, `RateLimit-Reset`.

    ## Pagination

    Most listings take `limit` and return the newest rows first. The run and
    notification-delivery listings are keyset-paginated: pass the response's
    `next_before` back as `before`. The user and audit listings, and usage
    rollups, page with an opaque `cursor`/`next_cursor` (`next_cursor` is null,
    or empty for usage, on the last page); a cursor the server did not issue is
    400 `invalid_cursor`.

    ## Streaming

    `GET .../runs/{id}/events` and `GET .../attempts/{id}/logs` stream
    server-sent events when the request carries `Accept: text/event-stream` or
    `stream=true`; both honour `Last-Event-ID` on reconnect. Attempt logs also
    stream as `text/plain` (`format=text`, optionally `follow=true`).

    ## Conditional routes

    Operations marked `x-nexus-conditional: identity` exist only when the
    gateway is built with identity wired (every production deployment); those
    marked `x-nexus-conditional: email` additionally need the email flows. When
    not wired they answer 404 because they are not registered at all. Routes
    whose upstream is optional (schedules, backfills, fleet health, logs, cache
    invalidation, quarantine, retry) are always registered and answer 501 when
    the upstream is not configured; so are notifications, webhook triggers,
    sensors and assets (501 `not_configured`).

    The audit and service-account routes are registered from the identity
    wiring too (their descriptions say so) but through their own helper, which
    the route-coverage test does not attribute to identity, so they carry no
    `x-nexus-conditional`.

    `POST /v1/hooks/{ns}/{trigger}` is the second unauthenticated route
    family after sign-in: a webhook sender holds no credential and proves
    itself with an HMAC signature instead.

    ## Coverage

    `/healthz` and `/readyz` are served by the same REST listener but outside
    `/v1` (they are mounted by the gateway binary, not by the REST package).
    They are described here AND included in the route-coverage test, which
    enumerates the routes of both the REST package and the health package.

    ## Extensions

    * `x-nexus-action` - the coarse guard action of the route.
    * `x-nexus-permissions` - every RBAC permission the route requires
      (`routePermissions` in services/api-gateway/rest/rbac_routes.go).
    * `x-nexus-conditional` - `identity` or `email`, see above.

    ## The workflow spec schema

    Spec documents are described by the gateway's own JSON Schema (draft
    2020-12), referenced by its canonical `$id`
    `https://nexus.khuriwalgroup.com/schemas/workflow-spec-v1.json`. The gateway
    serves the byte-identical document at `GET /v1/schemas/workflow-spec-v1.json`;
    tooling that cannot fetch the `$id` should register that response under the
    `$id` (the tests do exactly this).
servers:
  - url: '{scheme}://{host}'
    description: A KGF Nexus API gateway REST listener (NEXUS_REST_ADDR, default :8080).
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:8080
security:
  - apiKey: []
  - scopedToken: []
  - sessionToken: []
  - kgfContext: []
tags:
  - name: Specs
    description: Workflow definitions - submit, catalog, versions, delete.
  - name: Runs
    description: Workflow runs, their lifecycle and their event history.
  - name: Attempts
    description: Task attempt logs and replay assignments.
  - name: Schedules
    description: Cron schedules that create runs.
  - name: Backfills
    description: Bounded replays of a schedule over a past interval.
  - name: Workers
    description: The execution fleet, capacity, drain and quarantine.
  - name: Operations
    description: Triage, memo-cache invalidation and fleet health.
  - name: Platform
    description: Namespace infrastructure policy and the cluster registry.
  - name: Quotas
    description: Namespace quotas and metered usage (ADR-0021).
  - name: RBAC
    description: Custom roles and role assignment.
  - name: Auth
    description: Sign-in, registration, email verification and password recovery.
  - name: Tenants
    description: The caller's tenant and platform-operator tenant administration.
  - name: Users
    description: User administration and sessions.
  - name: Tokens
    description: Scoped machine tokens.
  - name: Audit
    description: The tamper-evident namespace audit trail, its export, retention, legal hold and SIEM sinks (ADR-0025).
  - name: Service accounts
    description: Non-human identities for agents and CI, with role bindings and ceilinged tokens (ADR-0024).
  - name: Notifications
    description: Channels, routing rules and the delivery outbox for run notifications (ADR-0028).
  - name: Triggers
    description: Signed inbound webhooks that start runs (ADR-0028).
  - name: Sensors
    description: Pollers that start runs when objects land or upstream workflows succeed (ADR-0028).
  - name: Assets
    description: Declared data-asset lineage across workflows (ADR-0028).
  - name: Meta
    description: Machine-readable descriptions of the API and the spec grammar.
  - name: Health
    description: Liveness and readiness probes.

paths:
  # ── specs ────────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/specs:
    parameters:
      - $ref: '#/components/parameters/ns'
    post:
      tags: [Specs]
      operationId: submitSpec
      summary: Submit (or validate) a workflow spec
      description: |
        Accepts JSON or YAML (by `Content-Type`, else sniffed from the first
        byte), validates structurally and semantically, canonicalizes,
        content-addresses and stores a new version. A byte-identical resubmit is
        a no-op answered 200 with the existing version (`created: false`); a new
        version is 201. With `dry_run=true` the document is validated exactly as
        a real submit and nothing is stored. The document's `namespace` must
        equal `{ns}`. Maximum body 4 MiB.
      x-nexus-action: write
      x-nexus-permissions: [workflows.publish]
      parameters:
        - name: dry_run
          in: query
          description: Validate only; store nothing. Use this in CI.
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowSpec'}
            examples:
              helloDag: {$ref: '#/components/examples/HelloDagSpec'}
          application/yaml:
            schema: {$ref: '#/components/schemas/WorkflowSpec'}
            examples:
              helloDag: {$ref: '#/components/examples/HelloDagSpec'}
      responses:
        '200':
          description: The identical spec was already stored (`created` is false), or a `dry_run` validation passed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SpecSubmitResult'
                  - $ref: '#/components/schemas/SpecDryRunResult'
              examples:
                unchanged:
                  summary: Byte-identical resubmit
                  value:
                    id: 7d0c2c3e-5b8e-4a55-9a61-2f1f0c9d3b10
                    namespace: default
                    name: hello-dag
                    version: 3
                    spec_hash: 4f9d1c0e7b2a6d58c3e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9
                    created: false
                    task_count: 3
                dryRun:
                  summary: dry_run=true
                  value:
                    namespace: default
                    name: hello-dag
                    spec_hash: 4f9d1c0e7b2a6d58c3e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9
                    task_count: 3
                    valid: true
                    dry_run: true
        '201':
          description: A new version was stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpecSubmitResult'}
              example:
                id: 7d0c2c3e-5b8e-4a55-9a61-2f1f0c9d3b10
                namespace: default
                name: hello-dag
                version: 3
                spec_hash: 4f9d1c0e7b2a6d58c3e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9
                created: true
                task_count: 3
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: '`spec_too_large`: the body exceeds 4 MiB.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: |
            `spec_invalid` (with `problems`, each located by path and, when
            known, line and column) or `namespace_mismatch`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/SpecInvalidError'
                  - $ref: '#/components/schemas/Error'
              examples:
                specInvalid:
                  value:
                    error: spec_invalid
                    message: spec failed validation
                    problems:
                      - path: /tasks/1/depends_on
                        message: additional properties 'depends_on' not allowed
                        stage: schema
                        line: 14
                        column: 5
                      - path: /edges/0
                        message: edge references unknown task "extrct"
                        stage: semantic
                namespaceMismatch:
                  value:
                    error: namespace_mismatch
                    message: spec declares namespace "analytics" but was submitted to "default"
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502':
          description: '`upstream_unavailable`: the workflow-manager could not store the spec.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    get:
      tags: [Specs]
      operationId: listWorkflows
      summary: List the workflow catalog
      description: One entry per workflow NAME with its newest version, optionally filtered by a search string.
      x-nexus-action: read
      x-nexus-permissions: [workflows.view]
      parameters:
        - name: search
          in: query
          description: Case-insensitive substring filter on the workflow name.
          schema: {type: string}
        - $ref: '#/components/parameters/limit100'
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
                required: [workflows]
                properties:
                  workflows:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogEntry'}
              example:
                workflows:
                  - id: 7d0c2c3e-5b8e-4a55-9a61-2f1f0c9d3b10
                    namespace: default
                    name: hello-dag
                    latest_version: 3
                    spec_hash: 4f9d1c0e7b2a6d58c3e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9
                    created_by: ci-deployer
                    updated_at: '2026-09-24T09:12:03Z'
                    version_count: 3
                    first_created_at: '2026-08-02T14:40:11Z'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/specs/{name}/versions:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/workflowName'
    get:
      tags: [Specs]
      operationId: listSpecVersions
      summary: List the versions of a workflow
      x-nexus-action: read
      x-nexus-permissions: [workflows.view]
      parameters:
        - $ref: '#/components/parameters/limit50'
      responses:
        '200':
          description: Versions, newest first. An unknown name yields an empty list.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: {$ref: '#/components/schemas/SpecVersion'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/specs/{name}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/workflowName'
    delete:
      tags: [Specs]
      operationId: deleteWorkflow
      summary: Delete every version of a workflow
      description: |
        Irreversible, so it is `admin_write`. REFUSED with 409 while any run or
        schedule still references the workflow; the body names the blockers.
      x-nexus-action: admin_write
      x-nexus-permissions: [workflows.delete]
      responses:
        '200':
          description: Deleted; reports how many versions were removed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowDeleted'}
              example: {namespace: default, name: hello-dag, versions_deleted: 3, deleted: true}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: '`workflow_not_found`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`workflow_referenced`: runs or schedules still reference it.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowReferencedError'}
              example:
                error: workflow_referenced
                message: workflow default/hello-dag is referenced by 12 runs and 1 schedule
                referencing_runs: 12
                referencing_schedules: [nightly-hello]
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/specdefs/{id}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/specId'
    get:
      tags: [Specs]
      operationId: getSpecDefinition
      summary: Get one spec version's definition by spec id
      description: |
        The exact canonical document a run pinned (runs carry `spec_id`). `spec`
        is returned verbatim, so its hash matches `spec_hash`.
      x-nexus-action: read
      x-nexus-permissions: [workflows.view]
      responses:
        '200':
          description: The definition.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpecDefinition'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── runs ─────────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/runs:
    parameters:
      - $ref: '#/components/parameters/ns'
    post:
      tags: [Runs]
      operationId: createRun
      summary: Create a run
      description: |
        Creates a run of a workflow by `spec_id` (an exact version) or
        `spec_name` (the newest version). Honours `Idempotency-Key`:

        * no key - create normally;
        * key + the same body (compared after JSON canonicalization) - replay the
          ORIGINAL response byte-for-byte with 200 and `Idempotency-Replayed: true`;
        * key + a different body - 409 `idempotency_key_reused`.

        Maximum body 256 KiB.
      x-nexus-action: write
      x-nexus-permissions: [runs.create, workflows.view]
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-chosen key making creation safe to retry.
          schema: {type: string, maxLength: 255}
          example: deploy-2026-09-24-hello-dag
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
            examples:
              byName:
                summary: Newest version, by name
                value:
                  spec_name: hello-dag
                  params: {source: s3://landing/2026-09-24/orders.csv}
                  priority: 10
              bySpecId:
                summary: An exact version, by spec id
                value:
                  spec_id: 7d0c2c3e-5b8e-4a55-9a61-2f1f0c9d3b10
                  trigger_kind: ci
                  params: {source: s3://landing/2026-09-24/orders.csv}
      responses:
        '200':
          description: |
            The run already existed: an idempotent replay (with
            `Idempotency-Replayed: true`) or the owner recognised the key.
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '201':
          description: The run was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
              example:
                id: 0b6f3a52-91c4-4f0e-8a77-3c5d2e1f9a40
                namespace: default
                spec_id: 7d0c2c3e-5b8e-4a55-9a61-2f1f0c9d3b10
                spec_name: hello-dag
                spec_version: 3
                state: PENDING
                priority: 10
                trigger_kind: api
                params: {source: s3://landing/2026-09-24/orders.csv}
                deadline_at: '2026-09-24T10:12:03Z'
                created_at: '2026-09-24T09:12:03Z'
                started_at: null
                ended_at: null
                state_version: 1
        '400':
          description: '`invalid_json`, `missing_spec` (neither spec_id nor spec_name) or `invalid_spec_id` (not a UUID).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: missing_spec, message: either spec_id or spec_name is required}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: '`spec_not_found`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`idempotency_key_reused`: the key was used with a different body.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error: idempotency_key_reused
                message: this Idempotency-Key was already used with a different request body
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_run`: the params do not satisfy the workflow.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: |
            `namespace_quota_exceeded` (a run quota; `Retry-After` when it is the
            hourly rate), `max_active_runs`, or `rate_limited`.
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/RunQuotaExceededError'
                  - $ref: '#/components/schemas/Error'
              examples:
                quota:
                  value:
                    error: namespace_quota_exceeded
                    message: 'namespace_quota_exceeded: runs_per_hour (used 500 of 500)'
                    dimension: runs_per_hour
                    used: 500
                    limit: 500
                    retry_after_seconds: 42
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List runs
      description: |
        Newest first, keyset-paginated on `created_at`: pass `next_before` back as
        `before` for the next page. `total` counts every run matching the filter.
      x-nexus-action: read
      x-nexus-permissions: [runs.view]
      parameters:
        - name: spec
          in: query
          description: Only runs of this workflow name.
          schema: {type: string}
        - name: state
          in: query
          description: Comma-separated run states, e.g. `FAILED,TIMED_OUT`.
          schema: {type: string}
          example: RUNNING,PENDING
        - name: before
          in: query
          description: RFC 3339 cursor; only runs created strictly before it.
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          description: Page size, 1-500. Values outside that range fall back to 100.
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: A page of runs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunList'}
              example:
                runs:
                  - id: 0b6f3a52-91c4-4f0e-8a77-3c5d2e1f9a40
                    namespace: default
                    spec_id: 7d0c2c3e-5b8e-4a55-9a61-2f1f0c9d3b10
                    spec_name: hello-dag
                    spec_version: 3
                    state: SUCCEEDED
                    priority: 10
                    trigger_kind: api
                    params: {source: s3://landing/2026-09-24/orders.csv}
                    deadline_at: '2026-09-24T10:12:03Z'
                    created_at: '2026-09-24T09:12:03Z'
                    started_at: '2026-09-24T09:12:04Z'
                    ended_at: '2026-09-24T09:14:41Z'
                    state_version: 7
                total: 118
