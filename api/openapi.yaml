        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── quotas and usage ─────────────────────────────────────────────────────
  /v1/namespaces/{ns}/quotas:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Quotas]
      operationId: getQuotas
      summary: Get the namespace's quotas and current usage per dimension
      x-nexus-action: read
      x-nexus-permissions: [quotas.view]
      responses:
        '200':
          description: The quotas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotasView'}
              example:
                namespace: default
                revision: 5
                quotas:
                  locked: false
                  max_inflight_attempts: 200
                  max_cpu_millis: 400000
                  max_memory_bytes: 858993459200
                  max_gpu_count: 8
                  max_custom: {}
                  max_active_runs: 50
                  max_runs_per_hour: 500
                  storage_soft_limit_bytes: 1099511627776
                  rate_limits:
                    openai/gpt-4o: {requests_per_second: 10, tokens_per_minute: 450000}
                dimensions:
                  - {name: inflight_attempts, kind: concurrent, unit: attempts, used: 37, limit: 200, enforced: true}
                  - {name: cpu_millis, kind: concurrent, unit: millicores, used: 74000, limit: 400000, enforced: true}
                  - {name: memory_bytes, kind: concurrent, unit: bytes, used: 158913789952, limit: 858993459200, enforced: true}
                  - {name: gpu_count, kind: concurrent, unit: gpus, used: 2, limit: 8, enforced: true}
                  - {name: active_runs, kind: run, unit: runs, used: 12, limit: 50, enforced: true}
                  - {name: runs_per_hour, kind: run, unit: runs/hour, used: 140, limit: 500, enforced: true}
                  - {name: storage_bytes, kind: storage, unit: bytes, used: 52613349376, limit: 1099511627776, enforced: false}
                storage:
                  source: task_logs
                  note: Measured from durable task-log bytes. Result-store artifacts are not metered yet, so this undercounts total storage.
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    put:
      tags: [Quotas]
      operationId: putQuotas
      summary: Replace the namespace's quotas
      description: |
        Optimistic concurrency on `revision`; 0 means unlimited for every limit.
        While a platform operator has `locked` the quotas, a namespace
        administrator may only tighten them (403 `quotas_locked` names what was
        loosened). Unknown fields are rejected. A body whose `quotas` omits
        `rate_limits` keeps the stored rate limits (so an editor that predates
        them cannot erase them); send `rate_limits: {}` to remove them all.
      x-nexus-action: admin_write
      x-nexus-permissions: [quotas.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuotasPutRequest'}
            example:
              revision: 4
              quotas:
                locked: false
                max_inflight_attempts: 200
                max_cpu_millis: 400000
                max_memory_bytes: 858993459200
                max_gpu_count: 8
                max_active_runs: 50
                max_runs_per_hour: 500
                storage_soft_limit_bytes: 1099511627776
                rate_limits:
                  openai: {requests_per_second: 50, tokens_per_minute: 2000000}
                  openai/gpt-4o: {requests_per_second: 10, tokens_per_minute: 450000, burst_tokens: 900000}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [namespace, revision, quotas]
                properties:
                  namespace: {type: string}
                  revision: {type: integer}
                  quotas: {$ref: '#/components/schemas/Quotas'}
        '400':
          description: '`invalid_quotas`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`forbidden`, or `quotas_locked` with the loosened limits.'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/QuotasLockedError'
                  - $ref: '#/components/schemas/Error'
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/usage:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Quotas]
      operationId: getUsage
      summary: Metered usage rollup for the namespace
