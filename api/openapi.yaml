              bindings:
                - {kubernetes_namespace: nexus-workers, worker_deployment: nexus-agent-default, pool: default, max_replicas: 10, max_scale_down_step: 1, scale_up_cooldown_seconds: 30, scale_down_cooldown_seconds: 300}
      responses:
