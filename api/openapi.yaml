      tags: [Meta]
      operationId: getOpenAPIDocument
      summary: This OpenAPI document
      description: Byte-identical to api/openapi.yaml at the gateway's build. Cacheable for an hour.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlHour'}
          content:
            application/yaml:
              schema: {type: object}

  # ── platform ─────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/platform/config:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Platform]
      operationId: getPlatformConfig
      summary: Get the namespace's infrastructure policy
      x-nexus-action: admin_write
      x-nexus-permissions: [infrastructure.view]
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformConfig'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    put:
      tags: [Platform]
      operationId: putPlatformConfig
      summary: Replace the namespace's infrastructure policy
      description: |
        Optimistic concurrency on `revision`. Unknown fields are rejected.
        Changing `scheduler.fair_share_weight` requires a platform-operator
        session. Quotas are NOT changed here (use PUT .../quotas): omitted quotas
        are kept, and changed quotas are refused at the current revision.
      x-nexus-action: admin_write
      x-nexus-permissions: [infrastructure.configure]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformConfig'}
            example:
              revision: 4
              scheduler: {min_replicas: 1, max_replicas: 4, target_cpu_percent: 65, scale_down_seconds: 300, fair_share_weight: 1}
              pools:
                - {name: default, queue: default, profile: small, min_workers: 1, max_workers: 10, tasks_per_worker: 4, idle_seconds: 600, max_scale_up_step: 2, enabled: true}
              profiles:
                - name: small
                  cloud: kubernetes
                  kubernetes_namespace: nexus-workers
                  service_account: nexus-worker
                  image: ghcr.io/khuriwalgroup/nexus-agent@sha256:0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
                  cpu_millis: 2000
                  memory_mib: 4096
                  gpu_count: 0
                  ephemeral_storage_mib: 10240
                  node_selector: {}
                  tolerations: []
                  deadline_seconds: 3600
                  grace_seconds: 30
      responses:
        '200':
          description: The saved policy with its new revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformConfig'}
        '400':
          description: '`invalid_policy`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/platform/plan:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Platform]
      operationId: getPlatformPlan
      summary: Preview the scaling decisions the policy implies
      description: Computed by the gateway and never applied; cluster controllers report their own decisions.
      x-nexus-action: admin_write
      x-nexus-permissions: [infrastructure.view]
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformPlan'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/platform/clusters:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Platform]
      operationId: listClusters
      summary: List registered clusters with everything their controllers reported
      x-nexus-action: admin_write
      x-nexus-permissions: [infrastructure.view]
      responses:
        '200':
          description: The registry.
          content:
            application/json:
              schema:
                type: object
                required: [clusters, observed_at]
                properties:
                  clusters:
                    description: '`null` (not `[]`) when no cluster is registered.'
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/ClusterView'}
                  observed_at: {$ref: '#/components/schemas/Timestamp'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/platform/clusters/{name}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/clusterName'
    put:
      tags: [Platform]
      operationId: putCluster
      summary: Register or update a cluster
      description: |
        The path names the cluster; a body `name` must match it. Optimistic
        concurrency on `desired_revision`. Unknown fields are rejected.
      x-nexus-action: admin_write
      x-nexus-permissions: [infrastructure.configure]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClusterSpec'}
            example:
              provider: aks
              provider_resource_id: /subscriptions/0000-1111/resourceGroups/nexus/providers/Microsoft.ContainerService/managedClusters/prod-weu
              expected_cluster_uid: 6f2d7c1e-0a9b-4c8d-b7e6-5f4a3b2c1d0e
              control_plane_namespace: kgf-nexus
              mode: plan
              desired_revision: 0
              bindings:
                - {kubernetes_namespace: nexus-workers, worker_deployment: nexus-agent-default, pool: default, max_replicas: 10, max_scale_down_step: 1, scale_up_cooldown_seconds: 30, scale_down_cooldown_seconds: 300}
      responses:
        '200':
          description: The saved registration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClusterSpec'}
        '400':
          description: '`invalid_cluster`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    delete:
      tags: [Platform]
      operationId: deleteCluster
      summary: Remove a cluster registration
      x-nexus-action: admin_write
      x-nexus-permissions: [infrastructure.configure]
      parameters:
        - name: revision
          in: query
          required: true
          description: The revision the operator saw; the delete is refused if it changed.
          schema: {type: integer, minimum: 1}
      responses:
        '204': {description: 'Removed.'}
        '400':
          description: '`invalid_request`: `revision` is missing or not a positive integer.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`revision_conflict` or `cluster_applying` (a cluster in apply mode cannot be removed).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── quotas and usage ─────────────────────────────────────────────────────
  /v1/namespaces/{ns}/quotas:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Quotas]
      operationId: getQuotas
      summary: Get the namespace's quotas and current usage per dimension
      x-nexus-action: read
      x-nexus-permissions: [quotas.view]
      responses:
        '200':
          description: The quotas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotasView'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    put:
      tags: [Quotas]
      operationId: putQuotas
      summary: Replace the namespace's quotas
      description: |
        Optimistic concurrency on `revision`; 0 means unlimited for every limit.
        While a platform operator has `locked` the quotas, a namespace
        administrator may only tighten them (403 `quotas_locked` names what was
        loosened). Unknown fields are rejected.
      x-nexus-action: admin_write
      x-nexus-permissions: [quotas.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuotasPutRequest'}
            example:
              revision: 4
              quotas: {locked: false, max_inflight_attempts: 200, max_cpu_millis: 400000, max_memory_bytes: 858993459200, max_gpu_count: 8, max_active_runs: 50, max_runs_per_hour: 500, storage_soft_limit_bytes: 1099511627776}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [namespace, revision, quotas]
                properties:
                  namespace: {type: string}
                  revision: {type: integer}
                  quotas: {$ref: '#/components/schemas/Quotas'}
        '400':
          description: '`invalid_quotas`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`forbidden`, or `quotas_locked` with the loosened limits.'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/QuotasLockedError'
                  - $ref: '#/components/schemas/Error'
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/usage:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Quotas]
      operationId: getUsage
      summary: Metered usage rollup for the namespace
      x-nexus-action: read
      x-nexus-permissions: [usage.view]
      parameters:
        - $ref: '#/components/parameters/usageFrom'
        - $ref: '#/components/parameters/usageTo'
        - name: group_by
          in: query
          schema: {type: string, enum: [day, queue, pool, worker, executor, outcome, none], default: day}
        - $ref: '#/components/parameters/usageCursor'
        - $ref: '#/components/parameters/usageLimit'
      responses:
        '200':
          description: One page of buckets.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsagePage'}
              example:
                namespace: default
                from: '2026-08-25T00:00:00Z'
                to: '2026-09-24T00:00:00Z'
                group_by: day
                buckets:
                  - key: '2026-09-23'
                    attempts: 412
                    wall_seconds: 18233.5
                    reserved_seconds: 19011.25
                    cpu_core_seconds: 9120.75
                    memory_gib_seconds: 36481
                    gpu_seconds: 0
                    measured_cpu_seconds: 7022.4
                    measured_attempts: 398
                next_cursor: ''
                attribution: attempts are counted in the UTC day they ended
        '400': {$ref: '#/components/responses/InvalidQuery'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/platform/usage:
    get:
      tags: [Quotas]
      operationId: getPlatformUsage
      summary: Usage across every namespace (platform operators)
      description: Requires a platform-operator session; buckets are keyed by namespace.
      x-nexus-action: read
      x-nexus-permissions: []
      parameters:
        - $ref: '#/components/parameters/usageFrom'
        - $ref: '#/components/parameters/usageTo'
        - $ref: '#/components/parameters/usageCursor'
        - $ref: '#/components/parameters/usageLimit'
      responses:
        '200':
          description: One page of buckets, one per namespace.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsagePage'}
        '400': {$ref: '#/components/responses/InvalidQuery'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PlatformOperatorRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── rbac ─────────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/roles:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [RBAC]
      operationId: listRoles
      summary: List built-in and custom roles, and the permission catalog
      x-nexus-action: read
      x-nexus-permissions: [roles.view]
      responses:
        '200':
          description: The roles.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/roles/{name}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/roleName'
    put:
      tags: [RBAC]
      operationId: putRole
      summary: Create or update a custom role
      description: |
        `revision` 0 creates; otherwise it must equal the stored revision. A
        caller may only grant permissions it holds itself, and never
        `users.manage`, `tokens.manage` or `roles.manage`.
      x-nexus-action: read
      x-nexus-permissions: [roles.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutRoleRequest'}
            example: {permissions: [overview.view, runs.view, runs.create, workflows.view], revision: 0}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved: {const: true}
        '400':
          description: '`invalid` (body or role name) or `invalid_grants`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`forbidden` or `invalid_grant` (cannot delegate that permission).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`builtin` or `conflict` (the revision changed).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    delete:
      tags: [RBAC]
      operationId: deleteRole
      summary: Delete an unassigned custom role
      x-nexus-action: read
      x-nexus-permissions: [roles.manage]
      parameters:
        - name: revision
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '204': {description: 'Deleted.'}
        '400':
          description: '`revision_required`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`builtin`, `assigned` (still assigned to users) or `conflict`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    get:
      tags: [RBAC]
      operationId: getUserRoles
      summary: Get a user's role assignment
      x-nexus-action: read
      x-nexus-permissions: [users.view]
      responses:
        '200':
          description: The assignment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserRoles'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    put:
      tags: [RBAC]
      operationId: putUserRoles
      summary: Replace a reader account's role assignment
      description: Not for your own account, and not for administrator accounts.
      x-nexus-action: read
      x-nexus-permissions: [roles.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutUserRolesRequest'}
            example: {roles: [Workflow Operator], revision: 2}
      responses:
        '200':
          description: The new assignment.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: {type: string}
        '400':
          description: '`invalid` or `unknown_role`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`forbidden` or `invalid_grant`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`self_assignment`, `protected_admin`, `protected_role` or `conflict`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── auth ─────────────────────────────────────────────────────────────────
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange an email and password for a session token
      description: |
        Unauthenticated. Every failure is one opaque 401. The token is returned
        exactly once. With email flows wired and verification required, an
        unverified account gets 403 `email_not_verified` (only after the password
        checked out). Failures spend the address's auth-failure budget.
      x-nexus-conditional: identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {namespace: default, email: ops@example.com, password: correct horse battery staple}
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
              example:
                token: nxsess_Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5MGFiY2RlZg
                expires_at: '2026-09-25T09:12:03Z'
                user:
                  id: 1d2c3b4a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  email: ops@example.com
                  display_name: Ops Team
                  namespace: default
                  role: admin
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: '`unauthenticated`: invalid email or password (deliberately not which).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: unauthenticated, message: invalid email or password}
        '403':
          description: '`email_not_verified`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: '`unavailable`: the identity backend failed.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Self-service registration of a new tenant and its administrator
      description: |
        Unauthenticated. Creates a tenant whose namespace is a new UUID and its
        first administrator. Sign in afterwards with that namespace (the "tenant
        ID"). When email flows are wired, `email_verification` reports whether a
        verification email was queued.
      x-nexus-conditional: identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
            example: {name: Acme Analytics, email: founder@acme.example, password: a long and unguessable passphrase}
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantCreated'}
              example:
                tenant:
                  id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d
                  namespace: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d
                  name: Acme Analytics
                  contact_email: founder@acme.example
                  created_at: '2026-09-24T09:40:00Z'
                administrator_id: 0f9e8d7c-6b5a-4493-8271-605f4e3d2c1b
                email_verification: {required: true, delivery: queued}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`registration_conflict`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_customer`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/auth/email/verification:
    post:
      tags: [Auth]
      operationId: requestVerificationEmail
      summary: Send a new email-verification link
      description: |
        Unauthenticated and NOT an account oracle: the same 202 is returned
        whether or not the address has an account needing verification.
      x-nexus-conditional: email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailLinkRequest'}
            example: {email: founder@acme.example, namespace: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d}
      responses:
        '202': {$ref: '#/components/responses/EmailLinkAccepted'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_email` or `invalid_namespace`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/EmailUnavailable'}

  /v1/auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Consume an email-verification link token
      x-nexus-conditional: email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkToken'}
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                required: [verified, email]
                properties:
                  verified: {const: true}
                  email: {type: string, format: email}
              example: {verified: true, email: founder@acme.example}
        '400':
          description: '`invalid_json` or `invalid_token` (invalid, expired or used).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: '`unavailable`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Send a password-reset link
      description: Unauthenticated and not an account oracle, like the verification request.
      x-nexus-conditional: email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailLinkRequest'}
      responses:
        '202': {$ref: '#/components/responses/EmailLinkAccepted'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_email` or `invalid_namespace`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/EmailUnavailable'}

  /v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset-link token
      description: Signs out every existing session of the account.
      x-nexus-conditional: email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetWithLink'}
      responses:
        '200':
          description: Reset.
          content:
            application/json:
              schema:
                type: object
                required: [password_reset, sessions_revoked]
                properties:
                  password_reset: {const: true}
                  sessions_revoked: {type: integer, minimum: 0}
        '400':
          description: '`invalid_json` or `invalid_token`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_password` (12-1024 characters).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: '`unavailable`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the caller's own session
      x-nexus-conditional: identity
      x-nexus-action: read
      x-nexus-permissions: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                required: [logged_out]
                properties:
                  logged_out: {const: true}
        '400':
          description: '`not_a_session`: the credential is an API key or token.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/auth/whoami:
    get:
      tags: [Auth]
      operationId: whoami
      summary: Describe the calling principal
      description: The same shape for every credential kind; `effective_permissions` is what the UI should render from.
      x-nexus-conditional: identity
      x-nexus-action: read
      x-nexus-permissions: []
      responses:
        '200':
          description: The principal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Whoami'}
              example:
                namespace: default
                name: ops@example.com
                role: reader
                kind: session
                permissions: {read: true, write: true, admin_write: false}
                effective_permissions: [overview.view, runs.cancel, runs.create, runs.view, workflows.view]
                roles: [Workflow Operator]
                user_id: 1d2c3b4a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── tenants ──────────────────────────────────────────────────────────────
  /v1/account/tenant:
    get:
      tags: [Tenants]
      operationId: getAccountTenant
      summary: The caller's tenant, and whether the caller is a platform operator
      x-nexus-conditional: identity
      x-nexus-action: read
      x-nexus-permissions: []
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                type: object
                required: [tenant, platform_operator]
                properties:
                  tenant: {$ref: '#/components/schemas/Tenant'}
                  platform_operator: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500':
          description: '`internal`. A namespace with no tenant row (for example a seeded dev namespace) currently lands here too.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/platform/tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: List tenants (platform operators)
      description: Requires a platform-operator session. At most 500, newest first.
      x-nexus-conditional: identity
      x-nexus-action: read
      x-nexus-permissions: []
      responses:
        '200':
          description: The tenants.
          content:
            application/json:
              schema:
                type: object
                required: [tenants, limit]
                properties:
                  tenants:
                    type: array
                    items: {$ref: '#/components/schemas/Tenant'}
                  limit: {const: 500}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PlatformOperatorRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Onboard a tenant (platform operators)
      description: Requires a platform-operator session. Same body and result as self-service registration.
      x-nexus-conditional: identity
      x-nexus-action: read
      x-nexus-permissions: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Onboarded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantCreated'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PlatformOperatorRequired'}
        '409':
          description: '`registration_conflict`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_customer`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── users ────────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/users:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.view]
      parameters:
        - $ref: '#/components/parameters/limit100'
      responses:
        '200':
          description: The users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      description: |
        With `role_name` (an RBAC role) the caller also needs `roles.manage` and
        may only assign permissions it holds; `role` is then derived.
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
            example: {email: analyst@example.com, display_name: Data Analyst, role_name: Viewer, password: a long and unguessable passphrase}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`email_taken`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_user` (with `problems`) or `unknown_role`.'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemsError'
                  - $ref: '#/components/schemas/Error'
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    put:
      tags: [Users]
      operationId: updateUser
      summary: Edit a user's email and display name
      description: |
        Compare-and-set: `previous_email` and `previous_display_name` must equal
        the stored values or the edit is refused with 409. Unknown fields are
        rejected. Roles and account state have their own routes.
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
            example: {email: analyst@example.com, display_name: Senior Analyst, previous_email: analyst@example.com, previous_display_name: Data Analyst}
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          description: '`invalid` or `invalid_user`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`conflict` (edited meanwhile) or `email_taken`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    post:
      tags: [Users]
      operationId: disableUser
      summary: Disable a user and revoke their sessions
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`cannot_disable_self` or `last_administrator`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    post:
      tags: [Users]
      operationId: enableUser
      summary: Re-enable a user
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Set a user's password and end all their sessions
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, minLength: 12}
      responses:
        '200':
          description: Set; reports how many sessions were revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionsRevoked'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_password` (with `problems`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProblemsError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500':
          description: '`internal`, or `partial_reset`: the password changed but sessions could not be revoked.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}/sessions:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    get:
      tags: [Users]
      operationId: listUserSessions
      summary: List a user's sessions
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.view]
      parameters:
        - $ref: '#/components/parameters/limit50'
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}/sessions/revoke:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    post:
      tags: [Users]
      operationId: revokeUserSessions
      summary: End every session a user holds
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionsRevoked'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── tokens ───────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/tokens:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: List scoped tokens (never their secrets)
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [tokens.view]
      parameters:
        - $ref: '#/components/parameters/limit100'
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: {$ref: '#/components/schemas/Token'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Tokens]
      operationId: createToken
      summary: Mint a scoped token (the secret is shown once)
      description: |
        `expires_in_days` 0 (or absent) means the 90-day default; a NEGATIVE
        value means no expiry. Scopes intersect with the role and never extend it.
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [tokens.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTokenRequest'}
            example: {name: github-actions-deploy, role: admin, scopes: [read, write], expires_in_days: 30}
      responses:
        '201':
          description: Minted. Store `token` now; it is never shown again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenCreated'}
              example:
                id: 4b3a2c1d-0e9f-48a7-b6c5-d4e3f2a1b0c9
                namespace: default
                name: github-actions-deploy
                scopes: [read, write]
                role: admin
                expires_at: '2026-10-24T09:50:00Z'
                last_used_at: null
                created_by: 1d2c3b4a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                created_at: '2026-09-24T09:50:00Z'
                revoked_at: null
                live: true
                token: nxtok_c2VjcmV0LXRva2VuLXZhbHVlLWV4YW1wbGU
                token_shown_once: true
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_token_request` (with `problems`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProblemsError'}
              example:
                error: invalid_token_request
                message: token could not be created
                problems: ['at least one scope is required; a token with no scopes can do nothing']
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/tokens/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/tokenId'
    post:
      tags: [Tokens]
      operationId: revokeToken
      summary: Revoke a scoped token
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [tokens.manage]
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                required: [token_id, revoked]
                properties:
                  token_id: {type: string}
                  revoked: {const: true}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── audit ────────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/audit:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Audit]
      operationId: listAudit
      summary: Read the audit trail
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.view]
      parameters:
        - name: action
          in: query
          description: Only entries with this action, e.g. `token.create`.
          schema: {type: string}
        - name: actor_id
          in: query
          schema: {type: string}
        - name: outcome
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/limit100'
      responses:
        '200':
          description: Entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEntry'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── probes (outside /v1) ─────────────────────────────────────────────────
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness
      description: Process liveness only; checks nothing external. Restarting on failure is correct.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness
      description: Checks dependencies (bounded to 2 s). Fails while the process is draining for shutdown.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
              example: {status: ready, checks: {postgres: ok}}
        '503':
          description: Not ready, or draining.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
              examples:
                notReady:
                  value: {status: not_ready, checks: {postgres: 'dial tcp 10.0.0.5:5432: connect: connection refused'}}
                draining:
                  value: {status: draining, detail: shutting down; not accepting new traffic}

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A namespace API key (no recognised prefix, e.g. `nxs_...`).
    scopedToken:
      type: http
      scheme: bearer
      bearerFormat: nxtok_
      description: A scoped token minted by `POST /v1/namespaces/{ns}/tokens`; its scopes intersect with its role.
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: nxsess_
      description: A console session from `POST /v1/auth/login`; RBAC roles apply.

  parameters:
    ns:
      name: ns
      in: path
      required: true
      description: The namespace; must be the credential's own namespace.
      schema: {type: string, minLength: 1}
      example: default
    runId:
      name: id
      in: path
      required: true
      description: The run id.
      schema: {type: string}
      example: 0b6f3a52-91c4-4f0e-8a77-3c5d2e1f9a40
    attemptId:
      name: id
      in: path
      required: true
      description: The attempt id.
      schema: {type: string}
      example: 5a1e9c0d-3f2b-4d6a-8e7c-9b0a1f2e3d4c
    specId:
      name: id
      in: path
      required: true
      description: The spec (version) id - a run's `spec_id`.
      schema: {type: string}
    workflowName:
      name: name
      in: path
      required: true
      description: The workflow name.
      schema: {type: string}
      example: hello-dag
    scheduleName:
      name: name
      in: path
      required: true
      description: The schedule name.
      schema: {type: string}
      example: nightly-hello
    backfillId:
      name: id
      in: path
      required: true
      description: The backfill id.
      schema: {type: string}
    workerId:
      name: id
      in: path
      required: true
      description: The worker id.
      schema: {type: string}
    userId:
      name: id
      in: path
      required: true
      description: The user id.
      schema: {type: string}
    tokenId:
      name: id
      in: path
      required: true
      description: The scoped token id.
      schema: {type: string}
    roleName:
      name: name
      in: path
      required: true
      description: The role name (2-64 letters, digits, spaces, `_` or `-`, starting with a letter).
      schema: {type: string}
      example: Data Engineers
    clusterName:
      name: name
      in: path
      required: true
      description: The cluster name (a DNS label).
      schema: {type: string}
      example: prod-weu
    limit100:
      name: limit
      in: query
      description: Maximum rows.
      schema: {type: integer, minimum: 0, default: 100}
    limit50:
      name: limit
      in: query
      description: Maximum rows.
      schema: {type: integer, minimum: 0, default: 50}
    previewCount:
      name: count
      in: query
      description: How many upcoming fire times to compute (clamped to 1-20).
      schema: {type: integer, minimum: 1, maximum: 20, default: 5}
    lastEventId:
      name: Last-Event-ID
      in: header
      description: SSE resume cursor, sent automatically by EventSource clients on reconnect.
      schema: {type: string}
    usageFrom:
      name: from
      in: query
      description: RFC 3339 timestamp or `YYYY-MM-DD`; default 30 days ago.
      schema: {type: string}
      example: '2026-09-01'
    usageTo:
      name: to
      in: query
      description: RFC 3339 timestamp or `YYYY-MM-DD`; default now.
      schema: {type: string}
    usageCursor:
      name: cursor
      in: query
      description: The previous page's `next_cursor`.
      schema: {type: string, maxLength: 512}
    usageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1}

  headers:
    RetryAfter:
      description: Seconds to wait before retrying (at least 1).
      schema: {type: integer, minimum: 1}
    RateLimitLimit:
      description: The bucket size.
      schema: {type: integer}
    RateLimitRemaining:
      description: Tokens left in the bucket.
      schema: {type: integer}
    RateLimitReset:
      description: Seconds until a token is available.
      schema: {type: integer}
    IdempotencyReplayed:
      description: '`true` when this is the cached response of an earlier request with the same Idempotency-Key.'
      schema: {type: string, enum: ['true']}
    CacheControlHour:
      description: '`public, max-age=3600`.'
      schema: {type: string}

  responses:
    BadRequest:
      description: The request was malformed; `error` names why.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: '`unauthenticated`: no valid credential. Deliberately opaque.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: unauthenticated, message: valid credentials are required}
    Forbidden:
      description: |
        `forbidden`: the credential may not perform this action in this
        namespace, or lacks a listed permission (`Missing permission: <name>`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: forbidden, message: 'Missing permission: runs.create'}
    PlatformOperatorRequired:
      description: '`forbidden`: a platform-operator session is required (or a listed permission is missing).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: forbidden, message: Platform operator session required}
    NotFound:
      description: '`not_found`: nothing with that id in this namespace.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: not_found, message: not found}
    ScheduleNotFound:
      description: '`schedule_not_found`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: schedule_not_found, message: no such schedule}
    BackfillNotFound:
      description: '`backfill_not_found`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: 'The body exceeds the route''s limit (`body_too_large`, `too_large`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: '`rate_limited`.'
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
        RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: rate_limited, message: Too many requests. Try again shortly.}
    InternalError:
      description: '`internal`. The detail is in the gateway log, never in the response.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: internal, message: request failed}
    AuthUnavailable:
      description: '`unavailable`: the authentication backend failed. Retry; do not rotate the credential.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: unavailable, message: authentication is temporarily unavailable}
    NotImplemented:
      description: '`not_implemented`: this gateway was not wired with the upstream this route needs.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SchedulesUnavailable:
      description: '`schedules_unavailable`: this gateway has no schedule service configured.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RevisionConflict:
      description: '`revision_conflict`: the stored revision changed; re-read and retry.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RunStateConflict:
      description: '`run_state_conflict`: the run''s state does not allow this.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: run_state_conflict, message: 'run is SUCCEEDED; pause applies only to PENDING or RUNNING runs'}
    RunLifecycle:
      description: The run after the transition.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Run'}
    BackfillAction:
      description: The backfill after the action.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Backfill'}
    InvalidQuery:
      description: '`invalid_query`: a bad `from`, `to`, `group_by`, `limit` or `cursor`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    EmailLinkAccepted:
      description: Accepted. Identical whether or not an email is actually sent.
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status: {const: accepted}
              message: {type: string}
          example: {status: accepted, message: 'If an account with that email address exists, a password reset link is on its way.'}
    EmailUnavailable:
      description: '`email_unavailable` (email delivery is not configured) or `unavailable` (the queue is busy).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  examples:
    HelloDagSpec:
      summary: A three-task pipeline
      value:
        api_version: nexus.dev/v1
        namespace: default
        name: hello-dag
        description: 'Three tasks in a line: extract, transform, load.'
        params:
          source: {type: string, required: true}
        tasks:
          - id: extract
            task_ref: hello.extract
            version: 1
            queue: default
            input_params: {source: source}
            inputs:
              source: {type: json, required: true}
            outputs:
              result: {type: json, required: true}
            runtime:
              executor: subprocess
              command: [sh, -c]
              args: [echo 'extracting records from the source']
          - id: transform
            task_ref: hello.transform
            version: 1
            inputs:
              data: {type: json, required: true}
            outputs:
              result: {type: json, required: true}
            runtime:
              executor: subprocess
              command: [sh, -c]
              args: [echo 'transforming']
          - id: load
            task_ref: hello.load
            version: 1
            inputs:
              summary: {type: json, required: true}
            runtime:
              executor: subprocess
              command: [sh, -c]
              args: [echo 'loading']
        edges:
          - {from_node_id: extract, to_node_id: transform, output_to_input: {data: result}}
          - {from_node_id: transform, to_node_id: load, output_to_input: {summary: result}}

  schemas:
    WorkflowSpec:
      description: |
        A workflow spec document. This is a `$ref` to the gateway's own JSON
        Schema by its canonical `$id`; the same bytes are served at
        `GET /v1/schemas/workflow-spec-v1.json`.
      $ref: https://nexus.khuriwalgroup.com/schemas/workflow-spec-v1.json

    Error:
      description: The error envelope every error response uses. Some errors add fields.
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code; branch on this.
          examples: [not_found, forbidden, invalid_cron]
        message:
          type: string
          description: A sentence for a human. Not stable.

    ProblemsError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [problems]
          properties:
            problems:
              type: array
              items: {type: string}

    SpecProblem:
      type: object
      required: [path, message, stage]
      properties:
        path: {type: string, description: 'JSON-Pointer-style location in the document.'}
        message: {type: string}
        stage: {type: string, enum: [parse, schema, semantic]}
        line: {type: integer, minimum: 1, description: '1-based line in the SUBMITTED document, when known.'}
        column: {type: integer, minimum: 1}

    SpecInvalidError:
      type: object
      required: [error, message, problems]
      properties:
        error: {const: spec_invalid}
        message: {type: string}
        problems:
          type: array
          items: {$ref: '#/components/schemas/SpecProblem'}

    WorkflowReferencedError:
      type: object
      required: [error, message]
      properties:
        error: {const: workflow_referenced}
        message: {type: string}
        referencing_runs: {type: integer, minimum: 0}
        referencing_schedules:
          type: array
          items: {type: string}

    RunQuotaExceededError:
      type: object
      required: [error, message, dimension, used, limit]
      properties:
        error: {const: namespace_quota_exceeded}
        message: {type: string}
        dimension: {type: string, examples: [active_runs, runs_per_hour]}
        used: {type: integer}
        limit: {type: integer}
        retry_after_seconds: {type: integer, minimum: 1}

    NodesNotRetryableError:
      type: object
      required: [error, message, nodes]
      properties:
        error: {const: nodes_not_retryable}
        message: {type: string}
        nodes:
          type: array
          items:
            type: object
            required: [node_id, state]
            properties:
              node_id: {type: string}
              state: {$ref: '#/components/schemas/NodeState'}

    UnknownNodesError:
      type: object
      required: [error, message, nodes]
      properties:
        error: {const: unknown_nodes}
        message: {type: string}
        nodes:
          type: array
          items: {type: string}

    QuotasLockedError:
      type: object
      required: [error, message, loosened]
      properties:
        error: {const: quotas_locked}
        message: {type: string}
        loosened:
          type: [array, 'null']
          items: {type: string}

    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, 'null']
      format: date-time
    Uuid:
      type: string
      format: uuid
    SpecHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 content address of the canonical spec (hex).
    AnyJSON:
      description: An arbitrary JSON value stored by the platform, passed through verbatim (may be null).

    RunState:
      type: string
      enum: [PENDING, RUNNING, PAUSING, PAUSED, SUCCEEDED, FAILED, CANCELLING, CANCELLED, TIMED_OUT]
    NodeState:
      type: string
      enum: [PENDING, READY, RUNNING, SUCCEEDED, FAILED, SKIPPED, UPSTREAM_FAILED, CANCELLED]
    AttemptState:
      type: string
      enum: [PENDING, DISPATCHED, RUNNING, SUCCEEDED, FAILED, TIMED_OUT, LOST, CANCELLED]
    WorkerState:
      type: string
      enum: [ACTIVE, DRAINING, QUARANTINED, DEAD]

    SpecSubmitResult:
      type: object
      required: [id, namespace, name, version, spec_hash, created, task_count]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        version: {type: integer, minimum: 1}
        spec_hash: {$ref: '#/components/schemas/SpecHash'}
        created: {type: boolean, description: 'false when an identical version already existed.'}
        task_count: {type: integer, minimum: 1}

    SpecDryRunResult:
      type: object
      required: [namespace, name, spec_hash, task_count, valid, dry_run]
      properties:
        namespace: {type: string}
        name: {type: string}
        spec_hash: {$ref: '#/components/schemas/SpecHash'}
        task_count: {type: integer, minimum: 1}
        valid: {const: true}
        dry_run: {const: true}

    CatalogEntry:
      type: object
      required: [id, namespace, name, latest_version, spec_hash, created_by, updated_at, version_count, first_created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        latest_version: {type: integer}
        spec_hash: {$ref: '#/components/schemas/SpecHash'}
        created_by: {type: string}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        version_count: {type: integer}
        first_created_at: {$ref: '#/components/schemas/Timestamp'}

    SpecVersion:
      type: object
      required: [id, name, version, spec_hash, created_by, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        version: {type: integer}
        spec_hash: {$ref: '#/components/schemas/SpecHash'}
        created_by: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    SpecDefinition:
      type: object
      required: [id, namespace, name, version, spec_hash, created_by, created_at, spec]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        version: {type: integer}
        spec_hash: {$ref: '#/components/schemas/SpecHash'}
        created_by: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        spec: {$ref: '#/components/schemas/WorkflowSpec'}

    WorkflowDeleted:
      type: object
      required: [namespace, name, versions_deleted, deleted]
      properties:
        namespace: {type: string}
        name: {type: string}
        versions_deleted: {type: integer, minimum: 1}
        deleted: {const: true}

    CreateRunRequest:
      type: object
      description: Exactly one of `spec_id` or `spec_name` is needed; `spec_id` wins when both are given.
      anyOf:
        - required: [spec_id]
        - required: [spec_name]
      properties:
        spec_id:
          type: string
          format: uuid
          description: An exact spec version.
        spec_name:
          type: string
          description: A workflow name; its newest version is used.
        trigger_kind:
          type: string
          default: api
          description: Free-form provenance label recorded on the run.
        params:
          type: object
          description: Values for the workflow's declared `params`.
        priority:
          type: integer
          format: int32

    Run:
      type: object
      required: [id, namespace, spec_id, spec_name, spec_version, state, priority, trigger_kind, params, deadline_at, created_at, started_at, ended_at, state_version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        spec_id: {$ref: '#/components/schemas/Uuid'}
        spec_name: {type: string}
        spec_version: {type: integer, description: 'The pinned version this run executes.'}
        state: {$ref: '#/components/schemas/RunState'}
        priority: {type: integer}
        trigger_kind: {type: string}
        params: {$ref: '#/components/schemas/AnyJSON'}
        deadline_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
        state_version: {type: integer, description: 'Increments on every state change.'}

    RunList:
      type: object
      required: [runs, total]
      properties:
        runs:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        total: {type: integer, minimum: 0}
        next_before:
          type: string
          format: date-time
          description: Present only when another page exists; pass it as `before`.

    RunNode:
      type: object
      required: [node_id, task_ref, state, trigger_rule, max_attempts, attempts_used, map_index, parent_node_id]
      properties:
        node_id: {type: string}
        task_ref: {type: string}
        state: {$ref: '#/components/schemas/NodeState'}
        trigger_rule: {type: string}
        max_attempts: {type: integer}
        attempts_used: {type: integer}
        map_index: {type: [integer, 'null'], description: 'Set on a dynamically expanded child.'}
        parent_node_id: {type: [string, 'null'], description: 'The template a child was expanded from.'}
        failure_reason: {type: string, description: 'Why a refused fan-in failed this node (it has no attempt to carry an error).'}

    RunEdge:
      type: object
      required: [from_node_id, to_node_id, output_to_input]
      properties:
        from_node_id: {type: string}
        to_node_id: {type: string}
        output_to_input: {$ref: '#/components/schemas/AnyJSON'}

    Attempt:
      type: object
      description: '`error` and `metrics` are omitted without `tasks.results.view`.'
      required: [id, node_id, attempt_number, state, queue, worker_id, worker_hostname, pending_reason, scheduled_at, dispatched_at, started_at, ended_at, cache_hit_of, progress_message, progress_fraction, progress_at, progress_message_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        node_id: {type: string}
        attempt_number: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/AttemptState'}
        queue: {type: string}
        worker_id: {type: [string, 'null']}
        worker_hostname: {type: [string, 'null']}
        pending_reason: {type: [string, 'null'], description: 'Why a PENDING attempt has not dispatched, e.g. `waiting_for_resources: gpu (need 4, free 3)`.'}
        error: {$ref: '#/components/schemas/AnyJSON'}
        metrics: {$ref: '#/components/schemas/AnyJSON'}
        scheduled_at: {$ref: '#/components/schemas/Timestamp'}
        dispatched_at: {$ref: '#/components/schemas/NullableTimestamp'}
        started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
        cache_hit_of: {type: [string, 'null'], description: 'The attempt whose memoized result this one reused.'}
        progress_message: {type: [string, 'null'], description: 'The latest status the worker reported.'}
        progress_fraction: {type: [number, 'null'], minimum: 0, maximum: 1}
        progress_at: {$ref: '#/components/schemas/NullableTimestamp'}
        progress_message_at: {$ref: '#/components/schemas/NullableTimestamp'}

    Expansion:
      type: object
      required: [template_node_id, source_node_id, source_output, item_count, max_fanout, outcome, reason, detail, created_at]
      properties:
        template_node_id: {type: string}
        source_node_id: {type: string}
        source_output: {type: string}
        item_count: {type: integer}
        max_fanout: {type: integer}
        outcome: {type: string}
        reason: {type: [string, 'null']}
        detail: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [nodes, edges, attempts, expansions]
          properties:
            nodes:
              type: array
              items: {$ref: '#/components/schemas/RunNode'}
            edges:
              type: array
              items: {$ref: '#/components/schemas/RunEdge'}
            attempts:
              type: array
              items: {$ref: '#/components/schemas/Attempt'}
            expansions:
              type: array
              items: {$ref: '#/components/schemas/Expansion'}

    RetryRequest:
      type: object
      additionalProperties: false
      properties:
        nodes:
          type: array
          maxItems: 10000
          description: Node ids to retry from; empty or absent means every node that did not succeed.
          items: {type: string, minLength: 1}

    RetryResult:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [retried_nodes]
          properties:
            retried_nodes:
              type: array
              items: {type: string}

    Event:
      type: object
      required: [seq, node_id, attempt_id, kind, payload, actor, occurred_at]
      properties:
        seq: {type: integer, minimum: 1}
        node_id: {type: [string, 'null']}
        attempt_id: {type: [string, 'null']}
        kind: {type: string}
        payload:
          description: 'The event body, or `{"redacted": true}` without `tasks.results.view`.'
        actor: {type: string}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}

    LogStatus:
      type: object
      required: [state, attempt_state, lines, bytes, chunks, truncated_lines, truncated_bytes, dropped_lines, compacted, detail]
      properties:
        state: {type: string, enum: [none, live, complete, partial, expired]}
        attempt_state: {type: string}
        lines: {type: integer}
        bytes: {type: integer}
        chunks: {type: integer}
        truncated_lines: {type: integer}
        truncated_bytes: {type: integer}
        dropped_lines: {type: integer}
        compacted: {type: boolean}
        last_chunk_at: {$ref: '#/components/schemas/Timestamp'}
        finalized_at: {$ref: '#/components/schemas/Timestamp'}
        detail: {type: string}

    LogLine:
      type: object
      required: [n, ts, stream, message]
      properties:
        n: {type: integer, minimum: 1}
        ts: {$ref: '#/components/schemas/Timestamp'}
        stream: {type: string}
        message: {type: string}
        partial: {type: boolean}
        kind:
          type: string
          description: Set on the platform's own lines.
          enum: [truncated, truncation_summary, dropped, gap]
        gap_end: {type: integer, description: 'The last line a gap line stands in for.'}

    LogPage:
      type: object
      required: [attempt_id, log, lines, next_line, has_more]
      properties:
        attempt_id: {$ref: '#/components/schemas/Uuid'}
        log: {$ref: '#/components/schemas/LogStatus'}
        lines:
          type: array
          items: {$ref: '#/components/schemas/LogLine'}
        first_line: {type: integer}
        next_line: {type: integer}
        has_more: {type: boolean}
        unreadable_chunks: {type: integer}

    LogSearch:
      type: object
      required: [attempt_id, log, search]
      properties:
        attempt_id: {$ref: '#/components/schemas/Uuid'}
        log: {$ref: '#/components/schemas/LogStatus'}
        search:
          type: object
          required: [matches, next_line, scanned_lines, scanned_bytes, complete]
          properties:
            matches:
              type: array
              items: {$ref: '#/components/schemas/LogLine'}
            next_line: {type: integer}
            scanned_lines: {type: integer}
            scanned_bytes: {type: integer}
            complete: {type: boolean}
            stopped_by: {type: string, enum: [matches, bytes, time]}
            unreadable_chunks: {type: integer}

    AttemptAssignment:
      type: object
      required: [namespace, workflow, attempt, assignment, encoding, result_store, secrets, omitted]
      properties:
        namespace: {type: string}
        workflow:
          type: object
          required: [name, version]
          properties:
            name: {type: string}
            version: {type: integer}
        attempt:
          type: object
          required: [id, run_id, node_id, attempt_number, state]
          properties:
            id: {type: string}
            run_id: {type: string}
            node_id: {type: string}
            attempt_number: {type: integer}
            state: {$ref: '#/components/schemas/AttemptState'}
            map_index: {type: integer}
            parent_node_id: {type: string}
        assignment:
          type: object
          required: [attempt_id, run_id, node_id, attempt_number, namespace, idempotency_key, spec, inputs]
          properties:
            attempt_id: {type: string}
            run_id: {type: string}
            node_id: {type: string}
            attempt_number: {type: integer}
            namespace: {type: string}
            idempotency_key: {type: string}
            spec: {type: [object, 'null'], description: 'The TaskSpec in protojson form, secrets reduced to references.'}
            inputs:
              type: object
              description: Resolved input references by input name (inline values are base64; blobs stay references).
            map_index: {type: integer}
        encoding: {const: protojson}
        result_store:
          type: object
          required: [inline_threshold_bytes]
          properties:
            inline_threshold_bytes: {type: integer}
        secrets:
          type: array
          items:
            type: object
            required: [name, ref]
            properties:
              name: {type: string}
              ref: {type: string}
        omitted:
          type: array
          items: {type: string}

    ScheduleFields:
      type: object
      properties:
        spec_name: {type: string, minLength: 1, description: 'Must name an existing workflow; its newest version is used unless `spec_version` pins one.'}
        spec_version: {type: [integer, 'null']}
        cron: {type: string, minLength: 1, description: 'A five-field cron expression.'}
        timezone: {type: string, description: 'IANA zone; default UTC.'}
        params: {type: object}
        priority: {type: integer, format: int32}
        overlap_policy: {type: string, enum: ['', skip, allow, queue_one], description: 'What to do when the previous run is still active; default `skip`.'}
        catchup_limit: {type: integer, minimum: 0, description: 'Missed ticks to fire after downtime; 0 fires only the tick that just came due.'}
        enabled: {type: boolean}

    CreateScheduleRequest:
      allOf:
        - $ref: '#/components/schemas/ScheduleFields'
        - type: object
          required: [name, spec_name, cron]
          properties:
            name: {type: string, minLength: 1}
            enabled: {default: true}

    UpdateScheduleRequest:
      allOf:
        - $ref: '#/components/schemas/ScheduleFields'
        - type: object
          required: [spec_name, cron, enabled]
          properties:
            name: {type: string, description: 'Optional; must equal the path''s name.'}

    Schedule:
      type: object
      required: [id, namespace, name, spec_name, cron, timezone, params, priority, overlap_policy, catchup_limit, enabled, next_fire_at, last_fire_at, created_at, updated_at, created_by]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        spec_name: {type: string}
        spec_version: {type: integer, description: 'Present only when the schedule pins a version.'}
        cron: {type: string}
        timezone: {type: string}
        params: {type: [object, 'null']}
        priority: {type: integer}
        overlap_policy: {type: string}
        catchup_limit: {type: integer}
        enabled: {type: boolean}
        next_fire_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Null when not currently armed (disabled, being fired, or left unarmed by a replica that died mid-fire).
        last_fire_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        created_by: {type: string}
        next_fires:
          type: array
          description: Upcoming fire times in the schedule's zone (create, update and get only).
          items: {type: string, format: date-time}
        cron_error: {type: string, description: 'Set instead of `next_fires` when the stored cron no longer compiles.'}

    SchedulePreview:
      type: object
      required: [cron, timezone, valid]
      properties:
        cron: {type: string}
        timezone: {type: string}
        valid: {type: boolean}
        next_fires:
          type: array
          items: {type: string, format: date-time}
        error: {type: string}

    StartBackfillRequest:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        max_active: {type: integer, minimum: 0}
        max_runs: {type: integer, minimum: 0}

    Backfill:
      type: object
      required: [id, schedule_id, namespace, from, to, cursor_at, max_active, max_runs, runs_created, state, detail, created_at, updated_at, ended_at, created_by]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        schedule_id: {$ref: '#/components/schemas/Uuid'}
        schedule_name: {type: string, description: 'Present where it is cheap to resolve.'}
        namespace: {type: string}
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        cursor_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: The next logical tick to generate; null when the interval is exhausted.
        max_active: {type: integer}
        max_runs: {type: integer}
        runs_created: {type: integer}
        state: {type: string, enum: [RUNNING, PAUSED, COMPLETED, CANCELLED, FAILED]}
        detail: {type: [object, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_by: {type: string}

    Worker:
      type: object
      required: [id, hostname, queues, executors, state, labels, capacity, committed, agent_version, registered_at, last_heartbeat_at, active_attempts]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        hostname: {type: string}
        queues:
          type: [array, 'null']
          items: {type: string}
        executors:
          type: [array, 'null']
          items: {type: string}
        state: {$ref: '#/components/schemas/WorkerState'}
        labels: {$ref: '#/components/schemas/AnyJSON'}
        capacity: {$ref: '#/components/schemas/AnyJSON'}
        committed: {$ref: '#/components/schemas/AnyJSON'}
        agent_version: {type: string}
        registered_at: {$ref: '#/components/schemas/Timestamp'}
        last_heartbeat_at: {$ref: '#/components/schemas/Timestamp'}
        active_attempts: {type: integer, minimum: 0}

    WorkerAttempt:
      type: object
      required: [id, run_id, node_id, task_ref, attempt_number, state, queue, scheduled_at, started_at, ended_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        run_id: {$ref: '#/components/schemas/Uuid'}
        node_id: {type: string}
        task_ref: {type: string}
        attempt_number: {type: integer}
        state: {$ref: '#/components/schemas/AttemptState'}
        queue: {type: string}
        scheduled_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}

    WorkerDetail:
      allOf:
        - $ref: '#/components/schemas/Worker'
        - type: object
          required: [running_attempts, recent_attempts]
          properties:
            running_attempts:
              type: array
              description: DISPATCHED and RUNNING attempts.
              items: {$ref: '#/components/schemas/WorkerAttempt'}
            recent_attempts:
              type: array
              description: The bounded terminal tail.
              items: {$ref: '#/components/schemas/WorkerAttempt'}

    DrainAccepted:
      type: object
      required: [worker_id, state, detail]
      properties:
        worker_id: {type: string}
        state: {const: DRAINING}
        detail: {type: string}

    Capacity:
      type: object
      required: [namespace, advertised, committed, workers, pending_attempts]
      properties:
        namespace: {type: string}
        advertised: {type: [object, 'null']}
        committed: {type: [object, 'null']}
        workers: {type: integer}
        pending_attempts: {type: integer}

    QuarantineRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
        duration_ms:
          type: integer
          minimum: 0
          maximum: 2592000000
          description: 0 (or absent) quarantines indefinitely; at most 30 days.

    ReleaseRequest:
      type: object
      properties:
        reason: {type: string}

    QuarantineResult:
      type: object
      required: [worker_id, state, duration_ms]
      properties:
        worker_id: {type: string}
        state: {const: QUARANTINED}
        duration_ms: {type: integer}

    ReleaseResult:
      type: object
      required: [worker_id, state]
      properties:
        worker_id: {type: string}
        state: {const: ACTIVE}

    Quarantine:
      type: object
      required: [id, trigger, reason, evidence, actor, started_at, expires_at, released_at, released_by, release_reason]
      properties:
        id: {type: string}
        trigger: {type: string}
        reason: {type: string}
        evidence: {$ref: '#/components/schemas/AnyJSON'}
        actor: {type: string}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/NullableTimestamp'}
        released_at: {$ref: '#/components/schemas/NullableTimestamp'}
        released_by: {type: [string, 'null']}
        release_reason: {type: [string, 'null']}

    CacheInvalidationRequest:
      type: object
      anyOf:
        - required: [task_ref]
        - required: [cache_key]
      properties:
        task_ref: {type: string}
        task_version: {type: [integer, 'null'], description: 'Requires `task_ref`.'}
        cache_key: {type: string}
        reason: {type: string}

    CacheInvalidationResult:
      type: object
      required: [invalidation_id, invalidated_at]
      properties:
        invalidation_id: {type: integer}
        invalidated_at: {$ref: '#/components/schemas/Timestamp'}

    AttentionItem:
      type: object
      required: [kind, severity, summary, detail, link, run_id, run_state, spec_name, occurred_at]
      properties:
        kind: {type: string, enum: [indeterminate_outcome, retry_exhausted, blocked_on_capacity, run_failed, run_stalled]}
        severity: {type: string, enum: [critical, warning]}
        summary: {type: string}
        detail: {type: string}
        link: {type: string, description: 'Console path to the run, node or attempt.'}
        run_id: {type: string}
        run_state: {type: string}
        spec_name: {type: string}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
        node_id: {type: string}
        attempt_id: {type: string}
        reason: {type: string, description: 'Machine-readable code behind the sentence.'}

    AttentionList:
      type: object
      required: [items, count, truncated]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AttentionItem'}
        count: {type: integer, description: 'Items returned.'}
        truncated: {type: boolean, description: 'True when the list reached the cap.'}

    FleetHealth:
      type: object
      required: [status, upstreams, measures]
      properties:
        status: {type: string, enum: [ok, degraded]}
        upstreams:
          type: [array, 'null']
          items:
            type: object
            required: [name, addr, state, configured]
            properties:
              name: {type: string}
              addr: {type: string}
              state: {type: string, enum: [IDLE, CONNECTING, READY, TRANSIENT_FAILURE, SHUTDOWN]}
              configured: {type: boolean}
        measures: {type: string}

    PlatformConfig:
      type: object
      additionalProperties: false
      required: [revision, scheduler]
      properties:
        revision: {type: integer, minimum: 0}
        scheduler:
          type: object
          additionalProperties: false
          properties:
            min_replicas: {type: integer, minimum: 1}
            max_replicas: {type: integer, maximum: 100}
            target_cpu_percent: {type: integer, minimum: 10, maximum: 90}
            scale_down_seconds: {type: integer, minimum: 60, maximum: 3600}
            fair_share_weight: {type: integer, minimum: 0, maximum: 100, description: '1-100; 0 in a request means the default (1). Changing it needs a platform operator.'}
        pools:
          type: [array, 'null']
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              name: {type: string}
              queue: {type: string}
              profile: {type: string}
              min_workers: {type: integer}
              max_workers: {type: integer}
              tasks_per_worker: {type: integer}
              idle_seconds: {type: integer}
              max_scale_up_step: {type: integer}
              enabled: {type: boolean}
        profiles:
          type: [array, 'null']
          maxItems: 100
          items: {$ref: '#/components/schemas/PodProfile'}
        quotas: {$ref: '#/components/schemas/Quotas'}

    PodProfile:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        cloud: {type: string, enum: [aws, azure, kubernetes]}
        kubernetes_namespace: {type: string}
        service_account: {type: string}
        image: {type: string, description: 'Must be pinned by digest: `image@sha256:<64 hex>`.'}
        cpu_millis: {type: integer}
        memory_mib: {type: integer}
        gpu_count: {type: integer}
        ephemeral_storage_mib: {type: integer}
        node_selector:
          type: [object, 'null']
          additionalProperties: {type: string}
        tolerations:
          type: [array, 'null']
          items:
            type: object
            additionalProperties: false
            properties:
              key: {type: string}
              value: {type: string}
              effect: {type: string}
        deadline_seconds: {type: integer}
        grace_seconds: {type: integer}

    Quotas:
      type: object
      additionalProperties: false
      description: Every limit uses 0 for UNLIMITED.
      properties:
        locked: {type: boolean, description: 'Set by a platform operator; while set a namespace admin may only tighten.'}
        max_inflight_attempts: {type: integer, minimum: 0}
        max_cpu_millis: {type: integer, minimum: 0}
        max_memory_bytes: {type: integer, minimum: 0}
        max_gpu_count: {type: integer, minimum: 0}
        max_custom:
          type: object
          maxProperties: 32
          additionalProperties: {type: integer, minimum: 0}
        max_active_runs: {type: integer, minimum: 0}
        max_runs_per_hour: {type: integer, minimum: 0}
        storage_soft_limit_bytes: {type: integer, minimum: 0, description: 'Reported against measured storage, never enforced.'}

    PlatformPlan:
      type: object
      required: [revision, mode, decisions, task_job_templates, controllers, message]
      properties:
        revision: {type: integer}
        mode: {const: preview}
        decisions:
          type: array
          items:
            type: object
            required: [pool, current, desired, reason, limited, demand]
            properties:
              pool: {type: string}
              current: {type: integer}
              desired: {type: integer}
              reason: {type: string}
              limited: {type: boolean}
              demand:
                type: object
                properties:
                  pending_tasks: {type: integer}
                  running_tasks: {type: integer}
                  cpu_millis: {type: integer}
                  memory_mib: {type: integer}
                  gpu_count: {type: integer}
                  current_workers: {type: integer}
                  idle_seconds: {type: integer}
                  unschedulable_tasks: {type: integer}
        task_job_templates:
          type: object
          description: A Kubernetes Job template per profile name.
        controllers:
          type: array
          items:
            type: object
            required: [cluster, registry_mode, reporting]
            properties:
              cluster: {type: string}
              registry_mode: {type: string}
              reporting: {type: boolean}
              effective_mode: {type: string}
              last_report_at: {$ref: '#/components/schemas/NullableTimestamp'}
        message: {type: string}

    ClusterBinding:
      type: object
      additionalProperties: false
      properties:
        kubernetes_namespace: {type: string}
        worker_deployment: {type: string}
        pool: {type: string, description: 'A pool defined in the namespace''s platform config.'}
        max_replicas: {type: integer, minimum: 0, maximum: 10000}
        max_scale_down_step: {type: integer, minimum: 0, maximum: 100}
        scale_up_cooldown_seconds: {type: integer, minimum: 0}
        scale_down_cooldown_seconds: {type: integer, minimum: 0}

    ClusterSpec:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, description: 'Optional in a request; must equal the path.'}
        provider: {type: string, enum: [aks, eks, kubernetes]}
        provider_resource_id: {type: string, maxLength: 1024}
        expected_cluster_uid: {type: string, maxLength: 64, description: 'Required in apply mode.'}
        control_plane_namespace: {type: string, default: kgf-nexus}
        mode: {type: string, enum: [plan, apply], default: plan}
        desired_revision: {type: integer, minimum: 0}
        bindings:
          type: [array, 'null']
          maxItems: 50
          items: {$ref: '#/components/schemas/ClusterBinding'}

    ClusterView:
      type: object
      description: The registration (ClusterSpec fields) plus everything the in-cluster controller reported.
      required: [id, name, provider, mode, desired_revision, created_at, updated_at, updated_by, status]
      properties:
        id: {type: string}
        name: {type: string}
        provider: {type: string}
        provider_resource_id: {type: string}
        expected_cluster_uid: {type: string}
        control_plane_namespace: {type: string}
        mode: {type: string}
        desired_revision: {type: integer}
        bindings:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/ClusterBinding'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        updated_by: {type: string}
        status:
          description: The controller's latest self-report; null when it never reported.
          type: [object, 'null']
          properties:
            observed_revision: {type: integer}
            observed_cluster_uid: {type: string}
            identity_verified: {type: boolean}
            kubernetes_version: {type: string}
            controller_identity: {type: string}
            effective_mode: {type: string}
            effective_mode_reason: {type: string}
            last_report_at: {$ref: '#/components/schemas/NullableTimestamp'}
            last_error: {type: string}
            last_error_at: {$ref: '#/components/schemas/NullableTimestamp'}
        observations: {type: [array, 'null'], items: {type: object}}
        scaling: {type: [array, 'null'], items: {type: object}}
        events: {type: [array, 'null'], items: {type: object}}
        errors: {type: [array, 'null'], items: {type: object}}
        jobs_shown: {type: integer}

    QuotaDimension:
      type: object
      required: [name, kind, unit, used, limit, enforced]
      properties:
        name: {type: string, examples: [inflight_attempts, cpu_millis, active_runs, storage_bytes]}
        kind: {type: string, enum: [concurrent, run, storage]}
        unit: {type: string}
        used: {type: integer}
        limit: {type: integer, description: '0 means unlimited.'}
        enforced: {type: boolean}

    QuotasView:
      type: object
      required: [namespace, revision, quotas, dimensions, storage]
      properties:
        namespace: {type: string}
        revision: {type: integer}
        quotas: {$ref: '#/components/schemas/Quotas'}
        dimensions:
          type: array
          items: {$ref: '#/components/schemas/QuotaDimension'}
        storage:
          type: object
          required: [source, note]
          properties:
            source: {type: string}
            note: {type: string}

    QuotasPutRequest:
      type: object
      additionalProperties: false
      required: [revision, quotas]
      properties:
        revision: {type: integer, minimum: 0}
        quotas: {$ref: '#/components/schemas/Quotas'}

    UsagePage:
      type: object
      required: [from, to, group_by, buckets, next_cursor, attribution]
      properties:
        namespace: {type: string, description: 'Absent on the platform-wide rollup.'}
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        group_by: {type: string}
        buckets:
          type: [array, 'null']
          items:
            type: object
            required: [key, attempts]
            properties:
              key: {type: string}
              attempts: {type: integer}
              wall_seconds: {type: number}
              reserved_seconds: {type: number}
              cpu_core_seconds: {type: number}
              memory_gib_seconds: {type: number}
              gpu_seconds: {type: number}
              measured_cpu_seconds: {type: number}
              measured_attempts: {type: integer}
        next_cursor: {type: string, description: 'Empty on the last page.'}
        attribution: {type: string}

    Role:
      type: object
      required: [name, permissions, builtin, revision]
      properties:
        name: {type: string}
        permissions:
          type: [array, 'null']
          items: {type: string}
        builtin: {type: boolean}
        revision: {type: integer}
        immutable: {type: boolean, description: 'Built-in roles only.'}
        assignable: {type: boolean, description: 'Built-in roles only.'}

    RoleList:
      type: object
      required: [roles, catalog]
      properties:
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
        catalog:
          type: object
          description: Module name to its actions; a permission is `<module>.<action>`.
          additionalProperties:
            type: array
            items: {type: string}

    PutRoleRequest:
      type: object
      additionalProperties: false
      properties:
        permissions:
          type: [array, 'null']
          items: {type: string}
        revision: {type: integer, minimum: 0}

    UserRoles:
      type: object
      required: [roles, legacy, revision]
      properties:
        roles:
          type: [array, 'null']
          items: {type: string}
        legacy: {type: boolean, description: 'True when the user has no RBAC assignment (the account role applies).'}
        revision: {type: integer}
        protected: {type: boolean, description: 'Set for administrator accounts.'}

    PutUserRolesRequest:
      type: object
      additionalProperties: false
      properties:
        roles:
          type: [array, 'null']
          maxItems: 20
          items: {type: string}
        revision: {type: integer, minimum: 0}

    LoginRequest:
      type: object
      required: [namespace, email, password]
      properties:
        namespace: {type: string, description: 'The tenant''s namespace (tenant ID).'}
        email: {type: string}
        password: {type: string, format: password}

    LoginResult:
      type: object
      required: [token, expires_at, user]
      properties:
        token: {type: string, pattern: '^nxsess_', description: 'Shown exactly once.'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        user:
          type: object
          required: [id, email, display_name, namespace, role]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            email: {type: string}
            display_name: {type: string}
            namespace: {type: string}
            role: {type: string}

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 12, maxLength: 1024}

    Tenant:
      type: object
      required: [id, namespace, name, contact_email, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        contact_email: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    TenantCreated:
      type: object
      required: [tenant, administrator_id]
      properties:
        tenant: {$ref: '#/components/schemas/Tenant'}
        administrator_id: {$ref: '#/components/schemas/Uuid'}
        email_verification:
          type: object
          description: Present only when email flows are wired.
          required: [required]
          properties:
            required: {type: boolean}
            delivery: {type: string, enum: [mail_disabled, not_sent, queued, not_queued]}

    EmailLinkRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
        namespace: {type: string, maxLength: 200, description: 'Optional; narrows to one tenant.'}

    LinkToken:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 1, maxLength: 256}

    PasswordResetWithLink:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 1, maxLength: 256}
        password: {type: string, format: password, minLength: 12, maxLength: 1024}

    Whoami:
      type: object
      required: [namespace, name, role, kind, permissions, effective_permissions, roles]
      properties:
        namespace: {type: string}
        name: {type: string}
        role: {type: string, enum: [admin, reader, worker]}
        kind: {type: string, enum: [api_key, session, token]}
        permissions:
          type: object
          description: Coarse actions this principal may perform.
          required: [read, write, admin_write]
          properties:
            read: {type: boolean}
            write: {type: boolean}
            admin_write: {type: boolean}
        effective_permissions:
          type: array
          items: {type: string}
        roles:
          type: [array, 'null']
          items: {type: string}
        user_id: {type: string}
        scopes:
          type: array
          items: {type: string}

    User:
      type: object
      required: [id, namespace, email, display_name, role, created_at, disabled_at, disabled, email_verified]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        email: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [admin, reader]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        disabled_at: {$ref: '#/components/schemas/NullableTimestamp'}
        disabled: {type: boolean}
        email_verified: {type: boolean}
        roles:
          type: array
          description: Present on creation with `role_name`.
          items: {type: string}

    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [admin, reader], default: reader}
        role_name: {type: string, description: 'An RBAC role to assign (needs roles.manage).'}
        password: {type: string, format: password, minLength: 12}

    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [email, display_name, previous_email, previous_display_name]
      properties:
        email: {type: string, maxLength: 254}
        display_name: {type: string, maxLength: 200}
        previous_email: {type: string}
        previous_display_name: {type: string}

    SessionsRevoked:
      type: object
      required: [user_id, sessions_revoked]
      properties:
        user_id: {type: string}
        sessions_revoked: {type: integer, minimum: 0}

    Session:
      type: object
      required: [id, created_at, expires_at, revoked_at, last_used_at, user_agent, client_ip, live]
      properties:
        id: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        revoked_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_used_at: {$ref: '#/components/schemas/NullableTimestamp'}
        user_agent: {type: string}
        client_ip: {type: string}
        live: {type: boolean}

    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1}
        role: {type: string, enum: [admin, reader, worker], default: reader}
        scopes:
          type: array
          minItems: 1
          items: {type: string, enum: [read, write, admin_write, worker_rpc]}
        expires_in_days: {type: integer, default: 0, description: '0 = 90 days; negative = never expires.'}

    Token:
      type: object
      required: [id, namespace, name, scopes, role, expires_at, last_used_at, created_by, created_at, revoked_at, live]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        scopes:
          type: [array, 'null']
          items: {type: string}
        role: {type: string}
        expires_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_used_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_by: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        revoked_at: {$ref: '#/components/schemas/NullableTimestamp'}
        live: {type: boolean}

    TokenCreated:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [token, token_shown_once]
          properties:
            token: {type: string, pattern: '^nxtok_'}
            token_shown_once: {const: true}

    AuditEntry:
      type: object
      required: [id, namespace, actor_id, actor_kind, actor_label, action, target_kind, target_id, outcome, detail, client_ip, occurred_at]
      properties:
        id: {type: integer}
        namespace: {type: string}
        actor_id: {type: [string, 'null']}
        actor_kind: {type: string}
        actor_label: {type: string}
        action: {type: string}
        target_kind: {type: string}
        target_id: {type: string}
        outcome: {type: string}
        detail: {$ref: '#/components/schemas/AnyJSON'}
        client_ip: {type: string}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}

    Readiness:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, not_ready, draining]}
        checks:
          type: object
          additionalProperties: {type: string}
        detail: {type: string}
