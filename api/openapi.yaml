        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ScheduleNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/SchedulesUnavailable'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/schedules/{name}/enable:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/scheduleName'
    post:
      tags: [Schedules]
      operationId: enableSchedule
      summary: Enable a schedule
      description: The next fire time is recomputed from now, so re-enabling never fires a burst of missed ticks.
      x-nexus-action: write
      x-nexus-permissions: [schedules.update]
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '400':
          description: '`invalid_cron` or `unreachable_cron`: the stored expression cannot fire.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
