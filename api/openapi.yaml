          schema: {type: string, enum: [day, queue, pool, worker, executor, outcome, none], default: day}
        - $ref: '#/components/parameters/usageCursor'
        - $ref: '#/components/parameters/usageLimit'
      responses:
        '200':
          description: One page of buckets.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsagePage'}
              example:
                namespace: default
                from: '2026-08-25T00:00:00Z'
                to: '2026-09-24T00:00:00Z'
                group_by: day
                buckets:
                  - key: '2026-09-23'
                    attempts: 412
                    wall_seconds: 18233.5
                    reserved_seconds: 19011.25
                    cpu_core_seconds: 9120.75
                    memory_gib_seconds: 36481
                    gpu_seconds: 0
                    measured_cpu_seconds: 7022.4
                    measured_attempts: 398
                next_cursor: ''
                attribution: attempts are counted in the UTC day they ended
        '400': {$ref: '#/components/responses/InvalidQuery'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/platform/usage:
    get:
      tags: [Quotas]
      operationId: getPlatformUsage
      summary: Usage across every namespace (platform operators)
      description: Requires a platform-operator session; buckets are keyed by namespace.
      x-nexus-action: read
      x-nexus-permissions: []
      parameters:
        - $ref: '#/components/parameters/usageFrom'
        - $ref: '#/components/parameters/usageTo'
        - $ref: '#/components/parameters/usageCursor'
        - $ref: '#/components/parameters/usageLimit'
      responses:
        '200':
          description: One page of buckets, one per namespace.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsagePage'}
        '400': {$ref: '#/components/responses/InvalidQuery'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PlatformOperatorRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

