  /v1/namespaces/{ns}/runs/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/runId'
    get:
      tags: [Runs]
      operationId: listRunEvents
      summary: Read or live-tail a run's event history
      description: |
        Events are ordered by `seq`, a gap-free per-run sequence. Returns JSON by
        default; with `Accept: text/event-stream` or `stream=true` it streams
        server-sent events and keeps the connection open. Each SSE frame is
        `id: <seq>`, `event: <kind>`, `data: <Event JSON>`; a `: keepalive`
        comment is sent every 20 s, and `event: error` ends the stream on a read
        failure. The stream re-checks the credential on every poll and ends when
        it no longer allows `runs.view`. Without `tasks.results.view` every
        event's `payload` is `{"redacted": true}`.
      x-nexus-action: read
      x-nexus-permissions: [runs.view]
      parameters:
        - name: after_seq
          in: query
          description: Only events with a sequence greater than this.
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          description: Maximum events in a JSON response.
          schema: {type: integer, minimum: 0, default: 500}
        - name: stream
          in: query
          description: '`true` streams server-sent events (same as `Accept: text/event-stream`).'
          schema: {type: boolean}
        - $ref: '#/components/parameters/lastEventId'
      responses:
        '200':
          description: The events, or an event stream.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/Event'}
              example:
                events:
                  - seq: 1
                    node_id: null
                    attempt_id: null
                    kind: run.created
                    payload: {trigger_kind: api}
                    actor: user:ci-deployer
                    occurred_at: '2026-09-24T09:12:03Z'
                  - seq: 2
                    node_id: extract
                    attempt_id: 9f8e7d6c-5b4a-4392-8170-6f5e4d3c2b1a
                    kind: attempt.dispatched
                    payload: {queue: default}
                    actor: scheduler
                    occurred_at: '2026-09-24T09:12:04Z'
            text/event-stream:
              schema: {type: string}
              example: |+
                id: 2
                event: attempt.dispatched
                data: {"seq":2,"node_id":"extract","attempt_id":"9f8e7d6c-5b4a-4392-8170-6f5e4d3c2b1a","kind":"attempt.dispatched","payload":{"queue":"default"},"actor":"scheduler","occurred_at":"2026-09-24T09:12:04Z"}

                : keepalive

