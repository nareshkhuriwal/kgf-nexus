      responses:
        '200':
          description: The receipts.
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items: {$ref: '#/components/schemas/WebhookReceipt'}
              example:
                deliveries:
                  - received_at: '2026-09-26T11:05:00Z'
                    outcome: accepted
                    http_status: 202
                    run_id: 0b6f3a52-91c4-4f0e-8a77-3c5d2e1f9a40
                    idempotency_key: 'webhook:9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d:3f9a1c2b7e'
                    detail: ''
                    signature_digest: 7d1e0c9b8a7f6e5d
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/EventsNotConfigured'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/hooks/{ns}/{trigger}:
    parameters:
      - $ref: '#/components/parameters/hookNamespace'
      - $ref: '#/components/parameters/hookTrigger'
    post:
      tags: [Triggers]
      operationId: receiveWebhook
      summary: Deliver a signed webhook (starts or finds a run)
      description: |
        UNAUTHENTICATED by credential: the sender proves itself with an HMAC
        signature over the timestamp and the exact body bytes,

        `X-Nexus-Signature: v1=<hex HMAC-SHA256(secret, X-Nexus-Timestamp + "." + body)>`

        where `X-Nexus-Timestamp` is Unix seconds and must be within the
        trigger's `tolerance_seconds` of the gateway's clock. Several
        comma-separated `v1=` values are accepted (for a sender's own key
        rotation); during a trigger's rotation grace period either secret
        verifies. A byte-identical resend of an accepted delivery is a replay
        (409); a retry with a fresh timestamp is a new delivery and is
        de-duplicated by the idempotency key instead, answering 202 with
        `created: false` and the existing run.

        An unknown or disabled trigger, and a gateway without triggers
        enabled, all answer the same 404, so the route cannot enumerate
        triggers. Rate limited per client address; every refusal is audited
        (`trigger.fire`, outcome `denied`). The body (at most 1 MiB) must be
        JSON or empty.
      security: []
      parameters:
        - name: X-Nexus-Timestamp
          in: header
          required: true
          description: Unix seconds at signing time.
          schema: {type: string, pattern: '^-?[0-9]+$'}
          example: '1790420700'
        - name: X-Nexus-Signature
          in: header
          required: true
          description: One or more comma-separated `v1=<64 hex>` signatures.
          schema: {type: string}
          example: v1=5d41402abc4b2a76b9719d911017c5925d41402abc4b2a76b9719d911017c592
      requestBody:
        required: false
        content:
          application/json:
            schema:
              description: Any JSON document; it is mapped onto run parameters by the trigger's `params_mapping`.
            example:
              ref: refs/heads/main
              after: 3f9a1c2b7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b
              repository: {full_name: example/pipelines}
      responses:
        '202':
          description: Accepted. `created` is false when the idempotency key matched an existing run.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, created, idempotency_key]
                properties:
                  run_id: {type: string, format: uuid}
                  created: {type: boolean}
                  idempotency_key: {type: string}
              example: {run_id: 0b6f3a52-91c4-4f0e-8a77-3c5d2e1f9a40, created: true, idempotency_key: 'webhook:9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d:3f9a1c2b7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b'}
        '400':
          description: '`malformed_json`: the body is not JSON.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: '`signature_required`, `bad_timestamp`, `stale_timestamp` (outside the tolerance; check the sender''s clock) or `bad_signature`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: bad_signature, message: signature does not verify}
        '404':
          description: '`not_found`: no enabled trigger with that id in that namespace (or triggers are not enabled).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: not_found, message: not found}
        '409':
          description: '`replayed`: this exact signed delivery was already received.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: '`payload_too_large`: the body exceeds 1 MiB.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: |
            `missing_idempotency_key` (nothing at `idempotency_key_path`),
            `unmapped_params` (a mapping path did not resolve), `unknown_workflow`
            or `invalid_params` (the workflow refused the parameters). The sender
            may retry the same signed delivery after the trigger is fixed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: '`rate_limited` (per client address) or `run_limit` (the namespace''s run quota).'
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: '`unavailable`: run creation is not configured or the workflow-manager is unreachable. Retry.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ── sensors (ADR-0028) ───────────────────────────────────────────────────
  /v1/namespaces/{ns}/sensors:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Sensors]
      operationId: listSensors
      summary: List sensors
      x-nexus-action: read
      x-nexus-permissions: [sensors.view]
      responses:
        '200':
          description: The sensors, by name, each with its runtime state.
          content:
            application/json:
              schema:
                type: object
                required: [sensors]
                properties:
                  sensors:
                    type: array
                    items: {$ref: '#/components/schemas/Sensor'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/EventsNotConfigured'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Sensors]
      operationId: createSensor
      summary: Create a sensor
      description: |
        A poller in the workflow-manager that starts one run of `workflow` per
        new item it observes:

        * `object_store` - new objects under `config.uri` (`s3://bucket/prefix`;
          `gs://` and `az://` are accepted ahead of their listers) whose key,
          relative to the prefix, matches the glob `config.pattern`.
          `params_mapping` sees `$.object` = `{uri, bucket, key, relative_key,
          size, etag, last_modified}`.
        * `run_succeeded` - successful runs of `config.upstream_workflow`
          (never the sensor's own workflow). `params_mapping` sees `$.run` =
          `{id, workflow, params, ended_at, trigger_kind, logical_date}`.

        Both also see `$.sensor` = `{id, name}`; the expression language is the
        one webhook triggers use. On its first pass a sensor
        records what already exists as a baseline and triggers nothing,
        unless `backfill` is true. A sensor is a standing authorization to
        create runs, so creating one also needs `runs.create`. Unknown fields
        are rejected.
      x-nexus-action: write
      x-nexus-permissions: [sensors.create, workflows.view, runs.create]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSensorRequest'}
            examples:
              objectStore:
                summary: New CSV files in a bucket
                value:
                  name: landing-csv
                  kind: object_store
                  workflow: ingest-file
                  config: {uri: 's3://landing/incoming/', pattern: '*.csv'}
                  params_mapping: {object: $.object.uri}
                  poll_interval_seconds: 60
              upstream:
                summary: After another workflow succeeds
                value:
                  name: after-etl
                  kind: run_succeeded
                  workflow: publish-reports
                  config: {upstream_workflow: nightly-etl}
                  params_mapping: {upstream_run: $.run.id}
      responses:
        '201':
          description: Created. A new sensor reports `status` `waiting` until a workflow-manager replica first polls it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sensor'}
              example:
                id: 2b3c4d5e-6f70-4812-9a3b-4c5d6e7f8091
                namespace: default
                name: landing-csv
                kind: object_store
                workflow: ingest-file
                config: {uri: 's3://landing/incoming/', pattern: '*.csv'}
                params_mapping: {object: $.object.uri}
                poll_interval_seconds: 60
                backfill: false
                priority: 100
                enabled: true
                created_by: ops@example.com
                created_at: '2026-09-26T11:10:00Z'
                updated_at: '2026-09-26T11:10:00Z'
                revision: 1
                status: waiting
        '400': {$ref: '#/components/responses/ConfigBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/ConfigConflict'}
        '422': {$ref: '#/components/responses/InvalidSensor'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/EventsNotConfigured'}
        '503': {$ref: '#/components/responses/ConfigWriteUnavailable'}

  /v1/namespaces/{ns}/sensors/{name}:
    parameters:
      - $ref: '#/components/parameters/ns'
