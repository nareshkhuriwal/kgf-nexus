    post:
      tags: [Runs]
      operationId: retryRun
      summary: Retry a failed run
      description: |
        Retries from the named nodes, or - with an empty body or empty `nodes` -
        from every node that did not succeed. Only FAILED, UPSTREAM_FAILED and
