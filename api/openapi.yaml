      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CacheInvalidationResult'}
              example: {invalidation_id: 42, invalidated_at: '2026-09-24T09:30:00Z'}
        '400':
          description: '`invalid_json` or `invalid_selector`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '503':
          description: '`unavailable`: the DAG engine did not answer, or the authentication backend is down.'
