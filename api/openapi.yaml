        - name: limit
          in: query
          description: Maximum events in a JSON response.
          schema: {type: integer, minimum: 0, default: 500}
        - name: stream
          in: query
          description: '`true` streams server-sent events (same as `Accept: text/event-stream`).'
          schema: {type: boolean}
        - $ref: '#/components/parameters/lastEventId'
      responses:
        '200':
          description: The events, or an event stream.
          content:
