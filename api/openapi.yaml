                    state: dead
                    attempts: 8
                    max_attempts: 8
                    next_attempt_at: '2026-09-26T03:10:00Z'
                    last_error: 'receiver answered 400: invalid routing key'
                    last_status: 400
                    created_by: event-service
                    created_at: '2026-09-26T02:40:00Z'
                    delivered_at: null
                    dead_at: '2026-09-26T03:10:00Z'
        '400':
          description: '`invalid`: a bad `state` or a `run_id` that is not a UUID.'
