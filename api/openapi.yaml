                materializations:
                  - {run_id: 0b6f3a52-91c4-4f0e-8a77-3c5d2e1f9a40, node_id: load, workflow: nightly-etl, materialized_at: '2026-09-26T02:14:00Z', run_state: SUCCEEDED}
                latest_materialization: {run_id: 0b6f3a52-91c4-4f0e-8a77-3c5d2e1f9a40, node_id: load, workflow: nightly-etl, materialized_at: '2026-09-26T02:14:00Z', run_state: SUCCEEDED}
        '400':
          description: '`missing_field`: `uri` is required.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/EventsNotConfigured'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/assets/graph:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Assets]
      operationId: getAssetGraph
      summary: The declared lineage graph
      description: |
        Asset nodes (`asset:<uri>`) and task nodes (`task:<workflow>/<node>`),
        with an edge task -> asset for what a task produces and asset -> task
        for what it consumes. With `uri` it is that asset's neighbourhood to
        `depth` asset-to-asset hops; without it, the whole namespace, from at
        most 5000 lineage edges (`truncated` when there were more).
      x-nexus-action: read
      x-nexus-permissions: [assets.view]
      parameters:
        - name: uri
          in: query
          description: Focus on this asset.
          schema: {type: string}
        - name: depth
          in: query
          description: Asset-to-asset hops around `uri`; values outside 1-6 mean 2.
          schema: {type: integer, default: 2}
      responses:
        '200':
          description: The graph, nodes sorted by id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetGraph'}
              example:
                nodes:
                  - {id: 'asset:s3://warehouse/orders/daily', kind: asset, label: orders_daily, uri: 's3://warehouse/orders/daily'}
                  - {id: task:nightly-etl/load, kind: task, label: nightly-etl · load, workflow: nightly-etl, node_id: load}
                  - {id: task:publish-reports/render, kind: task, label: publish-reports · render, workflow: publish-reports, node_id: render}
                edges:
                  - {from: task:nightly-etl/load, to: 'asset:s3://warehouse/orders/daily'}
                  - {from: 'asset:s3://warehouse/orders/daily', to: task:publish-reports/render}
                truncated: false
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: '`not_found`: no lineage is recorded for the focus `uri`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/EventsNotConfigured'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── probes (outside /v1) ─────────────────────────────────────────────────
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness
      description: Process liveness only; checks nothing external. Restarting on failure is correct.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness
      description: Checks dependencies (bounded to 2 s). Fails while the process is draining for shutdown.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
              example: {status: ready, checks: {postgres: ok}}
        '503':
          description: Not ready, or draining.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
              examples:
                notReady:
                  value: {status: not_ready, checks: {postgres: 'dial tcp 10.0.0.5:5432: connect: connection refused'}}
                draining:
                  value: {status: draining, detail: shutting down; not accepting new traffic}

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A namespace API key (no recognised prefix, e.g. `nxs_...`).
    scopedToken:
      type: http
      scheme: bearer
      bearerFormat: nxtok_
      description: A scoped token minted by `POST /v1/namespaces/{ns}/tokens`; its scopes intersect with its role.
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: nxsess_
      description: A console session from `POST /v1/auth/login`; RBAC roles apply.
    kgfContext:
      type: apiKey
      in: header
      name: X-KGF-Context
      description: |
        A signed KGF Cloud context (Ed25519, three base64url segments), only
        with NEXUS_AUTH_MODE `kgf` or `both`. Never together with an
        `Authorization` header. See Authentication in the description.

  parameters:
    ns:
      name: ns
      in: path
      required: true
      description: The namespace; must be the credential's own namespace.
      schema: {type: string, minLength: 1}
      example: default
    runId:
      name: id
      in: path
      required: true
      description: The run id.
      schema: {type: string}
      example: 0b6f3a52-91c4-4f0e-8a77-3c5d2e1f9a40
    attemptId:
      name: id
      in: path
      required: true
      description: The attempt id.
      schema: {type: string}
      example: 5a1e9c0d-3f2b-4d6a-8e7c-9b0a1f2e3d4c
    specId:
      name: id
      in: path
      required: true
      description: The spec (version) id - a run's `spec_id`.
      schema: {type: string}
    workflowName:
      name: name
      in: path
      required: true
      description: The workflow name.
      schema: {type: string}
      example: hello-dag
    scheduleName:
      name: name
      in: path
      required: true
      description: The schedule name.
      schema: {type: string}
      example: nightly-hello
    backfillId:
      name: id
      in: path
      required: true
      description: The backfill id.
      schema: {type: string}
    workerId:
      name: id
      in: path
      required: true
      description: The worker id.
      schema: {type: string}
    userId:
      name: id
      in: path
      required: true
      description: The user id.
      schema: {type: string}
    tokenId:
      name: id
      in: path
      required: true
      description: The scoped token id.
      schema: {type: string}
    roleName:
      name: name
      in: path
      required: true
      description: The role name (2-64 letters, digits, spaces, `_` or `-`, starting with a letter).
      schema: {type: string}
      example: Data Engineers
    clusterName:
      name: name
      in: path
      required: true
      description: The cluster name (a DNS label).
      schema: {type: string}
      example: prod-weu
    limit100:
      name: limit
      in: query
      description: Maximum rows.
      schema: {type: integer, minimum: 0, default: 100}
    limit50:
      name: limit
      in: query
      description: Maximum rows.
      schema: {type: integer, minimum: 0, default: 50}
    previewCount:
      name: count
      in: query
      description: How many upcoming fire times to compute (clamped to 1-20).
      schema: {type: integer, minimum: 1, maximum: 20, default: 5}
    lastEventId:
      name: Last-Event-ID
      in: header
      description: SSE resume cursor, sent automatically by EventSource clients on reconnect.
      schema: {type: string}
    usageFrom:
      name: from
      in: query
      description: RFC 3339 timestamp or `YYYY-MM-DD`; default 30 days ago.
      schema: {type: string}
      example: '2026-09-01'
    usageTo:
      name: to
      in: query
      description: RFC 3339 timestamp or `YYYY-MM-DD`; default now.
      schema: {type: string}
    usageCursor:
      name: cursor
      in: query
      description: The previous page's `next_cursor`.
      schema: {type: string, maxLength: 512}
    usageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1}
    cursor:
      name: cursor
      in: query
      description: The previous page's `next_cursor` (opaque; omit for the first page).
      schema: {type: string}
    auditAction:
      name: action
      in: query
      description: Only entries with this action, e.g. `token.create`.
      schema: {type: string}
      example: token.create
    auditActorId:
      name: actor_id
      in: query
      description: Only entries by this actor (a user id).
      schema: {type: string}
    auditOutcome:
      name: outcome
      in: query
      description: Only entries with this outcome.
      schema: {type: string, examples: [success, denied, error]}
    auditSince:
      name: since
      in: query
      description: Entries at or after this RFC 3339 instant.
      schema: {type: string, format: date-time}
      example: '2026-09-01T00:00:00Z'
    auditUntil:
      name: until
      in: query
      description: Entries strictly before this RFC 3339 instant.
      schema: {type: string, format: date-time}
    auditRequestId:
      name: request_id
      in: query
      description: The rows of one request, by its `X-Request-ID` (how a KGF support reference is resolved).
      schema: {type: string}
    sinkId:
      name: id
      in: path
      required: true
      description: The audit sink id.
      schema: {type: string}
      example: 6f5e4d3c-2b1a-4098-8765-43210fedcba9
    serviceAccountId:
      name: id
      in: path
      required: true
      description: The service account id.
      schema: {type: string}
      example: 7c6b5a49-3827-4165-9f4e-3d2c1b0a9f8e
    channelName:
      name: name
      in: path
      required: true
      description: The notification channel's name (its id is accepted too).
      schema: {type: string}
      example: oncall-pagerduty
    ruleName:
      name: name
      in: path
      required: true
      description: The notification rule's name.
      schema: {type: string}
      example: nightly-failures
    deliveryId:
      name: id
      in: path
      required: true
      description: The notification delivery id (an integer).
      schema: {type: integer, format: int64}
      example: 4811
    triggerName:
      name: name
      in: path
      required: true
      description: The webhook trigger's name (its id is accepted too).
      schema: {type: string}
      example: github-push
    sensorName:
      name: name
      in: path
      required: true
      description: The sensor's name (its id is accepted too).
      schema: {type: string}
      example: landing-csv
    assetUri:
      name: uri
      in: query
      required: true
      description: The asset's URI, exactly as declared.
      schema: {type: string, minLength: 1}
      example: s3://warehouse/orders/daily
    hookNamespace:
      name: ns
      in: path
      required: true
      description: The trigger's namespace. No credential is involved, so it is not checked against one.
      schema: {type: string, minLength: 1}
      example: default
    hookTrigger:
      name: trigger
      in: path
      required: true
      description: The trigger's ID (from its `path`), never its name.
      schema: {type: string, format: uuid}
      example: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d

  headers:
    RetryAfter:
      description: Seconds to wait before retrying (at least 1).
      schema: {type: integer, minimum: 1}
    RateLimitLimit:
      description: The bucket size.
      schema: {type: integer}
    RateLimitRemaining:
      description: Tokens left in the bucket.
      schema: {type: integer}
    RateLimitReset:
      description: Seconds until a token is available.
      schema: {type: integer}
    IdempotencyReplayed:
      description: '`true` when this is the cached response of an earlier request with the same Idempotency-Key.'
      schema: {type: string, enum: ['true']}
    CacheControlHour:
      description: '`public, max-age=3600`.'
      schema: {type: string}
    RequestId:
      description: The request's correlation id (sent when a KGF context carried one).
      schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$'}

  responses:
    BadRequest:
      description: The request was malformed; `error` names why.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: '`unauthenticated`: no valid credential. Deliberately opaque.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: unauthenticated, message: valid credentials are required}
    Forbidden:
      description: |
        `forbidden`: the credential may not perform this action in this
        namespace, or lacks a listed permission (`Missing permission: <name>`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: forbidden, message: 'Missing permission: runs.create'}
    PlatformOperatorRequired:
      description: '`forbidden`: a platform-operator session is required (or a listed permission is missing).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: forbidden, message: Platform operator session required}
    NotFound:
      description: '`not_found`: nothing with that id in this namespace.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: not_found, message: not found}
    ScheduleNotFound:
      description: '`schedule_not_found`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: schedule_not_found, message: no such schedule}
    BackfillNotFound:
      description: '`backfill_not_found`: no backfill with that id in this namespace (a malformed id included).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: backfill_not_found, message: no such backfill}
    PayloadTooLarge:
      description: 'The body exceeds the route''s limit (`body_too_large`, `too_large`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: '`rate_limited`.'
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
        RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: rate_limited, message: Too many requests. Try again shortly.}
    InternalError:
      description: '`internal`. The detail is in the gateway log, never in the response.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: internal, message: request failed}
    AuthUnavailable:
      description: '`unavailable`: the authentication backend failed. Retry; do not rotate the credential.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: unavailable, message: authentication is temporarily unavailable}
    NotImplemented:
      description: '`not_implemented`: this gateway was not wired with the upstream this route needs.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SchedulesUnavailable:
      description: '`schedules_unavailable`: this gateway has no schedule service configured.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RevisionConflict:
      description: '`revision_conflict`: the stored revision changed; re-read and retry.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RunStateConflict:
      description: '`run_state_conflict`: the run''s state does not allow this.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: run_state_conflict, message: 'run is SUCCEEDED; pause applies only to PENDING or RUNNING runs'}
    RunLifecycle:
      description: The run after the transition.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Run'}
    BackfillAction:
      description: The backfill after the action.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Backfill'}
    InvalidQuery:
      description: '`invalid_query`: a bad `from`, `to`, `group_by`, `limit` or `cursor`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    EmailLinkAccepted:
      description: Accepted. Identical whether or not an email is actually sent.
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status: {const: accepted}
              message: {type: string}
          example: {status: accepted, message: 'If an account with that email address exists, a password reset link is on its way.'}
    EmailUnavailable:
      description: '`email_unavailable` (email delivery is not configured) or `unavailable` (the queue is busy).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuditOrAuthUnavailable:
      description: |
        `audit_unavailable`: the change was NOT made, because its audit record
        could not be written (security grants fail closed, ADR-0025); retry
        shortly. Or `unavailable`: the authentication backend failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            auditUnavailable:
              value: {error: audit_unavailable, message: the change was not made because its audit record could not be written; retry shortly}
            authUnavailable:
              value: {error: unavailable, message: authentication is temporarily unavailable}
    SinkWriteUnavailable:
      description: '`sinks_disabled` (the gateway has no NEXUS_AUDIT_SINK_KEY), `audit_unavailable` or `unavailable`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: sinks_disabled, message: audit sinks need NEXUS_AUDIT_SINK_KEY(_FILE) on the gateway (OPERATIONS §25.2)}
    AuditPolicyConflict:
      description: '`conflict`: the policy changed since it was read. `current` is the stored policy to reload from.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuditPolicyConflictError'}
    TargetAboveActor:
      description: '`forbidden`, or `target_above_actor`: the service account holds a permission the caller does not.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: target_above_actor, message: 'This service account holds workflows.delete, which you do not have'}
    EventsNotConfigured:
      description: '`not_configured`: notifications, triggers and sensors are not enabled on this gateway.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: not_configured, message: 'notifications, triggers and sensors are not enabled on this gateway'}
    ConfigBadRequest:
      description: |
        `malformed_json` (not JSON, larger than 64 KiB, or an unknown field),
        `invalid_name` (1-63 lower-case letters, digits, `.`, `_` or `-`,
        starting with a letter or digit), `invalid` (a number out of range) or
        `immutable` (a field that cannot change on update).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: invalid_name, message: 'name must be 1-63 characters of lower-case letters, digits, ''.'', ''_'' or ''-'', starting with a letter or digit'}
    ConfigConflict:
      description: '`revision_conflict` (changed since it was read; reload and retry) or `already_exists` (the name is taken in this namespace).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: revision_conflict, message: the object changed since you read it; reload and retry}
    ConfigWriteUnavailable:
      description: |
        `audit_unavailable` (the change and its audit row commit together, so
        nothing was changed), `secret_key_unconfigured` (storing a secret needs
        NEXUS_SECRET_KEY on the gateway; a `secret_ref` works without it) or
        `unavailable` (the authentication backend failed).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: secret_key_unconfigured, message: 'storing a secret needs NEXUS_SECRET_KEY on the gateway; configure it, or use a secret_ref instead'}
    InvalidTrigger:
      description: |
        `invalid_trigger` (no `workflow`), `unknown_workflow` (no such
        workflow or version in this namespace), `invalid_mapping` (a
        `params_mapping` or `idempotency_key_path` expression is not in the
        supported subset) or `invalid` (a database constraint).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: invalid_mapping, message: 'path "repository.name" must start with $'}
    InvalidSensor:
      description: |
        `invalid_sensor` (no `workflow`, an unknown `kind`, or `config` that
        does not fit the kind), `unknown_workflow`, `invalid_mapping` or
        `invalid`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: invalid_sensor, message: 'config.uri must be s3://bucket/prefix (gs:// and az:// are reserved)'}
    BackfillStateConflict:
      description: |
        `backfill_state_conflict`: the backfill's current state does not allow
        the action. Pause applies to a RUNNING backfill, resume to a PAUSED
        one, cancel to a RUNNING or PAUSED one; COMPLETED, CANCELLED and
        FAILED are final. `state` is the state it is in, when it could be read.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BackfillStateConflictError'}
          example: {error: backfill_state_conflict, message: 'resume backfill 8a7b6c5d-4e3f-4a1b-9c0d-e1f2a3b4c5d6: backfill is not in a state this transition may leave: backfill 8a7b6c5d-4e3f-4a1b-9c0d-e1f2a3b4c5d6 is CANCELLED; it can move to RUNNING only from PAUSED', state: CANCELLED}

  examples:
    HelloDagSpec:
      summary: A three-task pipeline
      value:
        api_version: nexus.dev/v1
        namespace: default
        name: hello-dag
        description: 'Three tasks in a line: extract, transform, load.'
        params:
          source: {type: string, required: true}
        tasks:
          - id: extract
            task_ref: hello.extract
            version: 1
            queue: default
            input_params: {source: source}
            inputs:
              source: {type: json, required: true}
            outputs:
              result: {type: json, required: true}
            runtime:
              executor: subprocess
              command: [sh, -c]
              args: [echo 'extracting records from the source']
          - id: transform
            task_ref: hello.transform
            version: 1
            inputs:
              data: {type: json, required: true}
            outputs:
              result: {type: json, required: true}
            runtime:
              executor: subprocess
              command: [sh, -c]
              args: [echo 'transforming']
          - id: load
            task_ref: hello.load
            version: 1
            inputs:
              summary: {type: json, required: true}
            runtime:
              executor: subprocess
              command: [sh, -c]
              args: [echo 'loading']
        edges:
          - {from_node_id: extract, to_node_id: transform, output_to_input: {data: result}}
          - {from_node_id: transform, to_node_id: load, output_to_input: {summary: result}}

  schemas:
    WorkflowSpec:
      description: |
        A workflow spec document. This is a `$ref` to the gateway's own JSON
        Schema by its canonical `$id`; the same bytes are served at
        `GET /v1/schemas/workflow-spec-v1.json`.
      $ref: https://nexus.khuriwalgroup.com/schemas/workflow-spec-v1.json

    Error:
      description: The error envelope every error response uses. Some errors add fields.
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code; branch on this.
          examples: [not_found, forbidden, invalid_cron]
        message:
          type: string
          description: A sentence for a human. Not stable.

    ProblemsError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [problems]
          properties:
            problems:
              type: array
              items: {type: string}

    SpecProblem:
      type: object
      required: [path, message, stage]
      properties:
        path: {type: string, description: 'JSON-Pointer-style location in the document.'}
        message: {type: string}
        stage: {type: string, enum: [parse, schema, semantic]}
        line: {type: integer, minimum: 1, description: '1-based line in the SUBMITTED document, when known.'}
        column: {type: integer, minimum: 1}

    SpecInvalidError:
      type: object
      required: [error, message, problems]
      properties:
        error: {const: spec_invalid}
        message: {type: string}
        problems:
          type: array
          items: {$ref: '#/components/schemas/SpecProblem'}

    WorkflowReferencedError:
      type: object
      required: [error, message]
      properties:
        error: {const: workflow_referenced}
        message: {type: string}
        referencing_runs: {type: integer, minimum: 0}
        referencing_schedules:
          type: array
          items: {type: string}

    RunQuotaExceededError:
      type: object
      required: [error, message, dimension, used, limit]
      properties:
        error: {const: namespace_quota_exceeded}
        message: {type: string}
        dimension: {type: string, examples: [active_runs, runs_per_hour]}
        used: {type: integer}
        limit: {type: integer}
        retry_after_seconds: {type: integer, minimum: 1}

    NodesNotRetryableError:
      type: object
      required: [error, message, nodes]
      properties:
        error: {const: nodes_not_retryable}
        message: {type: string}
        nodes:
          type: array
          items:
            type: object
            required: [node_id, state]
            properties:
              node_id: {type: string}
              state: {$ref: '#/components/schemas/NodeState'}

    UnknownNodesError:
      type: object
      required: [error, message, nodes]
      properties:
        error: {const: unknown_nodes}
        message: {type: string}
        nodes:
          type: array
          items: {type: string}

    QuotasLockedError:
      type: object
      required: [error, message, loosened]
      properties:
        error: {const: quotas_locked}
        message: {type: string}
        loosened:
          type: [array, 'null']
          items: {type: string}

    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, 'null']
      format: date-time
    Uuid:
      type: string
      format: uuid
    SpecHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 content address of the canonical spec (hex).
    AnyJSON:
      description: An arbitrary JSON value stored by the platform, passed through verbatim (may be null).

    RunState:
      type: string
      enum: [PENDING, RUNNING, PAUSING, PAUSED, SUCCEEDED, FAILED, CANCELLING, CANCELLED, TIMED_OUT]
    NodeState:
      type: string
      enum: [PENDING, READY, RUNNING, SUCCEEDED, FAILED, SKIPPED, UPSTREAM_FAILED, CANCELLED]
    AttemptState:
      type: string
      enum: [PENDING, DISPATCHED, RUNNING, SUCCEEDED, FAILED, TIMED_OUT, LOST, CANCELLED]
    WorkerState:
      type: string
      enum: [ACTIVE, DRAINING, QUARANTINED, DEAD]

    SpecSubmitResult:
      type: object
      required: [id, namespace, name, version, spec_hash, created, task_count]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        version: {type: integer, minimum: 1}
        spec_hash: {$ref: '#/components/schemas/SpecHash'}
        created: {type: boolean, description: 'false when an identical version already existed.'}
        task_count: {type: integer, minimum: 1}

    SpecDryRunResult:
      type: object
      required: [namespace, name, spec_hash, task_count, valid, dry_run]
      properties:
        namespace: {type: string}
        name: {type: string}
        spec_hash: {$ref: '#/components/schemas/SpecHash'}
        task_count: {type: integer, minimum: 1}
        valid: {const: true}
        dry_run: {const: true}

    CatalogEntry:
      type: object
      required: [id, namespace, name, latest_version, spec_hash, created_by, updated_at, version_count, first_created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        latest_version: {type: integer}
        spec_hash: {$ref: '#/components/schemas/SpecHash'}
        created_by: {type: string}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        version_count: {type: integer}
        first_created_at: {$ref: '#/components/schemas/Timestamp'}

    SpecVersion:
      type: object
      required: [id, name, version, spec_hash, created_by, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        version: {type: integer}
        spec_hash: {$ref: '#/components/schemas/SpecHash'}
        created_by: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    SpecDefinition:
      type: object
      required: [id, namespace, name, version, spec_hash, created_by, created_at, spec]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        version: {type: integer}
        spec_hash: {$ref: '#/components/schemas/SpecHash'}
        created_by: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        spec: {$ref: '#/components/schemas/WorkflowSpec'}

    WorkflowDeleted:
      type: object
      required: [namespace, name, versions_deleted, deleted]
      properties:
        namespace: {type: string}
        name: {type: string}
        versions_deleted: {type: integer, minimum: 1}
        deleted: {const: true}

    CreateRunRequest:
      type: object
      description: Exactly one of `spec_id` or `spec_name` is needed; `spec_id` wins when both are given.
      anyOf:
        - required: [spec_id]
        - required: [spec_name]
      properties:
        spec_id:
          type: string
          format: uuid
          description: An exact spec version.
        spec_name:
          type: string
          description: A workflow name; its newest version is used.
        trigger_kind:
          type: string
          default: api
          description: Free-form provenance label recorded on the run.
        params:
          type: object
          description: Values for the workflow's declared `params`.
        priority:
          type: integer
          format: int32

    Run:
      type: object
      required: [id, namespace, spec_id, spec_name, spec_version, state, priority, trigger_kind, params, deadline_at, created_at, started_at, ended_at, state_version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        spec_id: {$ref: '#/components/schemas/Uuid'}
        spec_name: {type: string}
        spec_version: {type: integer, description: 'The pinned version this run executes.'}
        state: {$ref: '#/components/schemas/RunState'}
        priority: {type: integer}
        trigger_kind: {type: string}
        params: {$ref: '#/components/schemas/AnyJSON'}
        deadline_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
        state_version: {type: integer, description: 'Increments on every state change.'}

    RunList:
      type: object
      required: [runs, total]
      properties:
        runs:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        total: {type: integer, minimum: 0}
        next_before:
          type: string
          format: date-time
          description: Present only when another page exists; pass it as `before`.

    RunNode:
      type: object
      required: [node_id, task_ref, state, trigger_rule, max_attempts, attempts_used, map_index, parent_node_id]
      properties:
        node_id: {type: string}
        task_ref: {type: string}
        state: {$ref: '#/components/schemas/NodeState'}
        trigger_rule: {type: string}
        max_attempts: {type: integer}
        attempts_used: {type: integer}
        map_index: {type: [integer, 'null'], description: 'Set on a dynamically expanded child.'}
        parent_node_id: {type: [string, 'null'], description: 'The template a child was expanded from.'}
        failure_reason: {type: string, description: 'Why a refused fan-in failed this node (it has no attempt to carry an error).'}

    RunEdge:
      type: object
      required: [from_node_id, to_node_id, output_to_input]
      properties:
        from_node_id: {type: string}
        to_node_id: {type: string}
        output_to_input: {$ref: '#/components/schemas/AnyJSON'}

    Attempt:
      type: object
      description: '`error` and `metrics` are omitted without `tasks.results.view`.'
      required: [id, node_id, attempt_number, state, queue, worker_id, worker_hostname, pending_reason, scheduled_at, dispatched_at, started_at, ended_at, cache_hit_of, progress_message, progress_fraction, progress_at, progress_message_at, usage_units, usage_reported_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        node_id: {type: string}
        attempt_number: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/AttemptState'}
        queue: {type: string}
        worker_id: {type: [string, 'null']}
        worker_hostname: {type: [string, 'null']}
        pending_reason: {type: [string, 'null'], description: 'Why a PENDING attempt has not dispatched, e.g. `waiting_for_resources: gpu (need 4, free 3)`.'}
        error: {$ref: '#/components/schemas/AnyJSON'}
        metrics: {$ref: '#/components/schemas/AnyJSON'}
        scheduled_at: {$ref: '#/components/schemas/Timestamp'}
        dispatched_at: {$ref: '#/components/schemas/NullableTimestamp'}
        started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
        cache_hit_of: {type: [string, 'null'], description: 'The attempt whose memoized result this one reused.'}
        progress_message: {type: [string, 'null'], description: 'The latest status the worker reported.'}
        progress_fraction: {type: [number, 'null'], minimum: 0, maximum: 1}
        progress_at: {$ref: '#/components/schemas/NullableTimestamp'}
        progress_message_at: {$ref: '#/components/schemas/NullableTimestamp'}
        usage_units:
          type: object
          description: |
            Usage the TASK reported through the workload API (ADR-0032):
            cumulative totals keyed like `tokens:<provider>/<model>:input`.
            `{}` when nothing was reported. Copied into the usage ledger when
            the attempt ends.
          additionalProperties: {type: number}
        usage_reported_at: {$ref: '#/components/schemas/NullableTimestamp'}

    Expansion:
      type: object
      required: [template_node_id, source_node_id, source_output, item_count, max_fanout, outcome, reason, detail, created_at]
      properties:
        template_node_id: {type: string}
        source_node_id: {type: string}
        source_output: {type: string}
        item_count: {type: integer}
        max_fanout: {type: integer}
        outcome: {type: string}
        reason: {type: [string, 'null']}
        detail: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [nodes, edges, attempts, expansions]
          properties:
            nodes:
              type: array
              items: {$ref: '#/components/schemas/RunNode'}
            edges:
              type: array
              items: {$ref: '#/components/schemas/RunEdge'}
            attempts:
              type: array
              items: {$ref: '#/components/schemas/Attempt'}
            expansions:
              type: array
              items: {$ref: '#/components/schemas/Expansion'}

    RetryRequest:
      type: object
      additionalProperties: false
      properties:
        nodes:
          type: array
          maxItems: 10000
          description: Node ids to retry from; empty or absent means every node that did not succeed.
          items: {type: string, minLength: 1}

    RetryResult:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [retried_nodes]
          properties:
            retried_nodes:
              type: array
              items: {type: string}

    Event:
      type: object
      required: [seq, node_id, attempt_id, kind, payload, actor, occurred_at]
      properties:
        seq: {type: integer, minimum: 1}
        node_id: {type: [string, 'null']}
        attempt_id: {type: [string, 'null']}
        kind: {type: string}
        payload:
          description: 'The event body, or `{"redacted": true}` without `tasks.results.view`.'
        actor: {type: string}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}

    LogStatus:
      type: object
      required: [state, attempt_state, lines, bytes, chunks, truncated_lines, truncated_bytes, dropped_lines, compacted, detail]
      properties:
        state: {type: string, enum: [none, live, complete, partial, expired]}
        attempt_state: {type: string}
        lines: {type: integer}
        bytes: {type: integer}
        chunks: {type: integer}
        truncated_lines: {type: integer}
        truncated_bytes: {type: integer}
        dropped_lines: {type: integer}
        compacted: {type: boolean}
        last_chunk_at: {$ref: '#/components/schemas/Timestamp'}
        finalized_at: {$ref: '#/components/schemas/Timestamp'}
        detail: {type: string}

    LogLine:
      type: object
      required: [n, ts, stream, message]
      properties:
        n: {type: integer, minimum: 1}
        ts: {$ref: '#/components/schemas/Timestamp'}
        stream: {type: string}
        message: {type: string}
        partial: {type: boolean}
        kind:
          type: string
          description: Set on the platform's own lines.
          enum: [truncated, truncation_summary, dropped, gap]
        gap_end: {type: integer, description: 'The last line a gap line stands in for.'}

    LogPage:
      type: object
      required: [attempt_id, log, lines, next_line, has_more]
      properties:
        attempt_id: {$ref: '#/components/schemas/Uuid'}
        log: {$ref: '#/components/schemas/LogStatus'}
        lines:
          type: array
          items: {$ref: '#/components/schemas/LogLine'}
        first_line: {type: integer}
        next_line: {type: integer}
        has_more: {type: boolean}
        unreadable_chunks: {type: integer}

    LogSearch:
      type: object
      required: [attempt_id, log, search]
      properties:
        attempt_id: {$ref: '#/components/schemas/Uuid'}
        log: {$ref: '#/components/schemas/LogStatus'}
        search:
          type: object
          required: [matches, next_line, scanned_lines, scanned_bytes, complete]
          properties:
            matches:
              type: array
              items: {$ref: '#/components/schemas/LogLine'}
            next_line: {type: integer}
            scanned_lines: {type: integer}
            scanned_bytes: {type: integer}
            complete: {type: boolean}
            stopped_by: {type: string, enum: [matches, bytes, time]}
            unreadable_chunks: {type: integer}

    AttemptAssignment:
      type: object
      required: [namespace, workflow, attempt, assignment, encoding, result_store, secrets, omitted]
      properties:
        namespace: {type: string}
        workflow:
          type: object
          required: [name, version]
          properties:
            name: {type: string}
            version: {type: integer}
        attempt:
          type: object
          required: [id, run_id, node_id, attempt_number, state]
          properties:
            id: {type: string}
            run_id: {type: string}
            node_id: {type: string}
            attempt_number: {type: integer}
            state: {$ref: '#/components/schemas/AttemptState'}
            map_index: {type: integer}
            parent_node_id: {type: string}
        assignment:
          type: object
          required: [attempt_id, run_id, node_id, attempt_number, namespace, idempotency_key, spec, inputs]
          properties:
            attempt_id: {type: string}
            run_id: {type: string}
            node_id: {type: string}
            attempt_number: {type: integer}
            namespace: {type: string}
            idempotency_key: {type: string}
            spec: {type: [object, 'null'], description: 'The TaskSpec in protojson form, secrets reduced to references.'}
            inputs:
              type: object
              description: Resolved input references by input name (inline values are base64; blobs stay references).
            map_index: {type: integer}
        encoding: {const: protojson}
        result_store:
          type: object
          required: [inline_threshold_bytes]
          properties:
            inline_threshold_bytes: {type: integer}
        secrets:
          type: array
          items:
            type: object
            required: [name, ref]
            properties:
              name: {type: string}
              ref: {type: string}
        omitted:
          type: array
          items: {type: string}

    ScheduleFields:
      type: object
      properties:
        spec_name: {type: string, minLength: 1, description: 'Must name an existing workflow; its newest version is used unless `spec_version` pins one.'}
        spec_version: {type: [integer, 'null']}
        cron: {type: string, minLength: 1, description: 'A five-field cron expression.'}
        timezone: {type: string, description: 'IANA zone; default UTC.'}
        params: {type: object}
        priority: {type: integer, format: int32}
        overlap_policy: {type: string, enum: ['', skip, allow, queue_one], description: 'What to do when the previous run is still active; default `skip`.'}
        catchup_limit: {type: integer, minimum: 0, description: 'Missed ticks to fire after downtime; 0 fires only the tick that just came due.'}
        enabled: {type: boolean}

    CreateScheduleRequest:
      allOf:
        - $ref: '#/components/schemas/ScheduleFields'
        - type: object
          required: [name, spec_name, cron]
          properties:
            name: {type: string, minLength: 1}
            enabled: {default: true}

    UpdateScheduleRequest:
      allOf:
        - $ref: '#/components/schemas/ScheduleFields'
        - type: object
          required: [spec_name, cron, enabled]
          properties:
            name: {type: string, description: 'Optional; must equal the path''s name.'}

    Schedule:
      type: object
      required: [id, namespace, name, spec_name, cron, timezone, params, priority, overlap_policy, catchup_limit, enabled, next_fire_at, last_fire_at, created_at, updated_at, created_by]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        spec_name: {type: string}
        spec_version: {type: integer, description: 'Present only when the schedule pins a version.'}
        cron: {type: string}
        timezone: {type: string}
        params: {type: [object, 'null']}
        priority: {type: integer}
        overlap_policy: {type: string}
        catchup_limit: {type: integer}
        enabled: {type: boolean}
        next_fire_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Null when not currently armed (disabled, being fired, or left unarmed by a replica that died mid-fire).
        last_fire_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        created_by: {type: string}
        next_fires:
          type: array
          description: Upcoming fire times in the schedule's zone (create, update and get only).
          items: {type: string, format: date-time}
        cron_error: {type: string, description: 'Set instead of `next_fires` when the stored cron no longer compiles.'}

    SchedulePreview:
      type: object
      required: [cron, timezone, valid]
      properties:
        cron: {type: string}
        timezone: {type: string}
        valid: {type: boolean}
        next_fires:
          type: array
          items: {type: string, format: date-time}
        error: {type: string}

    StartBackfillRequest:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        max_active: {type: integer, minimum: 0}
        max_runs: {type: integer, minimum: 0}

    Backfill:
      type: object
      required: [id, schedule_id, namespace, from, to, cursor_at, max_active, max_runs, runs_created, state, detail, created_at, updated_at, ended_at, created_by]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        schedule_id: {$ref: '#/components/schemas/Uuid'}
        schedule_name: {type: string, description: 'Present where it is cheap to resolve.'}
        namespace: {type: string}
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        cursor_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: The next logical tick to generate; null when the interval is exhausted.
        max_active: {type: integer}
        max_runs: {type: integer}
        runs_created: {type: integer}
        state: {type: string, enum: [RUNNING, PAUSED, COMPLETED, CANCELLED, FAILED]}
        detail: {type: [object, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_by: {type: string}

    Worker:
      type: object
      required: [id, hostname, queues, executors, state, labels, capacity, committed, agent_version, registered_at, last_heartbeat_at, active_attempts]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        hostname: {type: string}
        queues:
          type: [array, 'null']
          items: {type: string}
        executors:
          type: [array, 'null']
          items: {type: string}
        state: {$ref: '#/components/schemas/WorkerState'}
        labels: {$ref: '#/components/schemas/AnyJSON'}
        capacity: {$ref: '#/components/schemas/AnyJSON'}
        committed: {$ref: '#/components/schemas/AnyJSON'}
        agent_version: {type: string}
        registered_at: {$ref: '#/components/schemas/Timestamp'}
        last_heartbeat_at: {$ref: '#/components/schemas/Timestamp'}
        active_attempts: {type: integer, minimum: 0}

    WorkerAttempt:
      type: object
      required: [id, run_id, node_id, task_ref, attempt_number, state, queue, scheduled_at, started_at, ended_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        run_id: {$ref: '#/components/schemas/Uuid'}
        node_id: {type: string}
        task_ref: {type: string}
        attempt_number: {type: integer}
        state: {$ref: '#/components/schemas/AttemptState'}
        queue: {type: string}
        scheduled_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}

    WorkerDetail:
      allOf:
        - $ref: '#/components/schemas/Worker'
        - type: object
          required: [running_attempts, recent_attempts]
          properties:
            running_attempts:
              type: array
              description: DISPATCHED and RUNNING attempts.
              items: {$ref: '#/components/schemas/WorkerAttempt'}
            recent_attempts:
              type: array
              description: The bounded terminal tail.
              items: {$ref: '#/components/schemas/WorkerAttempt'}

    DrainAccepted:
      type: object
      required: [worker_id, state, detail]
      properties:
        worker_id: {type: string}
        state: {const: DRAINING}
        detail: {type: string}

    Capacity:
      type: object
      required: [namespace, advertised, committed, workers, pending_attempts]
      properties:
        namespace: {type: string}
        advertised: {type: [object, 'null']}
        committed: {type: [object, 'null']}
        workers: {type: integer}
        pending_attempts: {type: integer}

    QuarantineRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
        duration_ms:
          type: integer
          minimum: 0
          maximum: 2592000000
          description: 0 (or absent) quarantines indefinitely; at most 30 days.

    ReleaseRequest:
      type: object
      properties:
        reason: {type: string}

    QuarantineResult:
      type: object
      required: [worker_id, state, duration_ms]
      properties:
        worker_id: {type: string}
        state: {const: QUARANTINED}
        duration_ms: {type: integer}

    ReleaseResult:
      type: object
      required: [worker_id, state]
      properties:
        worker_id: {type: string}
        state: {const: ACTIVE}

    Quarantine:
      type: object
      required: [id, trigger, reason, evidence, actor, started_at, expires_at, released_at, released_by, release_reason]
      properties:
        id: {type: string}
        trigger: {type: string}
        reason: {type: string}
        evidence: {$ref: '#/components/schemas/AnyJSON'}
        actor: {type: string}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/NullableTimestamp'}
        released_at: {$ref: '#/components/schemas/NullableTimestamp'}
        released_by: {type: [string, 'null']}
        release_reason: {type: [string, 'null']}

    CacheInvalidationRequest:
      type: object
      anyOf:
        - required: [task_ref]
        - required: [cache_key]
      properties:
        task_ref: {type: string}
        task_version: {type: [integer, 'null'], description: 'Requires `task_ref`.'}
        cache_key: {type: string}
        reason: {type: string}

    CacheInvalidationResult:
      type: object
      required: [invalidation_id, invalidated_at]
      properties:
        invalidation_id: {type: integer}
        invalidated_at: {$ref: '#/components/schemas/Timestamp'}

    AttentionItem:
      type: object
      required: [kind, severity, summary, detail, link, run_id, run_state, spec_name, occurred_at]
      properties:
        kind: {type: string, enum: [indeterminate_outcome, retry_exhausted, blocked_on_capacity, run_failed, run_stalled]}
        severity: {type: string, enum: [critical, warning]}
        summary: {type: string}
        detail: {type: string}
        link: {type: string, description: 'Console path to the run, node or attempt.'}
        run_id: {type: string}
        run_state: {type: string}
        spec_name: {type: string}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
        node_id: {type: string}
        attempt_id: {type: string}
        reason: {type: string, description: 'Machine-readable code behind the sentence.'}

    AttentionList:
      type: object
      required: [items, count, truncated]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AttentionItem'}
        count: {type: integer, description: 'Items returned.'}
        truncated: {type: boolean, description: 'True when the list reached the cap.'}

    FleetHealth:
      type: object
      required: [status, upstreams, measures]
      properties:
        status: {type: string, enum: [ok, degraded]}
        upstreams:
          type: [array, 'null']
          items:
            type: object
            required: [name, addr, state, configured]
            properties:
              name: {type: string}
              addr: {type: string}
              state: {type: string, enum: [IDLE, CONNECTING, READY, TRANSIENT_FAILURE, SHUTDOWN]}
              configured: {type: boolean}
        measures: {type: string}

    PlatformConfig:
      type: object
      additionalProperties: false
      required: [revision, scheduler]
      properties:
        revision: {type: integer, minimum: 0}
        scheduler:
          type: object
          additionalProperties: false
          properties:
            min_replicas: {type: integer, minimum: 1}
            max_replicas: {type: integer, maximum: 100}
            target_cpu_percent: {type: integer, minimum: 10, maximum: 90}
            scale_down_seconds: {type: integer, minimum: 60, maximum: 3600}
            fair_share_weight: {type: integer, minimum: 0, maximum: 100, description: '1-100; 0 in a request means the default (1). Changing it needs a platform operator.'}
        pools:
          type: [array, 'null']
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              name: {type: string}
              queue: {type: string}
              profile: {type: string}
              min_workers: {type: integer}
              max_workers: {type: integer}
              tasks_per_worker: {type: integer}
              idle_seconds: {type: integer}
              max_scale_up_step: {type: integer}
              enabled: {type: boolean}
        profiles:
          type: [array, 'null']
          maxItems: 100
          items: {$ref: '#/components/schemas/PodProfile'}
        quotas: {$ref: '#/components/schemas/Quotas'}

    PodProfile:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        cloud: {type: string, enum: [aws, azure, kubernetes]}
        kubernetes_namespace: {type: string}
        service_account: {type: string}
        image: {type: string, description: 'Must be pinned by digest: `image@sha256:<64 hex>`.'}
        cpu_millis: {type: integer}
        memory_mib: {type: integer}
        gpu_count: {type: integer}
        ephemeral_storage_mib: {type: integer}
        node_selector:
          type: [object, 'null']
          additionalProperties: {type: string}
        tolerations:
          type: [array, 'null']
          items:
            type: object
            additionalProperties: false
            properties:
              key: {type: string}
              value: {type: string}
              effect: {type: string}
        deadline_seconds: {type: integer}
        grace_seconds: {type: integer}

    Quotas:
      type: object
      additionalProperties: false
      description: Every limit uses 0 for UNLIMITED.
      properties:
        locked: {type: boolean, description: 'Set by a platform operator; while set a namespace admin may only tighten.'}
        max_inflight_attempts: {type: integer, minimum: 0}
        max_cpu_millis: {type: integer, minimum: 0}
        max_memory_bytes: {type: integer, minimum: 0}
        max_gpu_count: {type: integer, minimum: 0}
        max_custom:
          type: object
          maxProperties: 32
          additionalProperties: {type: integer, minimum: 0}
        max_active_runs: {type: integer, minimum: 0}
        max_runs_per_hour: {type: integer, minimum: 0}
        storage_soft_limit_bytes: {type: integer, minimum: 0, description: 'Reported against measured storage, never enforced.'}
        rate_limits:
          type: object
          description: |
            Shared token-bucket limits on calls to external providers (ADR-0032),
            keyed by `<provider>` or `<provider>/<model>`, enforced by the permit
            service tasks call through the workload API, never at dispatch.
            Absent means no key is limited. While the quotas are locked, raising
            a rate or burst, or removing a key, counts as loosening.
          maxProperties: 64
          propertyNames: {pattern: '^[A-Za-z0-9][A-Za-z0-9._/@+-]{0,127}$'}
          additionalProperties: {$ref: '#/components/schemas/RateLimit'}

    PlatformPlan:
      type: object
      required: [revision, mode, decisions, task_job_templates, controllers, message]
      properties:
        revision: {type: integer}
        mode: {const: preview}
        decisions:
          type: array
          items:
            type: object
            required: [pool, current, desired, reason, limited, demand]
            properties:
              pool: {type: string}
              current: {type: integer}
              desired: {type: integer}
              reason: {type: string}
              limited: {type: boolean}
              demand:
                type: object
                properties:
                  pending_tasks: {type: integer}
                  running_tasks: {type: integer}
                  cpu_millis: {type: integer}
                  memory_mib: {type: integer}
                  gpu_count: {type: integer}
                  current_workers: {type: integer}
                  idle_seconds: {type: integer}
                  unschedulable_tasks: {type: integer}
        task_job_templates:
          type: object
          description: A Kubernetes Job template per profile name.
        controllers:
          type: array
          items:
            type: object
            required: [cluster, registry_mode, reporting]
            properties:
              cluster: {type: string}
              registry_mode: {type: string}
              reporting: {type: boolean}
              effective_mode: {type: string}
              last_report_at: {$ref: '#/components/schemas/NullableTimestamp'}
        message: {type: string}

    ClusterBinding:
      type: object
      additionalProperties: false
      properties:
        kubernetes_namespace: {type: string}
        worker_deployment: {type: string}
        pool: {type: string, description: 'A pool defined in the namespace''s platform config.'}
        max_replicas: {type: integer, minimum: 0, maximum: 10000}
        max_scale_down_step: {type: integer, minimum: 0, maximum: 100}
        scale_up_cooldown_seconds: {type: integer, minimum: 0}
        scale_down_cooldown_seconds: {type: integer, minimum: 0}

    ClusterSpec:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, description: 'Optional in a request; must equal the path.'}
        provider: {type: string, enum: [aks, eks, kubernetes]}
        provider_resource_id: {type: string, maxLength: 1024}
        expected_cluster_uid: {type: string, maxLength: 64, description: 'Required in apply mode.'}
        control_plane_namespace: {type: string, default: kgf-nexus}
        mode: {type: string, enum: [plan, apply], default: plan}
        desired_revision: {type: integer, minimum: 0}
        bindings:
          type: [array, 'null']
          maxItems: 50
          items: {$ref: '#/components/schemas/ClusterBinding'}

    ClusterView:
      type: object
      description: The registration (ClusterSpec fields) plus everything the in-cluster controller reported.
      required: [id, name, provider, mode, desired_revision, created_at, updated_at, updated_by, status]
      properties:
        id: {type: string}
        name: {type: string}
        provider: {type: string}
        provider_resource_id: {type: string}
        expected_cluster_uid: {type: string}
        control_plane_namespace: {type: string}
        mode: {type: string}
        desired_revision: {type: integer}
        bindings:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/ClusterBinding'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        updated_by: {type: string}
        status:
          description: The controller's latest self-report; null when it never reported.
          type: [object, 'null']
          properties:
            observed_revision: {type: integer}
            observed_cluster_uid: {type: string}
            identity_verified: {type: boolean}
            kubernetes_version: {type: string}
            controller_identity: {type: string}
            effective_mode: {type: string}
            effective_mode_reason: {type: string}
            last_report_at: {$ref: '#/components/schemas/NullableTimestamp'}
            last_error: {type: string}
            last_error_at: {$ref: '#/components/schemas/NullableTimestamp'}
        observations: {type: [array, 'null'], items: {type: object}}
        scaling: {type: [array, 'null'], items: {type: object}}
        events: {type: [array, 'null'], items: {type: object}}
        errors: {type: [array, 'null'], items: {type: object}}
        jobs_shown: {type: integer}

    QuotaDimension:
      type: object
      required: [name, kind, unit, used, limit, enforced]
      properties:
        name: {type: string, examples: [inflight_attempts, cpu_millis, active_runs, storage_bytes]}
        kind: {type: string, enum: [concurrent, run, storage]}
        unit: {type: string}
        used: {type: integer}
        limit: {type: integer, description: '0 means unlimited.'}
        enforced: {type: boolean}

    QuotasView:
      type: object
      required: [namespace, revision, quotas, dimensions, storage]
      properties:
        namespace: {type: string}
        revision: {type: integer}
        quotas: {$ref: '#/components/schemas/Quotas'}
        dimensions:
          type: array
          items: {$ref: '#/components/schemas/QuotaDimension'}
        storage:
          type: object
          required: [source, note]
          properties:
            source: {type: string}
            note: {type: string}

    QuotasPutRequest:
      type: object
      additionalProperties: false
      required: [revision, quotas]
      properties:
        revision: {type: integer, minimum: 0}
        quotas: {$ref: '#/components/schemas/Quotas'}

    UsagePage:
      type: object
      required: [from, to, group_by, buckets, next_cursor, attribution]
      properties:
        namespace: {type: string, description: 'Absent on the platform-wide rollup.'}
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        group_by: {type: string}
        buckets:
          type: [array, 'null']
          items:
            type: object
            required: [key, attempts]
            properties:
              key: {type: string}
              attempts: {type: integer}
              wall_seconds: {type: number}
              reserved_seconds: {type: number}
              cpu_core_seconds: {type: number}
              memory_gib_seconds: {type: number}
              gpu_seconds: {type: number}
              measured_cpu_seconds: {type: number}
              measured_attempts: {type: integer}
        next_cursor: {type: string, description: 'Empty on the last page.'}
        attribution: {type: string}

    Role:
      type: object
      required: [name, permissions, builtin, revision]
      properties:
        name: {type: string}
        permissions:
          type: [array, 'null']
          items: {type: string}
        builtin: {type: boolean}
        revision: {type: integer}
        immutable: {type: boolean, description: 'Built-in roles only.'}
        assignable: {type: boolean, description: 'Built-in roles only.'}

    RoleList:
      type: object
      required: [roles, catalog]
      properties:
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
        catalog:
          type: object
          description: Module name to its actions; a permission is `<module>.<action>`.
          additionalProperties:
            type: array
            items: {type: string}

    PutRoleRequest:
      type: object
      additionalProperties: false
      properties:
        permissions:
          type: [array, 'null']
          items: {type: string}
        revision: {type: integer, minimum: 0}

    UserRoles:
      type: object
      required: [roles, legacy, revision]
      properties:
        roles:
          type: [array, 'null']
          items: {type: string}
        legacy: {type: boolean, description: 'True when the user has no RBAC assignment (the account role applies).'}
        revision: {type: integer}
        protected: {type: boolean, description: 'Set for administrator accounts.'}

    PutUserRolesRequest:
      type: object
      additionalProperties: false
      properties:
        roles:
          type: [array, 'null']
          maxItems: 20
          items: {type: string}
        revision: {type: integer, minimum: 0}

    LoginRequest:
      type: object
      required: [namespace, email, password]
      properties:
        namespace: {type: string, description: 'The tenant''s namespace (tenant ID).'}
        email: {type: string}
        password: {type: string, format: password}

    LoginResult:
      type: object
      required: [token, expires_at, user]
      properties:
        token: {type: string, pattern: '^nxsess_', description: 'Shown exactly once.'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        user:
          type: object
          required: [id, email, display_name, namespace, role]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            email: {type: string}
            display_name: {type: string}
            namespace: {type: string}
            role: {type: string}

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 12, maxLength: 1024}

    Tenant:
      type: object
      required: [id, namespace, name, contact_email, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        contact_email: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    TenantCreated:
      type: object
      required: [tenant, administrator_id]
      properties:
        tenant: {$ref: '#/components/schemas/Tenant'}
        administrator_id: {$ref: '#/components/schemas/Uuid'}
        email_verification:
          type: object
          description: Present only when email flows are wired.
          required: [required]
          properties:
            required: {type: boolean}
            delivery: {type: string, enum: [mail_disabled, not_sent, queued, not_queued]}

    EmailLinkRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
        namespace: {type: string, maxLength: 200, description: 'Optional; narrows to one tenant.'}

    LinkToken:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 1, maxLength: 256}

    PasswordResetWithLink:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 1, maxLength: 256}
        password: {type: string, format: password, minLength: 12, maxLength: 1024}

    Whoami:
      type: object
      required: [namespace, name, role, kind, permissions, effective_permissions, roles]
      properties:
        namespace: {type: string}
        name: {type: string}
        role: {type: string, enum: [admin, reader, worker], description: 'The legacy account role; a KGF principal is always `reader` (its authority is its permissions).'}
        kind: {type: string, enum: [api_key, session, token, kgf]}
        permissions:
          type: object
          description: Coarse actions this principal may perform.
          required: [read, write, admin_write]
          properties:
            read: {type: boolean}
            write: {type: boolean}
            admin_write: {type: boolean}
        effective_permissions:
          type: array
          items: {type: string}
        roles:
          type: [array, 'null']
          items: {type: string}
        user_id: {type: string}
        service_account_id: {type: string, description: 'Set for a service-account token.'}
        kgf: {$ref: '#/components/schemas/KGFIdentity'}
        scopes:
          type: array
          items: {type: string}

    User:
      type: object
      required: [id, namespace, email, display_name, role, created_at, disabled_at, disabled, email_verified]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        email: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [admin, reader]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        disabled_at: {$ref: '#/components/schemas/NullableTimestamp'}
        disabled: {type: boolean}
        email_verified: {type: boolean}
        roles:
          type: array
          description: Present on creation with `role_name`.
          items: {type: string}

    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [admin, reader], default: reader}
        role_name: {type: string, description: 'An RBAC role to assign (needs roles.manage).'}
        password: {type: string, format: password, minLength: 12}

    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [email, display_name, previous_email, previous_display_name]
      properties:
        email: {type: string, maxLength: 254}
        display_name: {type: string, maxLength: 200}
        previous_email: {type: string}
        previous_display_name: {type: string}

    SessionsRevoked:
      type: object
      required: [user_id, sessions_revoked]
      properties:
        user_id: {type: string}
        sessions_revoked: {type: integer, minimum: 0}

    Session:
      type: object
      required: [id, created_at, expires_at, revoked_at, last_used_at, user_agent, client_ip, live]
      properties:
        id: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        revoked_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_used_at: {$ref: '#/components/schemas/NullableTimestamp'}
        user_agent: {type: string}
        client_ip: {type: string}
        live: {type: boolean}

    CreateTokenRequest:
      type: object
      description: A legacy token needs `scopes`; a ceilinged or service-account token needs `permissions`.
      required: [name]
      anyOf:
        - required: [scopes]
        - required: [permissions]
      properties:
        name: {type: string, minLength: 1}
        role: {type: string, enum: [admin, reader, worker], default: reader, description: 'Legacy and ceilinged tokens; ignored for a service-account token.'}
        scopes:
          type: array
          minItems: 1
          description: Legacy tokens. With `permissions` they only narrow the coarse scopes the ceiling implies.
          items: {type: string, enum: [read, write, admin_write, worker_rpc]}
        permissions:
          type: array
          minItems: 1
          description: The permission ceiling, e.g. `runs.view`. Every name must be in the catalog and held by the caller.
          items: {type: string, pattern: '^[a-z_]+(\.[a-z_]+)+$'}
        service_account_id:
          type: string
          format: uuid
          description: Mint the token for this service account (needs `permissions`).
        expires_in_days: {type: integer, default: 0, description: '0 = 90 days; negative = never expires (administrators only).'}

    Token:
      type: object
      required: [id, namespace, name, scopes, role, expires_at, last_used_at, created_by, created_at, revoked_at, service_account_id, permissions, live]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        scopes:
          type: [array, 'null']
          items: {type: string}
        role: {type: string}
        expires_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_used_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_by: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        revoked_at: {$ref: '#/components/schemas/NullableTimestamp'}
        service_account_id: {type: [string, 'null'], description: 'The owning service account; null otherwise.'}
        permissions:
          type: [array, 'null']
          description: The permission ceiling; null for a legacy token.
          items: {type: string}
        live: {type: boolean}

    TokenCreated:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [token, token_shown_once]
          properties:
            token: {type: string, pattern: '^nxtok_'}
            token_shown_once: {const: true}

    AuditEntry:
      type: object
      required: [id, namespace, actor_id, actor_kind, actor_label, action, target_kind, target_id, outcome, detail, client_ip, occurred_at, chain_seq, row_hash, request_id, kgf]
      properties:
        id: {type: integer}
        namespace: {type: string}
        actor_id: {type: [string, 'null']}
        actor_kind: {type: string}
        actor_label: {type: string}
        action: {type: string}
        target_kind: {type: string}
        target_id: {type: string}
        outcome: {type: string}
        detail: {$ref: '#/components/schemas/AnyJSON'}
        client_ip: {type: string, description: 'Evidence only (it honours X-Forwarded-For); never used to authorize.'}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
        chain_seq: {type: [integer, 'null'], minimum: 1, description: 'Position in the namespace''s hash chain; null for rows written before the chain existed.'}
        row_hash: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'SHA-256 over the row and the previous row''s hash.'}
        request_id: {type: string, description: 'The request''s correlation id; empty when none was given.'}
        kgf: {$ref: '#/components/schemas/AuditKGF'}

    Readiness:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, not_ready, draining]}
        checks:
          type: object
          additionalProperties: {type: string}
        detail: {type: string}

    BackfillStateConflictError:
      type: object
      required: [error, message]
      properties:
        error: {const: backfill_state_conflict}
        message: {type: string}
        state:
          type: string
          enum: [RUNNING, PAUSED, COMPLETED, CANCELLED, FAILED]
          description: The backfill's current state; absent when it could not be re-read.

    RateLimit:
      type: object
      additionalProperties: false
      description: |
        One key's shared token-bucket limit. At least one rate must be set; a
        zero (or absent) rate leaves that dimension unlimited. Bursts default
        to one second of requests (at least 1) and one minute of tokens, and
        need their rate.
      properties:
        requests_per_second: {type: number, minimum: 0, maximum: 1000000}
        tokens_per_minute: {type: integer, minimum: 0, maximum: 1000000000000}
        burst_requests: {type: integer, minimum: 0, maximum: 100000000}
        burst_tokens: {type: integer, minimum: 0, maximum: 1000000000000}

    KGFIdentity:
      type: object
      description: |
        Who KGF Cloud says the caller is (ADR-0024), taken only from a context
        whose signature the gateway verified. The organization, subscription
        and resource group are the readable form of the opaque `kgf-<hash>`
        namespace they map to.
      required: [organization, subscription, resource_group, principal, role, issuer, token_id]
      properties:
        organization: {type: string}
        subscription: {type: string}
        resource_group: {type: string}
        principal: {type: string, description: 'The EFFECTIVE principal: the person a delegating service acts for, when there is one.'}
        role: {type: string, description: 'The effective KGF role (`operator`, `viewer`, or a service''s mapped role).', examples: [operator, viewer]}
        via: {type: string, description: 'The KGF service that presented a delegated context.'}
        request_id: {type: string, description: 'KGF''s request id; also sent back as `X-Request-ID`.'}
        issuer: {type: string}
        token_id: {type: string}

    AuditKGF:
      type: [object, 'null']
      description: KGF Cloud attribution of an audit row (a verified X-KGF-Context); null when there was none.
      properties:
        organization: {type: string}
        subscription: {type: string}
        resource_group: {type: string}
        principal: {type: string}
        on_behalf_of: {type: string}

    AuditPolicy:
      type: object
      required: [namespace, retention_days, legal_hold, legal_hold_reason, legal_hold_by, legal_hold_at, revision, updated_by, updated_at, last_purge_at]
      properties:
        namespace: {type: string}
        retention_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: Rows older than this are purged; null keeps rows forever.
        legal_hold: {type: boolean, description: 'While true nothing is purged.'}
        legal_hold_reason: {type: string}
        legal_hold_by: {type: string}
        legal_hold_at: {$ref: '#/components/schemas/NullableTimestamp'}
        revision: {type: integer, minimum: 0, description: '0 for a namespace that never set a policy.'}
        updated_by: {type: string}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        last_purge_at: {$ref: '#/components/schemas/NullableTimestamp'}

    PutAuditPolicyRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        retention_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: Null or absent keeps rows forever.
        revision: {type: integer, minimum: 0, description: 'The revision last read.'}

    LegalHoldRequest:
      type: object
      additionalProperties: false
      required: [hold, revision]
      properties:
        hold: {type: boolean}
        reason: {type: string, description: 'Required when placing a hold: a matter, ticket or case reference.'}
        revision: {type: integer, minimum: 0}

    AuditPolicyConflictError:
      type: object
      required: [error, message, current]
      properties:
        error: {const: conflict}
        message: {type: string}
        current: {$ref: '#/components/schemas/AuditPolicy'}

    AuditSink:
      type: object
      description: A SIEM sink. Its signing secret is stored encrypted and never returned after creation or rotation.
      required: [id, namespace, name, kind, format, url, enabled, batch_size, cursor_seq, consecutive_failures, next_attempt_at, last_attempt_at, last_success_at, last_error, created_by, created_at, revision]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        kind: {const: webhook}
        format: {type: string, enum: [nexus, kgf]}
        url: {type: string}
        enabled: {type: boolean}
        batch_size: {type: integer, minimum: 1, maximum: 1000}
        cursor_seq: {type: integer, minimum: 0, description: 'The chain position delivered so far.'}
        consecutive_failures: {type: integer, minimum: 0}
        next_attempt_at: {$ref: '#/components/schemas/Timestamp'}
        last_attempt_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_success_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_error: {type: string}
        created_by: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        revision: {type: integer, minimum: 1}

    AuditSinkWithSecret:
      allOf:
        - $ref: '#/components/schemas/AuditSink'
        - type: object
          required: [signing_secret, signing_secret_shown_once]
          properties:
            signing_secret: {type: string, pattern: '^whsec_', description: 'Shown exactly once.'}
            signing_secret_shown_once: {const: true}

    CreateAuditSinkRequest:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        url: {type: string, description: 'An https URL with no credentials and no internal address.'}
        batch_size: {type: integer, minimum: 1, maximum: 1000, default: 100}
        enabled: {type: boolean, default: true}
        from_start: {type: boolean, default: false, description: 'Replay the whole retained chain rather than starting at the current head.'}
        format: {type: string, enum: [nexus, kgf], default: nexus}

    UpdateAuditSinkRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        url: {type: string}
        enabled: {type: boolean}
        batch_size: {type: integer, minimum: 1, maximum: 1000}
        revision: {type: integer, minimum: 1}

    InvalidSinkError:
      type: object
      description: The one error body without a `message`; `problems` lists every reason.
      required: [error, problems]
      properties:
        error: {const: invalid_sink}
        problems:
          type: array
          items: {type: string}

    ServiceAccount:
      type: object
      required: [id, namespace, name, description, disabled, disabled_at, created_at, revision, roles, live_tokens]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        description: {type: string}
        disabled: {type: boolean}
        disabled_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        revision: {type: integer}
        roles:
          type: [array, 'null']
          items: {type: string}
        live_tokens: {type: integer, minimum: 0, description: 'Unrevoked, unexpired tokens of the account.'}

    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,62}$', description: '2-63 lower-case letters, digits, `.`, `_` or `-`.'}
        description: {type: string, maxLength: 500}
        roles:
          type: array
          description: RBAC role names to bind; never Administrator.
          items: {type: string}

    UpdateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        description: {type: string, maxLength: 500}
        revision: {type: integer, minimum: 1}

    ServiceAccountState:
      type: object
      required: [id, disabled]
      properties:
        id: {type: string}
        disabled: {type: boolean}

    ServiceAccountRoles:
      type: object
      required: [roles, revision]
      properties:
        roles:
          type: array
          items: {type: string}
        revision: {type: integer, minimum: 0}

    PutServiceAccountRolesRequest:
      type: object
      additionalProperties: false
      required: [roles, revision]
      properties:
        roles:
          type: [array, 'null']
          maxItems: 20
          items: {type: string}
        revision: {type: integer, minimum: 0}

    ChannelKind:
      type: string
      enum: [slack_webhook, slack_bot, teams, pagerduty, webhook, email]

    NotificationEvent:
      type: string
      enum: [run.failed, run.succeeded, run.timed_out, run.sla_exceeded, attempt.lost]

    NotificationChannel:
      type: object
      required: [id, namespace, name, kind, config, secret, rate_limit_per_minute, enabled, created_by, created_at, updated_at, revision]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        kind: {$ref: '#/components/schemas/ChannelKind'}
        config: {type: object, description: 'Kind-specific settings; never secrets.'}
        secret:
          type: object
          description: Whether a secret is configured, never the secret.
          required: [configured, source, hint]
          properties:
            configured: {type: boolean}
            source: {type: string, enum: ['', sealed, ref], description: '`sealed` (stored encrypted), `ref` (an external reference) or empty.'}
            hint: {type: string, description: 'A short, non-reversible hint to recognise the secret by.'}
            ref: {type: string, description: 'The reference, when `source` is `ref`.'}
        rate_limit_per_minute: {type: integer, minimum: 1, maximum: 6000}
        enabled: {type: boolean}
        created_by: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        revision: {type: integer, minimum: 1}

    NotificationChannelCreated:
      allOf:
        - $ref: '#/components/schemas/NotificationChannel'
        - type: object
          properties:
            signing_secret: {type: string, description: 'A generated webhook signing key, shown exactly once.'}

    CreateNotificationChannelRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,62}$'}
        kind: {$ref: '#/components/schemas/ChannelKind'}
        config: {type: object, description: 'Kind-specific settings (see the operation).'}
        secret: {type: string, minLength: 1, description: 'The secret inline. Not with `secret_ref`.'}
        secret_ref: {type: string, description: 'A reference to an external secret. Not with `secret`.'}
        rate_limit_per_minute: {type: integer, minimum: 1, maximum: 6000, default: 30}
        enabled: {type: boolean, default: true}
        revision: {type: integer, description: 'Ignored on create.'}

    UpdateNotificationChannelRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, description: 'Optional; must equal the stored name.'}
        kind: {type: string, description: 'Optional; must equal the stored kind.'}
        config: {type: object}
        secret: {type: string, minLength: 1}
        secret_ref: {type: string}
        rate_limit_per_minute: {type: integer, minimum: 1, maximum: 6000}
        enabled: {type: boolean}
        revision: {type: integer, minimum: 0, description: '0 skips the concurrency check.'}

    NotificationRule:
      type: object
      required: [id, namespace, name, events, workflows, labels, enabled, channels, created_by, created_at, updated_at, revision]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        events:
          type: array
          items: {$ref: '#/components/schemas/NotificationEvent'}
        workflows:
          type: [array, 'null']
          description: Workflow names; empty matches every workflow.
          items: {type: string}
        labels:
          type: [object, 'null']
          description: Run labels that must all be present.
          additionalProperties: {type: string}
        sla_seconds: {type: integer, minimum: 60, maximum: 2592000, description: 'Present with `run.sla_exceeded`.'}
        enabled: {type: boolean}
        channels:
          type: array
          description: Channel names.
          items: {type: string}
        created_by: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        revision: {type: integer, minimum: 1}

    NotificationRuleRequest:
      type: object
      additionalProperties: false
      description: '`name` is required on create; on update it is optional and must equal the path.'
      required: [events, channels]
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,62}$'}
        events:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/NotificationEvent'}
        workflows:
          type: array
          maxItems: 100
          items: {type: string}
        labels:
          type: object
          maxProperties: 20
          additionalProperties: {type: string}
        sla_seconds: {type: integer, minimum: 60, maximum: 2592000}
        channels:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string}
        enabled: {type: boolean, default: true}
        revision: {type: integer, minimum: 0, description: 'Update only; 0 skips the concurrency check.'}

    NotificationDelivery:
      type: object
      required: [id, channel, channel_id, channel_kind, rule, rule_id, event_key, dedup_key, event_type, action, run_id, payload, state, attempts, max_attempts, next_attempt_at, last_error, created_by, created_at, delivered_at, dead_at]
      properties:
        id: {type: integer, format: int64}
        channel: {type: string}
        channel_id: {type: string}
        channel_kind: {$ref: '#/components/schemas/ChannelKind'}
        rule: {type: string, description: 'Empty for a channel test.'}
        rule_id: {type: string}
        event_key: {type: string, description: 'Unique per delivery.'}
        dedup_key: {type: string, description: 'The receiver-facing idempotency key; kept by a redrive.'}
        event_type: {type: string, examples: [run.failed, notification.test]}
        action: {type: string, enum: [trigger, resolve, test]}
        run_id: {type: string, description: 'Empty when the event concerns no run.'}
        payload: {type: object}
        state: {type: string, enum: [pending, delivered, dead]}
        attempts: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1, maximum: 50}
        next_attempt_at: {$ref: '#/components/schemas/Timestamp'}
        last_error: {type: string}
        last_status: {type: integer, description: 'The receiver''s last HTTP status, when it answered.'}
        redrive_of: {type: integer, format: int64, description: 'The dead delivery this one re-sends.'}
        created_by: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        delivered_at: {$ref: '#/components/schemas/NullableTimestamp'}
        dead_at: {$ref: '#/components/schemas/NullableTimestamp'}

    ParamsMapping:
      type: object
      description: |
        Run parameter name to expression: a JSONPath of member and index steps
        only (`$.payload.ref`, `$.payload.commits[0].id`, `$['odd key']`), a
        template string with `{{ $.path }}` placeholders, or a literal. A path
        that does not resolve is an error, never a silently missing parameter.
      additionalProperties: true

    WebhookTrigger:
      type: object
      required: [id, namespace, name, workflow, params_mapping, idempotency_key_path, priority, tolerance_seconds, enabled, secret_rotated_at, previous_secret_expires_at, created_by, created_at, updated_at, last_fired_at, fire_count, revision, path, url_source, signature_scheme]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        workflow: {type: string}
        workflow_version: {type: integer, minimum: 1, description: 'Present only when the trigger pins a version.'}
        params_mapping: {$ref: '#/components/schemas/ParamsMapping'}
        idempotency_key_path: {type: string, description: 'Empty: each distinct signed delivery is one run.'}
        priority: {type: integer, minimum: 0, maximum: 1000}
        tolerance_seconds: {type: integer, minimum: 30, maximum: 3600}
        enabled: {type: boolean}
        secret_rotated_at: {$ref: '#/components/schemas/Timestamp'}
        previous_secret_expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Until when the rotated-out secret still verifies; null when it no longer does.
        created_by: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        last_fired_at: {$ref: '#/components/schemas/NullableTimestamp'}
        fire_count: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
        path: {type: string, description: 'Where senders POST: `/v1/hooks/<ns>/<trigger id>`.'}
        url: {type: string, format: uri, description: 'The absolute hook URL. Present whenever the gateway knows its public address (see url_source); omitted, never guessed, when it does not.'}
        url_source:
          type: string
          enum: [forwarded, config, unknown]
          description: >-
            Where `url` came from: `forwarded` headers of a proxy listed in
            NEXUS_TRUSTED_PROXIES, the configured NEXUS_PUBLIC_URL, or
            `unknown` (no url; a client must not build one from its own origin).
        signature_scheme: {type: string}

    WebhookTriggerWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookTrigger'
        - type: object
          required: [secret]
          properties:
            secret: {type: string, description: 'The signing secret, shown exactly once.'}

    TriggerFields:
      type: object
      properties:
        workflow: {type: string, minLength: 1, description: 'Must name an existing workflow.'}
        workflow_version: {type: integer, minimum: 1, description: 'Pin a version; otherwise the newest runs.'}
        params_mapping: {$ref: '#/components/schemas/ParamsMapping'}
        idempotency_key_path: {type: string, description: 'An expression naming the value that de-duplicates deliveries.'}
        priority: {type: integer, minimum: 0, maximum: 1000, default: 100}
        tolerance_seconds: {type: integer, minimum: 30, maximum: 3600, default: 300, description: 'Maximum clock skew of `X-Nexus-Timestamp`.'}
        enabled: {type: boolean, default: true}

    CreateTriggerRequest:
      allOf:
        - $ref: '#/components/schemas/TriggerFields'
        - type: object
          required: [name, workflow]
          properties:
            name: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,62}$'}
            revision: {type: integer, description: 'Ignored on create.'}

    UpdateTriggerRequest:
      allOf:
        - $ref: '#/components/schemas/TriggerFields'
        - type: object
          properties:
            name: {type: string, description: 'Optional; must equal the path.'}
            revision: {type: integer, minimum: 0, description: '0 skips the concurrency check.'}

    WebhookReceipt:
      type: object
      required: [received_at, outcome, http_status, run_id, idempotency_key, detail, signature_digest]
      properties:
        received_at: {$ref: '#/components/schemas/Timestamp'}
        outcome: {type: string, enum: [accepted, deduplicated, rejected]}
        http_status: {type: integer}
        run_id: {type: string, description: 'Empty when no run was started or found.'}
        idempotency_key: {type: string}
        detail: {type: string, description: 'Why a delivery was rejected.'}
        signature_digest: {type: string, pattern: '^[0-9a-f]{16}$', description: 'A prefix of the delivery''s digest, to correlate with the sender''s logs.'}

    SensorKind:
      type: string
      enum: [object_store, run_succeeded]

    SensorState:
      type: object
      description: The workflow-manager's runtime view of the sensor.
      required: [status, baseline_done, cursor, watermark, next_poll_at, lease_owner, lease_until, last_poll_at, last_success_at, last_error, consecutive_failures, observed_total, triggered_total, pending, definition_current]
      properties:
        status: {type: string, enum: [initializing, ok, error]}
        baseline_done: {type: boolean}
        cursor: {type: string}
        watermark: {$ref: '#/components/schemas/NullableTimestamp'}
        next_poll_at: {$ref: '#/components/schemas/Timestamp'}
        lease_owner: {type: string, description: 'The replica polling it right now, if any.'}
        lease_until: {$ref: '#/components/schemas/NullableTimestamp'}
        last_poll_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_success_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_error: {type: string}
        consecutive_failures: {type: integer, minimum: 0}
        observed_total: {type: integer, minimum: 0}
        triggered_total: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0, description: 'Observations waiting for their run.'}
        definition_current: {type: boolean, description: 'False until a replica picks up the latest definition.'}

    Sensor:
      type: object
      required: [id, namespace, name, kind, workflow, config, params_mapping, poll_interval_seconds, backfill, priority, enabled, created_by, created_at, updated_at, revision, status]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        namespace: {type: string}
        name: {type: string}
        kind: {$ref: '#/components/schemas/SensorKind'}
        workflow: {type: string}
        workflow_version: {type: integer, minimum: 1, description: 'Present only when the sensor pins a version.'}
        config: {type: object}
        params_mapping: {$ref: '#/components/schemas/ParamsMapping'}
        poll_interval_seconds: {type: integer, minimum: 5, maximum: 86400}
        backfill: {type: boolean, description: 'Trigger for what already existed at the first pass.'}
        priority: {type: integer, minimum: 0, maximum: 1000}
        enabled: {type: boolean}
        created_by: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        revision: {type: integer, minimum: 1}
        status:
          type: string
          enum: [disabled, waiting, stale, initializing, ok, error]
          description: |
            `disabled`; `waiting` (never polled yet); `stale` (its poll is more
            than 5 minutes overdue and no replica holds its lease, so no
            workflow-manager is polling it); otherwise the stored `state.status`.
        state: {$ref: '#/components/schemas/SensorState'}

    SensorFields:
      type: object
      properties:
        workflow: {type: string, minLength: 1}
        workflow_version: {type: integer, minimum: 1}
        config:
          type: object
          description: '`object_store`: `uri` and `pattern` (a glob). `run_succeeded`: `upstream_workflow`.'
          properties:
            uri: {type: string}
            pattern: {type: string}
            upstream_workflow: {type: string}
          additionalProperties: false
        params_mapping: {$ref: '#/components/schemas/ParamsMapping'}
        poll_interval_seconds: {type: integer, minimum: 5, maximum: 86400, default: 30}
        backfill: {type: boolean, default: false}
        priority: {type: integer, minimum: 0, maximum: 1000, default: 100}
        enabled: {type: boolean, default: true}

    CreateSensorRequest:
      allOf:
        - $ref: '#/components/schemas/SensorFields'
        - type: object
          required: [name, kind, workflow]
          properties:
            name: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,62}$'}
            kind: {$ref: '#/components/schemas/SensorKind'}
            revision: {type: integer, description: 'Ignored on create.'}

    UpdateSensorRequest:
      allOf:
        - $ref: '#/components/schemas/SensorFields'
        - type: object
          properties:
            name: {type: string, description: 'Optional; must equal the path.'}
            kind: {type: string, description: 'Optional; must equal the stored kind.'}
            revision: {type: integer, minimum: 0, description: '0 skips the concurrency check.'}

    SensorObservation:
      type: object
      required: [item_key, item, outcome, run_id, attempts, last_error, observed_at, triggered_at]
      properties:
        item_key: {type: string, description: 'The object key or upstream run id.'}
        item: {type: object, description: 'What the mapping sees as `$.object` or `$.run`.'}
        outcome: {type: string, enum: [pending, triggered, baseline, failed]}
        run_id: {type: string, description: 'Empty until triggered.'}
        attempts: {type: integer, minimum: 0}
        last_error: {type: string}
        observed_at: {$ref: '#/components/schemas/Timestamp'}
        triggered_at: {$ref: '#/components/schemas/NullableTimestamp'}

    Asset:
      type: object
      required: [uri, name, first_seen_at, last_declared_at, last_materialized_at, last_materialized_run_id, producers, consumers]
      properties:
        uri: {type: string}
        name: {type: string}
        first_seen_at: {$ref: '#/components/schemas/Timestamp'}
        last_declared_at: {$ref: '#/components/schemas/Timestamp'}
        last_materialized_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_materialized_run_id: {type: string, description: 'Empty when never materialized.'}
        producers: {type: integer, minimum: 0, description: 'Distinct (workflow, task) pairs that declare producing it.'}
        consumers: {type: integer, minimum: 0}

    AssetTask:
      type: object
      required: [workflow, node_id, last_run_id, last_recorded_at, runs]
      properties:
        workflow: {type: string}
        node_id: {type: string}
        last_run_id: {type: string}
        last_recorded_at: {$ref: '#/components/schemas/Timestamp'}
        runs: {type: integer, minimum: 1}

    AssetMaterialization:
      type: object
      required: [run_id, node_id, workflow, materialized_at, run_state]
      properties:
        run_id: {type: string}
        node_id: {type: string}
        workflow: {type: string}
        materialized_at: {$ref: '#/components/schemas/Timestamp'}
        run_state: {type: string, description: 'Empty when the run no longer exists.'}

    AssetDetail:
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          required: [producer_tasks, consumer_tasks, materializations, latest_materialization]
          properties:
            producer_tasks:
              type: array
              items: {$ref: '#/components/schemas/AssetTask'}
            consumer_tasks:
              type: array
              items: {$ref: '#/components/schemas/AssetTask'}
            materializations:
              type: array
              description: The 20 most recent, newest first.
              items: {$ref: '#/components/schemas/AssetMaterialization'}
            latest_materialization:
              oneOf:
                - $ref: '#/components/schemas/AssetMaterialization'
                - type: 'null'

    AssetGraph:
      type: object
      required: [nodes, edges, truncated]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, kind, label]
            properties:
              id: {type: string, description: '`asset:<uri>` or `task:<workflow>/<node>`.'}
              kind: {type: string, enum: [asset, task]}
              label: {type: string}
              uri: {type: string, description: 'Asset nodes.'}
              workflow: {type: string, description: 'Task nodes.'}
              node_id: {type: string, description: 'Task nodes.'}
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: {type: string}
              to: {type: string}
        truncated: {type: boolean, description: 'More than 5000 lineage edges exist; the graph is partial.'}
