        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/EventsNotConfigured'}
        '503': {$ref: '#/components/responses/ConfigWriteUnavailable'}

  # ── webhook triggers (ADR-0028) ──────────────────────────────────────────
  /v1/namespaces/{ns}/triggers:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Triggers]
      operationId: listTriggers
      summary: List webhook triggers
      x-nexus-action: read
      x-nexus-permissions: [triggers.view]
      responses:
        '200':
          description: The triggers, by name. Secrets are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [triggers]
                properties:
                  triggers:
                    type: array
                    items: {$ref: '#/components/schemas/WebhookTrigger'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/EventsNotConfigured'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Triggers]
      operationId: createTrigger
      summary: Create a webhook trigger (the secret is shown once)
      description: |
        A signed inbound webhook that starts runs of `workflow`. The response
        carries the hook `path` (and absolute `url` when the gateway knows its
        public URL) and the generated signing `secret`, shown ONCE; senders
        sign each delivery with it (see `POST /v1/hooks/{ns}/{trigger}`).

        `params_mapping` maps run parameters from the delivery. Expressions are
        evaluated against `{"payload": <request body>, "trigger": {"id", "name"}}`
        and are a JSONPath of member and index steps only (`$.payload.ref`,
        `$.payload.commits[0].id`), a template string with `{{ $.path }}`
        placeholders, or a literal. `idempotency_key_path`, when set, names
        the value that de-duplicates deliveries; otherwise each distinct signed
        delivery is one run. A trigger is a standing authorization to create
        runs, so creating one also needs `runs.create`. Needs NEXUS_SECRET_KEY
        on the gateway (503 `secret_key_unconfigured`).
      x-nexus-action: write
      x-nexus-permissions: [triggers.create, workflows.view, runs.create]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTriggerRequest'}
            example:
              name: github-push
              workflow: build-and-test
              params_mapping: {repo: $.payload.repository.full_name, commit: $.payload.after, note: 'push to {{ $.payload.ref }}'}
              idempotency_key_path: $.payload.after
              tolerance_seconds: 300
      responses:
        '201':
          description: Created. Store `secret` now; it is never shown again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookTriggerWithSecret'}
              example:
                id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                namespace: default
                name: github-push
                workflow: build-and-test
                params_mapping: {repo: $.payload.repository.full_name, commit: $.payload.after, note: 'push to {{ $.payload.ref }}'}
                idempotency_key_path: $.payload.after
                priority: 100
                tolerance_seconds: 300
                enabled: true
                secret_rotated_at: '2026-09-26T11:00:00Z'
                previous_secret_expires_at: null
                created_by: ops@example.com
                created_at: '2026-09-26T11:00:00Z'
                updated_at: '2026-09-26T11:00:00Z'
                last_fired_at: null
                fire_count: 0
                revision: 1
                path: /v1/hooks/default/9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                signature_scheme: 'X-Nexus-Signature: v1=hex(HMAC-SHA256(secret, X-Nexus-Timestamp + "." + body))'
                url: https://nexus.example.com/v1/hooks/default/9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                url_source: config
                secret: 5e0b9d8c7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d
        '400': {$ref: '#/components/responses/ConfigBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/ConfigConflict'}
        '422': {$ref: '#/components/responses/InvalidTrigger'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/EventsNotConfigured'}
        '503': {$ref: '#/components/responses/ConfigWriteUnavailable'}

  /v1/namespaces/{ns}/triggers/{name}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/triggerName'
    get:
      tags: [Triggers]
      operationId: getTrigger
      summary: Get a webhook trigger
      x-nexus-action: read
      x-nexus-permissions: [triggers.view]
      responses:
        '200':
          description: The trigger.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookTrigger'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/EventsNotConfigured'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    put:
      tags: [Triggers]
      operationId: updateTrigger
      summary: Update a webhook trigger
      description: |
        Omitted fields keep their stored values; `params_mapping`, when given,
        replaces the whole mapping. Pointing the trigger at a different
        `workflow` drops a `workflow_version` pin unless one is given. The
        secret is unchanged (rotate it separately). `name`, if given, must
        equal the path. `revision`, when non-zero, must equal the stored
