              schema: {$ref: '#/components/schemas/AttentionList'}
              example:
                items:
                  - kind: blocked_on_capacity
                    severity: warning
                    summary: transform has waited 12m for resources
                    detail: 'waiting_for_resources: gpu (need 4, free 3)'
                    link: /runs/0b6f3a52-91c4-4f0e-8a77-3c5d2e1f9a40?attempt=5a1e9c0d-3f2b-4d6a-8e7c-9b0a1f2e3d4c
                    run_id: 0b6f3a52-91c4-4f0e-8a77-3c5d2e1f9a40
                    run_state: RUNNING
                    spec_name: hello-dag
                    occurred_at: '2026-09-24T09:02:00Z'
                    node_id: transform
                    attempt_id: 5a1e9c0d-3f2b-4d6a-8e7c-9b0a1f2e3d4c
                count: 1
                truncated: false
