      operationId: rotateTriggerSecret
      summary: Issue a new trigger secret (shown once)
      description: |
        The previous secret keeps verifying for `grace_seconds` (default 86400,
        at most 604800; 0 revokes it immediately), so senders can switch over;
        `previous_secret_expires_at` says until when. The body is optional.
      x-nexus-action: write
