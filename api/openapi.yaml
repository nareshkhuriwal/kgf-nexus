  # ── attempts ─────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/attempts/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/attemptId'
    get:
      tags: [Attempts]
      operationId: getAttemptLogs
      summary: Read, search, download or follow an attempt's log
      description: |
        One route, four modes, chosen in this order:

        1. `q` present - a bounded **search** (JSON `LogSearch`).
        2. `Accept: text/event-stream` or `stream=true` - **follow** as SSE:
           `event: line` frames (`id` = the line number, `data` = `LogLine`),
           `event: status` when the log state changes, a final `event: end`
           carrying the status, and `event: error` on failure.
        3. `format=text` or `Accept: text/plain` (without `application/json`) -
           raw **text**, one line per line, optionally `follow=true`.
        4. otherwise a JSON **page** (`LogPage`): the last `tail` lines, or
           `limit` lines from `from_line`.
      x-nexus-action: read
      x-nexus-permissions: [tasks.logs.view]
      parameters:
        - name: stream_name
          in: query
          description: Only lines of this stream.
          schema: {type: string, enum: [stdout, stderr, combined, nexus]}
        - name: tail
          in: query
          description: Page or start from the last N lines.
          schema: {type: integer, minimum: 1, default: 500}
        - name: from_line
          in: query
          description: First line number (1-based). Takes precedence over `tail`.
          schema: {type: integer, minimum: 1}
        - name: limit
          in: query
          description: Lines per page with `from_line`, or maximum matches with `q`.
          schema: {type: integer, minimum: 0}
        - name: q
          in: query
          description: Search pattern (a substring, or an RE2 expression with `regex=true`).
          schema: {type: string}
        - name: regex
          in: query
          schema: {type: boolean}
        - name: case
          in: query
          description: '`insensitive` for case-insensitive search.'
          schema: {type: string, enum: [insensitive]}
        - name: scan_bytes
          in: query
          description: Upper bound on bytes a search scans.
          schema: {type: integer, minimum: 0}
        - name: format
          in: query
          schema: {type: string, enum: [text]}
        - name: follow
          in: query
          description: With `format=text`, keep the response open and append new lines.
          schema: {type: boolean}
        - name: stream
          in: query
          description: '`true` follows the log as server-sent events.'
          schema: {type: boolean}
        - $ref: '#/components/parameters/lastEventId'
      responses:
        '200':
          description: A page, search results, an event stream or plain text.
          headers:
            X-Nexus-Log-State:
              description: Text mode only - the log state.
              schema: {type: string, enum: [none, live, complete, partial, expired]}
            X-Nexus-Log-Lines:
              description: Text mode only - the indexed line count, when the log exists.
              schema: {type: integer}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LogPage'
                  - $ref: '#/components/schemas/LogSearch'
              examples:
                page:
                  value:
                    attempt_id: 5a1e9c0d-3f2b-4d6a-8e7c-9b0a1f2e3d4c
                    log:
                      state: complete
                      attempt_state: SUCCEEDED
                      lines: 2
                      bytes: 71
                      chunks: 1
                      truncated_lines: 0
                      truncated_bytes: 0
                      dropped_lines: 0
                      compacted: true
                      finalized_at: '2026-09-24T09:14:40Z'
                      detail: The attempt finished and its whole log is stored.
                    lines:
                      - {n: 1, ts: '2026-09-24T09:13:11.201Z', stream: stdout, message: extracting records from the source}
                      - {n: 2, ts: '2026-09-24T09:14:39.870Z', stream: stdout, message: wrote 90000 rows}
                    first_line: 1
                    next_line: 3
                    has_more: false
            text/plain:
              schema: {type: string}
              example: |
                extracting records from the source
                wrote 90000 rows
            text/event-stream:
              schema: {type: string}
              example: |+
                event: status
                data: {"state":"live","attempt_state":"RUNNING","lines":1,"bytes":36,"chunks":1,"truncated_lines":0,"truncated_bytes":0,"dropped_lines":0,"compacted":false,"detail":"The attempt is running; lines appear as the worker ships them."}

                id: 1
                event: line
                data: {"n":1,"ts":"2026-09-24T09:13:11.201Z","stream":"stdout","message":"extracting records from the source"}

        '400':
          description: '`invalid_argument`: a bad `stream_name` or search expression.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501':
          description: '`logs_unavailable`: this gateway has no log backend.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/runs/{run}/attempts/{id}/assignment:
    parameters:
