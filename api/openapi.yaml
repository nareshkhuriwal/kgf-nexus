  # ── tokens ───────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/tokens:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: List scoped tokens (never their secrets)
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [tokens.view]
      parameters:
        - $ref: '#/components/parameters/limit100'
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: {$ref: '#/components/schemas/Token'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Tokens]
      operationId: createToken
      summary: Mint a scoped token (the secret is shown once)
      description: |
        Three kinds of token (ADR-0024 §6):

        * **Legacy** (`role` and `scopes`, no `permissions`): carries its
          role's full authority, narrowed by `scopes`. Only a Nexus
          administrator may mint one (403 `ceiling_required` otherwise).
        * **Ceilinged** (`permissions`): at every request its authority is the
          creator's grants intersected with `permissions`. The caller may only
          name permissions it holds (403 `invalid_grant`); a worker token
          cannot carry a ceiling.
        * **Service account** (`service_account_id` and `permissions`): its
          authority is the account's CURRENT roles intersected with
          `permissions`, so narrowing or disabling the account takes effect
          at once. Every permission must be held by the account (422
          `outside_account`), and the account must be enabled.

        `expires_in_days` 0 (or absent) means the 90-day default; a NEGATIVE
        value means no expiry, which only an administrator may ask for. Minted
        and audited in one transaction: 503 `audit_unavailable` means no token
        exists.
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [tokens.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTokenRequest'}
            examples:
              legacy:
                summary: A legacy scoped token (administrators only)
                value: {name: github-actions-deploy, role: admin, scopes: [read, write], expires_in_days: 30}
              ceiling:
                summary: A token with a permission ceiling
                value: {name: dashboards-readonly, permissions: [runs.view, workflows.view], expires_in_days: 90}
              serviceAccount:
                summary: A service-account token
                value: {name: ci-deployer-2026-09, service_account_id: 7c6b5a49-3827-4165-9f4e-3d2c1b0a9f8e, permissions: [workflows.publish, workflows.view], expires_in_days: 30}
      responses:
        '201':
          description: Minted. Store `token` now; it is never shown again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenCreated'}
              example:
                id: 4b3a2c1d-0e9f-48a7-b6c5-d4e3f2a1b0c9
                namespace: default
                name: github-actions-deploy
                scopes: [read, write]
                role: admin
                expires_at: '2026-10-24T09:50:00Z'
                last_used_at: null
                created_by: 1d2c3b4a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                created_at: '2026-09-24T09:50:00Z'
                revoked_at: null
                service_account_id: null
                permissions: null
                live: true
                token: nxtok_c2VjcmV0LXRva2VuLXZhbHVlLWV4YW1wbGU
                token_shown_once: true
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: |
            `forbidden`; `ceiling_required` (only an administrator may mint a
            token without `permissions`); `invalid_grant` (a permission the
            caller does not hold, or one that cannot be delegated); or
            `expiry_required` (only an administrator may mint a token that
            never expires).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: ceiling_required, message: Set permissions (a ceiling within your own permissions) or mint the token for a service account}
        '404':
          description: '`not_found`: no such service account.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`account_disabled`: enable the service account before minting tokens for it.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_token_request` (with `problems`: no name, no or unknown permissions or scopes, a bad role), or `outside_account` (a permission the service account does not hold).'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemsError'
                  - $ref: '#/components/schemas/Error'
              example:
                error: invalid_token_request
                message: token could not be created
                problems: ['at least one scope is required; a token with no scopes can do nothing']
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501':
          description: '`not_configured`: this gateway cannot mint ceilinged tokens.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  /v1/namespaces/{ns}/tokens/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/tokenId'
    post:
      tags: [Tokens]
      operationId: revokeToken
      summary: Revoke a scoped token
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [tokens.manage]
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                required: [token_id, revoked]
                properties:
                  token_id: {type: string}
                  revoked: {const: true}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── audit ────────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/audit:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Audit]
      operationId: listAudit
      summary: Read the audit trail (keyset-paginated)
      description: |
        Newest first. Pass `next_cursor` back as `cursor` for the next page;
        it is null on the last page. Every row written since the trail became
        hash-chained (ADR-0025) carries its `chain_seq` and `row_hash`; use
        `GET .../audit/export` for a verifiable copy. `request_id` finds the
        rows of one request (a KGF support reference). Registered only when
        identity is wired.
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.view]
      parameters:
        - $ref: '#/components/parameters/auditAction'
        - $ref: '#/components/parameters/auditActorId'
        - $ref: '#/components/parameters/auditOutcome'
        - $ref: '#/components/parameters/auditSince'
        - $ref: '#/components/parameters/auditUntil'
        - $ref: '#/components/parameters/auditRequestId'
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          description: Rows per page; 0, absent or more than 1000 means 100.
          schema: {type: integer, minimum: 0, maximum: 1000, default: 100}
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries, next_cursor]
                properties:
                  entries:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEntry'}
                  next_cursor:
                    type: [string, 'null']
                    description: Pass as `cursor` for the next page; null on the last page.
              example:
                entries:
                  - id: 4211
                    namespace: default
                    actor_id: 1d2c3b4a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    actor_kind: session
                    actor_label: ops@example.com
                    action: token.create
                    target_kind: token
                    target_id: 4b3a2c1d-0e9f-48a7-b6c5-d4e3f2a1b0c9
                    outcome: success
                    detail: {name: github-actions-deploy, role: admin, scopes: [read, write]}
                    client_ip: 10.0.4.17
                    occurred_at: '2026-09-24T09:50:00Z'
                    chain_seq: 1187
                    row_hash: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
                    request_id: req-7f3a9c2e
                    kgf: null
                next_cursor: eyJ0IjoiMjAyNi0wOS0yNFQwOTo1MDowMFoiLCJpIjo0MjExfQ
        '400':
          description: '`invalid_filter` (`since`/`until` is not RFC 3339) or `invalid_cursor`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: invalid_cursor, message: cursor was not issued by this server}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/audit/export:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Audit]
      operationId: exportAudit
      summary: Export the audit trail (NDJSON, CSV or KGF events)
      description: |
        Streams every matching row as a download (`Content-Disposition:
        attachment`, `Cache-Control: no-store`). Takes the same filters as the
        listing except `cursor` and `limit`: an export is never paged.

        * `format=ndjson` (default) - a VERIFIABLE export: a `header` line
          (`encoding: nexus-audit-v1`, the chain `anchor`, `complete: true`
          when unfiltered), one `audit` line per row in chain order carrying
          `chain_seq`, `prev_hash` and `row_hash`, then a `trailer` line with
          the row count and the chain `head`. A missing trailer means the
          stream was cut short, and the offline verifier reports it as
          truncated.
        * `format=csv` - the same rows for spreadsheets and SIEM import.
        * `format=kgf` - KGF Cloud's audit event shape, one per line.

        Registered only when identity is wired, like the listing. An error
        after the first byte cannot change the status code; the stream simply
        ends (without its trailer).
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.view]
      parameters:
        - name: format
          in: query
          schema: {type: string, enum: [ndjson, csv, kgf], default: ndjson}
        - $ref: '#/components/parameters/auditAction'
        - $ref: '#/components/parameters/auditActorId'
        - $ref: '#/components/parameters/auditOutcome'
        - $ref: '#/components/parameters/auditSince'
        - $ref: '#/components/parameters/auditUntil'
        - $ref: '#/components/parameters/auditRequestId'
      responses:
        '200':
          description: The export, streamed.
          headers:
            Content-Disposition:
              description: '`attachment; filename="audit-<ns>-<UTC stamp>.ndjson"` (`.csv`, `.kgf.ndjson`).'
              schema: {type: string}
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON; see the operation description for the line types.
              example: |
                {"type":"header","v":1,"encoding":"nexus-audit-v1","namespace":"default","complete":true,"anchor":{"kind":"genesis","seq":0,"hash":"9b1c6f0e4d2a8c7b5e3f1a0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b"},"generated_at":"2026-09-26T10:00:00.000000Z"}
                {"type":"audit","id":4211,"namespace":"default","chain_seq":1,"occurred_at":"2026-09-26T09:12:03.000000Z","actor_id":null,"actor_kind":"api_key","actor_label":"ci-deploy","action":"token.create","target_kind":"token","target_id":"4b3a2c1d-0e9f-48a7-b6c5-d4e3f2a1b0c9","outcome":"success","detail":{"name":"github-actions-deploy"},"client_ip":"10.0.4.17","prev_hash":"9b1c6f0e4d2a8c7b5e3f1a0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b","row_hash":"0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"}
                {"type":"trailer","rows":1,"head":{"kind":"head","seq":1,"hash":"0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"}}
            text/csv:
              schema: {type: string, description: 'A header row, then one row per audit entry.'}
        '400':
          description: '`invalid_filter` (a bad `since`/`until`) or `invalid_format`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: invalid_format, message: 'format must be ndjson, csv or kgf'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/audit/policy:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Audit]
      operationId: getAuditPolicy
      summary: Get the audit retention policy and legal hold
      description: |
        A namespace that never set one gets the default: keep forever
        (`retention_days: null`), no legal hold, `revision` 0. Registered only
        when identity is wired.
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.view]
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPolicy'}
              example:
                namespace: default
                retention_days: 400
                legal_hold: false
                legal_hold_reason: ''
                legal_hold_by: ''
                legal_hold_at: null
                revision: 3
                updated_by: security@example.com
                updated_at: '2026-09-20T08:00:00Z'
                last_purge_at: '2026-09-26T09:00:00Z'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    put:
      tags: [Audit]
      operationId: putAuditPolicy
      summary: Set the audit retention period
      description: |
        Optimistic concurrency on `revision` (the value last read; 0 for a
        namespace that never set a policy). `retention_days` null or absent
        keeps rows forever. The purge loop removes rows older than the period
        hourly unless the namespace is under legal hold; each purge records a
        chain checkpoint so exports stay verifiable. A security grant: the
        change and its audit row commit together (503 `audit_unavailable`
        otherwise). Registered only when identity is wired.
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutAuditPolicyRequest'}
            example: {retention_days: 400, revision: 2}
      responses:
        '200':
          description: The saved policy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPolicy'}
        '400':
          description: '`invalid_json` (unknown fields are rejected).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/AuditPolicyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_retention`: `retention_days` must be 1-36500, or null to keep forever.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  /v1/namespaces/{ns}/audit/legal-hold:
    parameters:
      - $ref: '#/components/parameters/ns'
    post:
      tags: [Audit]
      operationId: setAuditLegalHold
      summary: Place or release a legal hold on the audit trail
      description: |
        While a hold is set, nothing is purged, neither by the hourly loop nor
        by `POST .../audit/purge` (409 `legal_hold`). Setting a hold needs a
        `reason` (a matter, ticket or case reference). Optimistic concurrency
        on `revision`. Audited in the same transaction (fail closed).
        Registered only when identity is wired.
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LegalHoldRequest'}
            examples:
              set:
                summary: Place a hold
                value: {hold: true, reason: 'Matter 2026-114: preserve records', revision: 3}
              release:
                summary: Release it
                value: {hold: false, revision: 4}
      responses:
        '200':
          description: The policy after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPolicy'}
              example:
                namespace: default
                retention_days: 400
                legal_hold: true
                legal_hold_reason: 'Matter 2026-114: preserve records'
                legal_hold_by: security@example.com
                legal_hold_at: '2026-09-26T10:15:00Z'
                revision: 4
                updated_by: security@example.com
                updated_at: '2026-09-26T10:15:00Z'
                last_purge_at: '2026-09-26T09:00:00Z'
        '400':
          description: '`invalid_json`: the body must be `{"hold": true|false, "reason": "...", "revision": N}`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/AuditPolicyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`reason_required`: a hold needs a reason.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  /v1/namespaces/{ns}/audit/purge:
    parameters:
      - $ref: '#/components/parameters/ns'
    post:
      tags: [Audit]
      operationId: purgeAudit
      summary: Apply the retention policy now
      description: |
        Removes the rows the retention period has expired (the loop does the
        same hourly) and records a chain checkpoint. With no retention period
        nothing is removed. Refused under legal hold; the refusal is itself
        audited. Takes no body. Registered only when identity is wired.
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.manage]
      responses:
        '200':
          description: Purged.
          content:
            application/json:
              schema:
                type: object
                required: [rows_purged]
                properties:
                  rows_purged: {type: integer, minimum: 0}
              example: {rows_purged: 18231}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`legal_hold`: the namespace is under legal hold; nothing was purged.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: legal_hold, message: the namespace is under legal hold; nothing was purged}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  /v1/namespaces/{ns}/audit/sinks:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Audit]
      operationId: listAuditSinks
      summary: List SIEM sinks
      description: |
        Webhook sinks the gateway streams the chained trail to, with their
        delivery cursor and backoff state. Signing secrets are never returned.
        Registered only when identity is wired.
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.view]
      responses:
        '200':
          description: The sinks.
          content:
            application/json:
              schema:
                type: object
                required: [sinks]
                properties:
                  sinks:
                    type: array
                    items: {$ref: '#/components/schemas/AuditSink'}
              example:
                sinks:
                  - id: 6f5e4d3c-2b1a-4098-8765-43210fedcba9
                    namespace: default
                    name: splunk-hec
                    kind: webhook
                    format: nexus
                    url: https://siem.example.com/nexus/audit
                    enabled: true
                    batch_size: 100
                    cursor_seq: 4211
                    consecutive_failures: 0
                    next_attempt_at: '2026-09-26T10:00:05Z'
                    last_attempt_at: '2026-09-26T10:00:00Z'
                    last_success_at: '2026-09-26T10:00:00Z'
                    last_error: ''
                    created_by: security@example.com
                    created_at: '2026-09-01T12:00:00Z'
                    revision: 1
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Audit]
      operationId: createAuditSink
      summary: Add a SIEM sink (the signing secret is shown once)
      description: |
        Batches of rows are POSTed to `url` as NDJSON (`format: nexus` rows in
        the export's `audit` line shape, or `format: kgf` events) with
        `X-Nexus-Signature: t=<unix>,v1=<hex HMAC-SHA256(secret, "<unix>." + body)>`
        and a stable `X-Nexus-Delivery` id per batch for de-duplication. The
        URL must be https (http only with NEXUS_AUDIT_SINK_ALLOW_HTTP), carry no
        credentials, and not name an internal address. `from_start` replays
        the whole retained chain; otherwise delivery starts at the current
        head. Needs NEXUS_AUDIT_SINK_KEY on the gateway (503 `sinks_disabled`).
        Registered only when identity is wired.
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAuditSinkRequest'}
            example: {name: splunk-hec, url: 'https://siem.example.com/nexus/audit', batch_size: 100, format: nexus, from_start: true}
      responses:
        '201':
          description: Created. Store `signing_secret` now; it is never shown again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditSinkWithSecret'}
              example:
                id: 6f5e4d3c-2b1a-4098-8765-43210fedcba9
                namespace: default
                name: splunk-hec
                kind: webhook
                format: nexus
                url: https://siem.example.com/nexus/audit
                enabled: true
                batch_size: 100
                cursor_seq: 0
                consecutive_failures: 0
                next_attempt_at: '2026-09-26T10:20:00Z'
                last_attempt_at: null
                last_success_at: null
                last_error: ''
                created_by: security@example.com
                created_at: '2026-09-26T10:20:00Z'
                revision: 1
                signing_secret: whsec_c2lnbmluZy1zZWNyZXQtZXhhbXBsZS12YWx1ZQ
                signing_secret_shown_once: true
        '400':
          description: '`invalid_json` (unknown fields are rejected).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`sink_exists`: a sink with this name already exists.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_sink`, with every problem found.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvalidSinkError'}
              example:
                error: invalid_sink
                problems: ['url must be https (plain http is refused unless NEXUS_AUDIT_SINK_ALLOW_HTTP=true)', batch_size must be 1..1000]
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SinkWriteUnavailable'}

  /v1/namespaces/{ns}/audit/sinks/{id}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/sinkId'
    put:
      tags: [Audit]
      operationId: updateAuditSink
      summary: Re-point, enable, disable or resize a sink
      description: |
        Only the fields given change. `revision` must equal the stored one.
        Re-enabling or re-pointing a sink clears its backoff so delivery
        resumes at once. Audited in the same transaction (fail closed).
        Registered only when identity is wired.
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAuditSinkRequest'}
            example: {enabled: false, revision: 1}
      responses:
        '200':
          description: The sink.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditSink'}
        '400':
          description: '`invalid_json` (unknown fields are rejected).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`conflict`: the sink changed since it was read; reload and retry.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_sink`: a refused `url` or a `batch_size` outside 1-1000.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}
    delete:
      tags: [Audit]
      operationId: deleteAuditSink
      summary: Remove a sink
      description: Audited in the same transaction (fail closed). Registered only when identity is wired.
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.manage]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: {const: true}
              example: {deleted: true}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  /v1/namespaces/{ns}/audit/sinks/{id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/sinkId'
    post:
      tags: [Audit]
      operationId: rotateAuditSinkSecret
      summary: Issue a new signing secret for a sink (shown once)
      description: |
        The old secret stops signing immediately: update the receiver first
        (or have it accept both) before rotating. Registered only when
        identity is wired.
      x-nexus-action: admin_write
      x-nexus-permissions: [audit.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: {type: integer, minimum: 1}
            example: {revision: 2}
      responses:
        '200':
          description: The sink with its new `signing_secret`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditSinkWithSecret'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`conflict`: the sink changed since it was read.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SinkWriteUnavailable'}

  # ── service accounts (ADR-0024 §6) ───────────────────────────────────────
  /v1/namespaces/{ns}/service-accounts:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Service accounts]
      operationId: listServiceAccounts
      summary: List service accounts
      description: At most 500, by name. Registered only when identity is wired.
      x-nexus-action: read
      x-nexus-permissions: [service_accounts.view]
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [service_accounts]
                properties:
                  service_accounts:
                    type: array
                    items: {$ref: '#/components/schemas/ServiceAccount'}
              example:
                service_accounts:
                  - id: 7c6b5a49-3827-4165-9f4e-3d2c1b0a9f8e
                    namespace: default
                    name: ci-deployer
                    description: GitHub Actions deploys workflow specs
                    disabled: false
                    disabled_at: null
                    created_at: '2026-09-20T08:30:00Z'
                    revision: 2
                    roles: [Workflow Publisher]
                    live_tokens: 1
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Service accounts]
      operationId: createServiceAccount
      summary: Create a service account
      description: |
        A non-human identity for an agent or CI system, with its own role
        bindings. Its tokens (`POST .../tokens` with `service_account_id`)
        resolve at every request to the account's CURRENT roles intersected
        with the token's permission ceiling. The Administrator role cannot be
        bound, and the caller may only bind roles whose every permission it
        holds itself. A security grant: audited in the same transaction.
        Registered only when identity is wired.
      x-nexus-action: read
      x-nexus-permissions: [service_accounts.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateServiceAccountRequest'}
            example: {name: ci-deployer, description: GitHub Actions deploys workflow specs, roles: [Workflow Publisher]}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccount'}
              example:
                id: 7c6b5a49-3827-4165-9f4e-3d2c1b0a9f8e
                namespace: default
                name: ci-deployer
                description: GitHub Actions deploys workflow specs
                disabled: false
                disabled_at: null
                created_at: '2026-09-26T10:30:00Z'
                revision: 1
                roles: [Workflow Publisher]
                live_tokens: 0
        '400':
          description: '`invalid` (not one JSON object, or an unknown field) or `unknown_role`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`forbidden`, or `invalid_grant`: a bound role holds a permission the caller does not.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: invalid_grant, message: 'Cannot delegate permission: workflows.delete'}
        '409':
          description: '`name_taken`, or `protected_role` (Administrator cannot be bound to a service account).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_service_account`: a bad name or a description over 500 characters.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  /v1/namespaces/{ns}/service-accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/serviceAccountId'
    put:
      tags: [Service accounts]
      operationId: updateServiceAccount
      summary: Edit a service account's description
      description: |
        Only the description is editable; the name is fixed. `description`
        replaces the stored one (absent means empty). `revision` must equal the
        stored revision. Registered only when identity is wired.
      x-nexus-action: read
      x-nexus-permissions: [service_accounts.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateServiceAccountRequest'}
            example: {description: GitHub Actions deploys specs and starts smoke runs, revision: 2}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [id, updated]
                properties:
                  id: {type: string}
                  updated: {const: true}
              example: {id: 7c6b5a49-3827-4165-9f4e-3d2c1b0a9f8e, updated: true}
        '400':
          description: '`invalid`: not one JSON object, an unknown field, or a description over 500 characters.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: |
            `conflict`: the account changed since it was read, OR does not exist
            (this route does not distinguish the two).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/service-accounts/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/serviceAccountId'
    post:
      tags: [Service accounts]
      operationId: disableServiceAccount
      summary: Disable a service account (its tokens stop working at once)
      description: |
        Every token of the account fails authentication from its next request;
        the token rows are untouched, so enabling the account restores them.
        Revoke tokens to end them for good. A revocation: never blocked by the
        audit store. The caller may only disable an account no more powerful
        than itself. Registered only when identity is wired.
      x-nexus-action: read
      x-nexus-permissions: [service_accounts.manage]
      responses:
        '200':
          description: Disabled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccountState'}
              example: {id: 7c6b5a49-3827-4165-9f4e-3d2c1b0a9f8e, disabled: true}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/TargetAboveActor'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/service-accounts/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/serviceAccountId'
    post:
      tags: [Service accounts]
      operationId: enableServiceAccount
      summary: Re-enable a service account (restores its live tokens)
      description: |
        A security grant: the change and its audit row commit together (503
        `audit_unavailable` otherwise). The caller may only enable an account
        no more powerful than itself. Registered only when identity is wired.
      x-nexus-action: read
      x-nexus-permissions: [service_accounts.manage]
      responses:
        '200':
          description: Enabled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccountState'}
              example: {id: 7c6b5a49-3827-4165-9f4e-3d2c1b0a9f8e, disabled: false}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/TargetAboveActor'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  /v1/namespaces/{ns}/service-accounts/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/serviceAccountId'
    get:
      tags: [Service accounts]
      operationId: getServiceAccountRoles
      summary: Get a service account's role bindings
      description: Registered only when identity is wired.
      x-nexus-action: read
      x-nexus-permissions: [service_accounts.view]
      responses:
        '200':
          description: The bindings and the revision to send back when changing them.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccountRoles'}
              example: {roles: [Workflow Publisher], revision: 1}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    put:
      tags: [Service accounts]
      operationId: putServiceAccountRoles
      summary: Replace a service account's role bindings
      description: |
        Takes effect on the account's tokens at their next request. The caller
        must hold every permission the account holds now (`target_above_actor`
        otherwise) and every permission of each new role (`invalid_grant`);
        Administrator cannot be bound. `revision` must equal the stored one.
        A security grant: audited in the same transaction. Registered only when
        identity is wired.
      x-nexus-action: read
      x-nexus-permissions: [service_accounts.manage, roles.view]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutServiceAccountRolesRequest'}
            example: {roles: [Workflow Publisher, Workflow Operator], revision: 1}
      responses:
        '200':
          description: The new bindings.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: [array, 'null']
                    items: {type: string}
              example: {roles: [Workflow Publisher, Workflow Operator]}
        '400':
          description: '`invalid` (not one JSON object, an unknown field, or more than 20 roles) or `unknown_role`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`forbidden`, `target_above_actor` or `invalid_grant`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: target_above_actor, message: 'This service account holds workflows.delete, which you do not have'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`conflict` (the bindings changed since they were read) or `protected_role`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  # ── notifications (ADR-0028) ─────────────────────────────────────────────
  /v1/namespaces/{ns}/notification-channels:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Notifications]
      operationId: listNotificationChannels
      summary: List notification channels
      description: Every channel, by name, with the supported channel kinds. Secrets are never returned, only whether one is configured.
      x-nexus-action: read
      x-nexus-permissions: [notifications.view]
      responses:
        '200':
          description: The channels.
          content:
            application/json:
              schema:
                type: object
                required: [channels, kinds]
                properties:
                  channels:
                    type: array
                    items: {$ref: '#/components/schemas/NotificationChannel'}
                  kinds:
                    type: array
                    items: {$ref: '#/components/schemas/ChannelKind'}
              example:
                channels:
                  - id: 3d2c1b0a-9f8e-4d7c-b6a5-948372615049
                    namespace: default
                    name: oncall-pagerduty
                    kind: pagerduty
                    config: {severity: critical}
                    secret: {configured: true, source: sealed, hint: '…a91c'}
                    rate_limit_per_minute: 30
                    enabled: true
                    created_by: ops@example.com
                    created_at: '2026-09-25T08:00:00Z'
                    updated_at: '2026-09-25T08:00:00Z'
                    revision: 1
                kinds: [slack_webhook, slack_bot, teams, pagerduty, webhook, email]
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/EventsNotConfigured'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Notifications]
      operationId: createNotificationChannel
      summary: Create a notification channel
      description: |
        A destination for notifications. What `config` and the secret hold
        depends on `kind`:

        | kind | secret | config |
        | --- | --- | --- |
        | `slack_webhook` | required: the incoming-webhook URL | none |
        | `slack_bot` | required: the bot token (`xoxb-...`) | `channel` (required) |
        | `teams` | required: the Workflows webhook URL | none |
        | `pagerduty` | required: the Events API v2 routing key | `severity` (optional) |
        | `webhook` | optional: the HMAC signing key, GENERATED when omitted | `url` (required) |
        | `email` | none | `to`: 1-20 addresses |

        A secret is given inline as `secret` (sealed with NEXUS_SECRET_KEY;
        503 `secret_key_unconfigured` without it) or as a `secret_ref` to an
        external secret store, never both, and never inside `config`. It cannot
        be read back. A generated webhook signing key is returned ONCE as
        `signing_secret`; receivers verify `X-Nexus-Signature` with it. Webhook
        URLs must be https and public unless the gateway allows private
        targets. Unknown fields are rejected.
      x-nexus-action: admin_write
      x-nexus-permissions: [notifications.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateNotificationChannelRequest'}
            examples:
              pagerduty:
                summary: PagerDuty with an inline routing key
                value: {name: oncall-pagerduty, kind: pagerduty, config: {severity: critical}, secret: R0UT1NGK3YEXAMPLEa91c}
              webhook:
                summary: A signed webhook (the key is generated)
                value: {name: ops-webhook, kind: webhook, config: {url: 'https://hooks.example.com/nexus'}, rate_limit_per_minute: 60}
              slackRef:
                summary: Slack, secret held in an external store
                value: {name: data-eng-slack, kind: slack_webhook, secret_ref: 'vault:kv/data/nexus/slack#webhook_url'}
      responses:
        '201':
          description: Created. `signing_secret` is present only for a webhook channel whose key was generated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannelCreated'}
              example:
                id: 8e7d6c5b-4a39-4827-9615-0f1e2d3c4b5a
                namespace: default
                name: ops-webhook
                kind: webhook
                config: {url: 'https://hooks.example.com/nexus'}
                secret: {configured: true, source: sealed, hint: '…3f0a'}
                rate_limit_per_minute: 60
                enabled: true
                created_by: ops@example.com
                created_at: '2026-09-26T10:40:00Z'
                updated_at: '2026-09-26T10:40:00Z'
                revision: 1
                signing_secret: 4f1c2e8a9b7d6c5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c3f0a
        '400': {$ref: '#/components/responses/ConfigBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
