            application/json:
              schema: {$ref: '#/components/schemas/ProblemsError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500':
          description: '`internal`, or `partial_reset`: the password changed but sessions could not be revoked.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}/sessions:
    parameters:
