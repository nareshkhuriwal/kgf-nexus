                upstreams:
                  - {name: workflow-manager, addr: 'workflow-manager:9090', state: READY, configured: true}
                  - {name: scheduler, addr: 'scheduler:9090', state: TRANSIENT_FAILURE, configured: true}
                  - {name: resource-manager, addr: '', state: IDLE, configured: false}
                measures: gRPC connectivity from this gateway, read without a network round trip; not each service's own /readyz
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
