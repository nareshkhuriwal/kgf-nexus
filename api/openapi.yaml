  # ── operations ───────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/cache/invalidations:
    parameters:
      - $ref: '#/components/parameters/ns'
    post:
      tags: [Operations]
      operationId: invalidateCache
      summary: Invalidate memoized task results
      description: Only ever causes work to run again, so it is `write`, not admin.
      x-nexus-action: write
      x-nexus-permissions: [workflows.cache.invalidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CacheInvalidationRequest'}
