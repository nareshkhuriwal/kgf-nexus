          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── auth ─────────────────────────────────────────────────────────────────
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange an email and password for a session token
      description: |
        Unauthenticated. Every failure is one opaque 401. The token is returned
        exactly once. With email flows wired and verification required, an
        unverified account gets 403 `email_not_verified` (only after the password
        checked out). Failures spend the address's auth-failure budget.
      x-nexus-conditional: identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {namespace: default, email: ops@example.com, password: correct horse battery staple}
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
              example:
                token: nxsess_Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5MGFiY2RlZg
                expires_at: '2026-09-25T09:12:03Z'
                user:
                  id: 1d2c3b4a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  email: ops@example.com
                  display_name: Ops Team
                  namespace: default
                  role: admin
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: '`unauthenticated`: invalid email or password (deliberately not which).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: unauthenticated, message: invalid email or password}
        '403':
          description: '`email_not_verified`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: '`unavailable` (the identity backend failed) or `audit_unavailable` (the session is issued only together with its audit row).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Self-service registration of a new tenant and its administrator
      description: |
        Unauthenticated. Creates a tenant whose namespace is a new UUID and its
        first administrator. Sign in afterwards with that namespace (the "tenant
        ID"). When email flows are wired, `email_verification` reports whether a
        verification email was queued.
      x-nexus-conditional: identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
            example: {name: Acme Analytics, email: founder@acme.example, password: a long and unguessable passphrase}
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantCreated'}
              example:
                tenant:
                  id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d
                  namespace: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d
                  name: Acme Analytics
                  contact_email: founder@acme.example
                  created_at: '2026-09-24T09:40:00Z'
                administrator_id: 0f9e8d7c-6b5a-4493-8271-605f4e3d2c1b
                email_verification: {required: true, delivery: queued}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`registration_conflict`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_customer`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/auth/email/verification:
    post:
      tags: [Auth]
      operationId: requestVerificationEmail
      summary: Send a new email-verification link
      description: |
        Unauthenticated and NOT an account oracle: the same 202 is returned
        whether or not the address has an account needing verification.
      x-nexus-conditional: email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailLinkRequest'}
            example: {email: founder@acme.example, namespace: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d}
      responses:
        '202': {$ref: '#/components/responses/EmailLinkAccepted'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_email` or `invalid_namespace`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/EmailUnavailable'}

  /v1/auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Consume an email-verification link token
      x-nexus-conditional: email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkToken'}
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                required: [verified, email]
                properties:
                  verified: {const: true}
                  email: {type: string, format: email}
              example: {verified: true, email: founder@acme.example}
        '400':
          description: '`invalid_json` or `invalid_token` (invalid, expired or used).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: '`unavailable`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Send a password-reset link
      description: Unauthenticated and not an account oracle, like the verification request.
      x-nexus-conditional: email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailLinkRequest'}
      responses:
        '202': {$ref: '#/components/responses/EmailLinkAccepted'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_email` or `invalid_namespace`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/EmailUnavailable'}

  /v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset-link token
      description: Signs out every existing session of the account.
      x-nexus-conditional: email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetWithLink'}
      responses:
        '200':
          description: Reset.
          content:
            application/json:
              schema:
                type: object
                required: [password_reset, sessions_revoked]
                properties:
                  password_reset: {const: true}
                  sessions_revoked: {type: integer, minimum: 0}
        '400':
          description: '`invalid_json` or `invalid_token`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_password` (12-1024 characters).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: '`unavailable`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the caller's own session
      x-nexus-conditional: identity
      x-nexus-action: read
      x-nexus-permissions: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                required: [logged_out]
                properties:
                  logged_out: {const: true}
        '400':
          description: '`not_a_session`: the credential is an API key or token.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/auth/whoami:
    get:
      tags: [Auth]
      operationId: whoami
      summary: Describe the calling principal
      description: |
        The same shape for every credential kind; `effective_permissions` is
        what the UI should render from. A service-account token adds
        `service_account_id`; a principal authenticated by a KGF context adds
        `kgf` (who KGF says it is, and the readable scope its `kgf-<hash>`
        namespace was mapped from) and gets `X-Request-ID` back.
      x-nexus-conditional: identity
      x-nexus-action: read
      x-nexus-permissions: []
      responses:
        '200':
          description: The principal.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Whoami'}
              examples:
                session:
                  summary: A console session
                  value:
                    namespace: default
                    name: ops@example.com
                    role: reader
                    kind: session
                    permissions: {read: true, write: true, admin_write: false}
                    effective_permissions: [overview.view, runs.cancel, runs.create, runs.view, workflows.view]
                    roles: [Workflow Operator]
                    user_id: 1d2c3b4a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                kgf:
                  summary: A KGF Cloud context
                  value:
                    namespace: kgf-3f1c9a7e2b4d6f8a0c1e3b5d7f9a1c3e
                    name: alice@contoso.example
                    role: reader
                    kind: kgf
                    permissions: {read: true, write: true, admin_write: false}
                    effective_permissions: [runs.create, runs.view, workflows.publish, workflows.view]
                    roles: [KGF operator]
                    kgf:
                      organization: contoso
                      subscription: analytics-prod
                      resource_group: pipelines
                      principal: alice@contoso.example
                      role: operator
                      request_id: req-7f3a9c2e
                      issuer: kgf-gateway
                      token_id: 01J8Z4QK3M6T9W2X5Y7B0C4D8E
        '400':
          description: '`ambiguous_credentials` or `kgf_context_not_accepted` (see Authentication).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: ambiguous_credentials, message: 'send either an X-KGF-Context or an Authorization credential, not both'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`forbidden`, `kgf_scope_required` or `kgf_service_not_allowed`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: kgf_scope_required, message: 'the KGF context names no subscription and resource group; Nexus work lives in a resource group'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── tenants ──────────────────────────────────────────────────────────────
  /v1/account/tenant:
    get:
      tags: [Tenants]
      operationId: getAccountTenant
      summary: The caller's tenant, and whether the caller is a platform operator
      x-nexus-conditional: identity
      x-nexus-action: read
      x-nexus-permissions: []
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                type: object
                required: [tenant, platform_operator]
                properties:
                  tenant: {$ref: '#/components/schemas/Tenant'}
                  platform_operator: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500':
          description: '`internal`. A namespace with no tenant row (for example a seeded dev namespace) currently lands here too.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/platform/tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: List tenants (platform operators)
      description: Requires a platform-operator session. At most 500, newest first.
      x-nexus-conditional: identity
      x-nexus-action: read
      x-nexus-permissions: []
      responses:
        '200':
          description: The tenants.
          content:
            application/json:
              schema:
                type: object
                required: [tenants, limit]
                properties:
                  tenants:
                    type: array
                    items: {$ref: '#/components/schemas/Tenant'}
                  limit: {const: 500}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PlatformOperatorRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Onboard a tenant (platform operators)
      description: Requires a platform-operator session. Same body and result as self-service registration.
      x-nexus-conditional: identity
      x-nexus-action: read
      x-nexus-permissions: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Onboarded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantCreated'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PlatformOperatorRequired'}
        '409':
          description: '`registration_conflict`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_customer`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  # ── users ────────────────────────────────────────────────────────────────
  /v1/namespaces/{ns}/users:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (keyset-paginated, searchable)
      description: |
        Newest accounts first. Pass `next_cursor` back as `cursor` for the next
        page; it is null on the last page. `q` matches a case-insensitive
        substring of the email or display name on the server (at most 200
        characters are used), so a search spans every page.
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.view]
      parameters:
        - name: limit
          in: query
          description: Rows per page; 0 or absent means 100, larger values are capped at 200.
          schema: {type: integer, minimum: 0, maximum: 200, default: 100}
        - $ref: '#/components/parameters/cursor'
        - name: q
          in: query
          description: Search the email and display name.
          schema: {type: string}
          example: analyst
      responses:
        '200':
          description: One page of users.
          content:
            application/json:
              schema:
                type: object
                required: [users, next_cursor]
                properties:
                  users:
                    type: array
                    items: {$ref: '#/components/schemas/User'}
                  next_cursor:
                    type: [string, 'null']
                    description: Pass as `cursor` for the next page; null on the last page.
              example:
                users:
                  - id: 1d2c3b4a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    namespace: default
                    email: analyst@example.com
                    display_name: Data Analyst
                    role: reader
                    created_at: '2026-09-20T08:00:00Z'
                    disabled_at: null
                    disabled: false
                    email_verified: true
                next_cursor: MjAyNi0wOS0yMFQwODowMDowMFp8MWQyYzNiNGEtNWU2Zi00YTdiLThjOWQtMGUxZjJhM2I0YzVk
        '400':
          description: '`invalid_cursor`: the cursor was not issued by this server; restart from the first page.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: invalid_cursor, message: cursor is not one this server issued; restart from the first page}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      description: |
        With `role_name` (an RBAC role) the caller also needs `roles.manage` and
        may only assign permissions it holds; `role` is then derived.
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
            example: {email: analyst@example.com, display_name: Data Analyst, role_name: Viewer, password: a long and unguessable passphrase}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`email_taken`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_user` (with `problems`) or `unknown_role`.'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemsError'
                  - $ref: '#/components/schemas/Error'
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    put:
      tags: [Users]
      operationId: updateUser
      summary: Edit a user's email and display name
      description: |
        Compare-and-set: `previous_email` and `previous_display_name` must equal
        the stored values or the edit is refused with 409. Unknown fields are
        rejected. Roles and account state have their own routes.
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
            example: {email: analyst@example.com, display_name: Senior Analyst, previous_email: analyst@example.com, previous_display_name: Data Analyst}
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          description: '`invalid` or `invalid_user`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`conflict` (edited meanwhile) or `email_taken`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    post:
      tags: [Users]
      operationId: disableUser
      summary: Disable a user and revoke their sessions
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`cannot_disable_self` or `last_administrator`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    post:
      tags: [Users]
      operationId: enableUser
      summary: Re-enable a user
      description: A security grant, audited in the same transaction (503 `audit_unavailable` otherwise). Disabling is a revocation and is never blocked by the audit store.
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/AuditOrAuthUnavailable'}

  /v1/namespaces/{ns}/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ns'
      - $ref: '#/components/parameters/userId'
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Set a user's password and end all their sessions
      x-nexus-conditional: identity
      x-nexus-action: admin_write
      x-nexus-permissions: [users.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, minLength: 12}
      responses:
        '200':
          description: Set; reports how many sessions were revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionsRevoked'}
        '400':
          description: '`invalid_json`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: '`invalid_password` (with `problems`).'
