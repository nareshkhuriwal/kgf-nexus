  /v1/namespaces/{ns}/attention:
    parameters:
      - $ref: '#/components/parameters/ns'
    get:
      tags: [Operations]
      operationId: getAttention
      summary: The ranked "needs attention" triage list
      description: |
        Windows are Go durations (`5m`, `2h`); an unparseable or non-positive
        value falls back to the default rather than failing.
      x-nexus-action: read
      x-nexus-permissions: [overview.view, runs.view, workers.view]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 0}
        - name: blocked_for
          in: query
          description: How long an attempt must be unplaceable to be listed.
          schema: {type: string}
          example: 5m
        - name: failed_within
          in: query
          description: How recent a failed run must be to be listed.
          schema: {type: string}
          example: 24h
        - name: stalled_for
          in: query
          description: How long a run must be stalled to be listed.
          schema: {type: string}
          example: 30m
      responses:
