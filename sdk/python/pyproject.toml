[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-sdk"
version = "0.1.0"
description = "Python SDK for the Nexus workflow orchestration platform -- a compiler for WorkflowSpec, not a scheduler hook."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Khuriwal Group"}]
keywords = ["workflow", "orchestration", "dag", "scheduler"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

# No runtime dependencies, deliberately. The SDK is installed into every task
# image; each dependency is a version conflict waiting to happen with the user's
# own requirements. The HTTP client is built on urllib from the stdlib.
dependencies = []

[project.optional-dependencies]
# YAML is needed only to RENDER a compiled spec, never to compile one.
yaml = ["PyYAML>=6.0"]
# Tracing (nexus.tracing): with these installed a handler runs inside a child
# span of the platform's trace (TRACEPARENT from the worker agent). Optional:
# without them the trace context is still exposed on TaskContext. The SDK
# never configures an exporter -- that is the user's TracerProvider's job.
opentelemetry = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]
# Test tooling. Lower bounds, not pins: the SDK is a library, and CI runs the
# suite across 3.11-3.13, so the floor is what is promised to work. pytest-cov
# produces the Cobertura XML CI publishes.
# The OpenTelemetry pair is here so the tracing tests run instead of skipping;
# tests that need its ABSENCE hide it rather than relying on it being missing.
dev = [
  "pytest>=8.3", "pytest-cov>=6.0", "PyYAML>=6.0", "mypy>=1.13", "types-PyYAML>=6.0",
  "opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27",
]

[project.urls]
Homepage = "https://github.com/khuriwalgroup/kgf-nexus"

[tool.setuptools.packages.find]
include = ["nexus*"]

# PEP 561: ship the marker so type checkers use the SDK's inline annotations.
[tool.setuptools.package-data]
nexus = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# A floor, not a target: the suite measured 91% line coverage when CI started
# running it, so a drop below 85% is a regression worth failing on. Applies only
# when pytest runs with --cov (make sdk-test and CI do).
[tool.coverage.report]
fail_under = 85

# `make sdk-typecheck` runs this over the package AND the typed usage example,
# which pins that a task's return type flows through tracing (assert_type).
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["nexus", "typecheck"]
