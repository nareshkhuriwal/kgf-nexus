# buf configuration for the Nexus wire contract (proto/nexus/v1).
#
#   make proto-lint       buf lint
#   make proto-breaking   buf breaking against the previous main (BUF_AGAINST)
#
# buf is the version pinned in deploy/scripts/pinned-tool.sh, checksum
# verified. Code generation still goes through `make proto` (protoc); buf is
# used only to check, so adopting it changes no generated byte.
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  # The existing API predates buf and deliberately shares a few messages
  # between RPCs; renaming them would be a wire-compatible but source-breaking
  # change to every generated client for no behavioural gain. Exceptions are
  # configured here, per rule, rather than reformatting the protos:
  #
  #  RPC_REQUEST_RESPONSE_UNIQUE, RPC_RESPONSE_STANDARD_NAME
  #    `Ack` is the shared reply of the worker report RPCs (ReportStarted,
  #    ReportResult, ReportProgress, ReportLogs), `RunActionResponse` of the
  #    run actions (Cancel/Pause/Resume/Retry), and ReleaseReservation answers
  #    `ReleaseResponse`. New RPCs should still use <Rpc>Request/<Rpc>Response;
  #    the exceptions are scoped to the two files that hold these services.
  ignore_only:
    RPC_REQUEST_RESPONSE_UNIQUE:
      - nexus/v1/services.proto
      - nexus/v1/worker.proto
    RPC_RESPONSE_STANDARD_NAME:
      - nexus/v1/services.proto
      - nexus/v1/worker.proto
breaking:
  # FILE: the strictest category. Generated Go code is per file, so moving a
  # type between files breaks importers even when the wire is unchanged.
  use:
    - FILE
