# A workflow built to create dispatch contention.
#
# Phase 1 exit criterion 3 is "two schedulers never double-dispatch under load".
# Proving that needs load of a specific shape: many attempts becoming eligible
# at the SAME INSTANT, competing for capacity that is deliberately scarcer than
# demand. A deep chain would serialise and never contend; a wide fan-out of
# short tasks puts every replica on the same rows simultaneously.
#
# The tasks do almost nothing (a sub-second echo) on purpose. Long tasks would
# spend the run idle-waiting rather than dispatching, and dispatch is the thing
# under test. Short tasks also RECYCLE capacity fast, which keeps the claim path
# hot for the whole run instead of saturating once and going quiet -- the
# limitation of the in-process test this one exists to close.
api_version: nexus.dev/v1
name: dispatch-storm
namespace: default
description: A wide fan-out that makes scheduler replicas race for the same attempts.
# High, because the harness runs several of these CONCURRENTLY to sustain
# pressure. The cap exists to protect a namespace, not this test.
max_active_runs: 64
run_timeout_ms: 600000
params: {}
labels: {}

edges:
- from_node_id: fan_out
  output_to_input:
