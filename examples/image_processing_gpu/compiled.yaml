  runtime:
    args:
    - "place=\"\\\"worker\\\":\\\"$HOSTNAME\\\",\\\"devices\\\":\\\"${CUDA_VISIBLE_DEVICES:-}\\\
      \"\"; awk -v place=\"$place\" -v minarea=60 -v dets=\"$NEXUS_OUTPUT_DIR/detections\"\
      \ '\nfunction emit(Q, meta,   x, y, line) {\n  print \"P2\"; print \"# \" meta;\
      \ print W, HH; print 255\n  for (y = 0; y < HH; y++) { line = \"\"; for (x =\
      \ 0; x < W; x++) line = line (x ? \" \" : \"\") int(Q[x, y] + 0.5); print line\
      \ }\n}\nfunction clamp(v) { return v < 0 ? 0 : (v > 255 ? 255 : v) }\n\nfunction\
      \ process(   x, y, gx, gy, m, i, h, tot, sumall, wb, sb, best, t, mb, mf, bw,\
      \ thr, ne, comps, sp, cx, cy, area, id, truth) {\n  # Sobel gradient magnitude\
      \ -> the edge map.\n  ne = 0\n  for (y = 0; y < HH; y++) for (x = 0; x < W;\
      \ x++) {\n    if (x == 0 || y == 0 || x == W - 1 || y == HH - 1) { E[x, y] =\
      \ 0; continue }\n    gx = P[x + 1, y - 1] + 2 * P[x + 1, y] + P[x + 1, y + 1]\
      \ - P[x - 1, y - 1] - 2 * P[x - 1, y] - P[x - 1, y + 1]\n    gy = P[x - 1, y\
      \ + 1] + 2 * P[x, y + 1] + P[x + 1, y + 1] - P[x - 1, y - 1] - 2 * P[x, y -\
      \ 1] - P[x + 1, y - 1]\n    m = sqrt(gx * gx + gy * gy) / 4; E[x, y] = clamp(m);\
      \ if (m > 60) ne++ }\n  emit(E, META \" edges=sobel\")\n  # Otsu: the intensity\
      \ threshold that best separates two classes.\n  for (i = 0; i < 256; i++) h[i]\
      \ = 0\n  for (y = 0; y < HH; y++) for (x = 0; x < W; x++) h[int(P[x, y])]++\n\
      \  tot = W * HH; sumall = 0; for (i = 0; i < 256; i++) sumall += i * h[i]\n\
      \  wb = 0; sb = 0; best = -1; thr = 128\n  for (t = 0; t < 256; t++) { wb +=\
      \ h[t]; if (wb == 0) continue; if (wb == tot) break\n    sb += t * h[t]; mb\
      \ = sb / wb; mf = (sumall - sb) / (tot - wb); bw = wb * (tot - wb) * (mb - mf)\
      \ * (mb - mf)\n    if (bw > best) { best = bw; thr = t } }\n  # Connected components\
      \ (4-neighbour) over the bright class, via an explicit stack.\n  for (y = 0;\
      \ y < HH; y++) for (x = 0; x < W; x++) L[x, y] = 0\n  comps = 0\n  for (y =\
      \ 0; y < HH; y++) for (x = 0; x < W; x++) {\n    if (P[x, y] <= thr || L[x,\
      \ y]) continue\n    id++; area = 0; sp = 1; SX[1] = x; SY[1] = y; L[x, y] =\
      \ id\n    while (sp > 0) { cx = SX[sp]; cy = SY[sp]; sp--; area++\n      if\
      \ (cx > 0 && !L[cx - 1, cy] && P[cx - 1, cy] > thr) { L[cx - 1, cy] = id; sp++;\
      \ SX[sp] = cx - 1; SY[sp] = cy }\n      if (cx < W - 1 && !L[cx + 1, cy] &&\
      \ P[cx + 1, cy] > thr) { L[cx + 1, cy] = id; sp++; SX[sp] = cx + 1; SY[sp] =\
      \ cy }\n      if (cy > 0 && !L[cx, cy - 1] && P[cx, cy - 1] > thr) { L[cx, cy\
      \ - 1] = id; sp++; SX[sp] = cx; SY[sp] = cy - 1 }\n      if (cy < HH - 1 &&\
      \ !L[cx, cy + 1] && P[cx, cy + 1] > thr) { L[cx, cy + 1] = id; sp++; SX[sp]\
      \ = cx; SY[sp] = cy + 1 } }\n    if (area >= minarea) comps++ }\n  truth = META;\
      \ sub(/.*objects=/, \"\", truth); sub(/ .*/, \"\", truth)\n  tag = META; sub(/^id=/,\
      \ \"\", tag); sub(/ .*/, \"\", tag)\n  DT = DT sprintf(\"%s{\\\"image\\\":\\\
      \"%s\\\",\\\"true_objects\\\":%d,\\\"detected\\\":%d,\\\"otsu_threshold\\\"\
      :%d,\\\"edge_density\\\":%.4f}\", (NIMG > 1 ? \",\" : \"\"), tag, truth, comps,\
      \ thr, ne / tot)\n}\n\n$1 == \"P2\" { st = 1; META = \"\"; next }\nst == 1 &&\
      \ /^#/ { META = substr($0, 3); next }\nst == 1 { W = $1; HH = $2; st = 2; next\
      \ }\nst == 2 { st = 3; y = 0; next }\nst == 3 { for (x = 1; x <= NF; x++) P[x\
      \ - 1, y] = $x + 0; y++; if (y == HH) { NIMG++; process(); st = 0 } }\n\nEND\
      \ { printf \"{\\\"stage\\\":\\\"detect\\\",\\\"images\\\":%d,%s,\\\"per_image\\\
      \":[%s]}\", NIMG, place, DT > dets }' \"$NEXUS_INPUT_DIR/enhanced\" > \"$NEXUS_OUTPUT_DIR/edges\""
    command:
    - sh
    - -c
    executor: subprocess
