name: image-processing-gpu
namespace: default
params:
  denoise_passes:
    default_json: '2'
    type: int
  images:
    default_json: '4'
    type: int
  min_accuracy:
    default_json: '0.9'
    type: float
  seed:
    default_json: '5'
    type: int
  size:
    default_json: '384'
    type: int
run_timeout_ms: 10800000
tasks:
- id: acquire_00
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  input_literals:
    shard: '0'
  input_params:
    images: images
    seed: seed
    size: size
  inputs:
    images:
      required: true
      type: json
    seed:
      required: true
      type: json
    shard:
      required: true
      type: json
    size:
      required: true
      type: json
  outputs:
    raw:
      required: true
      type: string
  queue: default
  resources:
    request:
      cpu_millis: 250
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "v() { tr -d '\"\\n ' < \"$NEXUS_INPUT_DIR/$1\"; }; awk -v shard=\"$(v shard)\"\
      \ -v images=\"$(v images)\" -v size=\"$(v size)\" -v seed=\"$(v seed)\" '\n\
      function emit(Q, meta,   x, y, line) {\n  print \"P2\"; print \"# \" meta; print\
      \ W, HH; print 255\n  for (y = 0; y < HH; y++) { line = \"\"; for (x = 0; x\
      \ < W; x++) line = line (x ? \" \" : \"\") int(Q[x, y] + 0.5); print line }\n\
      }\nfunction clamp(v) { return v < 0 ? 0 : (v > 255 ? 255 : v) }\n\nBEGIN { srand(seed\
      \ * 1000 + shard * 17); W = size; HH = size\n  for (im = 1; im <= images; im++)\
      \ {\n    nobj = 3 + int(rand() * 7); placed = 0; tries = 0\n    while (placed\
      \ < nobj && tries < 500) { tries++\n      r = int(size * (0.035 + rand() * 0.055));\
      \ cx = r + 4 + int(rand() * (size - 2 * r - 8)); cy = r + 4 + int(rand() * (size\
      \ - 2 * r - 8))\n      ok = 1; for (k = 1; k <= placed; k++) { dx = cx - OX[k];\
      \ dy = cy - OY[k]; if (sqrt(dx * dx + dy * dy) < r + OR[k] + 10) { ok = 0; break\
      \ } }\n      if (ok) { placed++; OX[placed] = cx; OY[placed] = cy; OR[placed]\
      \ = r; OS[placed] = (rand() < 0.5); OI[placed] = 200 + int(rand() * 40) } }\n\
      \    for (y = 0; y < HH; y++) for (x = 0; x < W; x++) {\n      v = 40 + 70 *\
      \ x / W + 20 * y / HH\n      for (k = 1; k <= placed; k++) { dx = x - OX[k];\
      \ dy = y - OY[k]\n        if (OS[k] ? (dx * dx + dy * dy <= OR[k] * OR[k]) :\
      \ (dx >= -OR[k] && dx <= OR[k] && dy >= -OR[k] * 0.7 && dy <= OR[k] * 0.7))\
      \ { v = OI[k]; break } }\n      Q[x, y] = clamp(v + (rand() - 0.5) * 60) }\n\
      \    emit(Q, sprintf(\"id=s%02d-i%02d objects=%d\", shard, im, placed)) } }'\
      \  > \"$NEXUS_OUTPUT_DIR/raw\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: img.acquire
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 900000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
