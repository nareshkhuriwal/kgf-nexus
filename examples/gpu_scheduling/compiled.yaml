api_version: nexus.dev/v1
description: Eight GPU jobs contend for 2x A100 + 1x A10; an audit fails the run on
  any oversubscription.
edges:
- from_node_id: distributed_0
  output_to_input:
    distributed_0: placement
  to_node_id: audit
- from_node_id: finetune_0
  output_to_input:
    finetune_0: placement
  to_node_id: audit
- from_node_id: finetune_1
  output_to_input:
    finetune_1: placement
  to_node_id: audit
- from_node_id: finetune_2
  output_to_input:
    finetune_2: placement
  to_node_id: audit
- from_node_id: finetune_3
  output_to_input:
    finetune_3: placement
  to_node_id: audit
- from_node_id: inference_0
  output_to_input:
    inference_0: placement
  to_node_id: audit
- from_node_id: inference_1
  output_to_input:
    inference_1: placement
  to_node_id: audit
- from_node_id: inference_2
  output_to_input:
    inference_2: placement
  to_node_id: audit
- from_node_id: prepare
  output_to_input:
    features: features
  to_node_id: distributed_0
- from_node_id: prepare
  output_to_input:
    features: features
  to_node_id: finetune_0
- from_node_id: prepare
  output_to_input:
    features: features
  to_node_id: finetune_1
- from_node_id: prepare
  output_to_input:
    features: features
  to_node_id: finetune_2
- from_node_id: prepare
  output_to_input:
    features: features
  to_node_id: finetune_3
- from_node_id: prepare
  output_to_input:
    features: features
  to_node_id: inference_0
- from_node_id: prepare
  output_to_input:
    features: features
  to_node_id: inference_1
- from_node_id: prepare
  output_to_input:
    features: features
  to_node_id: inference_2
name: gpu-scheduling
namespace: default
params:
  hold_seconds:
    default_json: '15'
    type: int
run_timeout_ms: 3600000
tasks:
- id: audit
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    distributed_0:
      required: true
      type: json
    finetune_0:
      required: true
      type: json
    finetune_1:
      required: true
      type: json
    finetune_2:
      required: true
      type: json
    finetune_3:
      required: true
      type: json
    inference_0:
      required: true
      type: json
    inference_1:
      required: true
      type: json
    inference_2:
      required: true
      type: json
  outputs:
    audit:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 100
      memory_bytes: 67108864
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "cd \"$NEXUS_INPUT_DIR\" && cat * | sed 's/}{/}\\n{/g' | awk -v cap=\"agent-gpu-a10:nvidia-a10:1\
      \ agent-gpu-:nvidia-a100:2\" '\nfunction get(s, k,   m) {\n  if (match(s, \"\
      \\\"\" k \"\\\":\\\"[^\\\"]*\\\"\")) { m = substr(s, RSTART, RLENGTH); sub(/^\"\
      [^\"]+\":\"/, \"\", m); sub(/\"$/, \"\", m); return m }\n  if (match(s, \"\\\
      \"\" k \"\\\":[^,}]*\")) { m = substr(s, RSTART, RLENGTH); sub(/^\"[^\"]+\"\
      :/, \"\", m); return m }\n  return \"\" }\nBEGIN { n = split(cap, c, \" \");\
      \ for (i = 1; i <= n; i++) { split(c[i], p, \":\"); hostpat[i] = p[1]; hostkind[i]\
      \ = p[2]; hostcap[i] = p[3] } }\nfunction which(h,   i) { for (i = 1; i <= n;\
      \ i++) if (index(h, hostpat[i])) return i; return 0 }\n{\n  j++; node[j] = get($0,\
      \ \"node\"); kind[j] = get($0, \"kind\"); req[j] = get($0, \"requested\");\n\
      \  got[j] = get($0, \"assigned\"); host[j] = get($0, \"host\"); s[j] = get($0,\
      \ \"start\"); e[j] = get($0, \"end\");\n  mode = get($0, \"gpu\"); dev[j] =\
      \ get($0, \"devices\");\n  i = which(host[j]); okhost = (i && hostkind[i] ==\
      \ kind[j]);\n  if (!okhost) { bad++; why = why sprintf(\"%s ran on %s which\
      \ has no %s; \", node[j], host[j], kind[j]) }\n  if (got[j] != req[j]) { bad++;\
      \ why = why sprintf(\"%s asked for %s GPUs, was given %s; \", node[j], req[j],\
      \ got[j]) }\n}\nEND {\n  for (a = 1; a <= j; a++) {\n    used = 0; for (b =\
      \ 1; b <= j; b++) if (host[b] == host[a] && s[b] <= s[a] && e[b] > s[a]) used\
      \ += req[b];\n    if (used > peak[host[a]]) peak[host[a]] = used;\n  }\n  for\
      \ (a = 1; a <= j; a++) for (b = a + 1; b <= j; b++)\n    if (host[a] == host[b]\
      \ && s[a] < e[b] && s[b] < e[a]) {\n      na = split(dev[a], da, \",\"); nb\
      \ = split(dev[b], db, \",\");\n      for (x = 1; x <= na; x++) for (y = 1; y\
      \ <= nb; y++) if (da[x] == db[y]) {\n        bad++; why = why sprintf(\"%s and\
      \ %s ran at the same time on %s and both used device %s; \", node[a], node[b],\
      \ host[a], da[x]) }\n    }\n  for (h in peak) { i = which(h); if (!i) continue;\n\
      \    if (peak[h] > hostcap[i]) { bad++; why = why sprintf(\"%s ran %d GPUs at\
      \ once but has %d; \", h, peak[h], hostcap[i]) }\n    peaks = peaks sprintf(\"\
      %s\\\"%s\\\":{\\\"peak_gpus\\\":%d,\\\"capacity\\\":%d}\", (peaks == \"\" ?\
      \ \"\" : \",\"), h, peak[h], hostcap[i]);\n  }\n  first = s[1]; last = e[1];\
      \ for (a = 2; a <= j; a++) { if (s[a] < first) first = s[a]; if (e[a] > last)\
      \ last = e[a] }\n  printf \"{\\\"jobs\\\":%d,\\\"violations\\\":%d,\\\"gpu\\\
      \":\\\"%s\\\",\\\"makespan_seconds\\\":%d,\\\"hosts\\\":{%s}\", j, bad, mode,\
      \ last - first, peaks;\n  if (bad) { printf \",\\\"problems\\\":\\\"%s\\\"}\\\
      n\", why; print \"GPU AUDIT FAILED: \" why > \"/dev/stderr\"; exit 1 }\n  printf\
      \ \"}\\n\";\n}' > \"$NEXUS_OUTPUT_DIR/audit\" && cat \"$NEXUS_OUTPUT_DIR/audit\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: gpu.audit
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 300000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- id: distributed_0
  idempotency: IDEMPOTENCY_MODE_REQUIRED
