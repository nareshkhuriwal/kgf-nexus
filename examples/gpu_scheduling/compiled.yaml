  queue: gpu
  resources:
    limit:
      gpu_count: 2
    request:
      cpu_millis: 1000
      gpu_count: 2
      gpu_kind: nvidia-a100
      gpu_memory_bytes: 42949672960
      memory_bytes: 1073741824
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - 'v() { tr -d ''"\n '' < "$NEXUS_INPUT_DIR/$1"; }; start=$(date +%s); sleep "$(v
      hold)"; end=$(date +%s); devs="${CUDA_VISIBLE_DEVICES:-}"; n=$(printf "%s" "$devs"
      | awk -F, ''{print ($0 == "") ? 0 : NF}''); if command -v nvidia-smi >/dev/null
      2>&1; then smi=real; else smi=simulated; fi; printf ''{"node":"%s","kind":"%s","requested":%s,"assigned":%s,"devices":"%s","host":"%s","start":%s,"end":%s,"gpu":"%s"}''
      "$NEXUS_NODE_ID" "$(v kind)" "$(v count)" "$n" "$devs" "$HOSTNAME" "$start"
      "$end" "$smi" > "$NEXUS_OUTPUT_DIR/placement"; cat "$NEXUS_OUTPUT_DIR/placement"'
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: gpu.distributed_train
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 1800000
