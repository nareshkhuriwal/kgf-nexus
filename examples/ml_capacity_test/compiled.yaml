- id: generate_data
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  input_params:
    features: features
    rows: rows
    seed: seed
  inputs:
    features:
      required: true
      type: json
    rows:
      required: true
      type: json
    seed:
      required: true
      type: json
  outputs:
    dataset:
      required: true
      type: string
    manifest:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 500
      memory_bytes: 536870912
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "\nimport csv\nimport json\nimport math\nimport os\nimport random\nimport time\n\
      \ninp = os.environ[\"NEXUS_INPUT_DIR\"]\nout = os.environ[\"NEXUS_OUTPUT_DIR\"\
      ]\n\nrows = int(json.load(open(os.path.join(inp, \"rows\"))))\nfeatures = int(json.load(open(os.path.join(inp,\
      \ \"features\"))))\nseed = int(json.load(open(os.path.join(inp, \"seed\"))))\n\
      \nif rows < 1000:\n    raise SystemExit(\"rows must be >= 1000\")\nif features\
      \ < 2 or features > 128:\n    raise SystemExit(\"features must be between 2\
      \ and 128\")\n\nrng = random.Random(seed)\ntruth = [rng.uniform(-2.0, 2.0) for\
      \ _ in range(features)]\nbias = rng.uniform(-0.5, 0.5)\n\npath = os.path.join(out,\
      \ \"dataset\")\nstarted = time.time()\npositives = 0\n\nwith open(path, \"w\"\
      , newline=\"\") as f:\n    w = csv.writer(f)\n    w.writerow([\"row_id\", *[f\"\
      x{i:02d}\" for i in range(features)], \"label\"])\n    for row_id in range(rows):\n\
      \        x = [rng.uniform(-1.0, 1.0) for _ in range(features)]\n        z =\
      \ bias + sum(a * b for a, b in zip(truth, x)) + rng.gauss(0.0, 0.35)\n     \
      \   p = 1.0 / (1.0 + math.exp(-max(-30.0, min(30.0, z))))\n        y = 1 if\
      \ rng.random() < p else 0\n        positives += y\n        w.writerow([row_id,\
      \ *[f\"{v:.6f}\" for v in x], y])\n\nmanifest = {\n    \"rows\": rows,\n   \
      \ \"features\": features,\n    \"positive_rows\": positives,\n    \"negative_rows\"\
      : rows - positives,\n    \"dataset_bytes\": os.path.getsize(path),\n    \"generate_seconds\"\
      : round(time.time() - started, 6),\n    \"seed\": seed,\n}\nwith open(os.path.join(out,\
      \ \"manifest\"), \"w\") as f:\n    json.dump(manifest, f, separators=(\",\"\
      , \":\"))\nprint(json.dumps(manifest, separators=(\",\", \":\")))\n"
    command:
    - python3
    - -c
    executor: subprocess
  task_ref: ml.generate_data
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 1800000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- id: train_00
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  input_literals:
    candidate: '0'
    l2: '0'
    learning_rate: '0.005'
  input_params:
    epochs: epochs
    seed: seed
  inputs:
    candidate:
      required: true
      type: json
    dataset:
      required: true
      type: string
    epochs:
      required: true
      type: json
    l2:
      required: true
      type: json
    learning_rate:
      required: true
      type: json
    seed:
      required: true
      type: json
  outputs:
    model:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 1000
      memory_bytes: 805306368
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "\nimport csv\nimport json\nimport math\nimport os\nimport random\nimport time\n\
      \ninp = os.environ[\"NEXUS_INPUT_DIR\"]\nout = os.environ[\"NEXUS_OUTPUT_DIR\"\
      ]\n\ncandidate = int(json.load(open(os.path.join(inp, \"candidate\"))))\nepochs\
      \ = int(json.load(open(os.path.join(inp, \"epochs\"))))\nlr = float(json.load(open(os.path.join(inp,\
      \ \"learning_rate\"))))\nl2 = float(json.load(open(os.path.join(inp, \"l2\"\
      ))))\nseed = int(json.load(open(os.path.join(inp, \"seed\"))))\n\nstarted_epoch\
      \ = time.time()\nstarted_perf = time.perf_counter()\n\n# Materialize the full\
      \ data set to create realistic per-trainer memory pressure.\nX = []\ny = []\n\
      with open(os.path.join(inp, \"dataset\"), newline=\"\") as f:\n    r = csv.reader(f)\n\
      \    next(r)\n    for idx, row in enumerate(r):\n        # Keep 20% for evaluate;\
      \ training uses the remaining 80%.\n        if idx % 5 == 0:\n            continue\n\
      \        X.append([float(v) for v in row[1:-1]])\n        y.append(int(row[-1]))\n\
      \nif not X:\n    raise SystemExit(\"training set is empty\")\n\nfeatures = len(X[0])\n\
      rng = random.Random(seed * 1000 + candidate)\nweights = [rng.uniform(-0.01,\
      \ 0.01) for _ in range(features)]\nbias = 0.0\nindices = list(range(len(X)))\n\
      last_loss = 0.0\n\nfor epoch in range(epochs):\n    # Stable deterministic shuffle\
      \ for each candidate/epoch.\n    rng.shuffle(indices)\n    loss = 0.0\n    for\
      \ j in indices:\n        row = X[j]\n        target = y[j]\n        z = bias\n\
      \        for k, value in enumerate(row):\n            z += weights[k] * value\n\
      \        z = max(-30.0, min(30.0, z))\n        p = 1.0 / (1.0 + math.exp(-z))\n\
      \        err = p - target\n        # Logistic loss for observability.\n    \
      \    p_clip = min(1.0 - 1e-12, max(1e-12, p))\n        loss += -(target * math.log(p_clip)\
      \ + (1 - target) * math.log(1 - p_clip))\n        for k, value in enumerate(row):\n\
      \            weights[k] -= lr * (err * value + l2 * weights[k])\n        bias\
      \ -= lr * err\n    last_loss = loss / len(X)\n\nended_perf = time.perf_counter()\n\
      ended_epoch = time.time()\n\nmodel = {\n    \"candidate\": candidate,\n    \"\
      learning_rate\": lr,\n    \"l2\": l2,\n    \"epochs\": epochs,\n    \"features\"\
      : features,\n    \"train_rows\": len(X),\n    \"train_row_passes\": len(X) *\
      \ epochs,\n    \"train_loss\": round(last_loss, 8),\n    \"train_seconds\":\
      \ round(ended_perf - started_perf, 6),\n    \"train_start_epoch\": round(started_epoch,\
      \ 6),\n    \"train_end_epoch\": round(ended_epoch, 6),\n    \"weight_norm\"\
      : round(math.sqrt(sum(v * v for v in weights)), 8),\n    \"bias\": bias,\n \
      \   \"weights\": weights,\n}\nwith open(os.path.join(out, \"model\"), \"w\"\
      ) as f:\n    json.dump(model, f, separators=(\",\", \":\"))\nprint(json.dumps({k:\
      \ model[k] for k in model if k != \"weights\"}, separators=(\",\", \":\")))\n"
    command:
    - python3
    - -c
    executor: subprocess
