api_version: nexus.dev/v1
description: Synthetic regression, 24-trial hyperparameter search, best-model selection
  and a quality gate.
edges:
- from_node_id: make_dataset
  output_to_input:
    test: test
    train: train
  to_node_id: train_trial
- from_node_id: select_best
  output_to_input:
    best: best
  to_node_id: quality_gate
- from_node_id: train_trial
  output_to_input:
    trials: metrics
  to_node_id: select_best
name: ml-training-pipeline
namespace: default
params:
  min_r2:
    default_json: '0.95'
    type: float
  rows:
    default_json: '20000'
    type: int
  seed:
    default_json: '11'
    type: int
run_timeout_ms: 7200000
tasks:
- id: make_dataset
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  input_params:
    rows: rows
    seed: seed
  inputs:
    rows:
      required: true
      type: json
    seed:
      required: true
      type: json
  outputs:
    grid:
      required: true
      type: json
    test:
      required: true
      type: string
    train:
      required: true
      type: string
  queue: default
  resources:
    request:
      cpu_millis: 500
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "v() { tr -d '\"\\n ' < \"$NEXUS_INPUT_DIR/$1\"; }; awk -v rows=\"$(v rows)\"\
      \ -v seed=\"$(v seed)\" -v dir=\"$NEXUS_OUTPUT_DIR\" '\nBEGIN {\n  srand(seed);\n\
      \  h = \"x1,x2,x3,y\"; print h > (dir \"/train\"); print h > (dir \"/test\"\
      );\n  for (i = 1; i <= rows; i++) {\n    x1 = rand() * 4 - 2; x2 = rand() *\
      \ 4 - 2; x3 = rand() * 4 - 2;\n    u = rand(); if (u < 1e-12) u = 1e-12;\n \
      \   e = sqrt(-2 * log(u)) * cos(6.283185307 * rand()) * 0.3;\n    y = 3.2 *\
      \ x1 - 1.7 * x2 + 0.8 * x3 + 0.5 + e;\n    line = sprintf(\"%.5f,%.5f,%.5f,%.5f\"\
      , x1, x2, x3, y);\n    if (i % 5 == 0) print line > (dir \"/test\"); else print\
      \ line > (dir \"/train\");\n  }\n  n = split(\"0.005 0.01 0.02 0.05\", lr, \"\
      \ \"); split(\"40 100 200\", ep, \" \"); split(\"0 0.01\", l2, \" \");\n  printf\
      \ \"[\" > (dir \"/grid\"); sep = \"\";\n  for (a = 1; a <= 4; a++) for (b =\
      \ 1; b <= 3; b++) for (c = 1; c <= 2; c++) {\n    printf \"%s{\\\"lr\\\":%s,\\\
      \"epochs\\\":%s,\\\"l2\\\":%s}\", sep, lr[a], ep[b], l2[c] > (dir \"/grid\"\
      ); sep = \",\";\n  }\n  printf \"]\" > (dir \"/grid\");\n}'"
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: ml.make_dataset
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 600000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- id: quality_gate
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  input_params:
    min_r2: min_r2
  inputs:
    best:
      required: true
      type: json
    min_r2:
      required: true
      type: json
  outputs:
    model_card:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 100
      memory_bytes: 67108864
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "v() { tr -d '\"\\n ' < \"$NEXUS_INPUT_DIR/$1\"; }; awk -v min=\"$(v min_r2)\"\
      \ -v s=\"$(tr -d '\\n' < \"$NEXUS_INPUT_DIR/best\")\" '\nfunction get(s, k,\
      \   m) { if (match(s, \"\\\"\" k \"\\\":-?[0-9.eE+-]+\")) { m = substr(s, RSTART,\
      \ RLENGTH); sub(/^\"[^\"]+\":/, \"\", m); return m + 0 } return \"\" }\nBEGIN\
      \ {\n  r2 = get(s, \"r2\");\n  err = (get(s,\"w1\") - 3.2)^2 + (get(s,\"w2\"\
      ) + 1.7)^2 + (get(s,\"w3\") - 0.8)^2 + (get(s,\"b\") - 0.5)^2;\n  status = (r2\
      \ >= min) ? \"approved\" : \"rejected\";\n  printf \"{\\\"status\\\":\\\"%s\\\
      \",\\\"r2\\\":%.6f,\\\"min_r2\\\":%s,\\\"coefficient_error\\\":%.6f,\\\"true\\\
      \":{\\\"w1\\\":3.2,\\\"w2\\\":-1.7,\\\"w3\\\":0.8,\\\"b\\\":0.5},\\\"learned\\\
      \":{\\\"w1\\\":%s,\\\"w2\\\":%s,\\\"w3\\\":%s,\\\"b\\\":%s},\\\"lr\\\":%s,\\\
      \"epochs\\\":%s,\\\"l2\\\":%s}\\n\", status, r2, min, sqrt(err), get(s,\"w1\"\
      ), get(s,\"w2\"), get(s,\"w3\"), get(s,\"b\"), get(s,\"lr\"), get(s,\"epochs\"\
      ), get(s,\"l2\");\n  if (status != \"approved\") { printf \"model rejected:\
      \ R^2 %.4f < %s\\n\", r2, min > \"/dev/stderr\"; exit 1 }\n}' > \"$NEXUS_OUTPUT_DIR/model_card\"\
      \ && cat \"$NEXUS_OUTPUT_DIR/model_card\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: ml.quality_gate
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 300000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- id: select_best
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    trials:
      required: true
      type: json
  outputs:
    best:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 100
      memory_bytes: 67108864
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "tr -d '\\n' < \"$NEXUS_INPUT_DIR/trials\" | sed 's/},/}\\n/g' | awk '\nfunction\
      \ get(s, k,   m) { if (match(s, \"\\\"\" k \"\\\":-?[0-9.eE+-]+\")) { m = substr(s,\
      \ RSTART, RLENGTH); sub(/^\"[^\"]+\":/, \"\", m); return m + 0 } return \"\"\
      \ }\n/\"mse\"/ { s = $0; sub(/^[^{]*/, \"\", s); sub(/}[^}]*$/, \"}\", s); ok++;\n\
      \  m = get(s, \"mse\"); if (best == \"\" || m < bm) { bm = m; best = s } }\n\
      /null/ { failed++ }\nEND {\n  if (best == \"\") { print \"no trial succeeded\"\
      \ > \"/dev/stderr\"; exit 1 }\n  sub(/}$/, \"\", best);\n  printf \"%s,\\\"\
      trials_succeeded\\\":%d,\\\"trials_failed\\\":%d}\", best, ok, failed;\n}' >\
      \ \"$NEXUS_OUTPUT_DIR/best\" && cat \"$NEXUS_OUTPUT_DIR/best\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: ml.select_best
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 300000
  trigger_rule: TRIGGER_RULE_ALL_DONE
  version: 1
- cache:
    enabled: true
    ttl_ms: 86400000
  id: train_trial
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    config:
      required: true
      type: json
    test:
      required: true
      type: string
    train:
      required: true
      type: string
  map:
    item_input: config
    max_fanout: 64
    over_node_id: make_dataset
    over_output: grid
  outputs:
    metrics:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 500
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "cfg=$(tr -d \"\\n\" < \"$NEXUS_INPUT_DIR/config\"); awk -F, -v cfg=\"$cfg\"\
      \ '\nfunction get(s, k,   m) { if (match(s, \"\\\"\" k \"\\\":-?[0-9.eE+-]+\"\
      )) { m = substr(s, RSTART, RLENGTH); sub(/^\"[^\"]+\":/, \"\", m); return m\
      \ + 0 } return \"\" }\nBEGIN { lr = get(cfg, \"lr\"); epochs = get(cfg, \"epochs\"\
      ); l2 = get(cfg, \"l2\") }\nFNR == 1 { f++; next }\nf == 1 { n++; X1[n] = $1;\
      \ X2[n] = $2; X3[n] = $3; Y[n] = $4; next }\nf == 2 { t++; T1[t] = $1; T2[t]\
      \ = $2; T3[t] = $3; TY[t] = $4; next }\nEND {\n  w1 = w2 = w3 = b = 0;\n  for\
      \ (e = 1; e <= epochs; e++) {\n    g1 = g2 = g3 = gb = 0;\n    for (i = 1; i\
      \ <= n; i++) {\n      r = w1 * X1[i] + w2 * X2[i] + w3 * X3[i] + b - Y[i];\n\
      \      g1 += r * X1[i]; g2 += r * X2[i]; g3 += r * X3[i]; gb += r;\n    }\n\
      \    w1 -= lr * (2 * g1 / n + 2 * l2 * w1); w2 -= lr * (2 * g2 / n + 2 * l2\
      \ * w2);\n    w3 -= lr * (2 * g3 / n + 2 * l2 * w3); b -= lr * 2 * gb / n;\n\
      \  }\n  for (i = 1; i <= t; i++) { m += TY[i] }\n  m /= t;\n  for (i = 1; i\
      \ <= t; i++) {\n    p = w1 * T1[i] + w2 * T2[i] + w3 * T3[i] + b;\n    sse +=\
      \ (TY[i] - p) ^ 2; sst += (TY[i] - m) ^ 2;\n  }\n  printf \"{\\\"lr\\\":%s,\\\
      \"epochs\\\":%d,\\\"l2\\\":%s,\\\"mse\\\":%.6f,\\\"r2\\\":%.6f,\\\"w1\\\":%.4f,\\\
      \"w2\\\":%.4f,\\\"w3\\\":%.4f,\\\"b\\\":%.4f,\\\"train_rows\\\":%d,\\\"test_rows\\\
      \":%d}\", lr, epochs, l2, sse / t, 1 - sse / sst, w1, w2, w3, b, n, t;\n}' \"\
      $NEXUS_INPUT_DIR/train\" \"$NEXUS_INPUT_DIR/test\" > \"$NEXUS_OUTPUT_DIR/metrics\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: ml.train_trial
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 1200000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1

