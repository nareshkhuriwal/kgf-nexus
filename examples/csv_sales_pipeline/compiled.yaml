    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "cd \"$NEXUS_INPUT_DIR\" && awk -F'[{}\":,]+' '\nFILENAME ~ /^quality_/ { for\
      \ (i = 2; i < NF; i += 2) q[$i] += $(i + 1); next }\n$2 == \"category\" { rev[$3]\
      \ += $5; units[$3] += $7; orders[$3] += $9; agg += $9 }\nEND {\n  if (q[\"clean\"\
      ] != agg || q[\"clean\"] + q[\"rejected\"] != q[\"rows\"]) {\n    printf \"\
      ROW ACCOUNTING FAILED: rows=%d clean=%d rejected=%d aggregated=%d\\n\", q[\"\
      rows\"], q[\"clean\"], q[\"rejected\"], agg > \"/dev/stderr\";\n    exit 1;\n\
      \  }\n  for (c in rev) { total += rev[c]; if (rev[c] > best) { best = rev[c];\
      \ top = c } }\n  printf \"{\\\"regions\\\":%d,\\\"rows\\\":%d,\\\"clean\\\"\
      :%d,\\\"rejected\\\":%d,\\\"reject_rate_pct\\\":%.3f,\\\"categories\\\":{\"\
      , 16, q[\"rows\"], q[\"clean\"], q[\"rejected\"], 100 * q[\"rejected\"] / q[\"\
      rows\"];\n  sep = \"\";\n  for (c in rev) { printf \"%s\\\"%s\\\":{\\\"revenue\\\
      \":%.2f,\\\"units\\\":%d,\\\"orders\\\":%d}\", sep, c, rev[c], units[c], orders[c];\
      \ sep = \",\" }\n  printf \"},\\\"total_revenue\\\":%.2f,\\\"top_category\\\"\
      :\\\"%s\\\",\\\"row_accounting\\\":\\\"ok\\\"}\\n\", total, top;\n}' quality_*\
      \ summary_* > \"$NEXUS_OUTPUT_DIR/report\" && cat \"$NEXUS_OUTPUT_DIR/report\""
    command:
    - sh
    - -c
    executor: subprocess
