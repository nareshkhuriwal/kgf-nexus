- id: generate_00
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  input_literals:
    region: '"region-00"'
  input_params:
    rows: rows_per_region
    seed: seed
  inputs:
    region:
      required: true
      type: string
    rows:
      required: true
      type: json
    seed:
      required: true
      type: json
  outputs:
    csv:
      required: true
      type: string
  queue: default
  resources:
    request:
      cpu_millis: 250
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "v() { tr -d '\"\\n ' < \"$NEXUS_INPUT_DIR/$1\"; }; awk -v region=\"$(v region)\"\
      \ -v rows=\"$(v rows)\" -v seed=\"$(v seed)\" '\nBEGIN {\n  split(\"electronics\
      \ grocery apparel home toys sports books beauty\", cat, \" \");\n  n = region;\
      \ gsub(/[^0-9]/, \"\", n); s = seed * 100003 + n * 7919;\n  srand(s);\n  print\
      \ \"order_id,region,category,product,qty,unit_price,order_date\";\n  for (i\
      \ = 1; i <= rows; i++) {\n    c = cat[int(rand() * 8) + 1];\n    p = c \"-sku-\"\
      \ int(rand() * 25);\n    q = int(rand() * 9) + 1;\n    pr = sprintf(\"%.2f\"\
      , 2 + rand() * 198);\n    d = sprintf(\"2026-%02d-%02d\", int(rand() * 12) +\
      \ 1, int(rand() * 28) + 1);\n    r = rand();\n    if (r < 0.0025) q = \"\";\n\
      \    else if (r < 0.005) pr = \"-\" pr;\n    printf \"%s-%07d,%s,%s,%s,%s,%s,%s\\\
      n\", region, i, region, c, p, q, pr, d;\n  }\n}' > \"$NEXUS_OUTPUT_DIR/csv\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: csv.generate
