name: csv-sales-pipeline
namespace: default
params:
  rows_per_region:
    default_json: '20000'
    type: int
  seed:
    default_json: '7'
    type: int
run_timeout_ms: 3600000
tasks:
- id: aggregate_00
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    clean:
      required: true
      type: string
  outputs:
    summary:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 250
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "awk -F, 'NR > 1 { rev[$3] += $5 * $6; units[$3] += $5; orders[$3]++; region\
      \ = $2; n++ }\nEND {\n  printf \"{\\\"region\\\":\\\"%s\\\",\\\"rows\\\":%d,\\\
      \"categories\\\":[\\n\", region, n;\n  sep = \"\";\n  for (c in rev) {\n   \
      \ printf \"%s{\\\"category\\\":\\\"%s\\\",\\\"revenue\\\":%.2f,\\\"units\\\"\
      :%d,\\\"orders\\\":%d}\", sep, c, rev[c], units[c], orders[c];\n    sep = \"\
      ,\\n\";\n  }\n  printf \"\\n]}\\n\";\n}' \"$NEXUS_INPUT_DIR/clean\" > \"$NEXUS_OUTPUT_DIR/summary\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: csv.aggregate
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 900000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
