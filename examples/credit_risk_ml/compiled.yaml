name: credit-risk-ml
namespace: default
params:
  epochs:
    default_json: '10'
    type: int
  min_auc:
    default_json: '0.75'
    type: float
  rows:
    default_json: '60000'
    type: int
  seed:
    default_json: '2026'
    type: int
run_timeout_ms: 10800000
tasks:
- id: bootstrap_auc
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    replicate:
      required: true
      type: json
    scores:
      required: true
      type: string
  map:
    item_input: replicate
    max_fanout: 200
    over_node_id: score_holdout
    over_output: bootstrap_plan
  outputs:
    auc:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 250
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "T=$(mktemp -d); trap 'rm -rf \"$T\"' EXIT; auc() { sort -k2,2g \"$1\" | awk\
      \ '\n{ lab[NR] = $1; sc[NR] = $2 }\nEND { n = NR; i = 1\n  while (i <= n) {\
      \ j = i; while (j < n && sc[j + 1] == sc[i]) j++\n    r = (i + j) / 2; for (k\
      \ = i; k <= j; k++) if (lab[k] == 1) { sum += r; pos++ }\n    i = j + 1 }\n\
      \  neg = n - pos; if (pos == 0 || neg == 0) { print 0.5; exit }\n  printf \"\
      %.6f\\n\", (sum - pos * (pos + 1) / 2) / (pos * neg) }'; }; r=$(tr -d \" \\\
      n\" < \"$NEXUS_INPUT_DIR/replicate\"); awk -v r=\"$r\" '\n{ n++; L[n] = $0 }\n\
      END { srand(1000 + r); for (i = 1; i <= n; i++) print L[int(rand() * n) + 1]\
      \ }' \"$NEXUS_INPUT_DIR/scores\" > \"$T/bs\" && printf '{\"replicate\":%s,\"\
      auc\":%s}' \"$r\" \"$(auc \"$T/bs\")\" > \"$NEXUS_OUTPUT_DIR/auc\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: credit.bootstrap_auc
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 600000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- id: calibrate
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    scores:
      required: true
      type: string
  outputs:
    threshold:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 250
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "awk  '\n{ n++; Y[n] = $1; S[n] = $2; b = int($2 * 10); if (b > 9) b = 9; bn[b]++;\
      \ bp[b] += $2; by[b] += $1 }\nEND {\n  for (k = 1; k <= 99; k++) { th = k /\
      \ 100; fn = fp = tp = 0\n    for (i = 1; i <= n; i++) { d = (S[i] >= th); if\
      \ (d && Y[i]) tp++; else if (d) fp++; else if (Y[i]) fn++ }\n    cost = 5 *\
      \ fn + fp; if (best == \"\" || cost < bc) { bc = cost; best = th; btp = tp;\
      \ bfp = fp; bfn = fn } }\n  printf \"{\\\"threshold\\\":%.2f,\\\"expected_cost_per_1000\\\
      \":%.1f,\\\"recall\\\":%.4f,\\\"precision\\\":%.4f,\\\"reliability\\\":[\",\
      \ best, 1000 * bc / n, btp / (btp + bfn), (btp + bfp ? btp / (btp + bfp) : 0)\n\
      \  for (b = 0; b <= 9; b++) if (bn[b]) printf \"%s{\\\"bin\\\":%d,\\\"predicted\\\
      \":%.3f,\\\"observed\\\":%.3f,\\\"n\\\":%d}\", (s++ ? \",\" : \"\"), b, bp[b]\
      \ / bn[b], by[b] / bn[b], bn[b]\n  printf \"]}\" }' \"$NEXUS_INPUT_DIR/scores\"\
      \ > \"$NEXUS_OUTPUT_DIR/threshold\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: credit.calibrate
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 300000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- id: clean
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    raw:
      required: true
      type: string
  outputs:
    clean:
      required: true
      type: string
    profile:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 250
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "in=\"$NEXUS_INPUT_DIR/raw\"; q() { cut -d, -f\"$1\" \"$in\" | sed 1d | grep\
      \ -v '^$' | sort -g | awk -v p=\"$2\" '{ a[NR] = $1 } END { print a[int(NR *\
      \ p) > 0 ? int(NR * p) : 1] }'; }; med_age=$(q 2 0.5); med_inc=$(q 3 0.5); p99_inc=$(q\
      \ 3 0.99); awk -v ma=\"$med_age\" -v mi=\"$med_inc\" -v p99=\"$p99_inc\" -v\
      \ prof=\"$NEXUS_OUTPUT_DIR/profile\" '\nBEGIN { FS = OFS = \",\" }\nNR == 1\
      \ { print \"age,income,debt_ratio,credit_lines,late_payments,utilization,r_north,r_south,r_east,r_west,p_basic,p_plus,p_premium,default\"\
      ; next }\n{ n++\n  if ($2 == \"\") { $2 = ma; imp_age++ }\n  if ($3 == \"\"\
      ) { $3 = mi; imp_inc++ }\n  if ($3 > p99) { $3 = p99; clip_inc++ }\n  if ($7\
      \ > 1.2) { $7 = 1.2; clip_util++ }\n  print $2, $3, $4, $5, $6, $7, ($8 == \"\
      north\"), ($8 == \"south\"), ($8 == \"east\"), ($8 == \"west\"), ($9 == \"basic\"\
      ), ($9 == \"plus\"), ($9 == \"premium\"), $10\n  pos += $10 }\nEND { printf\
      \ \"{\\\"rows\\\":%d,\\\"default_rate\\\":%.4f,\\\"imputed_age\\\":%d,\\\"imputed_income\\\
      \":%d,\\\"clipped_income\\\":%d,\\\"clipped_utilization\\\":%d,\\\"median_age\\\
      \":%s,\\\"median_income\\\":%s,\\\"p99_income\\\":%s}\", n, pos / n, imp_age,\
      \ imp_inc, clip_inc, clip_util, ma, mi, p99 > prof }' \"$in\" > \"$NEXUS_OUTPUT_DIR/clean\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: credit.clean
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 600000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- id: confidence_interval
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    replicates:
      required: true
      type: json
  outputs:
    interval:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 250
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "tr -d '\\n' < \"$NEXUS_INPUT_DIR/replicates\" | sed 's/},/}\\n/g' | grep -o\
      \ '\"auc\":[0-9.]*' | cut -d: -f2 | sort -g | awk  '\n{ a[++n] = $1; s += $1\
      \ }\nEND { if (n < 10) { print \"too few bootstrap replicates\" > \"/dev/stderr\"\
      ; exit 1 }\n  lo = a[int(n * 0.025) + 1]; hi = a[int(n * 0.975) > 0 ? int(n\
      \ * 0.975) : n]\n  printf \"{\\\"replicates\\\":%d,\\\"mean_auc\\\":%.5f,\\\"\
      ci95_low\\\":%.5f,\\\"ci95_high\\\":%.5f}\", n, s / n, lo, hi }'  > \"$NEXUS_OUTPUT_DIR/interval\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: credit.confidence_interval
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 300000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- cache:
    enabled: true
    ttl_ms: 86400000
  id: cv_trial
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    experiment:
      required: true
      type: json
    train_pool:
      required: true
      type: string
  map:
    item_input: experiment
    max_fanout: 200
    over_node_id: plan_experiments
    over_output: experiments
  outputs:
    metrics:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 1000
      memory_bytes: 536870912
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "T=$(mktemp -d); trap 'rm -rf \"$T\"' EXIT; auc() { sort -k2,2g \"$1\" | awk\
      \ '\n{ lab[NR] = $1; sc[NR] = $2 }\nEND { n = NR; i = 1\n  while (i <= n) {\
      \ j = i; while (j < n && sc[j + 1] == sc[i]) j++\n    r = (i + j) / 2; for (k\
      \ = i; k <= j; k++) if (lab[k] == 1) { sum += r; pos++ }\n    i = j + 1 }\n\
      \  neg = n - pos; if (pos == 0 || neg == 0) { print 0.5; exit }\n  printf \"\
      %.6f\\n\", (sum - pos * (pos + 1) / 2) / (pos * neg) }'; }; e=$(tr -d \"\\n\"\
      \ < \"$NEXUS_INPUT_DIR/experiment\"); awk -v e=\"$e\" -v tv=\"$T/val\" '\nfunction\
      \ get(s, k,   m) {\n  if (match(s, \"\\\"\" k \"\\\":-?[0-9.eE+-]+\")) { m =\
      \ substr(s, RSTART, RLENGTH); sub(/^\"[^\"]+\":/, \"\", m); return m + 0 }\n\
      \  if (match(s, \"\\\"\" k \"\\\":\\\"[^\\\"]*\\\"\")) { m = substr(s, RSTART,\
      \ RLENGTH); sub(/^\"[^\"]+\":\"/, \"\", m); sub(/\"$/, \"\", m); return m }\n\
      \  return \"\" }\n\nfunction sigm(z) { if (z > 30) return 1; if (z < -30) return\
      \ 0; return 1 / (1 + exp(-z)) }\nfunction tanh_(z,   e) { if (z > 15) return\
      \ 1; if (z < -15) return -1; e = exp(2 * z); return (e - 1) / (e + 1) }\nfunction\
      \ init(m, h, k,   i, j) {\n  MODEL = m; H = h; K = k; B2 = 0\n  for (i = 1;\
      \ i <= K; i++) W[i] = 0\n  if (MODEL == \"mlp\") for (j = 1; j <= H; j++) {\
      \ B1[j] = 0; W2[j] = (rand() - 0.5) * 0.5\n    for (i = 1; i <= K; i++) W1[j,\
      \ i] = (rand() - 0.5) * 2 / sqrt(K) }\n}\nfunction score(x,   i, j, z, a) {\n\
      \  if (MODEL == \"logreg\") { z = B2; for (i = 1; i <= K; i++) z += W[i] * x[i];\
      \ return sigm(z) }\n  z = B2\n  for (j = 1; j <= H; j++) { a = B1[j]; for (i\
      \ = 1; i <= K; i++) a += W1[j, i] * x[i]; HID[j] = tanh_(a); z += W2[j] * HID[j]\
      \ }\n  return sigm(z)\n}\nfunction train_row(x, y, lr, l2,   p, d, i, j, dh)\
      \ {\n  p = score(x); d = p - y\n  if (MODEL == \"logreg\") { for (i = 1; i <=\
      \ K; i++) W[i] -= lr * (d * x[i] + l2 * W[i]); B2 -= lr * d; return }\n  for\
      \ (j = 1; j <= H; j++) {\n    dh = d * W2[j] * (1 - HID[j] * HID[j])\n    W2[j]\
      \ -= lr * (d * HID[j] + l2 * W2[j])\n    for (i = 1; i <= K; i++) W1[j, i] -=\
      \ lr * (dh * x[i] + l2 * W1[j, i])\n    B1[j] -= lr * dh\n  }\n  B2 -= lr *\
      \ d\n}\nfunction dump(   i, j, s) {\n  s = sprintf(\"{\\\"model\\\":\\\"%s\\\
      \",\\\"hidden\\\":%d,\\\"K\\\":%d,\\\"b2\\\":%.8g,\\\"w\\\":[\", MODEL, H, K,\
      \ B2)\n  if (MODEL == \"logreg\") { for (i = 1; i <= K; i++) s = s (i > 1 ?\
      \ \",\" : \"\") sprintf(\"%.8g\", W[i]) }\n  else { for (j = 1; j <= H; j++)\
      \ { s = s (j > 1 ? \",\" : \"\") sprintf(\"%.8g\", W2[j]); for (i = 1; i <=\
      \ K; i++) s = s \",\" sprintf(\"%.8g\", W1[j, i]); s = s \",\" sprintf(\"%.8g\"\
      , B1[j]) } }\n  return s \"]}\"\n}\nfunction load(js,   body, n, v, i, j, t)\
      \ {\n  MODEL = get(js, \"model\"); H = get(js, \"hidden\"); K = get(js, \"K\"\
      ); B2 = get(js, \"b2\")\n  body = js; sub(/^.*\"w\":\\[/, \"\", body); sub(/\\\
      ].*$/, \"\", body); n = split(body, v, \",\")\n  if (MODEL == \"logreg\") {\
      \ for (i = 1; i <= K; i++) W[i] = v[i] + 0; return }\n  t = 0; for (j = 1; j\
      \ <= H; j++) { W2[j] = v[++t] + 0; for (i = 1; i <= K; i++) W1[j, i] = v[++t]\
      \ + 0; B1[j] = v[++t] + 0 }\n}\n\nBEGIN { FS = \",\"; srand(7 + get(e, \"fold\"\
      ))\n  fold = get(e, \"fold\"); epochs = get(e, \"epochs\"); lr0 = get(e, \"\
      lr\"); l2 = get(e, \"l2\")\n  init(get(e, \"model\"), get(e, \"hidden\"), 16)\
      \ }\n{ if ($2 == fold) { v++; VY[v] = $1; for (i = 1; i <= 16; i++) VX[v, i]\
      \ = $(i + 2) }\n  else { t++; TY[t] = $1; for (i = 1; i <= 16; i++) TX[t, i]\
      \ = $(i + 2); ORD[t] = t } }\nEND {\n  for (ep = 1; ep <= epochs; ep++) {\n\
      \    for (a = t; a > 1; a--) { b = int(rand() * a) + 1; tmp = ORD[a]; ORD[a]\
      \ = ORD[b]; ORD[b] = tmp }\n    lr = lr0 / (1 + 0.15 * (ep - 1))\n    for (a\
      \ = 1; a <= t; a++) { r = ORD[a]; for (i = 1; i <= 16; i++) x[i] = TX[r, i];\
      \ train_row(x, TY[r], lr, l2) } }\n  for (a = 1; a <= v; a++) { for (i = 1;\
      \ i <= 16; i++) x[i] = VX[a, i]; p = score(x)\n    pc = (p < 1e-7 ? 1e-7 : (p\
      \ > 1 - 1e-7 ? 1 - 1e-7 : p)); ll -= VY[a] * log(pc) + (1 - VY[a]) * log(1 -\
      \ pc)\n    acc += ((p >= 0.5) == VY[a]); print VY[a], p > tv }\n  printf \"\
      {\\\"cfg\\\":\\\"%s\\\",\\\"model\\\":\\\"%s\\\",\\\"hidden\\\":%d,\\\"lr\\\"\
      :%s,\\\"l2\\\":%s,\\\"fold\\\":%d,\\\"train_rows\\\":%d,\\\"val_rows\\\":%d,\\\
      \"logloss\\\":%.6f,\\\"accuracy\\\":%.6f\", get(e, \"cfg\"), MODEL, H, lr0,\
      \ l2, fold, t, v, ll / v, acc / v }' \"$NEXUS_INPUT_DIR/train_pool\" > \"$T/m\"\
      \ && printf ',\"auc\":%s}' \"$(auc \"$T/val\")\" >> \"$T/m\" && cp \"$T/m\"\
      \ \"$NEXUS_OUTPUT_DIR/metrics\" && cat \"$T/m\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: credit.cv_trial
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 2700000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- id: features
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  input_params:
    seed: seed
  inputs:
    clean:
      required: true
      type: string
    seed:
      required: true
      type: json
  outputs:
    holdout:
      required: true
      type: string
    schema:
      required: true
      type: json
    train_pool:
      required: true
      type: string
  queue: default
  resources:
    request:
      cpu_millis: 250
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "v() { tr -d '\"\\n ' < \"$NEXUS_INPUT_DIR/$1\"; }; awk -v seed=\"$(v seed)\"\
      \ -v folds=5 -v dir=\"$NEXUS_OUTPUT_DIR\" '\nBEGIN { FS = \",\" }\nNR == 1 {\
      \ next }\n{ n++; R[n] = $0\n  v[1] = $1; v[2] = log($2 + 1); v[3] = $3; v[4]\
      \ = $4; v[5] = $5; v[6] = $6\n  v[7] = $3 * $6; v[8] = $5 * $5; v[9] = $6 *\
      \ $6\n  for (i = 1; i <= 9; i++) { s[i] += v[i]; ss[i] += v[i] * v[i]; X[n,\
      \ i] = v[i] }\n  for (i = 7; i <= 13; i++) X[n, i + 3] = $i\n  Y[n] = $14 }\n\
      END { srand(seed)\n  for (i = 1; i <= 9; i++) { mu[i] = s[i] / n; sd[i] = sqrt(ss[i]\
      \ / n - mu[i] * mu[i]); if (sd[i] < 1e-9) sd[i] = 1 }\n  for (r = 1; r <= n;\
      \ r++) {\n    line = \"\"\n    for (i = 1; i <= 9; i++) line = line \",\" sprintf(\"\
      %.5f\", (X[r, i] - mu[i]) / sd[i])\n    for (i = 10; i <= 16; i++) line = line\
      \ \",\" X[r, i]\n    if (rand() < 0.15) print Y[r] line > (dir \"/holdout\"\
      )\n    else print Y[r] \",\" int(rand() * folds) line > (dir \"/train_pool\"\
      )\n  }\n  printf \"{\\\"features\\\":16,\\\"names\\\":[\\\"age\\\",\\\"log_income\\\
      \",\\\"debt_ratio\\\",\\\"credit_lines\\\",\\\"late_payments\\\",\\\"utilization\\\
      \",\\\"debt_x_util\\\",\\\"late_sq\\\",\\\"util_sq\\\",\\\"r_north\\\",\\\"\
      r_south\\\",\\\"r_east\\\",\\\"r_west\\\",\\\"p_basic\\\",\\\"p_plus\\\",\\\"\
      p_premium\\\"],\\\"rows\\\":%d}\", n > (dir \"/schema\") }' \"$NEXUS_INPUT_DIR/clean\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: credit.features
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 600000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- id: importance_report
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    importances:
      required: true
      type: json
    schema:
      required: true
      type: json
  outputs:
