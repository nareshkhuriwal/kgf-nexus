      \ + (1 - $1) * log(1 - pc) }\nEND { printf \"{\\\"rows\\\":%d,\\\"default_rate\\\
      \":%.4f,\\\"auc\\\":%s,\\\"logloss\\\":%.6f}\", n, pos / n, a, ll / n }' \"\
      $NEXUS_OUTPUT_DIR/scores\" > \"$NEXUS_OUTPUT_DIR/holdout_metrics\" && awk -v\
      \ b=30 'BEGIN { printf \"[\"; for (i = 1; i <= b; i++) printf \"%s%d\", (i >\
      \ 1 ? \",\" : \"\"), i; printf \"]\" }' > \"$NEXUS_OUTPUT_DIR/bootstrap_plan\"\
      \ && awk -v k=16 'BEGIN { printf \"[\"; for (i = 1; i <= k; i++) printf \"%s%d\"\
      , (i > 1 ? \",\" : \"\"), i; printf \"]\" }' > \"$NEXUS_OUTPUT_DIR/features_plan\"\
      \ && cat \"$NEXUS_OUTPUT_DIR/holdout_metrics\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: credit.score_holdout
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 600000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1
- id: select_config
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  input_params:
    epochs: epochs
  inputs:
    epochs:
      required: true
      type: json
    trials:
      required: true
      type: json
  outputs:
    selection:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 250
      memory_bytes: 268435456
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "v() { tr -d '\"\\n ' < \"$NEXUS_INPUT_DIR/$1\"; }; tr -d '\\n' < \"$NEXUS_INPUT_DIR/trials\"\
      \ | sed 's/},/}\\n/g' | awk -v epochs=\"$(v epochs)\" '\nfunction get(s, k,\
      \   m) {\n  if (match(s, \"\\\"\" k \"\\\":-?[0-9.eE+-]+\")) { m = substr(s,\
      \ RSTART, RLENGTH); sub(/^\"[^\"]+\":/, \"\", m); return m + 0 }\n  if (match(s,\
      \ \"\\\"\" k \"\\\":\\\"[^\\\"]*\\\"\")) { m = substr(s, RSTART, RLENGTH); sub(/^\"\
      [^\"]+\":\"/, \"\", m); sub(/\"$/, \"\", m); return m }\n  return \"\" }\n\n\
      /\"auc\"/ { c = get($0, \"cfg\"); a = get($0, \"auc\"); n[c]++; s[c] += a; ss[c]\
      \ += a * a; ok++\n  model[c] = get($0, \"model\"); hid[c] = get($0, \"hidden\"\
      ); lr[c] = get($0, \"lr\"); l2[c] = get($0, \"l2\") }\n/null/ { failed++ }\n\
      END {\n  if (!ok) { print \"no trial succeeded\" > \"/dev/stderr\"; exit 1 }\n\
      \  for (c in n) { m = s[c] / n[c]; sd = sqrt(ss[c] / n[c] - m * m); if (best\
      \ == \"\" || m > bm) { bm = m; best = c }\n    lb = lb sprintf(\"%s{\\\"cfg\\\
      \":\\\"%s\\\",\\\"model\\\":\\\"%s\\\",\\\"hidden\\\":%d,\\\"mean_auc\\\":%.5f,\\\
      \"std_auc\\\":%.5f,\\\"folds\\\":%d}\", (lb == \"\" ? \"\" : \",\\n\"), c, model[c],\
      \ hid[c], m, sd, n[c]) }\n  printf \"{\\\"best\\\":{\\\"cfg\\\":\\\"%s\\\",\\\
      \"model\\\":\\\"%s\\\",\\\"hidden\\\":%d,\\\"lr\\\":%s,\\\"l2\\\":%s,\\\"epochs\\\
      \":%d,\\\"mean_cv_auc\\\":%.5f},\\\"trials_ok\\\":%d,\\\"trials_failed\\\":%d,\\\
      \"leaderboard\\\":[\\n%s\\n]}\\n\", best, model[best], hid[best], lr[best],\
      \ l2[best], epochs, bm, ok, failed, lb }'  > \"$NEXUS_OUTPUT_DIR/selection\"\
      \ && cat \"$NEXUS_OUTPUT_DIR/selection\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: credit.select_config
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 300000
  trigger_rule: TRIGGER_RULE_ALL_DONE
  version: 1
- id: train_final
  idempotency: IDEMPOTENCY_MODE_REQUIRED
  inputs:
    selection:
      required: true
      type: json
    train_pool:
      required: true
      type: string
  outputs:
    model:
      required: true
      type: json
  queue: default
  resources:
    request:
      cpu_millis: 1000
      memory_bytes: 536870912
  retry:
    initial_ms: 10000
    jitter: full
    max_attempts: 3
    max_ms: 600000
    multiplier: 2.0
    strategy: BACKOFF_STRATEGY_EXPONENTIAL
  runtime:
    args:
    - "sel=$(tr -d '\\n' < \"$NEXUS_INPUT_DIR/selection\" | sed 's/.*\"best\":{//;\
      \ s/}.*//'); awk -v sel=\"$sel\" '\nfunction get(s, k,   m) {\n  if (match(s,\
      \ \"\\\"\" k \"\\\":-?[0-9.eE+-]+\")) { m = substr(s, RSTART, RLENGTH); sub(/^\"\
      [^\"]+\":/, \"\", m); return m + 0 }\n  if (match(s, \"\\\"\" k \"\\\":\\\"\
      [^\\\"]*\\\"\")) { m = substr(s, RSTART, RLENGTH); sub(/^\"[^\"]+\":\"/, \"\"\
      , m); sub(/\"$/, \"\", m); return m }\n  return \"\" }\n\nfunction sigm(z) {\
      \ if (z > 30) return 1; if (z < -30) return 0; return 1 / (1 + exp(-z)) }\n\
      function tanh_(z,   e) { if (z > 15) return 1; if (z < -15) return -1; e = exp(2\
      \ * z); return (e - 1) / (e + 1) }\nfunction init(m, h, k,   i, j) {\n  MODEL\
      \ = m; H = h; K = k; B2 = 0\n  for (i = 1; i <= K; i++) W[i] = 0\n  if (MODEL\
      \ == \"mlp\") for (j = 1; j <= H; j++) { B1[j] = 0; W2[j] = (rand() - 0.5) *\
      \ 0.5\n    for (i = 1; i <= K; i++) W1[j, i] = (rand() - 0.5) * 2 / sqrt(K)\
      \ }\n}\nfunction score(x,   i, j, z, a) {\n  if (MODEL == \"logreg\") { z =\
      \ B2; for (i = 1; i <= K; i++) z += W[i] * x[i]; return sigm(z) }\n  z = B2\n\
      \  for (j = 1; j <= H; j++) { a = B1[j]; for (i = 1; i <= K; i++) a += W1[j,\
      \ i] * x[i]; HID[j] = tanh_(a); z += W2[j] * HID[j] }\n  return sigm(z)\n}\n\
      function train_row(x, y, lr, l2,   p, d, i, j, dh) {\n  p = score(x); d = p\
      \ - y\n  if (MODEL == \"logreg\") { for (i = 1; i <= K; i++) W[i] -= lr * (d\
      \ * x[i] + l2 * W[i]); B2 -= lr * d; return }\n  for (j = 1; j <= H; j++) {\n\
      \    dh = d * W2[j] * (1 - HID[j] * HID[j])\n    W2[j] -= lr * (d * HID[j] +\
      \ l2 * W2[j])\n    for (i = 1; i <= K; i++) W1[j, i] -= lr * (dh * x[i] + l2\
      \ * W1[j, i])\n    B1[j] -= lr * dh\n  }\n  B2 -= lr * d\n}\nfunction dump(\
      \   i, j, s) {\n  s = sprintf(\"{\\\"model\\\":\\\"%s\\\",\\\"hidden\\\":%d,\\\
      \"K\\\":%d,\\\"b2\\\":%.8g,\\\"w\\\":[\", MODEL, H, K, B2)\n  if (MODEL == \"\
      logreg\") { for (i = 1; i <= K; i++) s = s (i > 1 ? \",\" : \"\") sprintf(\"\
      %.8g\", W[i]) }\n  else { for (j = 1; j <= H; j++) { s = s (j > 1 ? \",\" :\
      \ \"\") sprintf(\"%.8g\", W2[j]); for (i = 1; i <= K; i++) s = s \",\" sprintf(\"\
      %.8g\", W1[j, i]); s = s \",\" sprintf(\"%.8g\", B1[j]) } }\n  return s \"]}\"\
      \n}\nfunction load(js,   body, n, v, i, j, t) {\n  MODEL = get(js, \"model\"\
      ); H = get(js, \"hidden\"); K = get(js, \"K\"); B2 = get(js, \"b2\")\n  body\
      \ = js; sub(/^.*\"w\":\\[/, \"\", body); sub(/\\].*$/, \"\", body); n = split(body,\
      \ v, \",\")\n  if (MODEL == \"logreg\") { for (i = 1; i <= K; i++) W[i] = v[i]\
      \ + 0; return }\n  t = 0; for (j = 1; j <= H; j++) { W2[j] = v[++t] + 0; for\
      \ (i = 1; i <= K; i++) W1[j, i] = v[++t] + 0; B1[j] = v[++t] + 0 }\n}\n\nBEGIN\
      \ { FS = \",\"; srand(99); s = \"{\" sel \"}\"\n  epochs = int(get(s, \"epochs\"\
      ) * 1.5); lr0 = get(s, \"lr\"); l2 = get(s, \"l2\")\n  init(get(s, \"model\"\
      ), get(s, \"hidden\"), 16) }\n{ t++; TY[t] = $1; for (i = 1; i <= 16; i++) TX[t,\
      \ i] = $(i + 2); ORD[t] = t }\nEND {\n  for (ep = 1; ep <= epochs; ep++) {\n\
      \    for (a = t; a > 1; a--) { b = int(rand() * a) + 1; tmp = ORD[a]; ORD[a]\
      \ = ORD[b]; ORD[b] = tmp }\n    lr = lr0 / (1 + 0.15 * (ep - 1))\n    for (a\
      \ = 1; a <= t; a++) { r = ORD[a]; for (i = 1; i <= 16; i++) x[i] = TX[r, i];\
      \ train_row(x, TY[r], lr, l2) } }\n  print dump() }' \"$NEXUS_INPUT_DIR/train_pool\"\
      \ > \"$NEXUS_OUTPUT_DIR/model\""
    command:
    - sh
    - -c
    executor: subprocess
  task_ref: credit.train_final
  timeouts:
    heartbeat_ms: 300000
    schedule_to_close_ms: 14400000
    schedule_to_start_ms: 1800000
    start_to_close_ms: 2700000
  trigger_rule: TRIGGER_RULE_ALL_SUCCESS
  version: 1

