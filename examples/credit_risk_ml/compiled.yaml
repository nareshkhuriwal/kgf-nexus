- from_node_id: clean
  output_to_input:
    profile: profile
  to_node_id: model_card
- from_node_id: confidence_interval
  output_to_input:
    interval: interval
  to_node_id: model_card
- from_node_id: cv_trial
  output_to_input:
    trials: metrics
  to_node_id: select_config
- from_node_id: features
  output_to_input:
    train_pool: train_pool
  to_node_id: cv_trial
- from_node_id: features
  output_to_input:
    schema: schema
  to_node_id: importance_report
- from_node_id: features
  output_to_input:
