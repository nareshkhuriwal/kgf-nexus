#
# The compose stack on a PostgreSQL OUTSIDE it -- the host's own server, by
# default -- instead of the bundled postgres container.
#
#   NEXUS_HOST_DATABASE_URL='postgres://me@host.docker.internal:5432/nexus_dev?sslmode=disable' \
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.host-db.yml up -d
#
# This is how the repository's own tooling runs a stack (`make up`,
# deploy/e2e/e2e-stack.sh, the chaos and gpusim suites): the project rule is
# that Postgres comes from the host, never a container. The bundled postgres
# service is switched off (its profile is never enabled), the migration job
# and every service use NEXUS_HOST_DATABASE_URL, and nothing waits on the
# container's health check.
#
#   NEXUS_HOST_DATABASE_URL  the database as a CONTAINER reaches it. Required.
#                            The database must exist (the migration job fills
#                            it); tests/lib/hostpg-db.sh create/container-url
#                            makes one and prints this URL. On Docker Desktop,
#                            host.docker.internal reaches the host's loopback,
#                            so a server listening on localhost only works; on
#                            Linux it maps to the host gateway (below), and the
#                            server must listen there.
#   NEXUS_DB_MAX_CONNS       caps every service's pool (default: the services'
#                            own). A server shared with other workloads needs
#                            it: seven services at their defaults can take most
#                            of a max_connections=100 server by themselves.
#
# Requires Docker Compose 2.24.4 or later for `!reset` and `!override`.

x-host-db-env: &host-db-env
  DATABASE_URL: ${NEXUS_HOST_DATABASE_URL:?set NEXUS_HOST_DATABASE_URL to the database as containers reach it (tests/lib/hostpg-db.sh container-url NAME)}
  NEXUS_DB_MAX_CONNS: ${NEXUS_DB_MAX_CONNS:-}

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

x-after-migrate: &after-migrate
  migrate:
    condition: service_completed_successfully

services:
  # Never started: no profile of this name is ever enabled.
  postgres:
    profiles: ["bundled-postgres-disabled-by-host-db-overlay"]

  migrate:
    depends_on: !reset {}
    extra_hosts: *host-gateway
    environment: *host-db-env
  api-gateway:
    depends_on: !override
      <<: *after-migrate
    extra_hosts: *host-gateway
    environment: *host-db-env
  workflow-manager:
    depends_on: !override
      <<: *after-migrate
    extra_hosts: *host-gateway
    environment: *host-db-env
  dag-engine:
    depends_on: !override
      <<: *after-migrate
    extra_hosts: *host-gateway
    environment: *host-db-env
  scheduler:
    depends_on: !override
      <<: *after-migrate
    extra_hosts: *host-gateway
    environment: *host-db-env
  scheduler-gpu:
    depends_on: !override
      <<: *after-migrate
    extra_hosts: *host-gateway
    environment: *host-db-env
  resource-manager:
    depends_on: !override
      <<: *after-migrate
    extra_hosts: *host-gateway
    environment: *host-db-env
  event-service:
    depends_on: !override
      <<: *after-migrate
      nats-init:
        condition: service_completed_successfully
    extra_hosts: *host-gateway
    environment: *host-db-env
