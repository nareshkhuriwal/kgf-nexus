# Nexus MVP: one-command bring-up (architecture §11 Phase 1).
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# DATABASE. The stack runs on the HOST's PostgreSQL by default (the project
# rule: Postgres comes from the host machine, never a container). Containers
# reach it at host.docker.internal (Docker Desktop forwards that to the host's
# loopback; on Linux it maps to the host gateway, and the server must listen
# there). The database is NEXUS_HOST_DATABASE_URL, default
# postgres://$USER@host.docker.internal:5432/nexus_compose; the migration job
# creates it when it is missing, and fails within seconds, saying how to start
# PostgreSQL, when the server cannot be reached. `make up`, `nexusctl up` and
# deploy/e2e/e2e-stack.sh create a database per stack themselves.
#
# The bundled `postgres` container below is an explicit OPT-IN only, for a
# machine without PostgreSQL, CI runners, and the PITR drills:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bundled-postgres.yml up
#   NEXUS_BUNDLED_POSTGRES=1 make up     NEXUS_BUNDLED_POSTGRES=1 nexusctl up
#
# Topology, in dependency order:
#   postgres (bundled opt-in), minio, nats → infrastructure (nats is OPTIONAL: an empty
#                                NEXUS_NATS_URL disables the bus and the
#                                stack runs poll-only, ADR-0003)
#   nats-init                  → NATS NKey identities + authorization config
#                                (generated once into volumes), then exits
#   minio-init                 → creates the result bucket, then exits
#   migrate                    → applies services/migrations/*.up.sql, then exits
#   six control-plane services → ADR-0011; each waits for postgres AND migrate
#   two worker agents          → DIFFERENT capacity, so resource-aware
#                                scheduling and the mixed CPU/GPU exit
#                                criterion are actually exercisable
#   ui                         → nginx, serves the console and proxies /v1
#   jaeger                     → OPTIONAL trace collector + UI, only with
#                                `--profile tracing` (see x-tracing-env)
#
# Credentials below are DEV-ONLY and deliberately obvious. They exist so
# `docker compose up` works with no setup; they are not a secret-management
# story and must never be used outside a laptop.

name: nexus

# ── Shared fragments ──────────────────────────────────────────────────────
x-postgres-env: &postgres-env
  # Per-service DB roles are ADR-0011's enforcement mechanism for table
  # ownership. The MVP uses one superuser role because the roles and grants are
  # a migration that does not exist yet; the URL is per-service so switching to
  # distinct roles is a values change, not a topology change.
  #
  # Required, not a convenience: the services have no built-in DSN and exit at
  # startup without one (internal/config.DSN). Every service that touches
  # Postgres must merge this fragment, directly or through *service-env.
  #
  # The host's PostgreSQL (see the header). The bundled-postgres overlay
  # replaces it with the container's URL.
  DATABASE_URL: ${NEXUS_HOST_DATABASE_URL:-postgres://${USER:-postgres}@host.docker.internal:5432/nexus_compose?sslmode=disable}
  # Caps every service's pool; set it on a server shared with other
  # workloads (empty: the services' own defaults).
  NEXUS_DB_MAX_CONNS: ${NEXUS_DB_MAX_CONNS:-}

# host.docker.internal on Linux, where Docker does not define it (Docker
# Desktop does, and this entry is then redundant).
x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

# OpenTelemetry trace export (ADR-0026), the STANDARD variables, passed
# through from the shell so an operator's usual OTEL_* settings apply as-is.
# OFF unless set: OTEL_TRACES_EXPORTER defaults to none, and every other value
# defaults to empty, which the binaries and the OTel SDK treat as unset. To
# trace the whole stack into the bundled Jaeger:
#
#   OTEL_TRACES_EXPORTER=otlp OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 \
#     docker compose -f deploy/docker-compose.yml --profile tracing up
#
# then open http://localhost:16686. Any other collector works the same way
# (grpc: OTEL_EXPORTER_OTLP_PROTOCOL=grpc and port 4317). OTEL_SERVICE_NAME is
# deliberately absent: each binary names itself, and one shared value would
# merge every service into one in the trace UI. Propagation of W3C trace
# context between the services is always on, traced or not.
x-tracing-env: &tracing-env
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  # Parent-based: the process that starts a trace decides once and every hop
  # follows, so a trace is whole or absent. 1.0 keeps every new trace -- right
  # for a laptop; production sizes it down (the chart's default is 0.1).
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=compose}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}

x-service-env: &service-env
  <<: [*postgres-env, *tracing-env]
  LOG_LEVEL: ${NEXUS_LOG_LEVEL:-info}
  # Both spellings: services added later read NEXUS_LOG_LEVEL (the prefixed
  # convention every other setting here follows), while the earlier ones read
  # LOG_LEVEL. Setting only one silently leaves half the fleet at info, which
  # costs a debugging cycle when a diagnostic log does not appear.
  NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-info}
  LOG_FORMAT: json
  NEXUS_NAMESPACE: ${NEXUS_NAMESPACE:-default}
  # Inter-service addressing. Every cross-service write goes through the owner's
  # gRPC API (ADR-0011 rule 1), so every service needs to know where the owners
  # live.
  WORKFLOW_MANAGER_ADDR: workflow-manager:9090
  NEXUS_WORKFLOW_MANAGER_ADDR: workflow-manager:9090
  DAG_ENGINE_ADDR: dag-engine:9090
  NEXUS_DAG_ENGINE_ADDR: dag-engine:9090
  # A scheduler replica drains exactly ONE queue, and ClaimForWorker answers with
  # nothing when the polling worker does not serve that queue. So every queue
  # needs a replica AND the gateway needs to know about all of them: with only
  # `scheduler` listed, a gpu-queue attempt sits PENDING until the run times out,
  # which is indistinguishable from a capacity shortage. The gateway offers a
  # worker poll to each address in turn (see upstream.splitAddrs / claimPeers).
  SCHEDULER_ADDR: scheduler:9090,scheduler-gpu:9090
  NEXUS_SCHEDULER_ADDR: scheduler:9090,scheduler-gpu:9090
  RESOURCE_MANAGER_ADDR: resource-manager:9090
  NEXUS_RESOURCE_MANAGER_ADDR: resource-manager:9090
  EVENT_SERVICE_ADDR: event-service:9090
  NEXUS_EVENT_SERVICE_ADDR: event-service:9090
  API_GATEWAY_ADDR: api-gateway:9091

# The event bus (ADR-0003). Only the event-service (outbox relay, SSE wake-ups)
# and the agents (dispatch hints) connect; the scheduler, dag-engine and
# workflow-manager write outbox rows to Postgres and never talk to NATS. Set
# NEXUS_NATS_URL= (empty) to run without it -- nothing depends_on nats, because
# nothing needs it to be correct.
#
# The broker requires authentication (docs/OPERATIONS.md §11.7): each client
# holds ONE NKey seed, installed by `nats-init` into a volume only that client
# mounts at /etc/nexus/nats. REQUIRE_AUTH makes a missing seed a startup error
# rather than a silent unauthenticated connection.
x-nats-env: &nats-env
  NEXUS_NATS_URL: ${NEXUS_NATS_URL-nats://nats:4222}
  NEXUS_NATS_NKEY_SEED_FILE: /etc/nexus/nats/user.nk
  NEXUS_NATS_REQUIRE_AUTH: "1"

x-nats-init-wait: &nats-init-wait
  nats-init:
    condition: service_completed_successfully

x-minio-env: &minio-env
  # s3 = the MinIO below. azblob and gcs exist (internal/objstore) but need
  # their own account/identity variables, which this laptop stack does not
  # model; it is here so every result-store client is told the same backend.
  NEXUS_RESULT_STORE_BACKEND: ${NEXUS_RESULT_STORE_BACKEND:-s3}
  RESULT_STORE_ENDPOINT: http://minio:9000
  NEXUS_RESULT_STORE_ENDPOINT: http://minio:9000
  NEXUS_S3_USE_TLS: "false"
  RESULT_STORE_BUCKET: ${NEXUS_RESULT_BUCKET:-nexus-results}
  NEXUS_RESULT_STORE_BUCKET: ${NEXUS_RESULT_BUCKET:-nexus-results}
  RESULT_STORE_REGION: us-east-1
  NEXUS_RESULT_STORE_REGION: us-east-1
  RESULT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-nexusadmin}
  NEXUS_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-nexusadmin}
  RESULT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-nexus-dev-password}
  NEXUS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-nexus-dev-password}
  # Results at or below this size are inlined in Postgres rather than costing two
  # round-trips to the blob store (ADR-0008; §12 proposes 64 KiB).
  RESULT_STORE_INLINE_THRESHOLD_BYTES: "65536"

# Notifications, webhook triggers and sensors (ADR-0028, docs/OPERATIONS.md §27).
# NEXUS_SECRET_KEY seals channel and trigger secrets at rest; the gateway seals,
# the event-service opens, so both must hold the SAME key. The default below is a
# DEVELOPMENT key, public in this file: any real deployment sets its own
# (openssl rand -base64 32) or leaves it unset and uses secret references.
x-events-env: &events-env
  NEXUS_SECRET_KEY: ${NEXUS_SECRET_KEY:-ZGV2LW9ubHktbmV4dXMtc2VjcmV0LWtleS0zMmJ5dGU=}
  # Local receivers (a webhook on the host, Mailpit) are private addresses; a
  # real deployment keeps this false so a channel cannot reach internal services.
  NEXUS_NOTIFY_ALLOW_PRIVATE_TARGETS: ${NEXUS_NOTIFY_ALLOW_PRIVATE_TARGETS:-true}

x-go-build: &go-build
  context: ..
  dockerfile: deploy/Dockerfile.service

# Common wait: the migration job exited 0 (with the bundled-postgres overlay,
# also the container healthy). A service that starts against an unmigrated
# schema fails in a way that looks like a code bug.
x-depends-on-db: &depends-on-db
  migrate:
    condition: service_completed_successfully

x-service-healthcheck: &service-healthcheck
  # Every service exposes /healthz + /readyz (ADR-0011 rule 3). /readyz is the
  # right probe for dependency ordering: it means "I can serve", not merely "my
  # process is alive".
  test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/readyz || exit 1"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 15s

services:
  # ── Infrastructure ──────────────────────────────────────────────────────
  # OPT-IN only (deploy/docker-compose.bundled-postgres.yml enables it): no
  # profile of this name is ever activated by default.
  postgres:
    profiles: ["bundled-postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus-dev-password   # DEV ONLY
      POSTGRES_DB: nexus
      # Faster and adequate for a laptop; never for a real deployment.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      # Postgres IS the dispatch queue (ADR-0002), so the connection budget has
      # to cover six services plus agents plus a human with psql open.
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    ports:
      - "${NEXUS_POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -d nexus matters: pg_isready with no database succeeds while the initdb
      # bootstrap database is still being replaced, which lets dependents start
      # a beat too early.
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    # Silo, the community-maintained MinIO fork, pinned by digest. MinIO Inc.
    # stopped publishing community images (Docker Hub, then quay.io: 401) and
    # archived minio/minio, so no official pullable image exists any more.
    # Drop-in: same S3 API, MINIO_* variables, on-disk format and `server`
    # argv; the image also bundles `mc`. Decision and supply-chain assessment:
    # CONTRACT-FINDINGS.md F111, docs/OPERATIONS.md section 22.
    image: &silo-image docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexusadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexus-dev-password}   # DEV ONLY
    ports:
      - "${NEXUS_MINIO_PORT:-9010}:9000"
      - "${NEXUS_MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # One-shot: NKey identities and the broker's authorization config
  # (deploy/nats/nexus-nats-auth.sh compose-init). Keys are generated ONCE into
  # the nats-auth-store volume and reused on every later `up`; nothing is ever
  # written to the source tree. Each consumer gets its own volume holding only
  # its own seed, so the event-service cannot read an agent's key or vice versa.
  # The monitor (SYS account) seed stays in the store; use it through this
  # container, e.g.
  #   docker compose -f deploy/docker-compose.yml run --rm --entrypoint nats nats-init \
  #     --server nats://nats:4222 --nkey /store/monitor/user.nk server report jetstream
  # DEV ONLY in the sense that the store volume holds every seed; see
  # docs/OPERATIONS.md §11.7 for where seeds live elsewhere.
  nats-init:
    image: natsio/nats-box:0.18.0
    user: "0:0"
    entrypoint: ["sh", "/nexus/nexus-nats-auth.sh"]
    # The agents' tenant: their NKey may subscribe to its dispatch hints only.
    command: ["compose-init", "--tenant", "${NEXUS_AGENT_NAMESPACE:-${NEXUS_NAMESPACE:-default}}"]
    environment:
      NEXUS_NATS_DIR: /store
    volumes:
      # render_compose.py inlines this script for the Portainer host, which has
      # no source tree to bind-mount it from.
      - ./nats/nexus-nats-auth.sh:/nexus/nexus-nats-auth.sh:ro
      - nats-auth-store:/store
      - nats-auth-server:/out/server
      - nats-auth-event-service:/out/event-service
      - nats-auth-agent:/out/agent
    restart: "no"

  nats:
    # Pinned to the newest patch of the 2.14 line rather than 2.15.0, which was
    # days old when this was written; move to 2.15.x once it has a patch release.
    image: nats:2.14.7-alpine
    depends_on: *nats-init-wait
    # The rendered config enables JetStream on /data (NEXUS_RUNS survives a
    # restart), requires an NKey for every client (no anonymous user) and
    # serves monitoring on the container's LOOPBACK only: the monitoring port
    # has no authentication and /connz lists every client. After changing
    # identities, re-run nats-init and `docker compose kill -s HUP nats`.
    #
    # Streams created before authorization live in the global account ($G),
    # which no configured account owns, so the server could never recover
    # them. They carry only notifications (PostgreSQL is authoritative) and
    # the event-service recreates its streams in the NEXUS account, so the old
    # store is moved aside -- never deleted -- before the server starts
    # (docs/OPERATIONS.md §11.7, upgrading an existing broker).
    entrypoint: ["sh", "-c"]
    command:
      - |
        legacy='/data/jetstream/$$G'
        if [ -d "$$legacy" ]; then
          dest="/data/retired-global-account-$$(date -u +%Y%m%dT%H%M%SZ)"
          mv "$$legacy" "$$dest"
          echo "moved pre-authorization JetStream store $$legacy to $$dest; delete it once the upgrade is verified"
        fi
        exec nats-server -c /etc/nats/nats.conf
    ports:
      # Loopback: host tools and agents run on the laptop reach it; nothing
      # else on the network does. The monitoring port is not published.
      - "127.0.0.1:${NEXUS_NATS_PORT:-4222}:4222"
    volumes:
      - nats-data:/data
      - nats-auth-server:/etc/nats:ro
    healthcheck:
      # js-enabled-only: healthy means JetStream is actually serving, not merely
      # that the process accepts connections.
      test: ["CMD-SHELL", "wget -q -O- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Bucket auto-creation. A separate one-shot container rather than a service
  # startup step, for the same reason as migrations: exactly one actor performs
  # the setup, and everything else waits for it to finish.
  minio-init:
    # The same image as the server: it bundles a version-matched `mc`, and one
    # attested digest is one fewer third-party artifact to trust (F111).
    image: *silo-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set nexus "$${RESULT_STORE_ENDPOINT}" "$${RESULT_STORE_ACCESS_KEY}" "$${RESULT_STORE_SECRET_KEY}"
        # --ignore-existing makes a second `compose up` a no-op rather than a failure.
        mc mb --ignore-existing "nexus/$${RESULT_STORE_BUCKET}"
        # Results are content-addressed and immutable; versioning would only
        # accumulate garbage for content that can never change (ADR-0008).
        mc anonymous set none "nexus/$${RESULT_STORE_BUCKET}"
        echo "minio-init: bucket $${RESULT_STORE_BUCKET} ready"
    restart: "no"

  # Development mail catcher. Accepts SMTP on 1025 from the gateway and shows
  # every message at http://localhost:8025, so verification and reset links can
  # be followed without a real mail server. Pinned, like every other image here,
  # so a laptop and CI catch the same behaviour. The web UI is bound to loopback:
  # it displays live reset links, which are credentials.
  mailpit:
    image: axllent/mailpit:v1.27.0
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "false"
    ports:
      - "127.0.0.1:${NEXUS_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # ── Migration job (ADR-0011 rule 4) ─────────────────────────────────────
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migrate
    extra_hosts: *host-gateway
    environment:
      <<: *postgres-env
      MIGRATIONS_DIR: /migrations
      # A missing database is created (the role needs CREATEDB, as a
      # Homebrew server's owner has), and an unreachable server fails fast
      # with what to do about it rather than after a minute of retries.
      NEXUS_MIGRATE_CREATE_DATABASE: "true"
      NEXUS_MIGRATE_WAIT_SECONDS: ${NEXUS_MIGRATE_WAIT_SECONDS:-15}
    volumes:
      # Read-only: the job applies the frozen migrations, it does not author them.
      - ../services/migrations:/migrations:ro
    restart: "no"

  # ── Control plane: six services, ADR-0011 ───────────────────────────────
  api-gateway:
    build:
      <<: *go-build
      args:
        # SERVICE_PATH is the main package. It is passed explicitly for every
        # service because the six services do not all place main in the same
        # spot (some use cmd/<name>/), and an implicit convention that half the
        # repo violates is worse than none. Override per service if a main
        # package moves: --build-arg SERVICE_PATH=services/x/cmd/x
        SERVICE: api-gateway
        SERVICE_PATH: services/api-gateway/cmd/api-gateway
    depends_on: *depends-on-db
    extra_hosts: *host-gateway
    environment:
      <<: [*service-env, *minio-env, *events-env]
      # true = an inbound REST traceparent becomes a span link, not the parent,
      # so callers cannot pick the trace a request joins. Set it where the REST
      # port faces callers you do not control; a laptop does not.
      NEXUS_TRACING_PUBLIC_ENDPOINT: ${NEXUS_TRACING_PUBLIC_ENDPOINT:-false}
      HTTP_ADDR: ":8080"        # REST for humans, CLI, UI (§8.2)
      NEXUS_HTTP_ADDR: ":8080"
      NEXUS_REST_ADDR: ":8080"
      NEXUS_WFM_HEALTH_ADDR: ":8080"
      RM_HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9091"        # worker RPCs (§8.1) — deliberately a separate
      NEXUS_GRPC_ADDR: ":9091"
      NEXUS_WFM_GRPC_ADDR: ":9091"
      RM_GRPC_ADDR: ":9091"
                                # listener so chatty worker traffic never
                                # contends with UI queries (§3.2)
      # Static API keys are the MVP authn story (§11). `make seed` inserts one.
      AUTH_MODE: api_key
      # Agent admission gate (docs/COMPATIBILITY.md §4.4); off unless set. The
      # compose agents are "dev" builds, so a minimum version refuses them.
      NEXUS_MIN_AGENT_VERSION: ${NEXUS_MIN_AGENT_VERSION:-}
      NEXUS_REQUIRED_AGENT_CAPABILITIES: ${NEXUS_REQUIRED_AGENT_CAPABILITIES:-}
      # Email verification and password recovery (docs/OPERATIONS.md, "Email").
      # Defaults send to the Mailpit catcher below, so every flow is testable
      # locally and nothing leaves the laptop. Each value is overridable because
      # render_compose.py deploys THIS file: a real host must set NEXUS_SMTP_HOST
      # and friends, or its users' reset mail lands in a catcher nobody reads.
      NEXUS_SMTP_HOST: ${NEXUS_SMTP_HOST:-mailpit}
      NEXUS_SMTP_PORT: ${NEXUS_SMTP_PORT:-1025}
      NEXUS_SMTP_TLS: ${NEXUS_SMTP_TLS:-none}
      NEXUS_SMTP_USERNAME: ${NEXUS_SMTP_USERNAME:-}
      NEXUS_SMTP_PASSWORD: ${NEXUS_SMTP_PASSWORD:-}
      NEXUS_SMTP_FROM: ${NEXUS_SMTP_FROM:-KGF Nexus <no-reply@nexus.localhost>}
      # Links in emails point at the console, which is where the verify and
      # reset pages live -- not at this gateway.
      NEXUS_PUBLIC_URL: ${NEXUS_PUBLIC_URL:-http://localhost:3000}
      # Proxies whose X-Forwarded-* headers decide webhook trigger URLs ahead
      # of NEXUS_PUBLIC_URL (OPERATIONS §27.1). Empty trusts none.
      NEXUS_TRUSTED_PROXIES: ${NEXUS_TRUSTED_PROXIES:-}
      # KGF Cloud context authentication (ADR-0024, OPERATIONS §24). Standalone
      # unless set; kgf/both need the gateway's key document or static keys.
      NEXUS_AUTH_MODE: ${NEXUS_AUTH_MODE:-standalone}
      # Comma-separated key-document URLs (gateway and provider fronts), merged
      # with the static keys (ADR-0034).
      NEXUS_KGF_CONTEXT_KEYS_URL: ${NEXUS_KGF_CONTEXT_KEYS_URL:-}
      NEXUS_KGF_CONTEXT_PUBLIC_KEYS: ${NEXUS_KGF_CONTEXT_PUBLIC_KEYS:-}
      # KGF provider fronts allowed to name a KGF.Nexus workspace (`res`).
      NEXUS_KGF_FRONT_ISSUERS: ${NEXUS_KGF_FRONT_ISSUERS:-}
      # The operations listener: /metrics, /healthz, /readyz. NOT the REST port,
      # which is the public ingress (docs/OPERATIONS.md, "Metrics").
      NEXUS_METRICS_ADDR: ":8088"
    ports:
      - "${NEXUS_API_PORT:-8090}:8080"
      - "${NEXUS_GRPC_PORT:-9091}:9091"
      # Loopback only: metrics are for an operator's local Prometheus, not the LAN.
      - "127.0.0.1:${NEXUS_GATEWAY_METRICS_PORT:-19100}:8088"
    healthcheck: *service-healthcheck
    restart: unless-stopped

  workflow-manager:
    build:
      <<: *go-build
      args:
        SERVICE: workflow-manager
        SERVICE_PATH: services/workflow-manager/cmd/workflow-manager
    depends_on: *depends-on-db
    extra_hosts: *host-gateway
    environment:
      # minio-env: object-store sensors (ADR-0028) list the result store unless
      # NEXUS_SENSOR_S3_* names another endpoint.
      <<: [*service-env, *minio-env]
      HTTP_ADDR: ":8080"
      NEXUS_HTTP_ADDR: ":8080"
      NEXUS_REST_ADDR: ":8080"
      NEXUS_WFM_HEALTH_ADDR: ":8080"
      RM_HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      NEXUS_GRPC_ADDR: ":9090"
      NEXUS_WFM_GRPC_ADDR: ":9090"
      RM_GRPC_ADDR: ":9090"
      # A single reconciler polls timers WHERE fire_at <= now() FOR UPDATE SKIP
      # LOCKED (§3.2). Every deadline in the system is a row in that table.
      TIMER_POLL_INTERVAL_MS: "1000"
    # /metrics on the health listener, published on LOOPBACK only (docs/OPERATIONS.md, "Metrics").
    ports:
      - "127.0.0.1:${NEXUS_WFM_METRICS_PORT:-19101}:8080"
    healthcheck: *service-healthcheck
    restart: unless-stopped

  dag-engine:
    build:
      <<: *go-build
      args:
        SERVICE: dag-engine
        SERVICE_PATH: services/dag-engine
    depends_on: *depends-on-db
    extra_hosts: *host-gateway
    environment:
      <<: *service-env
      HTTP_ADDR: ":8080"
      NEXUS_HTTP_ADDR: ":8080"
      NEXUS_REST_ADDR: ":8080"
      NEXUS_WFM_HEALTH_ADDR: ":8080"
      RM_HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      NEXUS_GRPC_ADDR: ":9090"
      NEXUS_WFM_GRPC_ADDR: ":9090"
      RM_GRPC_ADDR: ":9090"
    # /metrics on the health listener, published on LOOPBACK only (docs/OPERATIONS.md, "Metrics").
    ports:
      - "127.0.0.1:${NEXUS_DAG_METRICS_PORT:-19102}:8080"
    healthcheck: *service-healthcheck
    restart: unless-stopped

  scheduler:
    build:
      <<: *go-build
      args:
        SERVICE: scheduler
        SERVICE_PATH: services/scheduler
    depends_on: *depends-on-db
    extra_hosts: *host-gateway
    environment:
      <<: *service-env
      HTTP_ADDR: ":8080"
      NEXUS_HTTP_ADDR: ":8080"
      NEXUS_REST_ADDR: ":8080"
      NEXUS_WFM_HEALTH_ADDR: ":8080"
      RM_HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      NEXUS_GRPC_ADDR: ":9090"
      NEXUS_WFM_GRPC_ADDR: ":9090"
      RM_GRPC_ADDR: ":9090"
      # best_fit reduces fragmentation; spread is available for
      # resilience-sensitive workloads (§3.2).
      SCHEDULER_BIN_PACKING: best_fit
      # Bounded look-ahead prevents a large GPU task at the head of the queue
      # from blocking small ones, while the aging term guarantees the blocked
      # large task eventually wins. Without both, naive priority queues starve
      # big jobs forever.
      SCHEDULER_LOOKAHEAD: "32"
      SCHEDULER_AGING_MS: "30000"
      # Correctness comes from the atomic claim (§5.3), not leader election, so
      # replicas can be scaled up freely: `docker compose up --scale scheduler=3`.
      SCHEDULER_POLL_INTERVAL_MS: "500"
      LEASE_TTL_MS: "30000"
    # /metrics on the health listener, loopback only. A RANGE, because this
    # service may be scaled (`--scale scheduler=3`) and each replica needs a port.
    ports:
      - "127.0.0.1:${NEXUS_SCHEDULER_METRICS_PORTS:-19110-19119}:8080"
    healthcheck: *service-healthcheck
    restart: unless-stopped

  # A scheduler replica drains exactly ONE queue (NEXUS_QUEUE), and it also
  # refuses a worker's poll unless that queue is among the worker's queues. So
  # the `gpu` queue needs its own replica: without it, every gpu-queue attempt
  # sits PENDING forever with no pending_reason, which is indistinguishable
  # from a capacity shortage. The Phase 1 exit criterion ("a 10-node DAG with
  # mixed CPU/GPU tasks completes correctly") cannot be met without this.
  scheduler-gpu:
    build:
      <<: *go-build
      args:
        SERVICE: scheduler
        SERVICE_PATH: services/scheduler
    depends_on: *depends-on-db
    extra_hosts: *host-gateway
    environment:
      <<: *service-env
      HTTP_ADDR: ":8080"
      NEXUS_HTTP_ADDR: ":8080"
      NEXUS_REST_ADDR: ":8080"
      NEXUS_WFM_HEALTH_ADDR: ":8080"
      RM_HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      NEXUS_GRPC_ADDR: ":9090"
      NEXUS_WFM_GRPC_ADDR: ":9090"
      RM_GRPC_ADDR: ":9090"
      NEXUS_QUEUE: gpu
      SCHEDULER_BIN_PACKING: best_fit
      SCHEDULER_LOOKAHEAD: "32"
      SCHEDULER_AGING_MS: "30000"
      SCHEDULER_POLL_INTERVAL_MS: "500"
      LEASE_TTL_MS: "30000"
    # /metrics on the health listener, published on LOOPBACK only (docs/OPERATIONS.md, "Metrics").
    ports:
      - "127.0.0.1:${NEXUS_SCHEDULER_GPU_METRICS_PORT:-19104}:8080"
    healthcheck: *service-healthcheck
    restart: unless-stopped

  resource-manager:
    build:
      <<: *go-build
      args:
        SERVICE: resource-manager
        SERVICE_PATH: services/resource-manager/cmd/resource-manager
    depends_on: *depends-on-db
    extra_hosts: *host-gateway
    environment:
      <<: *service-env
      HTTP_ADDR: ":8080"
      NEXUS_HTTP_ADDR: ":8080"
      NEXUS_REST_ADDR: ":8080"
      NEXUS_WFM_HEALTH_ADDR: ":8080"
      RM_HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      NEXUS_GRPC_ADDR: ":9090"
      NEXUS_WFM_GRPC_ADDR: ":9090"
      RM_GRPC_ADDR: ":9090"
      # Three missed heartbeats. Reconciliation against the worker's reported
      # running_attempt_ids is what stops the capacity ledger drifting (§3.2).
      WORKER_LIVENESS_TIMEOUT_MS: "15000"
      RECONCILE_INTERVAL_MS: "10000"
    # /metrics on the health listener, published on LOOPBACK only (docs/OPERATIONS.md, "Metrics").
    ports:
      - "127.0.0.1:${NEXUS_RM_METRICS_PORT:-19105}:8080"
    healthcheck: *service-healthcheck
    restart: unless-stopped

  event-service:
    build:
      <<: *go-build
      args:
        SERVICE: event-service
        SERVICE_PATH: services/event-service/cmd/event-service
    depends_on:
      <<: [*depends-on-db, *nats-init-wait]
    extra_hosts: *host-gateway
    volumes:
      - nats-auth-event-service:/etc/nexus/nats:ro
    environment:
      <<: [*service-env, *nats-env, *events-env]
      HTTP_ADDR: ":8080"
      NEXUS_HTTP_ADDR: ":8080"
      NEXUS_REST_ADDR: ":8080"
      NEXUS_WFM_HEALTH_ADDR: ":8080"
      RM_HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      NEXUS_GRPC_ADDR: ":9090"
      NEXUS_WFM_GRPC_ADDR: ":9090"
      RM_GRPC_ADDR: ":9090"
      # Notification email goes through the same SMTP settings as the gateway's
      # account mail (Mailpit locally), and links point at the console.
      NEXUS_SMTP_HOST: ${NEXUS_SMTP_HOST:-mailpit}
      NEXUS_SMTP_PORT: ${NEXUS_SMTP_PORT:-1025}
      NEXUS_SMTP_TLS: ${NEXUS_SMTP_TLS:-none}
      NEXUS_SMTP_USERNAME: ${NEXUS_SMTP_USERNAME:-}
      NEXUS_SMTP_PASSWORD: ${NEXUS_SMTP_PASSWORD:-}
      NEXUS_SMTP_FROM: ${NEXUS_SMTP_FROM:-KGF Nexus <no-reply@nexus.localhost>}
      NEXUS_CONSOLE_URL: ${NEXUS_PUBLIC_URL:-http://localhost:3000}
      # Outbox relay tuning (services/event-service/relay). Defaults shown.
      NEXUS_OUTBOX_RETENTION: 1h
      NEXUS_OUTBOX_MAX_AGE: 24h
      # run_events is append-only (invariant 8); this service is its sole writer.
      EVENT_SSE_KEEPALIVE_MS: "15000"
    # /metrics on the health listener, published on LOOPBACK only (docs/OPERATIONS.md, "Metrics").
    ports:
      - "127.0.0.1:${NEXUS_EVENT_METRICS_PORT:-19106}:8080"
    healthcheck: *service-healthcheck
    restart: unless-stopped

  # ── Execution plane: two agents with DIFFERENT capacity ─────────────────
  # The capacities differ on purpose. The Phase 1 exit criterion is a 10-node
  # DAG with MIXED CPU/GPU tasks completing correctly, which is only a real test
  # if some tasks can run on one worker and not the other. Two identical workers
  # would let a broken resource matcher pass.
  agent-cpu:
    build:
      <<: *go-build
      args:
        SERVICE: agent
        SERVICE_PATH: agent/cmd/nexus-agent
    depends_on:
      <<: *nats-init-wait
      api-gateway:
        condition: service_healthy
    environment:
      <<: [*minio-env, *nats-env, *tracing-env]
      # Workers hold an API token and never database credentials: a compromised
      # worker cannot corrupt runs it never touched (§3.1 invariant 2).
      NEXUS_CONTROL_PLANE: api-gateway:9091
      NEXUS_API_KEY: ${NEXUS_WORKER_API_KEY:?is unset. First run on a fresh checkout - use `make quickstart` (nexusctl up). Own keys - export NEXUS_WORKER_API_KEY=$$(make -s worker-key), then make up and make seed}
      # The tenant this agent serves: NEXUS_AGENT_NAMESPACE, else the stack's
      # NEXUS_NAMESPACE, else "default". The worker key must belong to it
      # (`make seed AGENT_NAMESPACE=...`), and nats-init issues the agent NKey
      # for the same tenant.
      NEXUS_NAMESPACE: ${NEXUS_AGENT_NAMESPACE:-${NEXUS_NAMESPACE:-default}}
      NEXUS_QUEUES: default
      NEXUS_LABELS: "zone=local,accelerator=none"
      NEXUS_EXECUTORS: subprocess,docker
      # 8 cores / 16 GiB / no GPU.
      NEXUS_CPU_MILLIS: "8000"
      NEXUS_MEMORY_BYTES: "17179869184"
      NEXUS_GPU_COUNT: "0"
      NEXUS_DISK_BYTES: "53687091200"
      # A countable pooled resource, exercised by ten_node_mixed's `register`
      # node. The scheduler has always supported custom dimensions; without a
      # worker advertising one, that half of the fit check was dead code in
      # practice and the node could never be placed.
      NEXUS_CUSTOM_RESOURCES: "license_token=2"
      NEXUS_HEARTBEAT_INTERVAL_MS: "5000"
      NEXUS_METRICS_ADDR: ":8089"
      # The local write-ahead log is what lets a restarted agent know it started
      # a task but not how it ended, and report INDETERMINATE rather than
      # guessing (§6.3).
      NEXUS_WAL_DIR: /var/lib/nexus/wal
      NEXUS_WORK_DIR: ${NEXUS_AGENT_WORK_DIR:-/tmp/nexus-agent-work}
      LOG_LEVEL: ${NEXUS_LOG_LEVEL:-info}
    ports:
      # /metrics (agent), loopback only.
      - "127.0.0.1:${NEXUS_AGENT_CPU_METRICS_PORT:-19120}:8089"
    volumes:
      - agent-cpu-wal:/var/lib/nexus/wal
      # This tenant's agent NKey only (subscribe nexus.task.dispatch.<ns>.>).
      - nats-auth-agent:/etc/nexus/nats:ro
      - chaos-effects:/var/lib/nexus/effects
      # The docker executor runs tasks as sibling containers. Mounting the host
      # socket is effectively root on the host — acceptable on a laptop, never
      # in production, where the k8s executor (ADR-0007) is the answer.
      - /var/run/docker.sock:/var/run/docker.sock
      # Attempt work directories, at the SAME path on the host and in the
      # agent: the docker executor bind-mounts them into task containers by
      # path, and the daemon resolves that path on the host (F144).
      - ${NEXUS_AGENT_WORK_DIR:-/tmp/nexus-agent-work}:${NEXUS_AGENT_WORK_DIR:-/tmp/nexus-agent-work}
    # The agent runs as uid 10001, so it can use that socket only through the
    # socket's group. Docker Desktop's VM-side socket is root:root 0660, hence
    # the default 0; on a Linux host the socket is usually root:docker, and
    # `nexusctl up` sets NEXUS_DOCKER_SOCKET_GID from it (for plain compose:
    # NEXUS_DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)). Without it
    # the agent logs "docker daemon unreachable", advertises no docker
    # executor, and every docker task waits unplaced (F144).
    group_add:
      - "${NEXUS_DOCKER_SOCKET_GID:-0}"
    restart: unless-stopped

  agent-gpu:
    build:
      <<: *go-build
      args:
        SERVICE: agent
        SERVICE_PATH: agent/cmd/nexus-agent
    depends_on:
      <<: *nats-init-wait
      api-gateway:
        condition: service_healthy
    environment:
      <<: [*minio-env, *nats-env, *tracing-env]
      NEXUS_CONTROL_PLANE: api-gateway:9091
      NEXUS_API_KEY: ${NEXUS_WORKER_API_KEY:?is unset. First run on a fresh checkout - use `make quickstart` (nexusctl up). Own keys - export NEXUS_WORKER_API_KEY=$$(make -s worker-key), then make up and make seed}
      # The tenant this agent serves: NEXUS_AGENT_NAMESPACE, else the stack's
      # NEXUS_NAMESPACE, else "default". The worker key must belong to it
      # (`make seed AGENT_NAMESPACE=...`), and nats-init issues the agent NKey
      # for the same tenant.
      NEXUS_NAMESPACE: ${NEXUS_AGENT_NAMESPACE:-${NEXUS_NAMESPACE:-default}}
      # Subscribes to BOTH queues so gpu work has somewhere to go while the
      # cpu-only agent still handles the default queue.
      NEXUS_QUEUES: default,gpu
      # gpu-interconnect is what ten_node_mixed's train_large selects on. A
      # node_selector with no worker carrying the label is unsatisfiable, and the
      # example is the Phase 1 exit criterion, so the label ships with the fleet.
      NEXUS_LABELS: "zone=local,accelerator=nvidia,gpu-interconnect=nvlink"
      NEXUS_EXECUTORS: subprocess,docker
      # 4 cores / 32 GiB / 2 simulated GPUs. Advertised capacity is a ledger
      # entry, not a hardware probe, so the scheduler's GPU matching is
      # exercisable on a machine with no GPU at all.
      NEXUS_CPU_MILLIS: "4000"
      NEXUS_MEMORY_BYTES: "34359738368"
      NEXUS_GPU_COUNT: "2"
      NEXUS_GPU_KIND: ${NEXUS_GPU_KIND:-nvidia-a100}
      NEXUS_GPU_MEMORY_BYTES: "42949672960"
      # Fractional GPUs (ADR-0029), simulated like the whole ones: one A100
      # partitioned into MIG instances (synthetic UUIDs; the agent labels the
      # worker simulated=true) and two shared devices, one time-sliced and one
      # under MPS. Indices 2 and 3 because 0 and 1 are the whole GPUs above:
      # a device is in exactly one mode. examples/gpu_sharing runs on these.
      NEXUS_GPU_MIG: "1g.10gb=3;3g.40gb=1"
      NEXUS_GPU_SHARED: "2:timeslice:40Gi,3:mps:40Gi"
      # Node-local model/dataset cache (ADR-0030 §4).
      NEXUS_ARTIFACT_CACHE_DIR: /var/lib/nexus/artifacts
      NEXUS_ARTIFACT_CACHE_BYTES: 2Gi
      NEXUS_DISK_BYTES: "53687091200"
      NEXUS_HEARTBEAT_INTERVAL_MS: "5000"
      NEXUS_METRICS_ADDR: ":8089"
      NEXUS_WAL_DIR: /var/lib/nexus/wal
      NEXUS_WORK_DIR: ${NEXUS_AGENT_WORK_DIR:-/tmp/nexus-agent-work}
      LOG_LEVEL: ${NEXUS_LOG_LEVEL:-info}
    ports:
      # /metrics (agent), loopback only.
      - "127.0.0.1:${NEXUS_AGENT_GPU_METRICS_PORT:-19121}:8089"
    volumes:
      - agent-gpu-wal:/var/lib/nexus/wal
      # This tenant's agent NKey only (subscribe nexus.task.dispatch.<ns>.>).
      - nats-auth-agent:/etc/nexus/nats:ro
      - chaos-effects:/var/lib/nexus/effects
      - /var/run/docker.sock:/var/run/docker.sock
      # Attempt work directories, at the SAME path on the host and in the
      # agent: the docker executor bind-mounts them into task containers by
      # path, and the daemon resolves that path on the host (F144).
      - ${NEXUS_AGENT_WORK_DIR:-/tmp/nexus-agent-work}:${NEXUS_AGENT_WORK_DIR:-/tmp/nexus-agent-work}
    group_add:
      - "${NEXUS_DOCKER_SOCKET_GID:-0}"  # see agent-cpu (F144)
    restart: unless-stopped

  # A SECOND gpu agent, advertising nvidia-a10 rather than a100.
  #
  # It exists so gpu_kind matching is exercised by the shipped stack and not only
  # in unit tests: ten_node_mixed asks for an a10 in train_small and an a100 in
  # train_large, so a correct scheduler must send each to a different worker. With
  # one gpu worker the a10 task is simply unplaceable, which is what made the
  # example unrunnable on its own fleet (F60).
  #
  # No nvlink label and one GPU: it must NOT be able to take train_large.
  agent-gpu-a10:
    build:
      <<: *go-build
      args:
        SERVICE: agent
        SERVICE_PATH: agent/cmd/nexus-agent
    depends_on:
      <<: *nats-init-wait
      api-gateway:
        condition: service_healthy
    environment:
      <<: [*minio-env, *nats-env, *tracing-env]
      NEXUS_CONTROL_PLANE: api-gateway:9091
      NEXUS_API_KEY: ${NEXUS_WORKER_API_KEY:?is unset. First run on a fresh checkout - use `make quickstart` (nexusctl up). Own keys - export NEXUS_WORKER_API_KEY=$$(make -s worker-key), then make up and make seed}
      # The tenant this agent serves: NEXUS_AGENT_NAMESPACE, else the stack's
      # NEXUS_NAMESPACE, else "default". The worker key must belong to it
      # (`make seed AGENT_NAMESPACE=...`), and nats-init issues the agent NKey
      # for the same tenant.
      NEXUS_NAMESPACE: ${NEXUS_AGENT_NAMESPACE:-${NEXUS_NAMESPACE:-default}}
      NEXUS_QUEUES: default,gpu
      NEXUS_LABELS: "zone=local,accelerator=nvidia"
      NEXUS_EXECUTORS: subprocess,docker
      NEXUS_CPU_MILLIS: "4000"
      NEXUS_MEMORY_BYTES: "17179869184"
      NEXUS_GPU_COUNT: "1"
      NEXUS_GPU_KIND: nvidia-a10
      NEXUS_GPU_MEMORY_BYTES: "25769803776"
      NEXUS_DISK_BYTES: "53687091200"
      NEXUS_HEARTBEAT_INTERVAL_MS: "5000"
      NEXUS_METRICS_ADDR: ":8089"
      NEXUS_WAL_DIR: /var/lib/nexus/wal
      NEXUS_WORK_DIR: ${NEXUS_AGENT_WORK_DIR:-/tmp/nexus-agent-work}
      LOG_LEVEL: ${NEXUS_LOG_LEVEL:-info}
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-info}
    ports:
      # /metrics (agent), loopback only.
      - "127.0.0.1:${NEXUS_AGENT_GPU_A10_METRICS_PORT:-19122}:8089"
    volumes:
      - agent-gpu-a10-wal:/var/lib/nexus/wal
      # This tenant's agent NKey only (subscribe nexus.task.dispatch.<ns>.>).
      - nats-auth-agent:/etc/nexus/nats:ro
      - chaos-effects:/var/lib/nexus/effects
      - /var/run/docker.sock:/var/run/docker.sock
      # Attempt work directories, at the SAME path on the host and in the
      # agent: the docker executor bind-mounts them into task containers by
      # path, and the daemon resolves that path on the host (F144).
      - ${NEXUS_AGENT_WORK_DIR:-/tmp/nexus-agent-work}:${NEXUS_AGENT_WORK_DIR:-/tmp/nexus-agent-work}
    group_add:
      - "${NEXUS_DOCKER_SOCKET_GID:-0}"  # see agent-cpu (F144)
    restart: unless-stopped

  # ── Tracing (optional) ────────────────────────────────────────────────────
  # Jaeger v2 (an OpenTelemetry Collector distribution) as the OTLP receiver,
  # span store (in memory: gone on restart) and UI. Started ONLY with
  # `--profile tracing`, and nothing depends_on it: a stack without it is the
  # default, and a collector that is down costs spans, never requests.
  # Pinned by digest like every upstream image here (OPERATIONS §22).
  jaeger:
    image: jaegertracing/jaeger:2.10.0@sha256:8c593d8048d86334eb52dba26633b6c846b8ecbe5c22905702c932ae97baeb42
    profiles: ["tracing"]
    environment:
      # Jaeger v2's bundled config binds its receivers and UI to localhost
      # unless told otherwise, which would refuse every other container.
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports:
      # Loopback only: OTLP from processes on the host (the Python SDK, a
      # locally run service) and the UI. Containers use jaeger:4317/4318.
      - "127.0.0.1:${NEXUS_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${NEXUS_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${NEXUS_JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  # ── UI ──────────────────────────────────────────────────────────────────
  ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
      args:
        # Empty base: nginx proxies /v1 on the same origin, so the bundle carries
        # no absolute URL and the image works behind any hostname.
        VITE_NEXUS_API_BASE: ""
        VITE_NEXUS_NAMESPACE: ${NEXUS_NAMESPACE:-default}
    depends_on:
      api-gateway:
        # The UI renders an honest error rather than a blank screen when the
        # gateway is down, so it does not strictly need to wait. Waiting anyway
        # means the first page load after `up` shows data instead of an error.
        condition: service_healthy
    ports:
      - "${NEXUS_UI_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  nats-data:
  # NATS identities (nats-init). The store holds every seed; each other volume
  # holds exactly what its one consumer needs.
  nats-auth-store:
  nats-auth-server:
  nats-auth-event-service:
  nats-auth-agent:
  agent-cpu-wal:
  agent-gpu-wal:
  agent-gpu-a10-wal:
  # Shared by every agent so a task's recorded side effect OUTLIVES the worker
  # that produced it. The chaos suite kills a worker mid-task and then counts the
  # effects; a per-agent volume would lose exactly the evidence under test.
  chaos-effects:
