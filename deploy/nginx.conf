# Serves the built console and proxies the API on the same origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached hard; index.html
    # must not be, or a redeploy leaves clients on the old bundle indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: deep links like /runs/<uuid> must serve the app, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requirements. Without these three the live event tail and the log
        # tail buffer indefinitely and the console silently stops updating —
        # which looks exactly like a stalled run, the single most misleading
        # failure this UI can have.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Long enough to hold an idle SSE stream open between events.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Own healthcheck, so compose can tell "nginx is up" from "the gateway is up".
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
