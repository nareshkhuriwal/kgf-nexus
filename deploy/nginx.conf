#
# Serves the built console and proxies the API on the same origin. Rendered by
# the image's entrypoint into /etc/nginx/conf.d at start (deploy/Dockerfile.ui).
#
# 8080, not 80: nginx runs unprivileged (uid 101), and binding a port below
# 1024 would need a capability or a sysctl that Pod Security "restricted" and
# a read-only root filesystem rule out. The compose stack publishes it on the
# host port NEXUS_UI_PORT (default 3000); the chart's ui Service maps its own
# port (ui.service.port, 80) to it.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached hard; index.html
    # must not be, or a redeploy leaves clients on the old bundle indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Revalidate the brand mark. The new filename also bypasses legacy tab icons.
    location ~ ^/(favicon|nexus-logo)\.svg$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # Client-side routing: deep links like /runs/<uuid> must serve the app, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        # Resolve the upstream per-request rather than once at startup.
        #
        # nginx caches an upstream hostname's IP at config-load time when the
        # address is a literal in proxy_pass. Recreating the api-gateway
        # container (any `compose up` that replaces it) gives it a new IP, and
        # nginx then proxies to the old one forever -- surfacing as a 404 from a
        # gateway that is actually healthy, which is a genuinely confusing
        # failure to debug. Using the platform's DNS resolver with the target in
        # a variable forces per-request resolution.
        #
        # Both are filled in at container start (deploy/Dockerfile.ui): Docker's
        # embedded resolver and the compose service name by default; on
        # Kubernetes, the cluster DNS IP and the gateway Service's FQDN -- nginx's
        # resolver does not apply search domains, so a bare name would not
        # resolve there.
        resolver ${NEXUS_DNS_RESOLVER} valid=10s ipv6=off;
        set $upstream_gateway ${NEXUS_GATEWAY_UPSTREAM};
        proxy_pass http://$upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requirements. Without these three the live event tail and the log
        # tail buffer indefinitely and the console silently stops updating —
        # which looks exactly like a stalled run, the single most misleading
        # failure this UI can have.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Long enough to hold an idle SSE stream open between events.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Own healthcheck, so compose can tell "nginx is up" from "the gateway is up".
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
