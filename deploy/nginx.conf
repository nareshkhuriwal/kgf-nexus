# Serves the built console and proxies the API on the same origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached hard; index.html
    # must not be, or a redeploy leaves clients on the old bundle indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The favicon is the one un-hashed file the browser keeps by itself.
    #
    # Its name is fixed -- the <link rel="icon"> in index.html points at
    # /favicon.svg and browsers request it on their own besides -- so it gets
    # none of the fingerprinting that makes /assets/ safe to cache forever. With
    # no Cache-Control at all it fell through to `location /`, and a browser with
    # no instruction applies HEURISTIC caching: it invents a lifetime from
    # Last-Modified, which for a favicon is days. The file changed, the server
    # served the new bytes, and the tab kept drawing the old mark with nothing to
    # say why.
    #
    # must-revalidate with max-age=0 keeps the file cached but makes every use
    # conditional, so the ETag already being sent does its job: a 304 when the
    # mark is unchanged, the new bytes the moment it is not.
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Client-side routing: deep links like /runs/<uuid> must serve the app, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        # Resolve the upstream per-request rather than once at startup.
        #
        # nginx caches an upstream hostname's IP at config-load time when the
        # address is a literal in proxy_pass. Recreating the api-gateway
        # container (any `compose up` that replaces it) gives it a new IP, and
        # nginx then proxies to the old one forever -- surfacing as a 404 from a
        # gateway that is actually healthy, which is a genuinely confusing
        # failure to debug. Using Docker's embedded DNS resolver with the target
        # in a variable forces per-request resolution.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_gateway api-gateway:8080;
        proxy_pass http://$upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requirements. Without these three the live event tail and the log
        # tail buffer indefinitely and the console silently stops updating —
        # which looks exactly like a stalled run, the single most misleading
        # failure this UI can have.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Long enough to hold an idle SSE stream open between events.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Own healthcheck, so compose can tell "nginx is up" from "the gateway is up".
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
