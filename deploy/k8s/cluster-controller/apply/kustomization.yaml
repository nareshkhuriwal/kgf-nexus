#
# Apply mode = the base + the mutating Roles + the process-level permission
# + the scheduler HPA's ownership opt-in. The registry entry must ALSO be
# switched to apply, with the cluster's kube-system UID, from the console
# (Govern -> Infrastructure -> Clusters).
#
# To keep the scheduler HPA hand- or GitOps-managed while the controller
# scales workers, drop scheduler-hpa-owner-patch.yaml: the controller then
# reports the HPA's difference from the saved settings as drift and never
# writes it (docs/adr/0036-scheduler-autoscaling-applied-by-the-controller.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - rbac-apply.yaml
patches:
  - path: allow-apply-patch.yaml
  - path: scheduler-hpa-owner-patch.yaml
