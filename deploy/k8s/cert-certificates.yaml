  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  usages: [digital signature, server auth, client auth]
  issuerRef:
    name: nexus-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
# Agents running INSIDE the cluster. Client-only: an agent serves nothing, and a
# leaf that cannot be used as a server certificate cannot be used to
# impersonate a control-plane service either.
#
# Agents OUTSIDE the cluster (the usual case -- the execution plane leaves the
# control-plane network) cannot mount this secret; see docs/TLS.md §5.5 for
# their enrollment.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nexus-agent
  namespace: kgf-nexus
spec:
  secretName: nexus-agent-tls
  commonName: nexus-agent
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  usages: [digital signature, client auth]
  issuerRef:
    name: nexus-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
