apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nexus-scheduler
  namespace: kgf-nexus
spec:
  secretName: nexus-scheduler-tls
  commonName: scheduler
  # One leaf for every per-queue scheduler replica set: they are the same
  # program with the same trust, and the gateway dials each by its Service name.
  dnsNames:
    - scheduler
    - scheduler.kgf-nexus.svc
    - scheduler.kgf-nexus.svc.cluster.local
    - scheduler-gpu
    - scheduler-gpu.kgf-nexus.svc
    - scheduler-gpu.kgf-nexus.svc.cluster.local
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
