#
# Amazon S3 through IRSA: the EKS pod-identity webhook injects AWS_ROLE_ARN and
# a projected web-identity token from the eks.amazonaws.com/role-arn
# annotation of the chart-created nexus-artifacts ServiceAccount, which the
# three result-store clients share. No static key is rendered, and the
# Secret need not hold minio-root-user / minio-root-password.
# deploy/terraform/environments/eks renders this with
# artifact_identity = "irsa" (its default is EKS Pod Identity).
existingSecret: nexus-credentials
image: { tag: 0123456789ab }
nats:
  auth: { mode: none }
postgres:
  enabled: false
  host: nexus.cluster-x.us-east-1.rds.amazonaws.com
  sslmode: require
minio:
  enabled: false
  endpoint: https://s3.us-east-1.amazonaws.com
  bucket: kgf-nexus-prod-use1-results-abc123
  region: us-east-1
  useTLS: true
resultStore:
  backend: s3
  s3:
    credentials: web-identity
serviceAccounts:
  apiGateway: &artifacts
    name: nexus-artifacts
    annotations: { eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/kgf-nexus-prod-use1-nexus-artifacts" }
  workflowManager: *artifacts
  agent: *artifacts
  artifactGC: *artifacts
