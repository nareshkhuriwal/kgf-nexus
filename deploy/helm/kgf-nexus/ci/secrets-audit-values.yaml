#
# Renders the ADR-0025 surfaces: agent secret providers (config file, a
# KGF CSI-projected Key Vault secret for file://, workload identity for
# akv://) and the audit export (sink key, KGF context verification).
existingSecret: nexus-secrets
image:
  tag: "0.0.0-ci"
nats:
  auth: { mode: none }
agentDefaults:
  secrets:
    configSecret: nexus-agent-secrets
    fileSecrets:
      - { name: kv, secretName: nexus-kv, mountPath: /var/run/secrets/nexus }
    workloadIdentityClientId: 00000000-0000-0000-0000-000000000001
    serviceAccountName: nexus-agent
auditExport:
  sinkKeySecret: nexus-audit-sink-key
  sinkAllowCIDRs: 10.20.0.0/16
  kgfContext:
    publicKeys: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
