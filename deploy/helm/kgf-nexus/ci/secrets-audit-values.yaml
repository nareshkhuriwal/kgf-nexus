#
# Renders the ADR-0025 surfaces: agent secret providers (config file, a
# KGF CSI-projected Key Vault secret for file://, workload identity for
# akv://) and the audit export (sink key), with KGF context attribution in
# standalone mode through the kgf block's keys. The agents run as their own
# chart ServiceAccount, which the Key Vault identity's federated credential
# trusts.
existingSecret: nexus-secrets
image:
  tag: "0.0.0-ci"
nats:
  auth: { mode: none }
agentDefaults:
  secrets:
    configSecret: nexus-agent-secrets
    fileSecrets:
      - { name: kv, secretName: nexus-kv, mountPath: /var/run/secrets/nexus }
    workloadIdentityClientId: 00000000-0000-0000-0000-000000000001
serviceAccounts:
  agent:
    name: nexus-agent
    annotations: { azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000001 }
auditExport:
  sinkKeySecret: nexus-audit-sink-key
  sinkAllowCIDRs: 10.20.0.0/16
kgf:
  authMode: standalone
  contextPublicKeys: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
