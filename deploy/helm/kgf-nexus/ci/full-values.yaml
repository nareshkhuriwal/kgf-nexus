#
# Every optional feature on at once: mTLS with a self-signed bootstrap CA,
# HPAs, the cluster controller in apply mode, custom PDBs, a scheduler HPA and
# OpenTelemetry tracing (headers from a Secret, public REST endpoint).
# Render-only (deploy/helm/validate.sh); apply mode's UID check is skipped by
# `helm template` because lookup returns nothing there.
existingSecret: nexus-credentials
image: { tag: 0123456789ab }
nats:
  auth: { mode: none }
  tls:
    enabled: true
    secretName: nexus-nats-tls
    clientSecrets: { eventService: nexus-event-service-tls, agent: nexus-agent-tls }
tls:
  enabled: true
  certManager:
    natsLeaves: true
    gatewayExtraDnsNames: [workers.example.com]
autoscaling:
  enabled: true
  targetMemoryUtilizationPercentage: 80
services:
  eventService:
    autoscaling: { minReplicas: 3, maxReplicas: 3 }
clusterController:
  enabled: true
  clusterName: dev
  workerNamespaces: [nexus-workers, nexus-gpu-workers]
  apply: { enabled: true, expectedClusterUID: 00000000-0000-0000-0000-000000000000 }
placement:
  priorityClassName: nexus-critical
  topologySpread: { whenUnsatisfiable: DoNotSchedule }
schedulers:
  - name: scheduler
    queue: default
    replicas: 3
    podDisruptionBudget: { minAvailable: 2, maxUnavailable: null }
    nodeSelector: { kubernetes.azure.com/mode: system }
    tolerations: [{ key: CriticalAddonsOnly, operator: Exists, effect: NoSchedule }]
    topologySpread: { maxSkew: 2, topologyKeys: [topology.kubernetes.io/zone] }
    resources:
      requests: { cpu: 250m, memory: 128Mi }
      limits: { memory: 512Mi }
  - name: scheduler-gpu
    queue: gpu
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4 }
metrics:
  serviceMonitor: { enabled: true }
artifactGC:
  mode: delete
  confirmDelete: true
  logRetention: 720h
  pushgatewayUrl: http://prometheus-pushgateway.monitoring:9091
  timeZone: Europe/London
# Tracing on, with a vendor header from a Secret and an untrusted REST edge.
tracing:
  enabled: true
  endpoint: http://otel-collector.observability:4317
  protocol: grpc
  samplerArg: "0.25"
  headersSecret: { name: otel-vendor, key: headers }
  resourceAttributes: deployment.environment.name=ci,cloud.region=local
  publicEndpoint: true
# Runtime identity, per-scheduler placement, the agents' own control-plane
# TLS over this release's mTLS, and the control plane's NetworkPolicy with
# every peer list set (ADR-0035).
cluster:
  name: ci-cluster
agentDefaults:
  controlPlane:
    address: api-gateway.nexus-validate.svc:9091
    tls: { enabled: true, caSecretName: nexus-gateway-ca, serverName: workers.example.com }
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress } }
  metricsFrom:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
  minioFrom:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: nexus-pool } }
      podSelector: { matchLabels: { nexus.khuriwalgroup.com/role: agent } }
