#
# Renders the ADR-0029/0030/0031 agent and scheduler options: a MIG agent, an
# MPS-shared spot agent with eviction handling and an artifact cache, a
# published cluster name and claim placement settings. Self-contained, like
# every ci/ values file deploy/helm/validate.sh renders on its own.
existingSecret: nexus-secrets
image:
  tag: "0.0.0-ci"
nats:
  auth: { mode: none }
claimPlacement:
  policy: pack
  wait: 3s
  headroomTTL: 2m
  maxPreemptionRetries: 5
  preemptionRetryDelay: 2s
  clusterName: gpu-eu-west-1
agents:
  - name: agent-cpu
    queues: default
    cpuMillis: 2000
    memoryBytes: 4294967296
    diskBytes: 10737418240
  - name: agent-a100-mig
    queues: gpu
    labels: "accelerator=nvidia-a100"
    cpuMillis: 32000
    memoryBytes: 137438953472
    diskBytes: 214748364800
    gpuDiscovery: nvidia-smi
  - name: agent-h100-spot
    queues: gpu
    labels: "accelerator=nvidia-h100"
    cpuMillis: 32000
    memoryBytes: 137438953472
    diskBytes: 214748364800
    gpuShared: "0:mps:80Gi,1:mps:80Gi"
    capacityType: spot
    eviction: { sources: "kubernetes,aws", grace: 25s }
    artifactCache: { bytes: 200Gi, sizeLimit: 220Gi, verify: hit }
  # A kubernetes-executor agent fronting a MIG + MPS task pool: task pods
  # request nvidia.com/mig-<profile> and nvidia.com/gpu.shared per attempt,
  # the agent pod requests no GPU, and task pods reach its workload API.
  - name: agent-k8s-gpu-pool
    queues: gpu
    executors: kubernetes
    labels: "accelerator=nvidia-a100,substrate=kubernetes"
    cpuMillis: 64000
    memoryBytes: 274877906944
    diskBytes: 429496729600
    gpuMig: "1g.10gb=14;3g.40gb=4"
    gpuShared: "0:mps:40Gi"
    # Its own identity: it mounts an API token (it creates Jobs); the other
    # agents do not.
    serviceAccount: { name: nexus-agent-k8s }
    kubernetes:
      namespace: nexus-tasks
      serviceAccount: nexus-task
      sharedGpuResourceName: nvidia.com/gpu.shared
      gpuKindLabel: nvidia.com/gpu.product
      taskApi: { port: 9443 }
clusterController:
  clusterLabels: "nexus.io/cost-tier=1,nexus.io/data-locality=lake-eu"
  gpuResources: "nvidia.com/gpu,nvidia.com/gpu.shared"
