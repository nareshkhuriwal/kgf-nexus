#
# Google Cloud Storage, native JSON API, through GKE Workload Identity: no HMAC
# key. The shape deploy/terraform/environments/gke renders by default. The
# ServiceAccount (annotated iam.gke.io/gcp-service-account) is created by
# modules/kgf-nexus; the Secret holds no S3 key pair at all.
existingSecret: nexus-credentials
image: { tag: 0123456789ab }
nats:
  auth: { mode: none }
postgres:
  enabled: false
  host: 10.100.0.3
  sslmode: require
minio:
  enabled: false
  bucket: kgf-nexus-prod-usc1-results-abc123
  region: us-central1
resultStore:
  backend: gcs
  partSizeBytes: 8388608
  gcs:
    auth: auto
  serviceAccountName: kgf-nexus
