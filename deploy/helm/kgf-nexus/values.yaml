#
# Defaults are PRODUCTION-SAFE: no credentials here (every secret comes from an
# existing Secret), one CPU agent, ClusterIP services, simulated hardware off.
# Environment-specific choices -- Docker Desktop's LoadBalancer ports, dev
# simulated GPU agents -- live in deploy/terraform/environments/*, not here.
#
# One release per Kubernetes namespace: components use fixed Service names
# (api-gateway, postgres, ...) exactly as the compose stack does, so the
# services' peer addresses are the same everywhere.

image:
  # Prefix for every Nexus image: <registry><repositoryPrefix><component>:<tag>.
  # Components: api-gateway workflow-manager dag-engine scheduler
  # resource-manager event-service agent migrate ui.
  registry: ""
  repositoryPrefix: "kgf-nexus/"
  # Pin to an immutable tag (a git SHA or a digest-backed release tag). Never
  # "latest": a node that already has a "latest" would silently run old code.
  tag: ""
  # Per-image digests, keyed by IMAGE name (api-gateway, workflow-manager,
  # dag-engine, scheduler, resource-manager, event-service, agent, migrate, ui),
  # NOT by the camelCase keys under `services`. A digest here is appended to that
  # image's reference (<repo>:<tag>@sha256:...), so the kubelet pulls exactly the
  # bytes the release built. A release sets the whole map from its digest map:
  # release-images.yaml in the release workflow's image-digests artifact
  # (.github/workflows/release.yml), or KGF Cloud's deploy-aks.yml template;
  # deploy/scripts/helm-image-digests.py fails the release if any rendered
  # Nexus image does not resolve to it.
  digests: {}
  pullPolicy: IfNotPresent
  pullSecrets: []

# The Nexus namespace (tenant) the agents serve and that bootstrap creates if
# missing. Distinct from the Kubernetes namespace the release is installed in.
nexusNamespace: default
# KGF.Nexus workspace namespaces whose agents authenticate with a worker key
# the bootstrap job registers: [{namespace, secretKey}], the key held in
# existingSecret under secretKey. A development path: KGF issuing worker
# tokens (KGF-INTEGRATION.md §4.3) replaces it. A namespace the engine has not
# provisioned yet is skipped, and registered on a later release.
workspaceWorkers: []
logLevel: info

# Credentials. REQUIRED: the name of a Secret in the release namespace with:
#   postgres-password     password for the nexus database user (URL-safe)
#   minio-root-user       S3 access key (the in-cluster MinIO or an external
#   minio-root-password   S3 store) and its secret. Not needed when the result
#                         store uses a cloud identity (resultStore below)
#   worker-api-key        API key the agents authenticate with (nxs_worker_...)
#   admin-api-key         optional; bootstrap installs it as an admin key
#   nats-event-service-nkey, nats-agent-nkey
#                         NATS NKey seeds, unless nats.auth.seedSecret names
#                         another Secret (see nats.auth below)
# deploy/terraform creates this Secret with generated values.
existingSecret: ""

# Cluster DNS, for the console's nginx (its resolver needs an IP and does not
# apply search domains). Empty = look up kube-system/kube-dns at install time.
dns:
  resolver: ""
  clusterDomain: cluster.local

postgres:
  # false = use an external database (managed Postgres in production).
  enabled: true
  image: postgres:16-alpine
  host: postgres        # used when enabled=false
  port: 5432
  # The OWNER login: it owns the schema and runs the migrate, bootstrap and
  # db-roles Jobs (password: existingSecret key postgres-password). With
  # runtimeRoles.enabled=false it is ALSO what every service connects as;
  # production should enable runtimeRoles so no service holds DDL rights.
  user: nexus
  database: nexus
  # disable | require | verify-ca | verify-full. PRODUCTION: verify-full with
  # caBundle below, so every pod checks the server certificate's chain AND its
  # host name; require encrypts but accepts any server that answers. The
  # in-cluster postgres (enabled=true) serves no TLS, so it takes disable.
  sslmode: disable
  # Trust anchors for verify-ca/verify-full: the managed database's ROOT CA(s),
  # never an intermediate or the server certificate (they rotate unannounced).
  # One of secretName / configMapName, holding `key`. Mounted read-only at
  # /etc/nexus/postgres-ca/ca.crt in every pod that connects, and passed as
  # sslrootcert. deploy/terraform creates it from pinned bundles
  # (deploy/terraform/ca-bundles). Rotation: docs/OPERATIONS.md §20.11.
  caBundle:
    secretName: ""
    configMapName: ""
    key: ca.crt
  # Extra libpq/pgx connection parameters on EVERY connection, e.g.
  # { connect_timeout: "10", target_session_attrs: read-write }. Values are
  # URL-encoded. user, password, host, port, dbname and the ssl* keys are
  # refused here: they have their own settings.
  params: {}
  # Per-connection settings, merged over params. `user`/`passwordKey` apply only
  # with runtimeRoles.enabled; `params` always. migrate covers the migrate,
  # bootstrap and db-roles Jobs (always the owner login).
  connections:
    apiGateway:      { user: nexus_api_gateway_login,      passwordKey: postgres-password-api-gateway,      params: {} }
    workflowManager: { user: nexus_workflow_manager_login, passwordKey: postgres-password-workflow-manager, params: {} }
    dagEngine:       { user: nexus_dag_engine_login,       passwordKey: postgres-password-dag-engine,       params: {} }
    scheduler:       { user: nexus_scheduler_login,        passwordKey: postgres-password-scheduler,        params: {} }
    resourceManager: { user: nexus_resource_manager_login, passwordKey: postgres-password-resource-manager, params: {} }
    eventService:    { user: nexus_event_service_login,    passwordKey: postgres-password-event-service,    params: {} }
    artifactGC:      { user: nexus_artifact_gc_login,      passwordKey: postgres-password-artifact-gc,      params: {} }
    migrate:         { params: {} }
  # Least-privilege runtime logins (docs/OPERATIONS.md §20.12). When enabled,
  # each service connects as its own LOGIN role, a member of the NOLOGIN group
  # role migration 0005 created for it (nexus_api_gateway, nexus_scheduler,
  # ...), so it holds exactly ADR-0011's grants and no DDL; artifact-gc gets a
  # read-only login. A db-roles Job, running as the owner login inside the
  # cluster (where a managed server's private endpoint is reachable), creates
  # the logins and sets their passwords from SCRAM verifiers computed in the
  # Job, so no plaintext reaches the server. The owner password then reaches
  # only the three Jobs.
  runtimeRoles:
    enabled: false
    # union (default): every runtime login joins ALL six service group roles:
    #   the DML the platform grants to any service, and nothing else -- no
    #   DDL, no table ownership, no TRUNCATE, no role management, run_events
    #   still append-only. Separate logins still give per-service passwords,
    #   connection limits and pg_stat_activity attribution.
    # service: each login joins ONLY its own group role (ADR-0011's write
    #   matrix enforced at the database). Migration 0037 grants the paths the
    #   strict e2e run found (CONTRACT-FINDINGS F132); opt-in until production
    #   installs have run it (docs/OPERATIONS.md §20.12).
    scope: union
    # Secret holding each connections.<c>.passwordKey (URL-safe, >= 16 chars:
    # A-Z a-z 0-9 . _ ~ -). Empty = existingSecret.
    existingSecret: ""
    # Bump after changing the passwords in the Secret: the db-roles Job re-runs
    # under a new name and every connecting pod rolls to read the new value.
    passwordRevision: 1
    # Per-login concurrent session cap (-1 = none). Size above the pool's
    # max_conns x replicas, or scale-out fails at connect.
    connectionLimit: -1
    # On a server shared by several Nexus installations (F153, OPERATIONS
    # §20.12): the db-roles Job revokes PUBLIC's CONNECT on this database after
    # granting CONNECT to every login above, so another installation's logins
    # cannot connect here at all. Any other role that must connect (backups,
    # monitoring) then needs its own GRANT CONNECT.
    revokePublicConnect: false
  # Per-installation service group roles (migration 0038, F153): with "acme",
  # the migrate Job creates acme_api_gateway ... acme_event_service and moves
  # every grant this database gave the shared nexus_* roles onto them, so no
  # other installation's logins inherit it. Empty = the shared nexus_* roles
  # (every existing installation). Unique per server; fixed once applied.
  groupRolePrefix: ""
  # Per-service connection pool caps (NEXUS_DB_MAX_CONNS / NEXUS_DB_MIN_CONNS).
  # Empty keeps each service's own default (16 for most). Set these when the
  # database is shared and its max_connections is small, e.g. a workstation's
  # own Postgres: every replica of every service holds up to maxConns.
  #
  # perService overrides them for one connection key (the keys of
  # connections above: apiGateway, dagEngine, scheduler, ...). The dag-engine
  # is the usual candidate: it reconciles up to NEXUS_DAG_RECONCILE_CONCURRENCY
  # runs at once and consumes the durable reconcile queue (CONTRACT-FINDINGS
  # F160), so a cap sized for a quiet service starves it under a fan-out.
  #   perService:
  #     dagEngine: { maxConns: 10, minConns: 1 }
  pool:
    maxConns: ""
    minConns: ""
    perService: {}
  maxConnections: 200
  sharedBuffers: 256MB
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  # Point-in-time recovery for the IN-CLUSTER Postgres: continuous WAL archiving
  # plus scheduled base backups with pgBackRest (docs/OPERATIONS.md §4).
  #
  # Only for postgres.enabled=true. A MANAGED database (Azure Database for
  # PostgreSQL Flexible Server, Amazon RDS/Aurora, Cloud SQL) must use the
  # provider's own automated backups and PITR instead: it does not expose the
  # data directory or archive_command, and its PITR is the supported path. The
  # chart refuses pitr.enabled with postgres.enabled=false for that reason.
  pitr:
    enabled: false
    # Built from deploy/pgbackrest/Dockerfile: postgres 16.15-alpine3.24 +
    # pgBackRest 2.59.1. Same major AND libc as `image` above, so an existing
    # volume keeps working. Push it to your registry and pin it here.
    image: kgf-nexus/postgres-pitr:16.15-pgbackrest2.59.1
    stanza: nexus
    # REQUIRED when enabled: a Secret in the release namespace with
    #   s3-key          access key of a principal that can use ONLY repo.s3.bucket
    #   s3-key-secret   its secret
    #   cipher-pass     repository encryption passphrase. Needed to RESTORE: keep a
    #                   copy outside this cluster (a secret manager).
    existingSecret: ""
    repo:
      # A bucket SEPARATE from the result bucket (minio.bucket), with its own
      # credentials; ideally in another failure domain (region/account).
      path: /nexus
      s3:
        bucket: ""
        endpoint: ""            # e.g. s3.eu-west-1.amazonaws.com, or a MinIO host
        region: us-east-1
        port: 443               # pgBackRest's S3 client is TLS-only
        uriStyle: host          # "path" for MinIO and most S3-compatibles
        # Optional: a Secret with key ca.crt, for a store with a private CA.
        caSecret: ""
    # aes-256-cbc = client-side encryption of every backup file and WAL segment
    # before upload. "none" only if the store encrypts AND you accept the store's
    # operators being able to read the database. Fixed at stanza creation.
    cipherType: aes-256-cbc
    retention:
      full: 2                   # full backups kept (the PITR window starts at the oldest)
      fullType: count           # or "time": full = days
      diff: 7
    # Upper bound on RPO for a quiet database: a partially filled WAL segment is
    # archived after this many seconds. Busy databases fill segments faster.
    archiveTimeoutSeconds: 60
    processMax: 2
    schedule:
      fullIntervalSeconds: 604800   # weekly full
      diffIntervalSeconds: 86400    # daily differential
      pollSeconds: 300
    # Anything else pgBackRest accepts as PGBACKREST_* (e.g. repo1-s3-kms-key-id
    # for SSE-KMS, archive-push-queue-max). Names and values, as env entries.
    extraEnv: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 512Mi }

minio:
  enabled: true
  # Silo (github.com/pgsty/silo), the community-maintained MinIO fork, pinned by
  # digest: MinIO no longer publishes pullable community images (F111). mcImage
  # is the SAME image -- it bundles a version-matched mc -- so there is one
  # attested artifact to trust. Verify before bumping:
  #   gh attestation verify oci://docker.io/pgsty/silo@<digest> --repo pgsty/silo
  image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
  mcImage: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
  endpoint: http://minio:9000   # used when enabled=false
  bucket: nexus-results
  region: us-east-1
  useTLS: false
  inlineThresholdBytes: 65536
  storage:
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# ─── Result store: which backend and how it authenticates ───────────────
# Read by EVERY result-store client: api-gateway (task logs), the
# workflow-manager (object-store sensors), the agents (outputs, logs) and
# artifact-gc. They must all agree on the backend and the
# bucket, so this one block is rendered identically into each of them.
#
# The bucket (or Azure container) and region are minio.bucket / minio.region
# above WHATEVER the backend: their names predate the other backends, and every
# existing values file already sets them. The S3 endpoint is minio.endpoint;
# azblob and gcs take their own endpoint below, because their default is "the
# provider's public endpoint", never the in-cluster MinIO.
#
# minio.enabled (the in-cluster MinIO) is only valid with backend s3 and
# credentials static or auto: MinIO authenticates with its root key pair, never
# with a cloud identity. The chart refuses the other combinations rather than
# run a MinIO that nothing talks to (set minio.enabled=false).
resultStore:
  # s3     -- Amazon S3, MinIO, or any S3-compatible store -- including GCS
  #           through its XML interoperability API with an HMAC key (endpoint
  #           https://storage.googleapis.com, credentials static).
  # azblob -- Azure Blob Storage, native. minio.bucket is the CONTAINER.
  # gcs    -- Google Cloud Storage, native JSON API, keyless on GKE.
  backend: s3
  # Multipart part / Azure block / GCS resumable chunk size, 5 MiB..512 MiB.
  # Each in-flight upload buffers about one part in memory, so this times an
  # agent's concurrent uploads is the memory its uploads need. 5 MiB is S3's
  # minimum part; a multiple of 256 KiB keeps GCS from rounding it.
  partSizeBytes: 16777216
  s3:
    # auto         -- the static key pair when the Secret holds one (the key
    #                 references are optional in this mode), else the AWS
    #                 identity visible in the pod's environment: AWS_* keys,
    #                 IRSA, EKS Pod Identity, ECS. Never EC2 instance metadata
    #                 (probing it hangs off EC2; use iam for that).
    # static       -- ONLY the key pair (accessKeySecret below). A missing key
    #                 fails pod start instead of silently falling through.
    # web-identity -- IRSA: AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE, injected
    #                 by the EKS pod-identity webhook from the ServiceAccount's
    #                 eks.amazonaws.com/role-arn annotation.
    # pod-identity -- EKS Pod Identity: AWS_CONTAINER_CREDENTIALS_FULL_URI +
    #                 AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE, injected by the Pod
    #                 Identity agent for a ServiceAccount with an association.
    # iam          -- the whole chain including ECS task roles and EC2 IMDS.
    #                 Nodes with an IMDS hop limit of 1 (the eks-platform
    #                 default) deny IMDS to pods, on purpose.
    # env          -- AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY that YOU inject
    #                 into the pods; the chart renders none.
    # anonymous    -- unsigned requests: a public bucket or a test store only.
    # Only static and auto render key references, so for every other mode the
    # Secret need not hold minio-root-user / minio-root-password at all.
    credentials: auto
    # Where the static key pair lives. Empty name = existingSecret, under the
    # historical key names (they hold any S3 key pair, not only MinIO's). The
    # in-cluster MinIO reads its root credentials from the same place.
    accessKeySecret:
      name: ""
      accessKeyIdKey: minio-root-user
      secretAccessKeyKey: minio-root-password
  azure:
    # REQUIRED for backend azblob: the storage account NAME (not a URL).
    account: ""
    # Empty = https://<account>.blob.core.windows.net/. Set it for a sovereign
    # cloud (…blob.core.chinacloudapi.cn) or Azurite in a test cluster. A private
    # endpoint needs nothing here: its private DNS zone answers the public name.
    endpoint: ""
    # auto              -- shared key if keySecret.name is set, else workload
    #                      identity if the webhook injected
    #                      AZURE_FEDERATED_TOKEN_FILE, else managed identity.
    # workload-identity -- AKS workload identity (production). The chart adds
    #                      the pod label azure.workload.identity/use: "true" to
    #                      every result-store pod; the ServiceAccounts they run
    #                      as (serviceAccounts.apiGateway / .workflowManager / .agent / .artifactGC
    #                      below) must carry azure.workload.identity/client-id,
    #                      and the chart refuses to create them without it.
    # managed-identity  -- the node's (kubelet's) identity, or the user-assigned
    #                      identity clientId selects.
    # shared-key        -- the account key from keySecret. Accounts with shared
    #                      keys disabled (aks-platform's) refuse it.
    auth: auto
    # Optional NEXUS_AZURE_CLIENT_ID: selects a user-assigned managed identity,
    # or overrides the AZURE_CLIENT_ID the workload-identity webhook injects
    # (normally unnecessary: the webhook takes it from the SA annotation).
    clientId: ""
    # The account key, for auth shared-key (REQUIRED there) or auto.
    keySecret:
      name: ""
      key: azure-storage-key
  gcs:
    # auto -- Application Default Credentials: GKE Workload Identity through
    #         the metadata server (the ServiceAccount annotated
    #         iam.gke.io/gcp-service-account=<gsa>@<project>.iam.gserviceaccount.com),
    #         or GOOGLE_APPLICATION_CREDENTIALS.
    # none -- unauthenticated; an emulator (fake-gcs-server) only, and it
    #         needs endpoint below.
    auth: auto
    # Empty = the public JSON API. Emulators only.
    endpoint: ""
  # Cloud identity: the result-store pods (api-gateway, workflow-manager,
  # agents, artifact-gc) run as serviceAccounts.apiGateway / .workflowManager /
  # .agent / .artifactGC (below), so a
  # cloud identity (IRSA role, EKS Pod Identity association, Azure workload
  # identity, GKE Workload Identity) is bound to those accounts' annotations
  # and reaches ONLY the pods that use the store (docs/OPERATIONS.md §20.13).
  # s3 web-identity and azblob workload-identity are refused when the chart
  # would create those accounts without the annotation the identity needs.

# ─── Distributed tracing (OpenTelemetry, off by default) ─────────────────
# When enabled, every control-plane service and scheduler, the agents,
# artifact-gc and the cluster controller get the STANDARD OTEL_* variables and
# export spans over OTLP. Disabled, no OTEL_* variable is rendered and every
# process leaves its tracer off (W3C trace-context propagation stays on either
# way, so a partly traced deployment still produces connected traces).
# OTEL_SERVICE_NAME is deliberately not set: each binary names itself, and one
# value for all would merge every service into one in the trace UI.
tracing:
  enabled: false
  # REQUIRED when enabled: the collector (an OpenTelemetry Collector, Jaeger,
  # a vendor endpoint), e.g. http://otel-collector.observability:4317 (grpc)
  # or http://otel-collector.observability:4318 (http/protobuf).
  endpoint: ""
  # grpc | http/protobuf. Must match the endpoint's port.
  protocol: grpc
  # Plaintext to the collector. True suits a collector inside the cluster (the
  # spans never leave the pod network); set false and use https:// for one
  # reached across a network you do not control.
  insecure: true
  # parentbased_traceidratio honours an incoming trace's sampling decision and
  # keeps samplerArg of NEW traces. Also accepted: always_on, always_off,
  # traceidratio, parentbased_always_on, parentbased_always_off.
  sampler: parentbased_traceidratio
  # A STRING, as the OTEL variable is: "0.1" keeps 10% of new traces. The
  # binaries default to 1.0 when unset; 10% is a production-sized default.
  samplerArg: "0.1"
  # Optional OTEL_EXPORTER_OTLP_HEADERS from a Secret (never a plain value: it
  # is usually a vendor credential), e.g. "authorization=Bearer <token>" or
  # "x-honeycomb-team=<key>". Both name and key, or neither.
  headersSecret:
    name: ""
    key: ""
  # OTEL_RESOURCE_ATTRIBUTES, comma-separated key=value, e.g.
  # "deployment.environment.name=prod,cloud.region=westeurope". The chart
  # appends k8s.namespace.name and k8s.pod.name.
  resourceAttributes: ""
  # NEXUS_TRACING_PUBLIC_ENDPOINT on api-gateway: an inbound REST traceparent
  # becomes a span LINK instead of the parent, so an untrusted caller cannot
  # choose the trace ID (or the sampling decision) of what the platform does
  # for it. Set true when the REST API is reachable by callers you do not
  # control. Rendered whenever true, even with tracing disabled, because
  # propagation is always on and would otherwise forward the caller's context.
  publicEndpoint: false

nats:
  # The event bus is optional (ADR-0003): disabled, the agents long-poll.
  enabled: true
  image: nats:2.14.7-alpine
  # Authorization (docs/OPERATIONS.md §11.7). REQUIRED when enabled: rendering
  # FAILS without identities, so an unauthenticated broker cannot be installed
  # by omission. Generate keys on an admin machine, never in the cluster:
  #   NEXUS_NATS_DIR=/secure/nexus-nats deploy/nats/nexus-nats-auth.sh init --tenant <nexusNamespace>
  #   NEXUS_NATS_DIR=/secure/nexus-nats deploy/nats/nexus-nats-auth.sh helm-values   # -> these values
  # Public keys are not secret and belong here. The SEEDS go in a Secret:
  #   kubectl create secret generic <seedSecret> \
  #     --from-file=nats-event-service-nkey=/secure/nexus-nats/event-service/user.nk \
  #     --from-file=nats-agent-nkey=/secure/nexus-nats/agent-<ns>/user.nk
  auth:
    # nkey (production) | none (a throwaway dev cluster ONLY: every client can
    # read every tenant's run events and forge dispatch hints).
    mode: nkey
    eventService:
      publicKeys: []
    # SYS-account identity for `nats server report`, nats-surveyor and the like.
    monitor:
      publicKeys: []
    # One entry per Nexus namespace whose agents may receive dispatch hints;
    # each may subscribe to nexus.task.dispatch.<namespace>.> and nothing
    # else. Several keys per tenant = per-agent identities, or a rotation overlap.
    #   - namespace: default
    #     publicKeys: [UA...]
    tenants: []
    # Secret holding the seeds (default: existingSecret). Each pod mounts only
    # its own key. An agent entry may set natsSeedKey to use its own identity.
    seedSecret: ""
    eventServiceSeedKey: nats-event-service-nkey
    agentSeedKey: nats-agent-nkey
  tls:
    enabled: false
    # kubernetes.io/tls Secret (tls.crt, tls.key, ca.crt) the broker serves;
    # a cert-manager Certificate with dnsNames [nats, nats.<ns>.svc].
    secretName: ""
    # Require a client certificate from the same CA as well as the NKey.
    verifyClients: true
    # Client certificates (Secrets with tls.crt, tls.key, ca.crt) when
    # verifyClients is on; otherwise caSecret supplies only ca.crt.
    clientSecrets:
      eventService: ""
      agent: ""
    caSecret: ""
  # Sidecar that SIGHUPs nats-server when its config, authorization or TLS files
  # change, so adding a tenant or rotating a key or certificate needs no restart.
  configReloader:
    enabled: true
    image: natsio/nats-server-config-reloader:0.21.1
  # Only event-service and agent pods may open a connection to the broker.
  networkPolicy:
    enabled: true
    extraFrom: []
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

mailpit:
  # Development mail catcher. Leave false in production and set smtp.* instead.
  enabled: false
  image: axllent/mailpit:v1.27.0

smtp:
  # Empty host = mail disabled (the gateway says so at startup; link routes 503).
  host: ""
  port: 587
  tls: starttls
  from: "KGF Nexus <no-reply@nexus.localhost>"
  # Where emailed links point: the console's public URL.
  publicUrl: ""

# ─── KGF Cloud (ADR-0024, docs/OPERATIONS.md §24) ────────────────────────
# One kgfctx verifier for the gateway-signed X-KGF-Context:
#   authMode standalone -- Nexus credentials authenticate. With keys below,
#                          a context that verifies alongside a Nexus credential
#                          ATTRIBUTES the audit row (organization, scope,
#                          principal, request id) and never authorizes; without
#                          keys an X-KGF-Context is refused (400).
#   authMode kgf|both   -- the context authenticates people (keys REQUIRED);
#                          audit rows are attributed to that context.
kgf:
  authMode: standalone
  # Key sources, merged (ADR-0034): a comma-separated list of key-document
  # URLs (kgf-gateway's and each provider front's
  # /.well-known/kgf-context.json) and/or static base64url Ed25519 public keys
  # (comma-separated).
  contextKeysUrl: ""
  contextPublicKeys: ""
  # The audience a context must name, or a comma-separated list. KGF's
  # KGF.Nexus front mints kgf-nexus-engine.
  audience: kgf-nexus
  # Issuers entitled to assert a human principal (comma-separated).
  userIssuers: kgf-gateway
  # KGF provider fronts (comma-separated, e.g. kgf-nexus): the only issuers
  # that may name a KGF.Nexus workspace (`res`) and provision workspaces.
  # Empty: workspace contexts are refused. Never also a user issuer.
  frontIssuers: ""
  # KGF services allowed to call Nexus for themselves: "svc:kgf-billing=viewer".
  servicePrincipals: ""

# Notifications, webhook triggers and sensors (ADR-0028, OPERATIONS §27).
events:
  secretKey:
    # A Secret holding a 32-byte key (base64 or hex): openssl rand -base64 32.
    # Empty = no key: inline channel secrets and webhook triggers are refused;
    # channel secret references (env:/file:) still work.
    existingSecret: ""
    key: secret-key
    # During a key rotation, the key of the retired value in the same Secret.
    previousKey: ""
  # Lets channels reach private and loopback addresses (on-premises receivers).
  # Off by default so a channel cannot be pointed at internal services.
  allowPrivateTargets: false
  # CIDRs of the proxies in front of the gateway whose Forwarded /
  # X-Forwarded-Host / X-Forwarded-Proto headers decide a webhook trigger's
  # public URL, ahead of smtp.publicUrl (docs/OPERATIONS.md §27.1). Name only
  # proxies that overwrite those headers; empty trusts none.
  trustedProxies: []

migrate:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Shared defaults for the Go services; each service below can override.
serviceDefaults:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }

services:
  apiGateway:
    replicas: 1
    # Exposure outside the cluster, as a SEPARATE Service. The in-cluster
    # api-gateway Service always keeps 8080 (REST) and 9091 (worker gRPC).
    external:
      enabled: false
      type: LoadBalancer
      httpPort: 8080
      grpcPort: 9091
  workflowManager: {}
  dagEngine: {}
  resourceManager: {}
  eventService: {}

# One scheduler Deployment per queue it drains. Replicas are safe to scale: the
# claim is atomic in Postgres (ADR-0011, F81). Optional per entry: resources
# (default serviceDefaults.resources), podDisruptionBudget, and autoscaling --
# read the ADR-0018 note under `autoscaling` before using the last one.
schedulers:
  - name: scheduler
    queue: default
    replicas: 1
  - name: scheduler-gpu
    queue: gpu
    replicas: 1

# Worker agents. Real hardware only by default; simulated capacity belongs in a
# dev environment and must be labelled as such.
#
# Optional per entry, beyond the capacity it advertises:
#   gpuCount / gpuKind / gpuMemoryBytes   what the agent ADVERTISES (--gpu-count,
#       --gpu-kind, --gpu-memory-bytes). With gpuCount > 0 the pod also REQUESTS
#       that many devices of gpu.resourceName (default agentDefaults.
#       gpuResourceName, nvidia.com/gpu) from the device plugin, so it lands on a
#       node that has them and the devices are mounted: advertised == allocated.
#       It also tolerates the <resourceName>:NoSchedule taint GPU pools carry.
#   gpu: { requestDevices: false }   advertise without allocating: SIMULATED
#       capacity only, and the chart then requires "simulated=true" in labels.
#   gpu: { resourceName: amd.com/gpu }   another device plugin's resource.
#   nodeSelector / tolerations / affinity   REPLACE placement.* for this agent
#       (e.g. { nexus.khuriwalgroup.com/pool: gpu }).
#   serviceAccount: { name, annotations, automountServiceAccountToken, podLabels }
#       overrides serviceAccounts.agent for this agent.
#   namespace, workerApiKeySecretKey, natsSeedKey, podDisruptionBudget,
#       resources, customResources.
#
# Each agent serves nexusNamespace unless it sets `namespace`. An agent of
# another tenant also needs a worker key minted for that tenant
# (`workerApiKeySecretKey`, a key in existingSecret; default worker-api-key),
# a nats.auth.tenants entry for it and, with NKey auth, that tenant's seed
# (`natsSeedKey`). The chart refuses to render an agent whose namespace has no
# tenant entry. See docs/MULTITENANCY.md, "Agent namespace".
#   - name: agent-team-ml
#     namespace: team-ml
#     workerApiKeySecretKey: worker-api-key-team-ml
#     natsSeedKey: nats-agent-nkey-team-ml
agents:
  - name: agent-cpu
    replicas: 1
    queues: default
    labels: "zone=cluster,accelerator=none"
    executors: subprocess
    cpuMillis: 2000
    memoryBytes: 4294967296
    gpuCount: 0
    diskBytes: 10737418240
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { memory: 4Gi }

# Agent admission gate at Register (docs/COMPATIBILITY.md §4.4). Off by default.
# An agent older than minVersion (a semantic version; a "dev" build then never
# qualifies), or missing any requiredCapabilities, is refused with
# FAILED_PRECONDITION and exits instead of retrying. Capabilities of this
# release's agent: log_shipping, progress, uninterruptible_cancel,
# output_max_bytes.
agentPolicy:
  minVersion: ""
  requiredCapabilities: []

# Optional per-agent keys (ADR-0029/0030/0031), all off by default:
#   gpuMig: "1g.10gb=MIG-...,MIG-...;3g.40gb=MIG-..."   MIG instances by profile
#   gpuShared: "4:mps:80Gi"                             shared devices (mps|timeslice)
#   gpuDiscovery: nvidia-smi                            read GPUs/MIG from nvidia-smi -L
#   kubernetes: { namespace, serviceAccount, helperImage, gpuResourceName,
#                 migResourcePrefix, sharedGpuResourceName, gpuKindLabel,
#                 taskApi: { enabled, port } }       agentDefaults.kubernetes, per agent
#       (only for an agent whose executors include kubernetes; gpuMig is then
#       profile=count, e.g. "1g.10gb=7": the task pool's instances, allocated
#       per pod by the device plugin)
#   capacityType: spot                                  else discovered from the Node, else on-demand
#   eviction: { sources: "kubernetes,aws", taints: "", grace: 25s }
#   artifactCache: { bytes: 200Gi, sizeLimit: 220Gi, verify: "" }
# The kubernetes eviction source and Node capacity-type discovery need `get` on
# the agent's own Node (OPERATIONS §28.3).

# Claim-time placement (ADR-0029 §4, ADR-0030, ADR-0031). Not to be confused
# with `placement`, which places the chart's own pods.
claimPlacement:
  # pack (best fit, least waste) or spread.
  policy: pack
  # Pull-path delay scheduling: how long an attempt with a preference waits
  # for a strictly better live worker before any fitting worker may take it.
  wait: 3s
  # Cluster quota headroom older than this gates nothing.
  headroomTTL: 2m
  # Retries after PREEMPTED (spot eviction) that do not spend max_attempts.
  maxPreemptionRetries: 5
  preemptionRetryDelay: 2s
  # The registered cluster this release's agents run in (clusters.name);
  # empty = no cluster labels for them.
  clusterName: ""

agentDefaults:
  # Extended resource a GPU agent requests (agents[].gpu.resourceName overrides).
  gpuResourceName: nvidia.com/gpu
  # The kubernetes executor (an agent whose `executors` include kubernetes;
  # agents[].kubernetes overrides any key). Its GPU capacity (gpuCount, gpuMig,
  # gpuShared) describes the TASK pool: the agent pod itself requests no GPU,
  # and each task pod requests exactly its reservation from the device plugin
  # (ADR-0029 §2):
  kubernetes:
    # Namespace task Jobs run in. Empty = the release namespace. The chart
    # grants the agent a Role there (jobs, pods, pods/log, secrets).
    namespace: ""
    # ServiceAccount task pods run as (its token is never mounted). Empty =
    # the namespace default.
    serviceAccount: ""
    # Output-collector sidecar image (needs /bin/sh, base64, wc, sleep). Pin
    # it; mirror it for air-gapped clusters.
    helperImage: busybox:1.37.0
    # Whole GPUs: the device plugin's resource (NEXUS_K8S_GPU_RESOURCE).
    gpuResourceName: nvidia.com/gpu
    # MIG instances: prefix + profile, e.g. nvidia.com/mig-1g.10gb, the NVIDIA
    # device plugin's `mixed` strategy (NEXUS_K8S_MIG_RESOURCE_PREFIX).
    migResourcePrefix: nvidia.com/mig-
    # Shared (MPS or time-sliced) GPUs: ONE replica of this resource per
    # slice, e.g. nvidia.com/gpu.shared with the plugin's renameByDefault.
    # Empty refuses shared-GPU tasks rather than running them with no GPU
    # (NEXUS_K8S_GPU_SHARED_RESOURCE).
    sharedGpuResourceName: ""
    # Node label carrying the GPU model; gpu_kind becomes a nodeSelector on it
    # (e.g. nvidia.com/gpu.product). Empty = no pinning.
    gpuKindLabel: ""
    # The workload API for task pods (usage units, shared rate limits,
    # checkpoints, heartbeats; ADR-0032 addendum, OPERATIONS §29.10): a TLS
    # listener on the agent pod's IP, per-attempt tokens delivered through the
    # attempt's Secret. A NetworkPolicy in the task namespace lets task pods
    # reach it (and nothing else it opens). false leaves tasks on the SDK's
    # in-process fallback: usage then never reaches the ledger.
    taskApi:
      enabled: true
      port: 9443
  heartbeatIntervalMs: 5000
  # Must stay below terminationGracePeriodSeconds, or Kubernetes kills an agent
  # mid-drain and strands its attempts until their leases expire.
  drainGrace: 60s
  terminationGracePeriodSeconds: 90
  # Worker-side secret resolution (ADR-0025, OPERATIONS §25.1). configSecret
  # names a Secret whose key `secrets.yaml` is the per-tenant provider file
  # (only this release's nexusNamespace block is loaded). Empty: no providers,
  # and a task that declares a secret fails PERMISSION_DENIED.
  secrets:
    configSecret: ""
    # Extra Secret volumes for file:// refs, e.g. a KGF Cloud CSI-projected
    # Key Vault secret: [{ name: kv, secretName: nexus-kv, mountPath: /var/run/secrets/nexus }]
    # (list mountPath under file.allow_dirs in secrets.yaml).
    fileSecrets: []
    # Azure workload identity for akv:// (the KGF stamp's workload identity
    # client id): sets AZURE_CLIENT_ID and the azure.workload.identity/use pod
    # label on the agents. The federated credential must trust the agents'
    # ServiceAccount (serviceAccounts.agent, or agents[].serviceAccount).
    workloadIdentityClientId: ""
    # Extra agent-environment variables subprocess tasks may inherit (globs,
    # comma-separated), beyond PATH/HOME/LANG/TZ/TMPDIR and the task contract
    # (F151). The agent's own credentials never pass. Default: none.
    subprocessEnvPassthrough: ""
    # Host-side secret files (docker/subprocess executors) live on a
    # memory-backed emptyDir, never on the work volume's disk.
    tmpfsSizeLimit: 64Mi

# Prometheus scraping (docs/OPERATIONS.md, "Metrics"). Every Nexus pod serves
# /metrics on a port that no external Service exposes: the gateway on its
# dedicated ops listener (8088), the agents on 8089, every other service on its
# health listener (8080). Each in-cluster Service carries a port named
# "metrics"; api-gateway-external never does.
metrics:
  # prometheus.io/scrape|port|path pod annotations, for annotation-based
  # discovery (the stock Prometheus Helm chart's kubernetes-pods job).
  podAnnotations: true
  # Gateway ops listener port (NEXUS_METRICS_ADDR).
  gatewayPort: 8088
  # Agent metrics port (NEXUS_METRICS_ADDR on the agent).
  agentPort: 8089
  # prometheus-operator resources. Off by default: the CRDs exist only where
  # the operator is installed, and rendering them elsewhere fails the install.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, e.g. { release: kube-prometheus-stack } to match the
    # operator's serviceMonitorSelector.
    labels: {}
  # A PodMonitor for the agents, which have no Service. Follows
  # serviceMonitor.enabled unless set explicitly.
  podMonitor:
    enabled: null

# Audit export (ADR-0025, OPERATIONS §25.2).
auditExport:
  # Secret holding key `audit-sink-key` (openssl rand -base64 32): seals SIEM
  # sink signing secrets. Empty: sinks are refused (503); export, retention
  # and legal hold still work.
  sinkKeySecret: ""
  # Internal CIDRs a sink may deliver to (an on-premises SIEM). Loopback,
  # link-local and private ranges are refused otherwise.
  sinkAllowCIDRs: ""
  # KGF Cloud attribution of audit rows uses the kgf block's keys (one
  # verifier for authentication and attribution): see kgf above.

# Host-based routing via the Gateway API (templates/gateway.yaml). Off by
# default: it needs a Gateway API implementation installed in the cluster.
gateway:
  enabled: false
  # Create the cluster-scoped GatewayClass too (a cluster with its own shared
  # class, as most shared clusters have, sets this false and names it below).
  createGatewayClass: false
  className: eg
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  port: 80
  hosts:
    console: ""
    api: ""
    mail: ""

ui:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

# ─── ServiceAccounts (one per component) ─────────────────────────────────
# Every Nexus pod runs under its own ServiceAccount, never `default`, so a
# cloud identity can be bound to exactly the components that need it:
#   EKS IRSA          annotations: { eks.amazonaws.com/role-arn: arn:aws:iam::...:role/... }
#   EKS Pod Identity  nothing here: an aws_eks_pod_identity_association names the SA
#   GKE               annotations: { iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com }
#   AKS               annotations: { azure.workload.identity/client-id: <client-id> }
#                     podLabels:   { azure.workload.identity/use: "true" }
# Only the result-store users (apiGateway for logs, workflowManager for
# object-store sensors, agent, artifactGC) need one.
# The API token is NOT mounted unless a component sets
# automountServiceAccountToken: true; none of them calls the Kubernetes API
# (an agent whose executors include "kubernetes" defaults to true). IRSA,
# Pod Identity and Azure Workload Identity inject their own projected token and
# GKE uses the metadata server, so all of them work with the token unmounted.
# Components may SHARE an account by naming the same `name`; the chart creates
# it once and refuses conflicting settings. The cluster controller keeps its
# own RBAC-bound account (clusterController).
serviceAccounts:
  # false = the named accounts must already exist (name "" = `default`).
  create: true
  automountServiceAccountToken: false
  # Added to every account the chart creates.
  annotations: {}
  # Per component: name (default nexus-<component>), annotations,
  # automountServiceAccountToken (null = the default above), podLabels.
  apiGateway: {}
  workflowManager: {}
  dagEngine: {}
  scheduler: {}        # every schedulers[] Deployment
  resourceManager: {}
  eventService: {}
  agent: {}            # every agents[] entry, unless it sets serviceAccount
  artifactGC: {}
  ui: {}
  jobs: {}             # migrate, bootstrap, db-roles

# ─── Pod placement (every Nexus Deployment) ──────────────────────────────
# Applied to the control-plane services, schedulers, agents, console and the
# cluster controller. The dependencies (postgres, minio, nats) are
# single-replica StatefulSets and take none of this.
placement:
  # A PriorityClass that must already exist in the cluster -- e.g. one above
  # the batch workloads the agents run, so node pressure evicts task pods
  # before the control plane. Empty = the cluster default.
  priorityClassName: ""
  # Spread the replicas of each component across zones, then nodes.
  # ScheduleAnyway so a single-node or single-zone cluster still schedules
  # everything; use DoNotSchedule where losing one zone must never take out
  # every replica.
  topologySpread:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
    topologyKeys:
      - topology.kubernetes.io/zone
      - kubernetes.io/hostname
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─── PodDisruptionBudgets ────────────────────────────────────────────────
# One per control-plane Deployment, scheduler, agent Deployment, the console
# and the cluster controller, WHATEVER its replica count. With one replica the
# default (maxUnavailable: 1) still lets a node drain proceed; the budget
# starts protecting as soon as you scale out. minAvailable >= the replica count
# would block every drain, and the chart refuses to render it.
# Per-component override (same shape): services.<key>.podDisruptionBudget,
# schedulers[].podDisruptionBudget, agents[].podDisruptionBudget,
# ui.podDisruptionBudget, clusterController.podDisruptionBudget.
podDisruptionBudget:
  enabled: true
  # Set exactly one. maxUnavailable is safe at any size.
  maxUnavailable: 1
  minAvailable: null

# ─── HorizontalPodAutoscalers ────────────────────────────────────────────
# For the STATELESS request-path services: api-gateway, workflow-manager,
# dag-engine, event-service. All four are correct at any replica count (dag
# reconcile is compare-and-swap, the outbox relay and timers claim rows with
# SKIP LOCKED). Needs metrics-server; every pod declares a CPU request. With an
# HPA the Deployment omits spec.replicas, so `helm upgrade` never fights it.
# Per-service override (merged over this): services.<key>.autoscaling.
#
# The SCHEDULER is not covered by this switch, on purpose. ADR-0018 measured
# claim cost as linear in the queue's PENDING backlog and bound by Postgres
# CPU, not the scheduler's own: past a ~10k backlog more replicas add latency.
# Size it with schedulers[].replicas. schedulers[].autoscaling (same shape)
# exists for operators who have measured their own curve (OPERATIONS §20).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # null = scale on CPU only.
  targetMemoryUtilizationPercentage: null
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]

# ─── mTLS between services (docs/TLS.md) ─────────────────────────────────
# Every gRPC hop: service <-> service, agent -> api-gateway:9091, and cluster
# controller -> resource-manager. The HTTP listeners (REST, probes, /metrics)
# are unaffected. event-service speaks HTTP and takes no gRPC TLS; the NATS hop
# is nats.tls (certManager.natsLeaves issues its certificates).
tls:
  enabled: false
  # NEXUS_TLS_REQUIRE_CLIENT_CERT on every gRPC server (mutual TLS). Only set
  # false during a rollout where clients outside this release (external
  # agents) do not have a client certificate yet (docs/TLS.md §4.2).
  requireClientCert: true
  # NEXUS_REQUIRE_TLS: a missing certificate is a startup failure, never a
  # silent plaintext fallback (docs/TLS.md §4.4).
  requirePeerTLS: true
  # NEXUS_TLS_RELOAD_INTERVAL: renewed files are picked up without a restart.
  reloadInterval: 10s
  # Trust anchors. Empty = each pod verifies peers against ca.crt of its own
  # leaf Secret (right for a single CA). For a CA KEY rotation with an overlap
  # window, publish a trust-manager Bundle into a ConfigMap (key ca.crt) and
  # name it here (deploy/k8s/cert-issuer.yaml, OPERATIONS §9.4).
  caBundleConfigMap: ""
  # Leaf Secrets are nexus-<component>-tls, the names deploy/k8s uses:
  # api-gateway, workflow-manager, dag-engine, scheduler, resource-manager,
  # agent, cluster-controller. To bring your own, set certManager.enabled=false
  # and create them (tls.crt, tls.key, ca.crt; SANs as in
  # deploy/k8s/cert-certificates.yaml).
  certManager:
    # Issue every leaf with cert-manager (installed; CRDs present).
    enabled: true
    # Issuer of the leaves. PRODUCTION: a ClusterIssuer backed by a CA whose
    # key lives OUTSIDE this namespace (deploy/k8s/cert-issuer.yaml creates
    # nexus-internal-ca). Empty name = bootstrap a self-signed CA in the
    # release namespace: fine for a test cluster, NOT for production, because
    # anyone who can read Secrets here could then mint any service identity.
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    selfSignedCA:
      duration: 8760h
      renewBefore: 720h
    # Leaves: 30 days, renewed with 10 left, new key each time (docs/TLS.md §5.2).
    duration: 720h
    renewBefore: 240h
    # Extra SANs on the api-gateway leaf: the name EXTERNAL agents dial.
    gatewayExtraDnsNames: []
    # Also issue nexus-nats-tls (broker) and nexus-event-service-tls (client)
    # for nats.tls.secretName / nats.tls.clientSecrets.eventService; the agent
    # leaf (nexus-agent-tls) serves as nats.tls.clientSecrets.agent.
    natsLeaves: false

# ─── Cluster controller (docs/CLUSTER-SCALING.md, OPERATIONS §12) ────────
# Reports this cluster to the console and -- only under the triple opt-in
# below -- scales bound worker Deployments. Off by default.
clusterController:
  enabled: false
  # The registry name (clusters.name) registered in the console (Cluster &
  # scaling -> Live cluster). Empty = cluster.name, the chart-wide cluster
  # name; one of the two is REQUIRED when enabled. Its control-plane namespace
  # must be this release's namespace.
  clusterName: ""
  # The resource manager's gRPC address. The default is this release's own;
  # a release without the control plane (a worker-pool cluster) names the
  # control plane's, reachable from here, with the release's tls.* settings.
  resourceManagerAddress: resource-manager:9090
  # Two replicas for failover; a Lease (nexus-cluster-controller-<cluster>)
  # makes exactly one act, the other reports /readyz "standby".
  replicas: 2
  interval: 15s
  # Task Jobs to report: the kubernetes executor labels every Job it creates
  # nexus.dev/attempt.
  jobLabelSelector: nexus.dev/attempt
  # Namespaces where task Jobs run (the kubernetes executor's
  # NEXUS_K8S_NAMESPACE): Jobs are observed there and their ResourceQuota
  # headroom is published (ADR-0031). Empty = the task namespace of every
  # agent here that runs the kubernetes executor, or, when none does, the
  # bound worker namespaces. A read-only Role (Jobs, quotas) is created in
  # each one that is not already a worker namespace.
  taskNamespaces: []
  # The least time between two patches of one scheduler HPA (ADR-0036).
  schedulerPatchInterval: 1m
  logLevel: info
  # ADR-0031. Operator-declared cluster placement labels, published with every
  # report over the observed region and provider, e.g.
  # "nexus.io/cost-tier=1,nexus.io/data-locality=lake-eu|s3-eu-west-1".
  clusterLabels: ""
  # Extended resources counted as gpu_count in the published quota headroom.
  gpuResources: ""
  # Namespaces holding the worker Deployments bound to this cluster. A
  # read-only Role is created in each (and the apply Role under apply.enabled).
  # Empty = this release's namespace, where the chart's own agents run. Never
  # widened to a cluster-wide grant.
  workerNamespaces: []
  # Read Nodes (capacity context) and the kube-system Namespace object (its UID
  # is the cluster identity apply mode is verified against). Cluster-scoped by
  # nature, so one small read-only ClusterRole.
  observeNodes: true
  # APPLY MODE is three independent opt-ins; missing any one keeps plan mode:
  #   1. the registry entry is in apply mode WITH the expected kube-system UID
  #      (console; the API refuses apply without it);
  #   2. NEXUS_CONTROLLER_ALLOW_APPLY=true on the process;
  #   3. the apply Role (deployments/scale update, pods patch) is bound in the
  #      worker namespaces.
  # apply.enabled turns on 2 and 3, and requires expectedClusterUID, which the
  # chart compares with the live cluster at install: a values file written for
  # one cluster cannot enable apply on another.
  apply:
    enabled: false
    expectedClusterUID: ""
    # ADR-0036: in apply mode, also keep the scheduler HPAs' minReplicas,
    # maxReplicas, CPU target and scale-down window at the scheduler settings
    # saved in the console. Binds patch on the autoscaled schedulers' HPAs
    # (by name, this namespace). The controller still changes only an HPA
    # annotated nexus.khuriwalgroup.com/autoscaling-owner=cluster-controller;
    # false (or an HPA without it) leaves the HPA to Helm/GitOps and reports
    # the difference as drift.
    schedulerAutoscaling: true
  terminationGracePeriodSeconds: 30
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
  podDisruptionBudget: {}

# ─── Artifact GC (docs/OPERATIONS.md §7.7, §19.2) ────────────────────────
# A CronJob that sweeps the result store for objects no row references.
# REPORT ONLY by default: it logs what it would collect and deletes nothing.
artifactGC:
  enabled: true
  schedule: "17 3 * * *"
  # IANA zone for the schedule (CronJob spec.timeZone). Empty = the
  # controller-manager's zone (UTC on managed clusters).
  timeZone: ""
  # report | delete. delete ALSO needs confirmDelete: true -- the binary's
  # -delete -i-understand-this-deletes-data pair. The chart refuses
  # mode=delete without the confirmation rather than quietly reporting.
  mode: report
  confirmDelete: false
  # Minimum object age before collection: covers uploads whose row has not
  # committed yet. Never lower it toward minutes.
  grace: 24h
  # Time-based retention for TASK LOGS only; outputs are never time-expired.
  # Empty = logs live as long as their attempt.
  logRetention: ""
  maxObjects: 10000
  # Only keys under this prefix, e.g. "default/". Empty = the whole bucket.
  prefix: ""
  # Push the final metrics to a Prometheus Pushgateway under job=artifact-gc,
  # e.g. http://prometheus-pushgateway.monitoring:9091. Empty = off.
  pushgatewayUrl: ""
  logLevel: info
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  activeDeadlineSeconds: 3600
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
