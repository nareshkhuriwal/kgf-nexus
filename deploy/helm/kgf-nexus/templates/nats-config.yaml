{{- /*
Copyright 2026 Khuriwal Group
SPDX-License-Identifier: Apache-2.0

The NATS broker's configuration, including its AUTHORIZATION. It holds public
NKeys and permissions only -- nothing secret -- which is why it is a ConfigMap:
the matching seeds live in a Secret and are mounted only into the pod whose
identity they are.

This renders the same model as deploy/nats/nexus-nats-auth.sh (compose and the
Portainer host); tests/nats/run-integration.sh runs a broker with THIS output and
checks every role against it. Change one, change both.

  account NEXUS (JetStream)
    event-service   pub nexus.run.>, nexus.task.dispatch.>, nexus.usage.>, $JS.API.STREAM.{INFO,CREATE}.<its three streams>
                    sub nexus.run.>, _INBOX.nexus-event-service.>
    agent-<ns>      pub nothing; sub nexus.task.dispatch.<ns>.> only
    admin           optional (nats.auth.admin.publicKeys): pub $JS.API.INFO,
                    $JS.API.STREAM.{NAMES,LIST}, $JS.API.STREAM.{INFO,UPDATE,PURGE,DELETE}.<the three streams>;
                    sub _INBOX.nexus-admin.> -- stream maintenance, no messages
  account SYS (system_account)
    monitor         read-only $SYS server/account queries
No anonymous user exists, so an unauthenticated connection is refused.
*/ -}}
{{- if and .Values.nats.enabled (include "nexus.controlPlaneEnabled" .) }}
{{- include "nexus.natsAuthRequired" . }}
{{- include "nexus.natsStreamsFit" . }}
{{- $a := .Values.nats.auth -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels: {{- include "nexus.labels" (list . "nats") | nindent 4 }}
data:
  nats.conf: |
    server_name: nexus-nats
    port: 4222
    # nats-server's monitoring endpoint has NO authentication and /connz lists
    # every client, so it listens on the pod's loopback only. Probes exec wget
    # inside the container; operators use the SYS monitor identity.
    http: "127.0.0.1:8222"
    pid_file: "/var/run/nats/nats.pid"
    max_payload: 1MB
    jetstream {
      store_dir: "/data"
      # 80% of nats.storage.size ({{ .Values.nats.storage.size }}), in bytes:
      # the most JetStream will ever reserve for streams. Explicit, not
      # nats-server's default of 75% of the space free at start, so it is the
      # same on every start and storage class (docs/OPERATIONS.md §11.10).
      # nats-server cannot apply a change of it on reload; the StatefulSet
      # rolls the pod instead (nexus.khuriwalgroup.com/nats-max-file-store).
      max_file_store: {{ include "nexus.natsMaxFileStore" . }}
    }
    {{- if .Values.nats.tls.enabled }}
    tls {
      cert_file: "/etc/nats-tls/tls.crt"
      key_file: "/etc/nats-tls/tls.key"
      ca_file: "/etc/nats-tls/ca.crt"
      {{- if .Values.nats.tls.verifyClients }}
      verify: true
      {{- end }}
      timeout: 2
    }
    {{- end }}
    include "auth.conf"
  auth.conf: |
    {{- if eq $a.mode "none" }}
    # nats.auth.mode=none: AUTHENTICATION DISABLED. Development only; every
    # client can read every tenant's run events and forge dispatch hints.
    {{- else }}
    accounts {
      NEXUS {
        jetstream: enabled
        users: [
          {{- range $a.eventService.publicKeys }}
          # event-service: outbox relay (JetStream publish) + SSE waker
          { nkey: {{ . }}
            permissions: {
              publish: { allow: ["nexus.run.>", "nexus.task.dispatch.>", "nexus.usage.>"{{ range list "NEXUS_RUNS" "NEXUS_DISPATCH" "NEXUS_USAGE" }}, "$JS.API.STREAM.INFO.{{ . }}", "$JS.API.STREAM.CREATE.{{ . }}"{{ end }}] }
              subscribe: { allow: ["nexus.run.>", "_INBOX.nexus-event-service.>"] }
            } }
          {{- end }}
          {{- range (($a.admin | default dict).publicKeys | default list) }}
          # admin: stream maintenance only (resize, purge, delete); no messages
          { nkey: {{ . }}
            permissions: {
              publish: { allow: ["$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.LIST"{{ range $s := list "NEXUS_RUNS" "NEXUS_DISPATCH" "NEXUS_USAGE" }}{{ range list "INFO" "UPDATE" "PURGE" "DELETE" }}, "$JS.API.STREAM.{{ . }}.{{ $s }}"{{ end }}{{ end }}] }
              subscribe: { allow: ["_INBOX.nexus-admin.>"] }
            } }
          {{- end }}
          {{- range $t := $a.tenants }}
          {{- range $t.publicKeys }}
          # agents of tenant {{ $t.namespace }}: its dispatch hints only, publish nothing
          { nkey: {{ . }}
            permissions: {
              publish: { deny: [">"] }
              subscribe: { allow: ["nexus.task.dispatch.{{ $t.namespace }}.>"] }
            } }
          {{- end }}
          {{- end }}
        ]
      }
      SYS {
        users: [
          {{- range $a.monitor.publicKeys }}
          # monitor: read-only server and account queries
          { nkey: {{ . }}
            permissions: {
              publish: { allow: [{{ range $i, $z := list "STATSZ" "VARZ" "SUBSZ" "CONNZ" "ROUTEZ" "GATEWAYZ" "LEAFZ" "ACCOUNTZ" "JSZ" "HEALTHZ" "IDZ" }}{{ if $i }}, {{ end }}"$SYS.REQ.SERVER.PING.{{ $z }}", "$SYS.REQ.SERVER.*.{{ $z }}"{{ end }}, "$SYS.REQ.SERVER.PING"{{ range list "CONNZ" "JSZ" "STATZ" "SUBSZ" "INFO" "LEAFZ" "CONNS" }}, "$SYS.REQ.ACCOUNT.*.{{ . }}"{{ end }}, "$SYS.REQ.ACCOUNT.PING.STATZ"] }
              subscribe: { allow: ["_INBOX.>", "$SYS.SERVER.>", "$SYS.ACCOUNT.>"] }
            } }
          {{- end }}
        ]
      }
    }
    system_account: SYS
    {{- end }}
{{- end }}
