{{- /*
Copyright 2026 Khuriwal Group
SPDX-License-Identifier: Apache-2.0

In-cluster dependencies for a self-contained environment. Each can be turned
off to point Nexus at a managed service instead (production). None of them in
a worker-pool release (components.controlPlane.enabled=false): its agents use
the control plane's store and broker.
*/ -}}
{{- include "nexus.required" . }}
{{- if include "nexus.controlPlaneEnabled" . }}
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "nexus.labels" (list . "postgres") | nindent 4 }}
spec:
  selector: {{- include "nexus.selector" (list . "postgres") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "nexus.labels" (list . "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "nexus.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nexus.labels" (list . "postgres") | nindent 8 }}
    spec:
      # Started directly as the image's postgres user (uid 70) rather than as
      # root dropping to it: the entrypoint then skips its chown, fsGroup makes
      # the volume writable, and initdb creates PGDATA (a subdirectory) owned
      # by uid 70. A volume an earlier root-started pod initialised is already
      # uid 70's. Pod Security "restricted".
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      # The control plane's pool, priority and taints (placement.*), like every
      # Nexus pod: an in-cluster dependency must not float onto a batch pool.
      {{- include "nexus.placement" (list . "postgres") | nindent 6 }}
      containers:
        - name: postgres
          {{- $pitr := .Values.postgres.pitr }}
          image: {{ ternary $pitr.image .Values.postgres.image $pitr.enabled }}
          args:
            - "-c"
            - "max_connections={{ .Values.postgres.maxConnections }}"
            - "-c"
            - "shared_buffers={{ .Values.postgres.sharedBuffers }}"
            {{- if $pitr.enabled }}
            # Continuous archiving (docs/OPERATIONS.md §4). archive_command only
            # returns success once the segment is IN the repository.
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "archive_mode=on"
            - "-c"
            - "archive_command=pgbackrest --stanza={{ $pitr.stanza }} archive-push %p"
            - "-c"
            - "archive_timeout={{ $pitr.archiveTimeoutSeconds }}"
            {{- end }}
          env:
            {{- if $pitr.enabled }}
            {{- include "nexus.pgbackrestEnv" . | nindent 12 }}
            {{- end }}
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password } }
            - { name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256" }
            # A subdirectory: the volume root holds lost+found on many
            # provisioners, which initdb refuses to initialise over.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "nexus.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            {{- if $pitr.enabled }}
            - { name: pg-socket, mountPath: /var/run/postgresql }
            - { name: pgbackrest-spool, mountPath: /var/spool/pgbackrest }
            {{- if $pitr.repo.s3.caSecret }}
            - { name: pgbackrest-ca, mountPath: /etc/pgbackrest/ca, readOnly: true }
            {{- end }}
            {{- end }}
        {{- if $pitr.enabled }}
        # Base backups on a cadence, read from the repository's own state
        # (deploy/pgbackrest/nexus-pitr-scheduler.sh). It shares the data volume
        # (a physical backup reads the files) and the unix socket. Deliberately
        # no readiness probe: a failing backup must page someone, not take the
        # database out of its Service. Monitor with deploy/pitr-verify.sh:
        #   PITR_EXEC="kubectl -n <ns> exec -i postgres-0 -c pgbackrest --" deploy/pitr-verify.sh
        - name: pgbackrest
          image: {{ $pitr.image }}
          command: ["/usr/local/bin/nexus-pitr-scheduler"]
          env:
            {{- include "nexus.pgbackrestEnv" . | nindent 12 }}
            - { name: PITR_FULL_INTERVAL_SECONDS, value: {{ $pitr.schedule.fullIntervalSeconds | quote }} }
            - { name: PITR_DIFF_INTERVAL_SECONDS, value: {{ $pitr.schedule.diffIntervalSeconds | quote }} }
            - { name: PITR_POLL_SECONDS, value: {{ $pitr.schedule.pollSeconds | quote }} }
            # Archive-age guard (OPERATIONS §4.6): archive_timeout alone was
            # measured not to fire for up to checkpoint_timeout after a start.
            - { name: PITR_WAL_SWITCH_SECONDS, value: {{ $pitr.archiveTimeoutSeconds | quote }} }
          resources: {{- toYaml $pitr.resources | nindent 12 }}
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: pg-socket, mountPath: /var/run/postgresql }
            - { name: pgbackrest-spool, mountPath: /var/spool/pgbackrest }
            - { name: pgbackrest-state, mountPath: /var/lib/pgbackrest }
            {{- if $pitr.repo.s3.caSecret }}
            - { name: pgbackrest-ca, mountPath: /etc/pgbackrest/ca, readOnly: true }
            {{- end }}
      volumes:
        - { name: pg-socket, emptyDir: {} }
        # The spool holds async archive-push STATUS files, never the only copy of
        # a WAL segment: postgres keeps a segment until archive-push confirms it.
        - { name: pgbackrest-spool, emptyDir: {} }
        - { name: pgbackrest-state, emptyDir: {} }
        {{- if $pitr.repo.s3.caSecret }}
        - name: pgbackrest-ca
          secret: { secretName: {{ $pitr.repo.s3.caSecret }} }
        {{- end }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.postgres.storage.size }} }
{{- end }}
{{- if include "nexus.minioInRelease" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels: {{- include "nexus.labels" (list . "minio") | nindent 4 }}
spec:
  selector: {{- include "nexus.selector" (list . "minio") | nindent 4 }}
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
    - { name: console, port: 9001, targetPort: console }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels: {{- include "nexus.labels" (list . "minio") | nindent 4 }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: {{- include "nexus.selector" (list . "minio") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nexus.labels" (list . "minio") | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      {{- include "nexus.placement" (list . "minio") | nindent 6 }}
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          {{- /* The key pair the clients present (resultStore.s3.accessKeySecret):
                 one source, so MinIO and its clients cannot disagree. */}}
          {{- $keys := .Values.resultStore.s3.accessKeySecret }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: {{ $keys.name | default .Values.existingSecret }}, key: {{ $keys.accessKeyIdKey }} } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $keys.name | default .Values.existingSecret }}, key: {{ $keys.secretAccessKeyKey }} } }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.minio.resources | nindent 12 }}
          securityContext: {{- include "nexus.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.minio.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.minio.storage.size }} }
---
# Creates the result bucket and keeps it private. Idempotent, so it is simply
# re-run whenever the release's image tag changes.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-{{ include "nexus.jobSuffix" . }}
  labels: {{- include "nexus.labels" (list . "minio-init") | nindent 4 }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {{- include "nexus.labels" (list . "minio-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: minio-init
          image: {{ .Values.minio.mcImage }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export MC_CONFIG_DIR=/tmp/mc
              until mc alias set nexus "$RESULT_STORE_ENDPOINT" "$RESULT_STORE_ACCESS_KEY" "$RESULT_STORE_SECRET_KEY" >/dev/null 2>&1; do
                echo "waiting for minio"; sleep 2
              done
              mc mb --ignore-existing "nexus/$RESULT_STORE_BUCKET"
              mc anonymous set none "nexus/$RESULT_STORE_BUCKET"
              echo "bucket $RESULT_STORE_BUCKET ready"
          env: {{- include "nexus.resultStoreEnv" . | nindent 12 }}
          securityContext: {{- include "nexus.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
{{- if .Values.nats.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels: {{- include "nexus.labels" (list . "nats") | nindent 4 }}
spec:
  selector: {{- include "nexus.selector" (list . "nats") | nindent 4 }}
  # Client port only. The monitoring endpoint is unauthenticated, so it is
  # bound to the pod's loopback and deliberately not part of any Service.
  ports:
    - { name: client, port: 4222, targetPort: client }
{{- if .Values.nats.networkPolicy.enabled }}
---
# Defence in depth beneath the broker's own authorization: only the pods that
# have a NATS identity may open a connection at all. Agents outside the cluster
# reach the broker through whatever ingress an operator adds to extraFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats
  labels: {{- include "nexus.labels" (list . "nats") | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "nexus.selector" (list . "nats") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { port: 4222, protocol: TCP }
      from:
        - podSelector:
            matchLabels: {{- include "nexus.selector" (list . "event-service") | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              nexus.khuriwalgroup.com/role: agent
        {{- with .Values.nats.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels: {{- include "nexus.labels" (list . "nats") | nindent 4 }}
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: {{- include "nexus.selector" (list . "nats") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nexus.labels" (list . "nats") | nindent 8 }}
      {{- if not .Values.nats.configReloader.enabled }}
      # Without the reloader sidecar a changed ConfigMap (a new tenant, a
      # rotated key) must roll the pod to take effect.
      annotations:
        checksum/nats-config: {{ include (print $.Template.BasePath "/nats-config.yaml") . | sha256sum }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- include "nexus.placement" (list . "nats") | nindent 6 }}
      # The reloader signals nats-server (SIGHUP) when the config, the
      # authorization include or the TLS files change, so adding a tenant,
      # rotating an NKey or renewing the certificate needs no restart.
      shareProcessNamespace: {{ .Values.nats.configReloader.enabled }}
      automountServiceAccountToken: false
      {{- if ne .Values.nats.auth.mode "none" }}
      # Streams created before authorization lived in the global account ($G).
      # With accounts configured nothing owns $G, so nats-server can never
      # recover those streams and reports them unhealthy forever. They carry
      # only notifications (PostgreSQL is authoritative, ADR-0003) and the
      # event-service recreates its streams in the NEXUS account, so the old
      # store is MOVED aside -- never deleted -- for the operator to remove
      # (docs/OPERATIONS.md §11.7, upgrading an existing broker).
      initContainers:
        - name: retire-global-account-streams
          image: {{ .Values.nats.image }}
          command:
            - sh
            - -c
            - |
              legacy='/data/jetstream/$G'
              if [ -d "$legacy" ]; then
                dest="/data/retired-global-account-$(date -u +%Y%m%dT%H%M%SZ)"
                mv "$legacy" "$dest"
                echo "moved pre-authorization JetStream store $legacy to $dest; delete it once the upgrade is verified"
              fi
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            {{- include "nexus.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: data, mountPath: /data }
      {{- end }}
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - { name: client, containerPort: 4222 }
          # exec, not httpGet: monitoring listens on loopback only (it has no
          # authentication), so the kubelet cannot reach it over the pod IP.
          #
          # Every probe asks only whether JetStream is serving. The full
          # /healthz also fails when any single stream is unhealthy, which a
          # restart cannot repair: as a liveness check it turned one bad stream
          # into a broker restart loop that took the whole bus down.
          startupProbe:
            exec: { command: ["wget", "-q", "-O-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"] }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["wget", "-q", "-O-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["wget", "-q", "-O-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"] }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.nats.resources | nindent 12 }}
          securityContext:
            {{- include "nexus.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/nats, readOnly: true }
            - { name: pid, mountPath: /var/run/nats }
            {{- if .Values.nats.tls.enabled }}
            - { name: tls, mountPath: /etc/nats-tls, readOnly: true }
            {{- end }}
        {{- if .Values.nats.configReloader.enabled }}
        - name: reloader
          image: {{ .Values.nats.configReloader.image }}
          args:
            - -pid
            - /var/run/nats/nats.pid
            - -config
            - /etc/nats/nats.conf
            - -config
            - /etc/nats/auth.conf
            {{- if .Values.nats.tls.enabled }}
            {{- range list "tls.crt" "tls.key" "ca.crt" }}
            - -config
            - /etc/nats-tls/{{ . }}
            {{- end }}
            {{- end }}
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            {{- include "nexus.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: config, mountPath: /etc/nats, readOnly: true }
            - { name: pid, mountPath: /var/run/nats }
            {{- if .Values.nats.tls.enabled }}
            - { name: tls, mountPath: /etc/nats-tls, readOnly: true }
            {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap: { name: nats-config }
        - { name: pid, emptyDir: {} }
        {{- if .Values.nats.tls.enabled }}
        - name: tls
          secret: { secretName: {{ .Values.nats.tls.secretName }}, defaultMode: 0400 }
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.nats.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.nats.storage.size }} }
{{- end }}
{{- if .Values.mailpit.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels: {{- include "nexus.labels" (list . "mailpit") | nindent 4 }}
spec:
  type: {{ .Values.mailpit.serviceType | default "ClusterIP" }}
  selector: {{- include "nexus.selector" (list . "mailpit") | nindent 4 }}
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: ui, port: {{ .Values.mailpit.uiPort | default 8025 }}, targetPort: ui }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: {{- include "nexus.labels" (list . "mailpit") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "nexus.selector" (list . "mailpit") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nexus.labels" (list . "mailpit") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- include "nexus.placement" (list . "mailpit") | nindent 6 }}
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          env:
            - { name: MP_MAX_MESSAGES, value: "500" }
            - { name: MP_SMTP_AUTH_ACCEPT_ANY, value: "false" }
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: ui, containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /readyz, port: ui }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext: {{- include "nexus.containerSecurity" . | nindent 12 }}
{{- end }}
{{- end }}
