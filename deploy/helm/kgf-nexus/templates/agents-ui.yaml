{{- /*
Copyright 2026 Khuriwal Group
SPDX-License-Identifier: Apache-2.0

Worker agents and the console. A worker-pool release
(components.controlPlane.enabled=false) renders the agents only; they dial
agentDefaults.controlPlane and agentDefaults.nats.
*/ -}}
{{- include "nexus.valuesComplete" . }}
{{- $root := . -}}
{{- range .Values.agents }}
{{- $sa := include "nexus.saFor" (list $root "agent" .serviceAccount (.executors | default "subprocess")) | fromYaml }}
{{- $resources := include "nexus.agentResources" (list $root .) | fromYaml }}
{{- $placement := include "nexus.agentPlacement" (list $root .) | fromYaml }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels: {{- include "nexus.labels" (list $root .name) | nindent 4 }}
    nexus.khuriwalgroup.com/role: agent
spec:
  {{- $live := dict }}
  {{- if include "nexus.controllerManagesAgentReplicas" (list $root .) }}
  {{- /* The cluster controller scales this Deployment: keep its count. */}}
  {{- $live = lookup "apps/v1" "Deployment" $root.Release.Namespace .name }}
  {{- end }}
  replicas: {{ include "nexus.agentReplicas" (list $root . $live) }}
  # An agent is a worker identity: replacing it while its old pod still holds
  # leases would briefly double its advertised capacity. Recreate drains the
  # old one (NEXUS_DRAIN_GRACE) before the new one registers.
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "nexus.selector" (list $root .name) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nexus.labels" (list $root .name) | nindent 8 }}
        nexus.khuriwalgroup.com/role: agent
        {{- include "nexus.saPodLabels" $sa | indent 8 }}
      {{- include "nexus.metricsAnnotations" (list $root (int $root.Values.metrics.agentPort)) | nindent 6 }}
    spec:
      {{- include "nexus.podIdentity" $sa | nindent 6 }}
      {{- include "nexus.pullSecrets" $root | nindent 6 }}
      securityContext: {{- include "nexus.podSecurity" $root | nindent 8 }}
      {{- include "nexus.placement" (list $root .name $placement) | nindent 6 }}
      terminationGracePeriodSeconds: {{ $root.Values.agentDefaults.terminationGracePeriodSeconds }}
      containers:
        - name: agent
          image: {{ include "nexus.image" (list $root "agent") }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          # Every number is rendered through int64: Helm reads YAML numbers as
          # float64, and a large one would otherwise print as 1.7179869184e+10.
          env:
            {{- include "nexus.resultStoreEnv" $root | nindent 12 }}
            {{- include "nexus.natsEnv" (list $root "agent") | nindent 12 }}
            # The worker gRPC endpoint: this release's api-gateway, or the
            # control plane a worker-pool release serves.
            - { name: NEXUS_CONTROL_PLANE, value: {{ ($root.Values.agentDefaults.controlPlane | default dict).address | default "api-gateway:9091" | quote }} }
            # The tenant this agent serves (agents[].namespace, else
            # nexusNamespace), and a worker key minted for that tenant
            # (agents[].workerApiKeySecretKey in existingSecret).
            - name: NEXUS_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $root.Values.existingSecret }}, key: {{ .workerApiKeySecretKey | default $root.Values.agentDefaults.workerApiKeySecretKey | default "worker-api-key" }} } }
            - { name: NEXUS_NAMESPACE, value: {{ .namespace | default $root.Values.nexusNamespace | quote }} }
            - { name: NEXUS_QUEUES, value: {{ .queues | quote }} }
            - { name: NEXUS_LABELS, value: {{ .labels | quote }} }
            {{- /* No NEXUS_EXECUTORS: the agent discovers its executors
                   (subprocess always; kubernetes from the NEXUS_K8S_*
                   configuration below). `executors` selects that
                   configuration; nexus.agentExecutorsRequired checks it. */}}
            {{- include "nexus.agentExecutorsRequired" . }}
            {{- if include "nexus.agentUsesKubernetes" . }}
            {{- $k := include "nexus.agentK8s" (list $root .) | fromYaml }}
            # The kubernetes executor (OPERATIONS §13). The pod name is the
            # agent's orphan-reaping identity; the Jobs it creates are owned by
            # this pod when they run in its own namespace.
            - { name: NEXUS_K8S_NAMESPACE, value: {{ $k.namespace | quote }} }
            - name: NEXUS_K8S_OWNER
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NEXUS_K8S_OWNER_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NEXUS_K8S_OWNER_POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: NEXUS_K8S_OWNER_POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            {{- with $k.serviceAccount }}
            - { name: NEXUS_K8S_SERVICE_ACCOUNT, value: {{ . | quote }} }
            {{- end }}
            {{- with $k.helperImage }}
            - { name: NEXUS_K8S_HELPER_IMAGE, value: {{ . | quote }} }
            {{- end }}
            {{- /* Device-plugin resources task pods request (ADR-0029 §2). */}}
            {{- with $k.gpuResourceName }}
            - { name: NEXUS_K8S_GPU_RESOURCE, value: {{ . | quote }} }
            {{- end }}
            {{- with $k.migResourcePrefix }}
            - { name: NEXUS_K8S_MIG_RESOURCE_PREFIX, value: {{ . | quote }} }
            {{- end }}
            {{- with $k.sharedGpuResourceName }}
            - { name: NEXUS_K8S_GPU_SHARED_RESOURCE, value: {{ . | quote }} }
            {{- end }}
            {{- with $k.gpuKindLabel }}
            - { name: NEXUS_K8S_GPU_KIND_LABEL, value: {{ . | quote }} }
            {{- end }}
            {{- /* Where the TASK pods run (the agent pod's own placement is
                   nodeSelector/tolerations above): key=value pairs and the
                   kubectl taint spelling the executor parses. */}}
            {{- with $k.taskNodeSelector }}
            {{- $kv := list }}
            {{- range $key := keys . | sortAlpha }}{{ $kv = append $kv (printf "%s=%s" $key (index $k.taskNodeSelector $key)) }}{{ end }}
            - { name: NEXUS_K8S_NODE_SELECTOR, value: {{ join "," $kv | quote }} }
            {{- end }}
            {{- with $k.taskTolerations }}
            {{- $tols := list }}
            {{- range . }}
            {{- $t := .key }}
            {{- if and .value (ne (.operator | default "Equal") "Exists") }}{{ $t = printf "%s=%s" $t .value }}{{ end }}
            {{- with .effect }}{{ $t = printf "%s:%s" $t . }}{{ end }}
            {{- $tols = append $tols $t }}
            {{- end }}
            - { name: NEXUS_K8S_TOLERATIONS, value: {{ join "," $tols | quote }} }
            {{- end }}
            {{- if $k.taskApi.enabled }}
            # The workload API for task pods, on this pod's IP (F148). Declared
            # before the $(VAR) reference that expands it.
            - name: NEXUS_POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: NEXUS_K8S_TASK_API_ADVERTISE, value: {{ printf "$(NEXUS_POD_IP):%d" (int $k.taskApi.port) | quote }} }
            - { name: NEXUS_K8S_TASK_API_LISTEN, value: {{ printf ":%d" (int $k.taskApi.port) | quote }} }
            {{- end }}
            {{- end }}
            - { name: NEXUS_CPU_MILLIS, value: {{ .cpuMillis | int64 | toString | quote }} }
            - { name: NEXUS_MEMORY_BYTES, value: {{ .memoryBytes | int64 | toString | quote }} }
            - { name: NEXUS_GPU_COUNT, value: {{ .gpuCount | default 0 | int64 | toString | quote }} }
            {{- with .gpuKind }}
            - { name: NEXUS_GPU_KIND, value: {{ . | quote }} }
            {{- end }}
            {{- with .gpuMemoryBytes }}
            - { name: NEXUS_GPU_MEMORY_BYTES, value: {{ . | int64 | toString | quote }} }
            {{- end }}
            - { name: NEXUS_DISK_BYTES, value: {{ .diskBytes | int64 | toString | quote }} }
            {{- with .customResources }}
            - { name: NEXUS_CUSTOM_RESOURCES, value: {{ . | quote }} }
            {{- end }}
            {{- /* Fractional GPUs, spot and caching (ADR-0029/0030/0031). */}}
            {{- with .gpuMig }}
            - { name: NEXUS_GPU_MIG, value: {{ . | quote }} }
            {{- end }}
            {{- with .gpuShared }}
            - { name: NEXUS_GPU_SHARED, value: {{ . | quote }} }
            {{- end }}
            {{- with .gpuDiscovery }}
            - { name: NEXUS_GPU_DISCOVERY, value: {{ . | quote }} }
            {{- end }}
            {{- with .capacityType }}
            - { name: NEXUS_CAPACITY_TYPE, value: {{ . | quote }} }
            {{- end }}
            {{- /* Pod, namespace, node and cluster: the instance the console
                   places, and NEXUS_CLUSTER_NAME also labels the claims. */}}
            {{- include "nexus.runtimeIdentityEnv" (list $root (include "nexus.agentClusterName" $root)) | nindent 12 }}
            {{- with .eviction }}
            {{- with .sources }}
            - { name: NEXUS_EVICTION_SOURCES, value: {{ . | quote }} }
            {{- end }}
            {{- with .taints }}
            - { name: NEXUS_EVICTION_TAINTS, value: {{ . | quote }} }
            {{- end }}
            {{- with .grace }}
            - { name: NEXUS_EVICTION_GRACE, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- with .artifactCache }}
            - { name: NEXUS_ARTIFACT_CACHE_DIR, value: /var/lib/nexus/artifacts }
            - { name: NEXUS_ARTIFACT_CACHE_BYTES, value: {{ .bytes | quote }} }
            {{- with .verify }}
            - { name: NEXUS_ARTIFACT_CACHE_VERIFY, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            - { name: NEXUS_DRAIN_GRACE, value: {{ $root.Values.agentDefaults.drainGrace | quote }} }
            - { name: NEXUS_WAL_DIR, value: /var/lib/nexus/wal }
            - { name: NEXUS_WORK_DIR, value: /var/lib/nexus/work }
            - { name: LOG_LEVEL, value: {{ $root.Values.logLevel | quote }} }
            - { name: NEXUS_LOG_LEVEL, value: {{ $root.Values.logLevel | quote }} }
            # All interfaces inside the pod so Prometheus can reach it; the
            # agent's own default is loopback. No Service exposes this port.
            - { name: NEXUS_METRICS_ADDR, value: {{ printf ":%d" (int $root.Values.metrics.agentPort) | quote }} }
            # Resolved secret files never touch the work volume's disk (ADR-0025).
            - { name: NEXUS_SECRETS_DIR_ROOT, value: /var/lib/nexus/secrets }
            {{- with $root.Values.agentDefaults.secrets }}
            {{- if .configSecret }}
            - { name: NEXUS_SECRETS_CONFIG, value: /etc/nexus/secrets/secrets.yaml }
            {{- end }}
            {{- if .workloadIdentityClientId }}
            - { name: AZURE_CLIENT_ID, value: {{ .workloadIdentityClientId | quote }} }
            {{- end }}
            {{- if .subprocessEnvPassthrough }}
            - { name: NEXUS_SUBPROCESS_ENV_PASSTHROUGH, value: {{ .subprocessEnvPassthrough | quote }} }
            {{- end }}
            {{- end }}
            {{- include "nexus.agentTlsEnv" $root | nindent 12 }}
            {{- include "nexus.tracingEnv" $root | nindent 12 }}
          ports:
            - { name: metrics, containerPort: {{ int $root.Values.metrics.agentPort }} }
            {{- if include "nexus.agentUsesKubernetes" . }}
            {{- $k := include "nexus.agentK8s" (list $root .) | fromYaml }}
            {{- if $k.taskApi.enabled }}
            - { name: task-api, containerPort: {{ int $k.taskApi.port }} }
            {{- end }}
            {{- end }}
          # Not ready until the agent has registered with the control plane
          # (it retries with backoff while the gateway starts), so a rollout
          # waits for agents that can take work. No liveness probe on
          # registration: a control-plane outage is waited out, not restarted.
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml $resources | nindent 12 }}
          securityContext: {{- include "nexus.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            # The WAL outlives a container restart (emptyDir survives those),
            # which is the case it exists for; a rescheduled pod is a new
            # worker identity anyway and re-registers.
            - { name: wal, mountPath: /var/lib/nexus/wal }
            - { name: work, mountPath: /var/lib/nexus/work }
            - { name: tmp, mountPath: /tmp }
            - { name: secrets-tmpfs, mountPath: /var/lib/nexus/secrets }
            {{- if $root.Values.agentDefaults.secrets.configSecret }}
            - { name: secrets-config, mountPath: /etc/nexus/secrets, readOnly: true }
            {{- end }}
            {{- range $root.Values.agentDefaults.secrets.fileSecrets }}
            - { name: {{ printf "fs-%s" .name }}, mountPath: {{ .mountPath | quote }}, readOnly: true }
            {{- end }}
            {{- if .artifactCache }}
            - { name: artifacts, mountPath: /var/lib/nexus/artifacts }
            {{- end }}
            {{- include "nexus.natsVolumeMounts" (list $root "agent") | nindent 12 }}
            {{- include "nexus.agentTlsVolumeMounts" $root | nindent 12 }}
      volumes:
        - { name: wal, emptyDir: {} }
        - { name: work, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - name: secrets-tmpfs
          emptyDir: { medium: Memory, sizeLimit: {{ $root.Values.agentDefaults.secrets.tmpfsSizeLimit | default "64Mi" }} }
        {{- with $root.Values.agentDefaults.secrets.configSecret }}
        # 0440 and read-only: the file names credentials paths, never values,
        # but it decides which backends this agent may reach.
        - name: secrets-config
          secret: { secretName: {{ . | quote }}, defaultMode: 0440, items: [{ key: secrets.yaml, path: secrets.yaml }] }
        {{- end }}
        {{- range $root.Values.agentDefaults.secrets.fileSecrets }}
        - name: {{ printf "fs-%s" .name }}
          secret: { secretName: {{ .secretName | quote }}, defaultMode: 0440 }
        {{- end }}
        {{- with .artifactCache }}
        {{- /* Sized above the cache bound so eviction happens in the cache, not
               by kubelet evicting the pod. A hostPath or local PV keeps the cache
               across pod restarts; an emptyDir does not (OPERATIONS §28.4). */}}
        - name: artifacts
          emptyDir: { sizeLimit: {{ .sizeLimit | default .bytes | quote }} }
        {{- end }}
        {{- include "nexus.natsVolumes" (list $root "agent" (.natsSeedKey | default "")) | nindent 8 }}
        {{- include "nexus.agentTlsVolumes" $root | nindent 8 }}
{{- include "nexus.pdb" (list $root .name .name (.replicas | default 1) .podDisruptionBudget) }}
{{- end }}
{{- if and .Values.ui.enabled (include "nexus.controlPlaneEnabled" .) }}
{{- $sa := include "nexus.saFor" (list . "ui" nil) | fromYaml }}
{{- $resolver := .Values.dns.resolver }}
{{- if not $resolver }}
{{- $kubeDNS := lookup "v1" "Service" "kube-system" "kube-dns" }}
{{- $resolver = ($kubeDNS.spec).clusterIP | default "10.96.0.10" }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels: {{- include "nexus.labels" (list . "ui") | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  selector: {{- include "nexus.selector" (list . "ui") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.ui.service.port }}, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels: {{- include "nexus.labels" (list . "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas | default 1 }}
  selector:
    matchLabels: {{- include "nexus.selector" (list . "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus.labels" (list . "ui") | nindent 8 }}
        {{- include "nexus.saPodLabels" $sa | indent 8 }}
    spec:
      {{- include "nexus.podIdentity" $sa | nindent 6 }}
      {{- include "nexus.pullSecrets" . | nindent 6 }}
      # The console image is nginx-unprivileged: uid 101, port 8080, so the
      # pod meets Pod Security "restricted" like every other Nexus pod.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      {{- include "nexus.placement" (list . "ui") | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "nexus.image" (list . "ui") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # nginx's resolver needs an IP and applies no search domains, so
            # the cluster DNS IP and the gateway's FQDN (deploy/nginx.conf).
            - { name: NEXUS_DNS_RESOLVER, value: {{ $resolver | quote }} }
            - { name: NEXUS_GATEWAY_UPSTREAM, value: {{ printf "api-gateway.%s.svc.%s:8080" .Release.Namespace .Values.dns.clusterDomain | quote }} }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            {{- include "nexus.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          # The only writable paths: the image's entrypoint renders the nginx
          # config from its template into conf.d at start, and nginx keeps its
          # pid and temp files under /tmp.
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: conf, emptyDir: { sizeLimit: 1Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
{{- include "nexus.pdb" (list . "ui" "ui" (.Values.ui.replicas | default 1) .Values.ui.podDisruptionBudget) }}
{{- end }}
