{{- /*
Copyright 2026 Khuriwal Group
SPDX-License-Identifier: Apache-2.0

One ServiceAccount per component (values.yaml `serviceAccounts`), so a cloud
identity (IRSA, EKS Pod Identity, GKE / Azure Workload Identity) binds to
exactly the pods that use the result store. Components naming the same
account share it; conflicting settings for one name are refused rather than
merged by accident.
*/ -}}
{{- include "nexus.valuesComplete" . }}
{{- $root := . -}}
{{- $users := list -}}
{{- range $k := list "apiGateway" "workflowManager" "dagEngine" "resourceManager" "eventService" "jobs" -}}
{{- $users = append $users (list $k (include "nexus.saFor" (list $root $k nil) | fromYaml)) -}}
{{- end -}}
{{- if .Values.schedulers }}{{ $users = append $users (list "scheduler" (include "nexus.saFor" (list $root "scheduler" nil) | fromYaml)) }}{{ end -}}
{{- range .Values.agents -}}
{{- $users = append $users (list (printf "agents[%s]" .name) (include "nexus.saFor" (list $root "agent" .serviceAccount (.executors | default "subprocess")) | fromYaml)) -}}
{{- end -}}
{{- if .Values.artifactGC.enabled }}{{ $users = append $users (list "artifactGC" (include "nexus.saFor" (list $root "artifactGC" nil) | fromYaml)) }}{{ end -}}
{{- if .Values.ui.enabled }}{{ $users = append $users (list "ui" (include "nexus.saFor" (list $root "ui" nil) | fromYaml)) }}{{ end -}}
{{- $byName := dict -}}{{- $firstUser := dict -}}
{{- range $u := $users -}}
{{- $who := index $u 0 -}}{{- $sa := index $u 1 -}}
{{- if eq $sa.name "nexus-cluster-controller" -}}
{{- fail (printf "serviceAccounts: %s names nexus-cluster-controller, which the cluster controller owns with its RBAC; choose another name" $who) -}}
{{- end -}}
{{- if hasKey $byName $sa.name -}}
{{- $prev := index $byName $sa.name -}}
{{- if or (ne (toJson $prev.annotations) (toJson $sa.annotations)) (ne (toJson $prev.automount) (toJson $sa.automount)) (ne (toJson $prev.podLabels) (toJson $sa.podLabels)) -}}
{{- fail (printf "serviceAccounts: %s and %s share ServiceAccount %q with different annotations, podLabels or automountServiceAccountToken; give them the same settings or different names" (index $firstUser $sa.name) $who $sa.name) -}}
{{- end -}}
{{- else -}}
{{- $_ := set $byName $sa.name $sa -}}{{- $_ := set $firstUser $sa.name $who -}}
{{- end -}}
{{- end -}}
{{- range $name, $sa := $byName }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "nexus.labels" (list $root "identity") | nindent 4 }}
  {{- with $sa.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $sa.automount }}
{{- end }}
{{- end }}
