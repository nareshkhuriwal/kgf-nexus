{{- /*
Copyright 2026 Khuriwal Group
SPDX-License-Identifier: Apache-2.0

The six control-plane services (ADR-0011): one Deployment and Service each,
plus one scheduler Deployment per queue. Env mirrors deploy/docker-compose.yml
so the two deployments cannot drift in behaviour.
*/ -}}
{{- $root := . -}}
{{- $svcs := list
  (dict "name" "api-gateway" "key" "apiGateway" "image" "api-gateway" "grpc" 9091 "resultStore" true "extra" (list
      (dict "name" "AUTH_MODE" "value" "api_key")
      (dict "name" "NEXUS_SMTP_HOST" "value" (.Values.smtp.host | toString))
      (dict "name" "NEXUS_SMTP_PORT" "value" (.Values.smtp.port | toString))
      (dict "name" "NEXUS_SMTP_TLS" "value" (.Values.smtp.tls | toString))
      (dict "name" "NEXUS_SMTP_FROM" "value" (.Values.smtp.from | toString))
      (dict "name" "NEXUS_PUBLIC_URL" "value" (.Values.smtp.publicUrl | toString))))
  (dict "name" "workflow-manager" "key" "workflowManager" "image" "workflow-manager" "grpc" 9090 "extra" (list
      (dict "name" "TIMER_POLL_INTERVAL_MS" "value" "1000")))
  (dict "name" "dag-engine" "key" "dagEngine" "image" "dag-engine" "grpc" 9090 "extra" (list))
  (dict "name" "resource-manager" "key" "resourceManager" "image" "resource-manager" "grpc" 9090 "extra" (list
      (dict "name" "WORKER_LIVENESS_TIMEOUT_MS" "value" "15000")
      (dict "name" "RECONCILE_INTERVAL_MS" "value" "10000")))
  (dict "name" "event-service" "key" "eventService" "image" "event-service" "grpc" 9090 "nats" true "extra" (list
      (dict "name" "NEXUS_OUTBOX_RETENTION" "value" "1h")
      (dict "name" "NEXUS_OUTBOX_MAX_AGE" "value" "24h")
      (dict "name" "EVENT_SSE_KEEPALIVE_MS" "value" "15000")))
-}}
{{- range .Values.schedulers }}
{{- $svcs = append $svcs (dict "name" .name "key" "" "image" "scheduler" "grpc" 9090 "replicas" (.replicas | default 1) "extra" (list
      (dict "name" "NEXUS_QUEUE" "value" .queue)
      (dict "name" "SCHEDULER_BIN_PACKING" "value" "best_fit")
      (dict "name" "SCHEDULER_LOOKAHEAD" "value" "32")
      (dict "name" "SCHEDULER_AGING_MS" "value" "30000")
      (dict "name" "SCHEDULER_POLL_INTERVAL_MS" "value" "500")
      (dict "name" "LEASE_TTL_MS" "value" "30000"))) }}
{{- end }}
{{- range $svcs }}
{{- $over := dict }}
{{- if .key }}{{ $over = index $root.Values.services .key | default dict }}{{ end }}
{{- $replicas := .replicas | default $over.replicas | default $root.Values.serviceDefaults.replicas }}
{{- $resources := $over.resources | default $root.Values.serviceDefaults.resources }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels: {{- include "nexus.labels" (list $root .name) | nindent 4 }}
spec:
  # In-cluster ports are FIXED: every peer, the agents (api-gateway:9091) and
  # the console's nginx (api-gateway:8080) address them. Exposure outside the
  # cluster is a separate Service below, so an environment choosing its own
  # external ports can never move the ones the platform depends on.
  selector: {{- include "nexus.selector" (list $root .name) | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: grpc, port: {{ .grpc }}, targetPort: grpc }
{{- if and (eq .name "api-gateway") $over.external $over.external.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-external
  labels: {{- include "nexus.labels" (list $root .name) | nindent 4 }}
spec:
  type: {{ $over.external.type | default "LoadBalancer" }}
  selector: {{- include "nexus.selector" (list $root .name) | nindent 4 }}
  ports:
    - { name: http, port: {{ $over.external.httpPort | default 8080 }}, targetPort: http }
    - { name: grpc, port: {{ $over.external.grpcPort | default 9091 }}, targetPort: grpc }
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels: {{- include "nexus.labels" (list $root .name) | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels: {{- include "nexus.selector" (list $root .name) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nexus.labels" (list $root .name) | nindent 8 }}
    spec:
      {{- include "nexus.pullSecrets" $root | nindent 6 }}
      securityContext: {{- include "nexus.podSecurity" $root | nindent 8 }}
      initContainers:
        {{- include "nexus.waitForSchema" $root | nindent 8 }}
      containers:
        - name: {{ .name }}
          image: {{ include "nexus.image" (list $root .image) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          env:
            {{- include "nexus.serviceEnv" $root | nindent 12 }}
            {{- include "nexus.listenEnv" (list .grpc) | nindent 12 }}
            {{- if .resultStore }}
            {{- include "nexus.resultStoreEnv" $root | nindent 12 }}
            {{- end }}
            {{- if .nats }}
            {{- include "nexus.natsEnv" $root | nindent 12 }}
            {{- end }}
            {{- range .extra }}
            - { name: {{ .name }}, value: {{ .value | quote }} }
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: {{ .grpc }} }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml $resources | nindent 12 }}
          securityContext:
            {{- include "nexus.containerSecurity" $root | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- if gt (int $replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .name }}
  labels: {{- include "nexus.labels" (list $root .name) | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "nexus.selector" (list $root .name) | nindent 6 }}
{{- end }}
{{- end }}
