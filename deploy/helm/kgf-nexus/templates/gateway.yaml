{{- /*
Copyright 2026 Khuriwal Group
SPDX-License-Identifier: Apache-2.0

Host-based routing through the Kubernetes Gateway API (not Ingress: the
ingress-nginx controller was retired in 2026, and Gateway API is the maintained
standard). Needs a Gateway API implementation installed first -- the dev
environment installs Envoy Gateway (deploy/terraform/environments/dev).

  <hosts.console>  -> ui           (the console; /v1 is proxied to the gateway)
  <hosts.api>      -> api-gateway  (REST for nexusctl and the SDK)
  <hosts.mail>     -> mailpit UI   (only when mailpit is enabled)
*/ -}}
{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.createGatewayClass }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
  labels: {{- include "nexus.labels" (list . "gateway") | nindent 4 }}
spec:
  controllerName: {{ .Values.gateway.controllerName }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nexus
  labels: {{- include "nexus.labels" (list . "gateway") | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces: { from: Same }
{{- $routes := list
  (dict "name" "console" "host" .Values.gateway.hosts.console "service" "ui" "port" .Values.ui.service.port "enabled" .Values.ui.enabled "streaming" true)
  (dict "name" "api" "host" .Values.gateway.hosts.api "service" "api-gateway" "port" 8080 "enabled" true "streaming" true)
  (dict "name" "mail" "host" .Values.gateway.hosts.mail "service" "mailpit" "port" (.Values.mailpit.uiPort | default 8025) "enabled" .Values.mailpit.enabled "streaming" false)
}}
{{- range $routes }}
{{- if and .enabled .host }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus-{{ .name }}
  labels: {{- include "nexus.labels" (list $ "gateway") | nindent 4 }}
spec:
  parentRefs:
    - name: nexus
      sectionName: http
  hostnames: [{{ .host | quote }}]
  rules:
    - backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
      {{- if .streaming }}
      # No request timeout: the console's live log tail and run events are
      # server-sent event streams that stay open for as long as a page is
      # watching. A proxy default (Envoy's is 15s) would cut every one of them.
      timeouts:
        request: "0s"
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
