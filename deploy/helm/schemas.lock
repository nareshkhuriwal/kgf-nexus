# Kubernetes and CRD JSON schemas deploy/helm/validate.sh checks the chart
# against, pinned by source commit AND by SHA-256 of each file.
#
# validate.sh fetches each file below into its schema cache (default
# ~/.cache/kgf-nexus/kubeconform-schemas) from the pinned commit, refuses any
# file whose SHA-256 differs, and then runs kubeconform against the cache ONLY:
# no schema is ever read from a floating branch. Once the cache is warm the
# check needs no network (SCHEMA_OFFLINE=1 makes a cold cache an error rather
# than a download).
#
# Sources (the commit pins are the `commit` lines):
#   k8s/   https://raw.githubusercontent.com/yannh/kubernetes-json-schema/<k8s>/...
#   crds/  https://raw.githubusercontent.com/datreeio/CRDs-catalog/<crds>/...
#
# To add a kind, or move the commits or KUBE_VERSION: edit the lines below (any
# placeholder hash will do for a new line) and run
#   deploy/helm/validate.sh --update-schema-lock
# which downloads each file from the pinned commit, rewrites its hash, and
# prints the diff for review. The files are addressed by git commit, so the
# content cannot change underneath a pin; the hashes also catch a proxy or
# mirror serving something else.
