# Release Pipeline for KGF Nexus
# Triggers on merges to the default branch.
#
# Shape: one build job per image (compile-time expansion over the `images`
# template, so a failure names the image), then a job that collects every
# pushed digest into one validated map and publishes it as an artifact.
#
# ─── On the deploy stages ────────────────────────────────────────────────
#
# They are written and they are OFF. Nexus has no Helm chart and no Bicep stamp
# today -- deploy/ is docker-compose, which README.md states is local-development
# only -- and the dev cluster kgf-nexus-dev-cin-aks is provisioned but STOPPED,
# with Nexus itself never deployed to it (deploy/AZURE-PROVISIONING.md, final
# verification). So the deploy stages below are the shape the release will take,
# not a path anything can currently travel. Each one guards itself: it refuses
# to run until the chart it needs exists.
#
# Environment stages also stay off until their Azure DevOps resources exist,
# because a service connection or variable group name that does not resolve is a
# COMPILE-TIME error that fails the whole run, including the build. Each
# environment needs:
#   - an Azure Resource Manager service connection able to run
#     `az aks get-credentials`, holding Azure Kubernetes Service RBAC Cluster
#     Admin on the cluster
#   - a variable group kgf-nexus-<env> holding NEXUS_SMOKE_TOKEN (secret)
#   - an environment kgf-nexus-<env>; add an approval check on test and prod
#   - deploy/helm/kgf-nexus to exist, with a values-<env>.yaml
# Then set the matching deployTo<Env> parameter default to true and give the
# environment its base URL.
#
# Until then this pipeline does the half that is real and useful today: it
# builds every image on every merge, pushes it digest-pinned to ACR, and
# publishes a complete digest map. Those images are what any deploy -- Helm,
# compose on a VM, or a human running `docker run` -- will pull.

# NOT a branch trigger.
#
# A `trigger: branches: [main]` here would start this pipeline on the merge
# commit at the same moment the validation pipeline started on it -- the two
# would race, and the release would build and push images for a commit whose
# tests had not finished, sometimes publishing a digest for a commit that was
# about to go red. Which of the two won would depend on agent availability.
#
# Declaring the gate as a pipeline RESOURCE inverts that: this pipeline does not
# start until "kgf-nexus-pr-validation" has completed successfully on main, so
# a push to the registry always follows a green gate on the same commit.
#
# The `trigger:` inside the resource is what makes it automatic; without it the
# resource would only be a version to download artifacts from. `stages` is left
# unset so completion of the WHOLE run is what starts this one, rather than one
# stage of it.
trigger: none
pr: none

resources:
  pipelines:
    - pipeline: validation          # the name this run refers to it by
      source: kgf-nexus-pr-validation   # the pipeline's name in Azure DevOps
      trigger:
        branches:
          include:
            - main

parameters:
  # ── Registry ──────────────────────────────────────────────────────────
  # Nexus shares kgf-cloud's registry under a nexus/ repository prefix, so
  # nexus/api-gateway and kgf/gateway sit side by side in one ACR with one
  # service connection. The prefix is what keeps them from colliding.
  - name: acrServiceConnection
    type: string
    default: kgfcloudacr_conn
  - name: acrLoginServer
    type: string
    default: kgfcloudacr.azurecr.io
  - name: repositoryPrefix
    type: string
    default: nexus

  # ── Dev environment ───────────────────────────────────────────────────
  - name: deployToDev
    type: boolean
    default: false
  - name: devAzureSubscription
    type: string
    default: kgf-nexus-arm
  - name: devResourceGroup
    type: string
    default: kgf-nexus-dev-cin-rg
  - name: devClusterName
    type: string
    default: kgf-nexus-dev-cin-aks
  - name: devEnvironment
    type: string
    default: kgf-nexus-dev
  - name: devBaseUrl
    type: string
    default: ''

  # ── Test environment ──────────────────────────────────────────────────
  - name: deployToTest
    type: boolean
    default: false
  - name: testAzureSubscription
    type: string
    default: kgf-nexus-arm
  - name: testResourceGroup
    type: string
    default: kgf-nexus-test-cin-rg
  - name: testClusterName
    type: string
    default: kgf-nexus-test-cin-aks
  - name: testEnvironment
    type: string
    default: kgf-nexus-test
  - name: testBaseUrl
    type: string
    default: ''

  # ── Production environment ────────────────────────────────────────────
  - name: deployToProd
    type: boolean
    default: false
  - name: prodAzureSubscription
    type: string
    default: kgf-nexus-arm
  - name: prodResourceGroup
    type: string
    default: kgf-nexus-prod-cin-rg
  - name: prodClusterName
    type: string
    default: kgf-nexus-prod-cin-aks
  - name: prodEnvironment
    type: string
    default: kgf-nexus-prod
  - name: prodBaseUrl
    type: string
    default: ''

  # Every image with a Dockerfile, shared with the PR pipeline so the gate and
  # the release can never build different sets.
  - template: templates/images.yml

variables:
  tag: 'v-$(Build.BuildId)'
  CI: 'true'
  # CI pins the toolchain rather than following the older minimum language
  # version in go.mod. Passed to `docker build` too, so the image and the agent
  # compile with the same Go.
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

pool:
  # Self-hosted agents run this pipeline. Microsoft-hosted agents need purchased
  # parallelism. The pool name is fixed here because a template expression is
  # not allowed in a pipeline-level pool block.
  name: Default

stages:
  # Build and push every image.
  #
  # On change detection: an image whose files did not change should ideally be
  # skipped and its previous digest reused. Azure DevOps YAML cannot express
  # that without a mechanism that can silently release a stale image. Jobs are
  # expanded at compile time, so a runtime `git diff` cannot remove one; and
  # reusing a previous digest means reading another run's output variables over
  # the REST API and trusting a tag that may have been overwritten since. Both
  # halves fail quietly and in the direction that matters -- what runs ends up
  # being an image this release never built. And Nexus makes skipping worse than
  # kgf-cloud does: every image is built from ONE Go module at the repository
  # root, so a change to internal/ or gen/ changes every service binary, and
  # "which files changed" is almost always "all of them". So all ten are built
  # on every run, and every run produces a complete digest map. If build time
  # becomes the constraint, the honest fix is a Docker layer cache on the agent,
  # not a skipped job.
  - stage: build
    displayName: 'Build and push images'
    jobs:
      - ${{ each image in parameters.images }}:
        - job: build_${{ replace(image.name, '-', '_') }}
          displayName: 'Build nexus/${{ image.name }}'
          timeoutInMinutes: 40
          workspace:
            clean: all
          steps:
            - checkout: self
              persistCredentials: false

            - task: GoTool@0
              displayName: 'Install Go'
              inputs:
                version: $(GO_VERSION)

            - template: templates/service-build.yml
              parameters:
                name: ${{ image.name }}
                imageName: ${{ parameters.repositoryPrefix }}/${{ image.name }}
                dockerfile: ${{ image.dockerfile }}
                servicePath: ${{ image.servicePath }}
                acrLoginServer: ${{ parameters.acrLoginServer }}
                acrServiceConnection: ${{ parameters.acrServiceConnection }}
                imageTag: $(tag)
                # Every build on main becomes the dev candidate, so dev-latest
                # is applied here. test-latest and prod-latest are applied by
                # their own deploy stage, because a build only becomes the test
                # or production image once that stage's approval has released
                # it; moving those tags at build time would make them describe
                # an image no one approved.
                environmentTag: 'dev-latest'

      # Turn the per-job output variables into one JSON map the deploy stages
      # consume, and refuse it here if it is incomplete or not digest-pinned, so
      # a bad map fails before anything is deployed.
      - job: collect_digests
        displayName: 'Collect and validate image digests'
        dependsOn:
          - ${{ each image in parameters.images }}:
            - build_${{ replace(image.name, '-', '_') }}
        condition: succeeded()
        variables:
          # service-build.yml names its push step push_<name> and sets
          # publishedImage_<name>, both with dashes replaced by underscores.
          ${{ each image in parameters.images }}:
            digest_${{ replace(image.name, '-', '_') }}: $[ dependencies.build_${{ replace(image.name, '-', '_') }}.outputs['push_${{ replace(image.name, '-', '_') }}.publishedImage_${{ replace(image.name, '-', '_') }}'] ]
        steps:
          - checkout: self
            persistCredentials: false
            fetchDepth: 1

          - script: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              # Every NEXUS_DIGEST_* variable below is one build job's output.
              # The map is refused unless EVERY expected image is present and
              # every reference is digest-pinned -- a tag reference would let
              # the thing that eventually deploys pull an image this run did not
              # build, which is the whole failure this map exists to prevent.
              python3 - "$(Build.ArtifactStagingDirectory)/digests.json" <<'PY'
              import json, os, re, sys

              # The variable name holds the image name with dashes replaced by
              # underscores, because a dash is not legal in a shell variable
              # name; only the dashes have to be restored.
              # The each-loop above emits one NEXUS_DIGEST_<name> variable per
              # image in templates/images.yml, so the set of those variables is
              # already the complete expected set -- no second list to keep in
              # step with the first. A build job that failed or never ran leaves
              # its variable PRESENT and EMPTY, which is the missing case below.
              prefix = "NEXUS_DIGEST_"
              pinned = re.compile(r"^[^@\s]+@sha256:[0-9a-f]{64}$")

              digests, problems = {}, []
              for key, value in os.environ.items():
                  if not key.startswith(prefix):
                      continue
                  name = key[len(prefix):].lower().replace("_", "-")
                  value = value.strip()
                  if not value:
                      problems.append(f"{name}: no digest was published (did its push step run?)")
                  elif not pinned.match(value):
                      problems.append(f"{name}: not a digest-pinned reference: {value!r}")
                  else:
                      digests[name] = value

              if not digests and not problems:
                  problems.append("no NEXUS_DIGEST_* variables were set at all; the build stage produced nothing")

              if problems:
                  print("The digest map is not releasable:", file=sys.stderr)
                  for p in problems:
                      print(f"  - {p}", file=sys.stderr)
                  raise SystemExit(1)

              # Only written once the WHOLE map validates, so a partial map
              # never reaches a deploy stage.
              with open(sys.argv[1], "w") as fh:
                  json.dump(digests, fh, indent=2, sort_keys=True)
              print(f"{len(digests)} images, every one digest-pinned")
              PY
              cat "$(Build.ArtifactStagingDirectory)/digests.json"
              echo "##vso[task.setvariable variable=imageDigests;isOutput=true]$(python3 -c 'import json,sys;print(json.dumps(json.load(open(sys.argv[1])),sort_keys=True))' "$(Build.ArtifactStagingDirectory)/digests.json")"
            name: collect
            displayName: 'Collect and validate digests'
            env:
              # Mapping context, so the compile-time loop is legal here. The
              # variable name carries the image name after the prefix.
              ${{ each image in parameters.images }}:
                NEXUS_DIGEST_${{ replace(image.name, '-', '_') }}: $(digest_${{ replace(image.name, '-', '_') }})


          - task: PublishPipelineArtifact@1
            displayName: 'Publish digest map'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/digests.json'
              artifactName: 'image-digests'
              publishLocation: 'pipeline'

  # ── Deploy to Dev ───────────────────────────────────────────────────────
  - ${{ if parameters.deployToDev }}:
    - stage: deploy_to_dev
      displayName: 'Deploy to Dev Cluster'
      dependsOn: build
      condition: succeeded()
      variables:
        - group: kgf-nexus-dev
        - name: imageDigests
          value: $[ stageDependencies.build.collect_digests.outputs['collect.imageDigests'] ]
      jobs:
        - deployment: DeployToDev
          displayName: 'Release kgf-nexus to dev'
          timeoutInMinutes: 45
          environment: ${{ parameters.devEnvironment }}
          workspace:
            clean: all
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    persistCredentials: false
                    fetchDepth: 1

                  - template: templates/deploy-aks.yml
                    parameters:
                      environment: 'dev'
                      azureSubscription: ${{ parameters.devAzureSubscription }}
                      resourceGroup: ${{ parameters.devResourceGroup }}
                      clusterName: ${{ parameters.devClusterName }}
                      valuesFile: 'deploy/helm/kgf-nexus/values-dev.yaml'

                  - template: templates/smoke-aks.yml
                    parameters:
                      environment: 'dev'
                      baseUrl: ${{ parameters.devBaseUrl }}

  # ── Deploy to Test (with manual approval on the environment) ────────────
  - ${{ if parameters.deployToTest }}:
    - stage: deploy_to_test
      displayName: 'Deploy to Test Cluster'
      dependsOn:
        - build
        - ${{ if parameters.deployToDev }}:
          - deploy_to_dev
      condition: succeeded()
      variables:
        - group: kgf-nexus-test
        - name: imageDigests
          value: $[ stageDependencies.build.collect_digests.outputs['collect.imageDigests'] ]
      jobs:
        - deployment: DeployToTest
          displayName: 'Release kgf-nexus to test'
          timeoutInMinutes: 45
          environment: ${{ parameters.testEnvironment }}  # Add an approval check on this environment for a manual gate
          workspace:
            clean: all
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    persistCredentials: false
                    fetchDepth: 1

                  - template: templates/deploy-aks.yml
                    parameters:
                      environment: 'test'
                      azureSubscription: ${{ parameters.testAzureSubscription }}
                      resourceGroup: ${{ parameters.testResourceGroup }}
                      clusterName: ${{ parameters.testClusterName }}
                      valuesFile: 'deploy/helm/kgf-nexus/values-test.yaml'

                  - template: templates/smoke-aks.yml
                    parameters:
                      environment: 'test'
                      baseUrl: ${{ parameters.testBaseUrl }}

                  - template: templates/retag.yml
                    parameters:
                      environment: 'test'
                      azureSubscription: ${{ parameters.testAzureSubscription }}
                      acrLoginServer: ${{ parameters.acrLoginServer }}

  # ── Deploy to Production (with manual approval on the environment) ──────
  - ${{ if parameters.deployToProd }}:
    - stage: deploy_to_prod
      displayName: 'Deploy to Production Cluster'
      dependsOn:
        - build
        - ${{ if parameters.deployToTest }}:
          - deploy_to_test
      condition: succeeded()
      variables:
        - group: kgf-nexus-prod
        - name: imageDigests
          value: $[ stageDependencies.build.collect_digests.outputs['collect.imageDigests'] ]
      jobs:
        - deployment: DeployToProd
          displayName: 'Release kgf-nexus to production'
          timeoutInMinutes: 60
          environment: ${{ parameters.prodEnvironment }}  # Add an approval check on this environment for a manual gate
          workspace:
            clean: all
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    persistCredentials: false
                    fetchDepth: 1

                  - template: templates/deploy-aks.yml
                    parameters:
                      environment: 'prod'
                      azureSubscription: ${{ parameters.prodAzureSubscription }}
                      resourceGroup: ${{ parameters.prodResourceGroup }}
                      clusterName: ${{ parameters.prodClusterName }}
                      valuesFile: 'deploy/helm/kgf-nexus/values-prod.yaml'

                  - template: templates/smoke-aks.yml
                    parameters:
                      environment: 'prod'
                      baseUrl: ${{ parameters.prodBaseUrl }}

                  - template: templates/retag.yml
                    parameters:
                      environment: 'prod'
                      azureSubscription: ${{ parameters.prodAzureSubscription }}
                      acrLoginServer: ${{ parameters.acrLoginServer }}
