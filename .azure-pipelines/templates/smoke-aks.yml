# Proves a release end to end through the public ingress: the console is served,
# the gateway answers through it, and the fleet registered. Nothing here reaches
# outside the cluster under test.
#
# Like deploy-aks.yml, this runs only once a chart exists and an environment has
# a base URL. It is deliberately thinner than the unit and chaos suites: its job
# is to prove THIS DEPLOYMENT of already-tested code is reachable and wired up,
# not to re-test the code.
#
# ─── Why nothing here probes $base/readyz ────────────────────────────────
#
# Because it would pass without a gateway. baseUrl is the console's ingress, and
# deploy/nginx.conf proxies ONLY /v1/ to api-gateway; `location /` ends in
# `try_files ... /index.html`. So $base/readyz returns the console's HTML with a
# 200 -- a green check that proves the front end is up and says nothing about
# the gateway. $base/healthz is worse: nginx answers it itself with a literal
# "ok" so that compose can tell "nginx is up" from "the gateway is up".
#
# Every check below therefore goes through /v1/, the one prefix that reaches the
# gateway. A service-level /readyz is the right probe from INSIDE the cluster
# (ADR-0011 rule 3, and the compose healthchecks use exactly that), which is
# what the chart's readiness probes should use -- not this template.

parameters:
  - name: environment
    type: string
  - name: baseUrl            # https://nexus.<env>.<domain> or the ingress address
    type: string
  - name: tokenSecret        # name of the secret variable holding an admin API key
    type: string
    default: NEXUS_SMOKE_TOKEN
  - name: namespace
    type: string
    default: default

steps:
  - script: |
      set -euo pipefail
      base='${{ parameters.baseUrl }}'
      if [ -z "$base" ]; then
        echo "No base URL is set for ${{ parameters.environment }}; set the ${{ parameters.environment }}BaseUrl parameter." >&2
        exit 1
      fi
      base="${base%/}"   # so a trailing slash in the parameter cannot produce //v1
      token='$(${{ parameters.tokenSecret }})'
      ns='${{ parameters.namespace }}'
      auth=(-H "Authorization: Bearer $token" -H "Content-Type: application/json")

      # 1. The console is served. The image is nginx serving the built bundle,
      #    so HTML carrying the mount point means the bundle built into the
      #    image that actually got deployed.
      curl -fsS --max-time 30 "$base/" | grep -q 'id="root"'
      echo "✅ operator console served"

      # 2. The gateway answers an authenticated read THROUGH the ingress. This
      #    is the check that proves the /v1/ proxy resolves to a live gateway
      #    and that the gateway can reach Postgres -- and it also proves the
      #    smoke token is valid, since -f turns a 401 into a failure.
      curl -fsS --max-time 30 "${auth[@]}" "$base/v1/namespaces/$ns/runs" \
        | python3 -c 'import json,sys; json.load(sys.stdin); print("✅ gateway answered through the ingress")'

      # 3. The schema endpoint, which is served by the gateway and needs no
      #    database. Distinguishes "the gateway is down" from "the gateway is up
      #    but its database is not" when check 2 fails.
      curl -fsS --max-time 30 "$base/v1/schemas/workflow-spec-v1.json" \
        | python3 -c 'import json,sys; json.load(sys.stdin); print("✅ gateway serves the workflow schema")'

      # 4. The workers registered. A control plane with no fleet accepts work
      #    and never runs it, which every check above would pass.
      curl -fsS --max-time 30 "${auth[@]}" "$base/v1/namespaces/$ns/workers" \
        | python3 -c '
      import json, sys
      payload = json.load(sys.stdin)
      # listWorkers returns {"workers": [...]}, not {"items": [...]}: the
      # gateway is not uniform about this and a wrong key here reads as an
      # empty fleet, which fails the deploy for the wrong reason.
      items = payload["workers"]
      active = [w for w in items if str(w.get("state", "")).upper() == "ACTIVE"]
      assert active, f"no ACTIVE workers; the fleet did not register ({len(items)} known)"
      print(f"✅ {len(active)} active workers")'

      echo "✅ ${{ parameters.environment }} smoke test passed"
    displayName: 'Smoke test ${{ parameters.environment }} through the ingress'
