# Deploys the release to a Docker daemon on a VM, managed by Portainer.
#
# Flow: the build stage pushed digest-pinned images to ACR; this renders the dev
# compose file into one that PULLS those exact images, copies it to the host,
# and runs `docker compose up -d` there. Portainer manages the resulting
# containers as it manages everything else on that daemon.
#
# ─── Why the daemon pulls rather than the agent pushing ──────────────────
#
# The pipeline agent never sends an image anywhere. It sends a compose file
# naming digests, and the host pulls them from ACR itself. So no image crosses
# the agent twice, a redeploy of unchanged services is a no-op pull, and the
# host can restart the stack on its own later and get byte-identical images
# without the pipeline being involved.
#
# ─── Why the registry credential is short-lived ──────────────────────────
#
# The host authenticates to ACR with a token minted by `az acr login
# --expose-token` during this run. It is not a stored credential on the VM:
# there is no admin password in a file that outlives the deploy and no long-term
# secret to rotate on that host. The trade is that the host cannot pull on its
# own after the token expires -- which is why `docker compose up -d` and the
# pull happen inside the same session, and why `docker logout` runs at the end.
#
# ─── What this template does NOT do ──────────────────────────────────────
#
# It does not write the host's .env. NEXUS_WORKER_API_KEY and the four
# RESULT_STORE_* variables have no defaults in the compose file, and they are
# secrets belonging to that host, not to this pipeline. They live in an env file
# beside the stack on the VM, and the deploy FAILS LOUDLY below if it is missing
# rather than starting a partial stack.

parameters:
  - name: environment
    type: string
  # An SSH service connection to the VM. Azure DevOps holds the key; it is never
  # materialised into the workspace.
  - name: sshServiceConnection
    type: string
  - name: azureSubscription
    type: string
  - name: acrLoginServer
    type: string
  # Where the stack lives on the host. The compose file and the env file sit
  # here, and Portainer is pointed at the same path.
  - name: stackDir
    type: string
    default: /opt/kgf-nexus
  - name: stackName
    type: string
    default: nexus

steps:
  # ── 1. Render ───────────────────────────────────────────────────────────
  - script: |
      set -euo pipefail
      echo "=== Render the deployable compose file ==="
      digests='$(imageDigests)'
      case "$digests" in \{*\}) ;; *) echo "imageDigests is not a JSON object: $digests" >&2; exit 1 ;; esac
      printf '%s' "$digests" > "$(Agent.TempDirectory)/digests.json"
      python3 -m pip install --quiet --disable-pip-version-check pyyaml
      # Refuses a tag reference and refuses a service whose image is absent, so
      # a bad map fails on the agent rather than half-deploying on the host.
      python3 deploy/render_compose.py \
        --digests "$(Agent.TempDirectory)/digests.json" \
        --out "$(Agent.TempDirectory)/docker-compose.deploy.yml"
      echo "--- images this release will run ---"
      grep -E '^\s+image:' "$(Agent.TempDirectory)/docker-compose.deploy.yml" | sed 's/^/  /'
    displayName: 'Render the deployable compose file'

  # ── 2. Mint a short-lived ACR token ─────────────────────────────────────
  - task: AzureCLI@2
    displayName: 'Mint a short-lived ACR pull token'
    inputs:
      azureSubscription: '${{ parameters.azureSubscription }}'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        registry='${{ parameters.acrLoginServer }}'
        # --expose-token returns a refresh token for `docker login`, so the VM
        # needs no stored registry credential and nothing on it outlives the
        # deploy. issecret so it is masked in every log line from here on.
        token="$(az acr login --name "${registry%%.*}" --expose-token --only-show-errors --query accessToken -o tsv)"
        test -n "$token" || { echo "Could not obtain an ACR token" >&2; exit 1; }
        echo "##vso[task.setvariable variable=acrPullToken;issecret=true]$token"
        echo "✅ token minted for $registry"

  # ── 3. Copy the compose file to the host ────────────────────────────────
  - task: CopyFilesOverSSH@0
    displayName: 'Copy the compose file to ${{ parameters.environment }}'
    inputs:
      sshEndpoint: '${{ parameters.sshServiceConnection }}'
      sourceFolder: '$(Agent.TempDirectory)'
      contents: 'docker-compose.deploy.yml'
      targetFolder: '${{ parameters.stackDir }}'
      # The previous file is replaced; the env file beside it is not touched,
      # because this template never writes the host's secrets.
      overwrite: true
      failOnEmptySource: true

  # ── 4. Pull and start ───────────────────────────────────────────────────
  - task: SSH@0
    displayName: 'Pull and start the stack on ${{ parameters.environment }}'
    inputs:
      sshEndpoint: '${{ parameters.sshServiceConnection }}'
      runOptions: 'inline'
      readyTimeout: '30000'
      # failOnStdErr is off deliberately: `docker compose` writes its ordinary
      # progress ("Pulling", "Created", "Started") to stderr, so leaving it on
      # fails every successful deploy. The script sets -e and checks the state
      # explicitly at the end, which is the real verdict.
      failOnStdErr: false
      inline: |
        set -euo pipefail
        cd '${{ parameters.stackDir }}'

        # The host's secrets. Absent means NEXUS_WORKER_API_KEY and the
        # RESULT_STORE_* variables are unset, and compose would fail partway
        # through with an interpolation error after some services had already
        # started. Checked first so the stack is never left half-up.
        if [ ! -f .env ]; then
          echo "FATAL: ${{ parameters.stackDir }}/.env is missing." >&2
          echo "It must define NEXUS_WORKER_API_KEY and RESULT_STORE_ACCESS_KEY," >&2
          echo "RESULT_STORE_SECRET_KEY, RESULT_STORE_BUCKET, RESULT_STORE_ENDPOINT." >&2
          echo "These are this host's secrets and are deliberately not written by" >&2
          echo "the pipeline. See deploy/portainer/README.md." >&2
          exit 1
        fi
        for required in NEXUS_WORKER_API_KEY RESULT_STORE_ACCESS_KEY RESULT_STORE_SECRET_KEY RESULT_STORE_BUCKET RESULT_STORE_ENDPOINT; do
          grep -qE "^${required}=" .env || { echo "FATAL: .env does not define $required" >&2; exit 1; }
        done

        # The token is a pipeline secret; passed on stdin so it is never an
        # argument in the host's process list.
        printf '%s' '$(acrPullToken)' | docker login '${{ parameters.acrLoginServer }}' \
          --username 00000000-0000-0000-0000-000000000000 --password-stdin
        trap 'docker logout "${{ parameters.acrLoginServer }}" >/dev/null 2>&1 || true' EXIT

        # Pull first, as its own step. `up -d` would pull too, but a registry
        # failure there leaves some services replaced and others not; pulling
        # everything before anything is replaced keeps a failed deploy on the
        # OLD images rather than on a mixture.
        docker compose -p '${{ parameters.stackName }}' -f docker-compose.deploy.yml pull

        # --remove-orphans so a service deleted from the compose file actually
        # goes away rather than lingering as a container Portainer still shows.
        docker compose -p '${{ parameters.stackName }}' -f docker-compose.deploy.yml up -d --remove-orphans

        docker compose -p '${{ parameters.stackName }}' -f docker-compose.deploy.yml ps

  # ── 5. Prove it came up ─────────────────────────────────────────────────
  - task: SSH@0
    displayName: 'Verify the stack is healthy on ${{ parameters.environment }}'
    inputs:
      sshEndpoint: '${{ parameters.sshServiceConnection }}'
      runOptions: 'inline'
      readyTimeout: '30000'
      failOnStdErr: false
      inline: |
        set -euo pipefail
        cd '${{ parameters.stackDir }}'
        compose="docker compose -p '${{ parameters.stackName }}' -f docker-compose.deploy.yml"

        # `up -d` returns once containers are CREATED, not once they are
        # serving. Without this wait a deploy is reported green while the
        # gateway is still opening its database connections -- and a service
        # that crash-loops on a bad image would never be noticed at all.
        #
        # migrate and minio-init are one-shot jobs: they exit 0 by design, so
        # "not running" is success for them and they are excluded.
        deadline=$(( $(date +%s) + 180 ))
        while :; do
          bad=""
          for svc in $(eval "$compose config --services"); do
            case "$svc" in migrate|minio-init) continue ;; esac
            cid="$(eval "$compose ps -q $svc" 2>/dev/null || true)"
            if [ -z "$cid" ]; then bad="$bad $svc(absent)"; continue; fi
            state="$(docker inspect -f '{{.State.Status}}' "$cid")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")"
            case "$state:$health" in
              running:healthy|running:none) ;;
              *) bad="$bad $svc($state/$health)" ;;
            esac
          done
          [ -z "$bad" ] && { echo "✅ every service is running"; break; }
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "FATAL: not healthy within 180s:$bad" >&2
            eval "$compose ps" >&2
            # The logs are the evidence; the exit code alone says nothing about
            # WHY a service would not start.
            for svc in $bad; do
              svc="${svc%%(*}"
              echo "--- $svc ---" >&2
              eval "$compose logs --tail=40 $svc" >&2 || true
            done
            exit 1
          fi
          sleep 5
        done

        # The migration job must have SUCCEEDED, not merely exited. A non-zero
        # exit leaves the schema half-applied and every service running against
        # it, which looks healthy above and is not.
        code="$(docker inspect -f '{{.State.ExitCode}}' "$(eval "$compose ps -aq migrate")" 2>/dev/null || echo missing)"
        [ "$code" = "0" ] || { echo "FATAL: the migration job exited $code" >&2; eval "$compose logs --tail=60 migrate" >&2; exit 1; }
        echo "✅ migrations applied"
