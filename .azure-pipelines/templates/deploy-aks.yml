# Releases Nexus to one environment's AKS cluster with digest-pinned images.
#
# ─── This template does not work yet, and says so out loud ───────────────
#
# deploy/helm/kgf-nexus does not exist. Nexus's deploy/ is docker-compose, which
# deploy/README.md states is local-development only. The first step below checks
# for the chart and fails with an explanation rather than letting `helm upgrade`
# fail with a path error that reads like a typo.
#
# It is written now because the release pipeline's shape should not be invented
# under time pressure on the day the chart lands, and because writing it is what
# surfaces what the chart has to provide: a values file per environment, a
# per-service image.digest key, and the migration job as a Helm hook.
#
# ─── What the chart has to provide ───────────────────────────────────────
#
#   services.<name>.image.digest   set per service from the digest map, so the
#                                  cluster pulls the exact image this release
#                                  built and never a tag someone could move
#   a pre-upgrade hook running the migrate image, because schema migrations are
#   applied by a dedicated job and never by a service at startup (ADR-0011
#   rule 4) -- with --wait, so no service starts against a half-migrated schema
#   Postgres and the result store as chart values, not compose defaults: the
#   credentials in docker-compose.yml are marked DEV ONLY and must not reach a
#   cluster
#
# The Azure Resource Manager service connection uses workload identity
# federation; kubeconfig is obtained per run and removed afterwards.
#
# Expects in the calling job:
#   imageDigests   JSON object {"api-gateway": "<acr>/nexus/api-gateway@sha256:...", ...}

parameters:
  - name: environment
    type: string
  - name: azureSubscription
    type: string
  - name: resourceGroup
    type: string
  - name: clusterName
    type: string
  - name: namespace
    type: string
    default: kgf-nexus
  - name: valuesFile
    type: string
  - name: chartPath
    type: string
    default: deploy/helm/kgf-nexus
  - name: releaseName
    type: string
    default: kgf-nexus

steps:
  - script: |
      set -euo pipefail
      if [ ! -f '${{ parameters.chartPath }}/Chart.yaml' ]; then
        cat >&2 <<'MSG'
      ===============================================================
      The Nexus Helm chart does not exist yet.
      ===============================================================
      Expected: ${{ parameters.chartPath }}/Chart.yaml

      This deploy stage is enabled (deployTo${{ parameters.environment }} is
      true) but there is nothing to release. Nexus ships docker-compose, which
      deploy/README.md states is local-development only.

      Either author the chart -- see the header of this template for what it
      has to provide -- or set the deployTo${{ parameters.environment }}
      parameter back to false. Images were still built and pushed; the digest
      map is published as the image-digests artifact.
      MSG
        exit 1
      fi
      echo "✅ Found ${{ parameters.chartPath }}/Chart.yaml"
    displayName: 'Verify the chart exists'

  - task: AzureCLI@2
    displayName: 'Release kgf-nexus to ${{ parameters.environment }}'
    inputs:
      azureSubscription: '${{ parameters.azureSubscription }}'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        # A per-run kubeconfig in a temp file, removed on exit: the agent is
        # shared, and a cluster credential left in the default kubeconfig is
        # available to every later job on it.
        export KUBECONFIG="$(mktemp)"
        trap 'rm -f "$KUBECONFIG"' EXIT
        az aks get-credentials \
          --resource-group '${{ parameters.resourceGroup }}' \
          --name '${{ parameters.clusterName }}' \
          --file "$KUBECONFIG" --only-show-errors
        # Entra-integrated clusters need kubelogin to exchange the pipeline
        # identity for a token kubectl can use.
        kubelogin convert-kubeconfig -l azurecli

        digests='$(imageDigests)'
        case "$digests" in \{*\}) ;; *) echo "imageDigests is not a JSON object: $digests" >&2; exit 1 ;; esac

        # Turn the digest map into per-service image.digest values. Only the
        # digest is passed, never the tag: the chart holds the repository, and
        # the digest is the part that makes the pull unforgeable.
        images="$(python3 - "$digests" <<'PY'
        import json, sys
        digests = json.loads(sys.argv[1])
        print(json.dumps({
            name: {"image": {"digest": ref.split("@", 1)[1]}}
            for name, ref in digests.items()
        }))
        PY
        )"

        helm upgrade --install '${{ parameters.releaseName }}' '${{ parameters.chartPath }}' \
          --namespace '${{ parameters.namespace }}' --create-namespace \
          --values '${{ parameters.valuesFile }}' \
          --set-json "services=$images" \
          --wait --timeout 15m --atomic
        # --atomic rolls the release back if it does not become ready, so a
        # failed deploy leaves the previous version serving rather than a
        # half-updated set of deployments.

        kubectl -n '${{ parameters.namespace }}' get deployments -o wide
