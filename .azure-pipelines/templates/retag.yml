# Moves <env>-latest onto the exact images this run built, after that
# environment's deploy and smoke test have succeeded.
#
# Why this is a separate step and not part of the build: a build only becomes
# the test or production image once that environment's approval has released it
# and its smoke test has passed. Moving the tag at build time would make
# prod-latest name an image nobody approved and nothing proved.
#
# `az acr import` copies BY DIGEST inside the registry: nothing is pulled to the
# agent, no registry credential is needed beyond the ARM connection, and the tag
# can only ever land on an image this run built and this stage released.

parameters:
  - name: environment        # test or prod
    type: string
  - name: azureSubscription
    type: string
  - name: acrLoginServer
    type: string

steps:
  - task: AzureCLI@2
    displayName: 'Move ${{ parameters.environment }}-latest to the released digests'
    inputs:
      azureSubscription: '${{ parameters.azureSubscription }}'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        registry='${{ parameters.acrLoginServer }}'
        env='${{ parameters.environment }}'
        list="$(Agent.TempDirectory)/kgf-nexus-$env-retag.txt"
        trap 'rm -f "$list"' EXIT

        python3 -c '
        import json, sys
        for ref in sorted(json.loads(sys.argv[1]).values()):
            repository, _, digest = ref.partition("@")
            # Strip the login server, leaving the repository path the registry
            # knows the image by.
            print(repository.split("/", 1)[1], digest)' '$(imageDigests)' > "$list"

        test -s "$list" || { echo "The digest map produced no images to retag" >&2; exit 1; }

        while read -r repo digest; do
          az acr import --name "${registry%%.*}" \
            --source "$registry/$repo@$digest" \
            --image "$repo:$env-latest" --force --only-show-errors
          echo "$env-latest -> $repo@$digest"
        done < "$list"
